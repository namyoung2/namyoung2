<style>
  :root{
    --bg: #FFFFFF;
    --surface: #FCFCFC;
    --text: #181818;
    --text-secondary: #666666;
    --text-tertiary: #A0A0A0;
    --border: #ECECEC;
    --category-color: #C6F24E;
    --compose-color: #C6F24E;
    --hover: #F5F5F5;
    --danger: #B23A2E;
    --danger-soft: #F5E6E4;
    --highlight-bg: #FFF176;
    --highlight-text: #2E7D32;
    --cancel-bg: #FFEBEE;
    --cancel-text: #C62828;
  }
  *{ box-sizing: border-box; }
  html{
    /* 스크롤바가 있고 없고에 따라 화면 폭이 미세하게 바뀌면서 콘텐츠가 좌우로
       움찔거리는 걸 막기 위해, 스크롤바 자리를 항상 비워둠. 모달을 열어 스크롤이
       잠기거나(body가 fixed가 되며 스크롤바가 사라짐), 문장이 늘어 스크롤이
       생기거나 하는 두 경우 다 이걸로 해결됨. */
    overflow-y: scroll;
    scrollbar-gutter: stable;
  }
  html,body{
    margin:0; padding:0;
    width: 100%;
    max-width: 100%;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", sans-serif;
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
  }
  body.modal-open{
    overflow: hidden;
    touch-action: none;
  }

  .wrap{
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
    padding: max(28px, env(safe-area-inset-top)) 22px 120px;
  }

  /* ── 시작 스플래시 화면 ─────────────────────── */
  .splash-overlay{
    position: fixed;
    inset: 0;
    z-index: 500;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.4s ease;
  }
  .splash-overlay.hide{
    opacity: 0;
    pointer-events: none;
  }
  .splash-logo{
    width: 108px;
    height: 108px;
    animation: splashPop 0.35s ease-out;
  }
  @keyframes splashPop{
    from{ opacity: 0; transform: scale(0.9); }
    to{ opacity: 1; transform: scale(1); }
  }

  /* ── 보관함 (카테고리별 문장 목록) - 메인 화면 ──── */
  .archive-header{
    display: flex;
    justify-content: center;
    margin-bottom: 24px;
  }
  .archive-header img{
    width: 40px;
    height: 40px;
    display: block;
    cursor: pointer;
  }
  /* 로고를 누르면 보기/편집 모드가 전환됨 - 화면 전체가 아주 잠깐 흐려졌다 돌아옴 */
  @keyframes modeSwitchFade{
    0%{ opacity: 1; }
    45%{ opacity: 0.62; }
    100%{ opacity: 1; }
  }
  .wrap.mode-switch-fade{ animation: modeSwitchFade 0.36s ease; }
  /* 모드가 바뀌면서 우하단 아이콘(+/돋보기)이 통통 튀듯 나타남 */
  @keyframes fabIconPop{
    0%{ transform: scale(1); }
    45%{ transform: scale(0.82); opacity: 0.5; }
    100%{ transform: scale(1); opacity: 1; }
  }
  .fab-icon-pop{ animation: fabIconPop 0.32s cubic-bezier(.2,.8,.3,1); }
  .archive-list{ max-width: 560px; margin: 0 auto; }
  /* 카테고리를 바꿀 때 아주 살짝 좌우로 미끄러지는 느낌 (토스 스타일의 미세한 전환) */
  @keyframes catOutToLeft{ to{ transform: translateX(-10px); opacity: 0; } }
  @keyframes catOutToRight{ to{ transform: translateX(10px); opacity: 0; } }
  @keyframes catInFromRight{ from{ transform: translateX(10px); opacity: 0; } to{ transform: translateX(0); opacity: 1; } }
  @keyframes catInFromLeft{ from{ transform: translateX(-10px); opacity: 0; } to{ transform: translateX(0); opacity: 1; } }
  .archive-list.cat-anim-out-l{ animation: catOutToLeft 0.13s ease forwards; }
  .archive-list.cat-anim-out-r{ animation: catOutToRight 0.13s ease forwards; }
  .archive-list.cat-anim-in-r{ animation: catInFromRight 0.24s cubic-bezier(.22,.7,.3,1); }
  .archive-list.cat-anim-in-l{ animation: catInFromLeft 0.24s cubic-bezier(.22,.7,.3,1); }

  /* 문장 목록 맨 아래 - 맞춤법 확인 트리거 */
  .spell-check-trigger{
    display: block;
    width: 100%;
    max-width: 560px;
    margin: 24px auto 0;
    padding: 8px 0;
    border: none;
    background: none;
    color: var(--text-tertiary);
    font-family: 'Pretendard', sans-serif;
    font-size: 11.5px;
    font-weight: 500;
    cursor: pointer;
  }
  .spell-check-trigger:disabled{ opacity: 0.5; cursor: default; }
  /* 보기 모드에서는 고치는 기능 버튼을 감춤 */
  body.mode-view .spell-check-trigger{ display: none; }

  /* ── 편집 모드 비밀번호 ─────────────────────── */
  .passcode-sheet{ max-width: 320px; }
  .passcode-sheet .sheet-body{
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 22px 26px;
  }
  .passcode-lock{
    color: var(--text-tertiary);
    margin-bottom: 12px;
  }
  .passcode-title{
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
  }
  .passcode-desc{
    margin-top: 5px;
    font-size: 12.5px;
    color: var(--text-tertiary);
  }
  .passcode-dots{
    display: flex;
    gap: 13px;
    margin-top: 22px;
    height: 13px;
  }
  .passcode-dot{
    width: 11px;
    height: 11px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    background: transparent;
    transition: background 0.16s ease, border-color 0.16s ease, transform 0.16s ease;
  }
  .passcode-dot.filled{
    background: var(--category-color);
    border-color: var(--category-color);
    transform: scale(1.12);
  }
  /* 실제 입력은 보이지 않는 칸이 받고, 화면에는 점만 보여줌 */
  .passcode-hidden-input{
    position: absolute;
    opacity: 0;
    pointer-events: none;
    width: 1px; height: 1px;
    font-size: 16px; /* iOS에서 포커스 시 화면이 확대되는 것 방지 */
  }
  .passcode-error{
    margin-top: 14px;
    font-size: 12px;
    color: var(--danger);
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  .passcode-error.show{ opacity: 1; }
  @keyframes passcodeShake{
    0%,100%{ transform: translateX(0); }
    20%{ transform: translateX(-7px); }
    40%{ transform: translateX(7px); }
    60%{ transform: translateX(-4px); }
    80%{ transform: translateX(4px); }
  }
  .passcode-dots.shake{ animation: passcodeShake 0.4s ease; }

  /* 비밀번호가 맞았을 때: 자물쇠가 열리고 점들이 잠깐 밝아졌다가 시트가 닫힘 */
  .sheet-overlay.unlocked .passcode-lock{
    color: var(--category-color);
    transform: translateY(-3px) scale(1.08);
    transition: color 0.25s ease, transform 0.3s cubic-bezier(.2,.8,.3,1);
  }
  .sheet-overlay.unlocked .passcode-dot{
    background: var(--category-color);
    border-color: var(--category-color);
    transform: scale(1.2);
  }
  .sheet-overlay.unlocked .bottom-sheet{
    opacity: 0;
    transform: scale(1.02) translateY(-4px);
    /* 자물쇠가 열리는 걸 충분히 본 뒤에 창이 사라지도록 늦춤 */
    transition: opacity 0.36s ease 0.5s, transform 0.36s ease 0.5s;
  }
  .passcode-lock{ transition: color 0.25s ease, transform 0.3s ease; position: relative; }
  /* 잠긴 자물쇠와 열린 자물쇠를 같은 자리에 겹쳐두고, 비밀번호가 맞으면 바꿔 보여줌 */
  .passcode-lock .lock-open{
    position: absolute;
    top: 0; left: 0;
    opacity: 0;
    transform: scale(0.7);
  }
  .sheet-overlay.unlocked .passcode-lock .lock-closed{
    opacity: 0;
    transform: scale(0.7);
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  .sheet-overlay.unlocked .passcode-lock .lock-open{
    opacity: 1;
    /* 살짝 튀어오르며 "짠" 하고 열리는 느낌. 너무 빨리 지나가지 않게 여유를 둠 */
    transform: scale(1);
    transition: opacity 0.36s ease 0.14s, transform 0.5s cubic-bezier(.34,1.56,.64,1) 0.14s;
  }
  .passcode-lock .lock-closed{ transition: opacity 0.3s ease, transform 0.3s ease; }

  /* 시트 우측 상단 닫기 버튼 - 키보드가 올라오면 바깥을 누르기 어려워서 필요함 */
  .sheet-close-btn{
    position: absolute;
    top: 16px;
    right: 16px;
    width: 30px;
    height: 30px;
    border: none;
    background: none;
    color: var(--text-tertiary);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border-radius: 50%;
    cursor: pointer;
  }
  .sheet-close-btn:active{ background: var(--hover); color: var(--text); }

  /* 입력칸 위 안내 글 */
  .field-label{
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-tertiary);
    margin: 16px 0 7px;
  }
  .field-label:first-of-type{ margin-top: 4px; }

  /* 저장 버튼이 놓이는 칸.
     PC에서는 본문에 이어서 그대로 보이고, 폰 전체화면에서는 화면 맨 아래에 고정됨. */
  .sheet-footer{ padding: 0 22px 22px; }

  /* ── 보기 모드 전용 검색 ─────────────────────── */
  /* 높이를 vh(화면 전체)로 잡으면 키보드가 올라왔을 때 실제 남은 공간보다 커져서
     시트가 위로 밀려 올라감. 부모(.bottom-sheet)가 이미 남은 공간에 맞춰 크기를
     제한하고 있으므로, 여기서는 그 안을 100%로 채우기만 함. */
  .search-sheet .sheet-body{
    position: relative;
    /* 아래쪽이 비어 보이지 않도록 위아래 여백을 같게 맞춤 */
    padding-bottom: 22px;
    display: flex;
    flex-direction: column;
    /* 부모(.bottom-sheet)가 flex 컨테이너라, max-height(%)로는 제대로 안 줄어듦.
       flex:1 + min-height:0 으로 남은 공간에 정확히 맞춰 줄어들게 함. */
    flex: 1 1 auto;
    min-height: 0;
  }
  .search-input-field{
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    font-family: 'Pretendard', sans-serif;
    font-size: 16px;
    color: var(--text);
    background: var(--surface);
    margin-bottom: 4px;
    flex-shrink: 0;
  }
  .search-input-field:focus{ outline: none; border-color: var(--text-tertiary); }
  .search-results-list{ overflow-y: auto; flex: 1; min-height: 0; margin-top: 8px; }
  .search-result-item{
    padding: 12px 2px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    text-align: left;
  }
  .search-result-item:last-child{ border-bottom: none; }
  .search-result-item:active{ background: var(--hover); }
  /* 키보드 위/아래로 고른 항목 - 회색 배경과 색 막대를 같이 쓰니 지저분해서,
     카테고리 색이 아주 옅게 깔리는 정도로만 표시함 */
  /* 키보드로 고른 항목 - 카테고리와 상관없이 늘 같은 색으로.
     글자색을 아주 옅게 깐 느낌이라 어떤 카테고리에서도 튀지 않음. */
  .search-result-item.active{
    background: rgba(24,24,24,0.06);
    border-radius: 8px;
  }
  .search-result-tag{
    display: inline-block;
    font-size: 10.5px;
    font-weight: 700;
    margin-bottom: 5px;
  }
  .search-result-text{
    font-size: 14px;
    line-height: 1.55;
    color: var(--text);
    word-break: keep-all;
  }
  .search-result-meta{
    margin-top: 5px;
    font-size: 11.5px;
    color: var(--text-tertiary);
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .search-result-bookmark{
    display: inline-flex;
    color: var(--category-color);
    flex-shrink: 0;
  }
  /* 검색 결과 안에서는 하이라이트를 눌러 지울 일이 없으므로 커서만 기본으로 되돌림 */
  .search-result-text .quote-highlight{ cursor: default; }
  .search-empty-hint{
    padding: 24px 2px;
    text-align: center;
    font-size: 13px;
    color: var(--text-tertiary);
  }
  /* 검색 결과를 눌러 이동했을 때, 그 문장이 잠깐 옅게 빛났다가 가라앉으며 눈에 띄게 함 */
  @keyframes searchJumpFlash{
    0%{ background: color-mix(in srgb, var(--category-color) 30%, white); }
    100%{ background: transparent; }
  }
  .quote-block.search-jump-flash{ animation: searchJumpFlash 1.6s ease; }

  /* 맞춤법 확인 결과 검토 목록 */
  .spell-check-item{
    border-bottom: 1px solid var(--border);
    padding: 14px 0;
  }
  .spell-check-item:last-child{ border-bottom: none; }
  .spell-check-item-header{
    display: flex;
    align-items: flex-start;
    gap: 10px;
    cursor: pointer;
  }
  .spell-check-checkbox{
    margin-top: 4px;
    flex-shrink: 0;
    width: 17px; height: 17px;
    accent-color: var(--category-color);
  }
  .spell-check-texts{ flex: 1; min-width: 0; }
  .spell-check-category{
    display: block;
    font-size: 10.5px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .spell-check-original{
    font-size: 13px;
    color: var(--text-tertiary);
    margin-bottom: 5px;
    line-height: 1.55;
    word-break: keep-all;
  }
  .spell-check-corrected{
    font-size: 14.5px;
    color: var(--text);
    line-height: 1.55;
    word-break: keep-all;
  }
  .diff-del{
    background: var(--cancel-bg);
    color: var(--cancel-text);
    text-decoration: line-through;
    border-radius: 2px;
  }
  .diff-ins{
    background: #E8F5E9;
    color: var(--highlight-text);
    font-weight: 700;
    border-radius: 2px;
  }
  .diff-space-mark{
    display: inline-block;
    color: var(--highlight-text);
    font-weight: 700;
    font-size: 10px;
    vertical-align: super;
    line-height: 1;
    margin: 0 1px;
  }

  .quote-block{
    position: relative;
    padding: 20px 0;
    cursor: pointer;
  }
  .quote-block:active{ background: var(--hover); }
  .quote-block + .quote-block{
    border-top: 1px solid var(--border);
  }
  /* 오래 안 만난 문장(스포트라이트)은 옅은 배경 칠로만 강조함(화면 끝까지 배경이 번짐).
     위/아래 여백을 정확히 맞추기 위해: 로고→스포트라이트 간격(archive-header의 margin-bottom)과
     스포트라이트→다음 문장 간격(margin-bottom)을 같은 값으로 맞추고, 다음 항목의 자체
     top padding은 0으로 상쇄시켜서 두 간격이 픽셀 단위로 동일해지도록 함. */
  .quote-block.spotlight-card{
    background: var(--spotlight-tint, #FBFEF3);
    margin: 0 -22px 24px;
    padding: 20px 22px;
  }
  .quote-block.spotlight-card + .quote-block{
    border-top: none;
    padding-top: 0;
  }
  .spotlight-label{
    font-size: 11.5px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 8px;
    padding-left: 18px;
  }
  .quote-text{
    border-left: 4px solid var(--category-color);
    padding-left: 14px;
    font-size: 16px;
    font-weight: 400;
    line-height: 1.6;
    color: var(--text);
    margin: 0;
    text-align: left;
    word-break: keep-all;
    overflow-wrap: break-word;
  }
  .quote-comment{
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin-top: 10px;
    padding-left: 18px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    line-height: 1.5;
  }
  .quote-comment-mark{
    display: inline-block;
    width: 10px;
    height: 2px;
    border-radius: 1px;
    background: var(--category-color);
    flex-shrink: 0;
    margin-top: 8px;
  }
  .quote-comment-text{
    word-break: keep-all;
  }
  .quote-meta-line{
    position: relative;
    margin-top: 10px;
    padding-left: 18px;
    font-size: 12px;
    color: var(--text-tertiary);
    min-height: 13px;
    display: flex;
    align-items: center;
  }
  /* 책갈피는 항상 세로 선과 같은 x위치(왼쪽 끝)에 고정되도록 절대 위치로 둠.
     출처/페이지 텍스트의 들여쓰기(padding-left:18px)와는 서로 영향을 주지 않아서,
     책갈피가 있든 없든 텍스트 위치는 항상 같고, 책갈피는 항상 선 바로 아래에 옴. */
  .quote-bookmark{
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    color: var(--category-color);
  }
  /* 추가된 지 24시간 안쪽인 문장에만 표시됨. 카테고리 색을 그대로 쓰면 파스텔톤이라
     작은 글자에서는 잘 안 보일 수 있어, 살짝 어둡게 섞어서 가독성을 확보함. */
  .quote-new-badge{
    color: color-mix(in srgb, var(--category-color) 60%, black);
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.02em;
    margin-right: 6px;
  }

  .empty{
    text-align:center;
    padding: 64px 20px;
    color: var(--text-tertiary);
    font-size: 13.5px;
    line-height: 1.9;
  }
  .empty-title{
    font-size: 14px;
    font-weight: 600;
    color: var(--text-secondary);
  }

  /* 아래 키로 문장 끝에 맞춰 멈춰도, 그 아래 여백에 다음 문장 글자가 두어 줄 비집고 들어와
     "중간에서 잘린" 것처럼 보였음. 딱 자르는 대신 서서히 흐려지게 해서 자연스럽게 마무리함.
     (카테고리 탭·버튼보다는 아래층에 있어서 그것들은 그대로 또렷하게 보임) */
  /* 떠 있는 요소들을 담는 판.
     높이를 100dvh(= 지금 실제로 보이는 화면 높이)로 두면, 주소창이 접히고 펴질 때
     브라우저가 알아서 갱신해줌. JavaScript로 뒤늦게 쫓아가지 않으니 버벅임이 없음. */
  .float-layer{
    position: fixed;
    left: 0; right: 0;
    top: 0;
    height: 100vh;    /* dvh를 모르는 옛 브라우저용 */
    height: 100dvh;
    pointer-events: none;
    z-index: 70;
  }
  .float-layer > *{ pointer-events: auto; }

  /* ── 하단 좌: 카테고리 세그먼트 탭 ──────────── */
  .category-tabs{
    position: absolute;
    left: 20px;
    bottom: max(20px, env(safe-area-inset-bottom));
    display: flex;
    gap: 2px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px;
    box-shadow: 0 4px 14px rgba(24,24,24,0.1);
    z-index: 70;
  }
  /* 탭 뒤에서 좌우로 슬라이드하는 필 - 애플 세그먼트 컨트롤 느낌 */
  .category-tab-indicator{
    position: absolute;
    top: 4px;
    bottom: 4px;
    left: 0;
    border-radius: 999px;
    background: var(--category-color);
    transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1), width 0.32s cubic-bezier(0.32, 0.72, 0, 1), background 0.25s ease;
    z-index: 0;
  }
  /* 마우스로 눌렀을 때 검은 테두리가 남지 않게 함 (키보드로 이동할 땐 그대로 보임) */
  .category-tab:focus:not(:focus-visible){ outline: none; }
  .category-tab{
    position: relative;
    z-index: 1;
    border: none;
    background: none;
    border-radius: 999px;
    padding: 9px 14px;
    font-family: 'Pretendard', sans-serif;
    font-size: 13.5px;
    font-weight: 700;
    color: var(--text-secondary);
    cursor: pointer;
    transition: color 0.2s ease;
  }
  .category-tab.active{
    color: var(--text);
  }

  /* ── 하단 우: + 버튼 ─────────────────────── */
  .add-quote-trigger-btn{
    position: absolute;
    right: 20px;
    bottom: max(20px, env(safe-area-inset-bottom));
    width: 48px; height: 48px;
    border-radius: 50%;
    border: none;
    background: var(--text);
    color: #FFFFFF;
    font-size: 22px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(24,24,24,0.22);
    z-index: 70;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .add-quote-trigger-btn:active{ transform: scale(0.94); }
  /* 문장을 드래그로 선택하면, 새 버튼을 따로 띄우는 대신 이미 익숙한 이 자리(우하단)를
     그대로 재사용해서 "하이라이트" 버튼으로 잠깐 바뀜. 선택이 풀리면 다시 +로 돌아옴. */
  .add-quote-trigger-btn.highlight-mode{
    background: var(--highlight-bg);
    color: #3D3200;
  }
  .add-quote-trigger-btn.highlight-mode.cancel-mode{
    background: var(--cancel-bg);
    color: var(--cancel-text);
  }

  /* 형광펜 하이라이트 - 카테고리 색과 무관하게 항상 통일된 노랑 */
  .quote-highlight{
    background: var(--highlight-bg);
    padding: 1px 0;
    border-radius: 2px;
    cursor: pointer;
  }

  /* ── 확인 다이얼로그 ──────────────────────── */
  .modal-overlay{
    position: fixed;
    left: 0; right: 0;
    /* 화면 높이만큼 위아래로 더 덮어서 가장자리가 절대 드러나지 않게 함 */
    top: -100vh;
    bottom: -100vh;
    background: rgba(31,35,40,0.32);
    display: none;
    align-items: center;
    justify-content: center;
    padding: calc(100vh + 20px) 20px;
    z-index: 330;
  }
  .modal-overlay.open{ display: flex; }
  .modal-box{
    background: var(--surface);
    border-radius: 14px;
    width: 100%;
    max-width: 440px;
    box-shadow: 0 12px 32px rgba(31,35,40,0.16);
    animation: fadeIn 0.18s ease;
  }
  .confirm-box{
    max-width: 300px;
    padding: 26px 22px 20px;
  }
  .confirm-message{
    margin: 0 0 20px;
    font-size: 14px;
    line-height: 1.75;
    color: var(--text);
    text-align: center;
  }
  .spell-error-text{
    text-align: left;
    font-size: 12.5px;
    line-height: 1.6;
    color: var(--text-secondary);
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 50vh;
    overflow-y: auto;
  }
  .confirm-actions{ display:flex; gap: 8px; }
  .confirm-btn{
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 0;
    font-family: 'Pretendard', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    background: var(--surface);
  }
  .confirm-cancel{ color: var(--text-secondary); }
  .confirm-cancel:hover{ background: var(--hover); }
  .confirm-ok{ color: var(--danger); border-color: var(--danger-soft); background: var(--danger-soft); }
  .confirm-ok:hover{ background: #EBDAD6; }

  @keyframes fadeIn{
    from{ opacity: 0; transform: translateY(2px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  /* ── 중앙 Dialog 공통 ──────────────────────── */
  .sheet-overlay{
    position: fixed;
    left: 0; right: 0;
    /* 어두운 배경은 화면보다 위아래로 넉넉히 넘치게 깔아서 어떤 경우에도 틈이 안 생기게 함.
       (보이는 영역에 딱 맞추려 하면 iOS의 화면 밀림·주소창 접힘 때문에 조금씩 어긋나
        중간에 흰 띠가 생겼음) */
    top: -100vh;
    bottom: -100vh;
    /* 창은 여백을 줘서 "실제로 보이는 영역" 안에 놓이도록 함 */
    padding: calc(100vh + var(--vv-pad-top, 0px)) 16px calc(100vh + var(--vv-pad-bottom, 0px));
    background: rgba(24,24,24,0.28);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 310;
  }
  .sheet-overlay.open{ display: flex; }
  .bottom-sheet{
    width: 100%;
    max-width: 480px;
    height: auto;
    /* 부모(오버레이)의 남은 공간을 넘지 않도록. 키보드가 올라오면 그만큼 자동으로 줄어듦 */
    max-height: min(100%, 82vh, 720px);   /* dvh를 모르는 옛 브라우저용 */
    max-height: min(100%, 82dvh, 720px);
    background: var(--surface);
    border-radius: 20px;
    box-shadow: 0 20px 50px rgba(24,24,24,0.18);
    opacity: 0;
    transform: scale(0.97) translateY(4px);
    transition: opacity 0.2s ease, transform 0.2s ease;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }
  .sheet-overlay.open .bottom-sheet{
    opacity: 1;
    transform: scale(1) translateY(0);
  }
  /* 키보드가 올라오면 시트를 화면 위쪽에 붙이고, 키보드 위 공간(--kb-avail) 안에 들어가게 함.
     배경(어두운 막)은 화면 전체를 그대로 덮으므로 중간에 끊기는 틈이 생기지 않음. */
  /* 키보드가 오르내릴 때 창이 부드럽게 따라가도록 */
  .sheet-overlay{
    transition: padding 0.25s cubic-bezier(0.32, 0.72, 0, 1);
  }
  /* 문장 추가 · 검색 팝업은 다른 시트(수정/코멘트)보다 살짝 더 또렷하게 등장함.
     처음엔 통통 튀는 스프링으로 했다가 정신없다는 피드백을 받아서, 오버슈트 없이
     한 방향으로만 자리 잡는 차분한 방식으로 바꿈. */
  /* 키보드를 내리면 쓸 수 있는 높이가 갑자기 늘어나는데, 그대로 두면 창이 "뚝" 하고 커짐.
     높이 변화를 부드럽게 이어줌. */
  #addQuoteOverlay .bottom-sheet, #searchSheetOverlay .bottom-sheet{
    transition: max-height 0.28s cubic-bezier(0.32, 0.72, 0, 1);
  }
  @keyframes sheetPopIn{
    0%{ opacity: 0; transform: scale(0.92) translateY(10px); }
    100%{ opacity: 1; transform: scale(1) translateY(0); }
  }
  #addQuoteOverlay.open .bottom-sheet, #searchSheetOverlay.open .bottom-sheet{
    animation: sheetPopIn 0.26s cubic-bezier(.2,.7,.3,1);
  }
  .sheet-title{
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    margin: 0 0 14px;
  }
  .sheet-body{
    position: relative;
    padding: 22px;
    overflow-y: auto;
    overscroll-behavior: contain;
  }

  /* ── 문장 추가/수정 시트 공통 입력 요소 ────── */
  .category-chip-row{
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .category-chip{
    flex: 1;
    text-align: center;
    border: 1px solid var(--border);
    background: var(--bg);
    border-radius: 10px;
    padding: 10px 0;
    font-family: 'Pretendard', sans-serif;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text-secondary);
    cursor: pointer;
  }
  .category-chip.active{
    background: var(--compose-color);
    border-color: var(--compose-color);
    color: var(--text);
  }

  /* [1] 출처: 입력칸을 포커스하면 최근 사용한 출처가 바로 아래 드롭다운으로 나타남 */
  .source-field-wrap{ position: relative; }
  .source-suggest{
    display: none;
    position: absolute;
    top: calc(100% - 8px);
    left: 0; right: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 10px 24px rgba(24,24,24,0.14);
    z-index: 5;
    overflow: hidden;
  }
  .source-suggest.open{ display: block; }
  .source-suggest-item{
    display: block;
    width: 100%;
    text-align: left;
    padding: 12px 14px;
    background: none;
    border: none;
    border-bottom: 1px solid var(--border);
    font-family: 'Pretendard', sans-serif;
    font-size: 14px;
    color: var(--text);
    cursor: pointer;
  }
  .source-suggest-item:last-child{ border-bottom: none; }
  .source-suggest-item:active{ background: var(--hover); }
  .source-suggest-item.highlighted{ background: var(--hover); }

  /* [2] 페이지/일자 토글 + 전용 입력 */
  .ref-field-row{
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 12px;
  }
  .ref-mode-toggle{
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--border);
    background: var(--bg);
    border-radius: 8px;
    padding: 0;
    color: var(--text-secondary);
    cursor: pointer;
  }
  .ref-mode-label{
    flex-shrink: 0;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-secondary);
    white-space: nowrap;
  }
  .ref-input{
    flex: 1;
    min-width: 0;
    margin-bottom: 0 !important;
  }
  .add-book-input{
    width: 100%;
    height: 52px;
    box-sizing: border-box;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0 14px;
    font-family: 'Pretendard', sans-serif;
    font-size: 16px;
    color: var(--text);
    outline: none;
    margin-bottom: 12px;
    background: var(--bg);
  }
  .add-book-input:focus{ border-color: var(--category-color); }
  .quote-textarea{
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    font-family: 'Pretendard', sans-serif;
    font-size: 16px;
    line-height: 1.65;
    color: var(--text);
    outline: none;
    margin-bottom: 12px;
    background: var(--bg);
    resize: none;
  }
  .quote-textarea:focus{ border-color: var(--category-color); }
  .quote-textarea::placeholder, .add-book-input::placeholder{ color: var(--text-tertiary); }

  .cta-btn{
    pointer-events: auto;
    border: none;
    border-radius: 999px;
    font-family: 'Pretendard', sans-serif;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  }
  .cta-primary{
    background: var(--category-color);
    color: var(--text);
    font-size: 14px;
    font-weight: 700;
    padding: 14px 26px;
    box-shadow: 0 3px 10px rgba(24,24,24,0.16);
  }
  .cta-primary:hover{ box-shadow: 0 4px 13px rgba(24,24,24,0.2); }
  .cta-btn:active{ transform: scale(0.96); }
  /* 문장 작성/수정 시트 안에서는 저장 버튼/포커스 테두리가 시트 전용 미리보기 색(compose-color)을
     따로 쓰도록 덮어씀 - 보관함 화면의 색과는 완전히 분리되어 서로 영향을 주지 않음 */
  #addQuoteOverlay .cta-primary,
  #editSheetOverlay .cta-primary{ background: var(--compose-color); }
  #addQuoteOverlay .add-book-input:focus,
  #addQuoteOverlay .quote-textarea:focus,
  #editSheetOverlay .add-book-input:focus,
  #editSheetOverlay .quote-textarea:focus{ border-color: var(--compose-color); }
  .add-book-submit{
    width: 100%;
    margin-top: 6px;
    padding: 13px 0;
  }
  .add-book-submit:disabled{ opacity: 0.5; cursor: default; }

  .status-msg{
    font-size: 12px;
    color: var(--text-secondary);
    min-height: 0;
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    transition: opacity 0.3s ease, max-height 0.3s ease, margin 0.3s ease;
  }
  .status-msg.show{
    opacity: 1;
    max-height: 30px;
    margin-top: 8px;
    margin-bottom: 8px;
  }
  .status-msg.error{ color: var(--danger); }

  /* ── 저장 완료 토스트 ─────────────────────── */
  .toast{
    position: absolute;
    top: max(20px, env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%) translateY(-6px);
    background: var(--category-color);
    color: var(--text);
    font-size: 12.5px;
    font-weight: 600;
    padding: 9px 18px;
    border-radius: 999px;
    box-shadow: 0 6px 18px rgba(24,24,24,0.2);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 400;
    white-space: nowrap;
  }
  .toast.show{
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ── 문장 ··· 액션 (아이폰 기본 선택 버튼/액션시트 스타일) ──── */
  .ios-sheet-backdrop{
    display: none;
    position: fixed;
    left: 0; right: 0;
    top: -100vh;
    bottom: -100vh;
    background: rgba(24,24,24,0.32);
    z-index: 96;
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  .ios-sheet-backdrop.open{ display: block; opacity: 1; }
  .ios-action-sheet{
    position: fixed;
    left: 12px; right: 12px;
    bottom: max(12px, env(safe-area-inset-bottom));
    z-index: 97;
    display: flex;
    flex-direction: column;
    gap: 8px;
    /* 아래에서 올라오는 애니메이션과, 주소창에 맞춘 위치 보정을 함께 적용 */
    transform: translateY(100%);
    opacity: 0;
    transition: transform 0.22s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.2s ease;
    pointer-events: none;
  }
  .ios-action-sheet.open{
    transform: translateY(0);
    opacity: 1;
    pointer-events: auto;
  }
  .ios-action-group{
    background: var(--surface);
    border-radius: 14px;
    overflow: hidden;
  }
  .ios-action-item{
    display: block;
    width: 100%;
    padding: 16px;
    background: none;
    border: none;
    border-bottom: 1px solid var(--border);
    font-family: 'Pretendard', sans-serif;
    font-size: 16px;
    color: var(--text);
    text-align: center;
    cursor: pointer;
  }
  .ios-action-item:last-child{ border-bottom: none; }
  .ios-action-item:active{ background: var(--hover); }
  .ios-action-item.danger{ color: var(--danger); }
  .ios-action-item.cancel{ font-weight: 700; }




  /* iOS Safari는 input/textarea의 font-size가 16px 미만이면 포커스 시 화면을 자동으로 확대함.
     margin-bottom을 12px로 잡은 입력 필드들 폰트는 14~15.5px라 확대가 걸릴 수 있어
     16px 미만 필드는 아래에서 별도로 보정함(선택 사항, 현재는 유지). */
  /* ── 폰에서는 가운데 뜨는 팝업 대신 화면 전체를 덮는 새 창으로 ──────────
     팝업 방식은 화면 가장자리에 여백이 생기는 문제가 계속 있었는데,
     화면을 통째로 덮으면 그럴 일이 아예 없음. 아래에서 위로 올라옴. */
  @media (pointer: coarse){
    .sheet-overlay{
      background: var(--bg);
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      align-items: stretch;
      justify-content: stretch;
      padding: 100vh 0;      /* 위아래로 넉넉히 덮은 만큼 되돌려서 창을 화면에 맞춤 */
    }
    .sheet-overlay .bottom-sheet{
      /* 창 배경(#FCFCFC)과 바깥 배경(#FFFFFF)이 미세하게 달라서 경계가 회색 띠로 보였음.
         전체화면일 땐 같은 색으로 맞춰서 경계가 아예 안 보이게 함. */
      background: var(--bg);
      width: 100%;
      max-width: none;
      /* 키보드가 올라오면 그 위 공간에 딱 맞게 줄어듦.
         입력칸이 늘 보이는 자리에 있으니 사파리가 화면을 밀어올릴 이유가 없어짐
         = 화면은 가만히 있고 키보드만 쓱 올라오는 느낌 (당근·구글 앱처럼) */
      height: var(--visible-h, 100%);
      transition: height 0.25s cubic-bezier(0.32, 0.72, 0, 1);
      max-height: none;
      border-radius: 0;
      box-shadow: none;
      animation: none;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
      opacity: 1;
    }
    .sheet-overlay.open .bottom-sheet{
      animation: none;
      transform: translateY(0);
      opacity: 1;
    }
    /* 저장 버튼을 화면에 계속 붙여두려 했더니, 오히려 빈 공간이 남는 문제가 생겼음.
       그냥 창 전체가 한 덩어리로 스크롤되고, 버튼은 마지막 칸 다음(기본 화면 맨 아래)에
       자연스럽게 놓이도록 단순화함. 입력 중엔 다른 필드처럼 스크롤해서 찾으면 됨. */
    /* 창 안에서 끝까지 스크롤해도 뒤 화면이 따라 움직이지 않게 함 */
    .sheet-overlay .bottom-sheet{ overflow-y: auto; overscroll-behavior: contain; }
    .sheet-overlay{ overscroll-behavior: contain; }
    .sheet-overlay .sheet-body{ padding: 26px 22px 20px; }
    #addQuoteOverlay .sheet-footer,
    #editSheetOverlay .sheet-footer{
      padding: 0 22px calc(20px + env(safe-area-inset-bottom));
    }
    .sheet-close-btn{ top: 22px; right: 18px; width: 34px; height: 34px; }
    .sheet-title{ font-size: 17px; margin-bottom: 20px; }
  }


</style>

// 겹치거나 인접한 구간을 하나로 합쳐서, 항상 정렬되고 겹치지 않는 배열로 유지함.
// 이렇게 저장해두면 화면에 그려지는 <mark> 개수와 실제 저장된 구간 개수가 항상 1:1로 맞아서,
// "이 마크를 탭하면 지운다"를 인덱스로 안전하게 매칭할 수 있음.
function mergeHighlights(list){
  const sorted = [...list].sort((a, b) => a.start - b.start);
  const merged = [];
  sorted.forEach(h => {
    const last = merged[merged.length - 1];
    if(last && h.start <= last.end){
      last.end = Math.max(last.end, h.end);
    } else {
      merged.push({ start: h.start, end: h.end });
    }
  });
  return merged;
}

// 하이라이트 버튼을 다시 누르면 취소되도록 하는 토글 로직.
// 선택한 구간이 기존 하이라이트와 조금이라도 겹치면, 그 겹치는 부분만 정확히 빼냄
// (겹치는 하이라이트가 딱 그 구간이면 통째로 사라지고, 일부만 겹치면 안 겹치는 조각만 남음).
// 전혀 안 겹치면 새 하이라이트로 추가함.
function toggleHighlightRange(existing, range){
  const overlapping = existing.some(h => range.start < h.end && range.end > h.start);
  if(!overlapping){
    return mergeHighlights([...existing, range]);
  }
  const result = [];
  existing.forEach(h => {
    if(range.end <= h.start || range.start >= h.end){
      result.push(h); // 안 겹치는 기존 구간은 그대로 유지
      return;
    }
    if(h.start < range.start) result.push({ start: h.start, end: range.start });
    if(h.end > range.end) result.push({ start: range.end, end: h.end });
  });
  return mergeHighlights(result);
}

// 문장 텍스트를 하이라이트 구간에 따라 <mark>로 감싸서 HTML로 만듦.
// 하이라이트가 아닌 부분은 그대로 escapeHtml 처리함.
function renderHighlightedText(text, highlights){
  if(!highlights || highlights.length === 0) return escapeHtml(text);
  let result = '';
  let cursor = 0;
  highlights.forEach((h, i) => {
    const start = Math.max(0, Math.min(h.start, text.length));
    const end = Math.max(0, Math.min(h.end, text.length));
    if(start > cursor) result += escapeHtml(text.slice(cursor, start));
    if(end > start) result += `<mark class="quote-highlight" data-hidx="${i}">${escapeHtml(text.slice(start, end))}</mark>`;
    cursor = Math.max(cursor, end);
  });
  if(cursor < text.length) result += escapeHtml(text.slice(cursor));
  return result;
}

// 드래그로 선택한 영역(range)의 시작/끝이, 문장 컨테이너 기준으로 순수 텍스트에서
// 몇 번째 글자에 해당하는지 계산함. 이미 <mark>가 섞여 있어도 정확히 셀 수 있도록
// 컨테이너의 자식 노드를 순서대로 훑으면서 글자 수를 누적함.
function getTextOffset(container, targetNode, targetOffset){
  let charCount = 0;
  let found = false;
  function walk(el){
    for(const child of el.childNodes){
      if(found) return;
      if(child === targetNode){
        charCount += targetOffset;
        found = true;
        return;
      }
      if(child.nodeType === Node.TEXT_NODE){
        charCount += child.textContent.length;
      } else if(child.nodeType === Node.ELEMENT_NODE){
        walk(child);
      }
    }
  }
  walk(container);
  return charCount;
}

// blockId를 시드로 쓰는 결정적 난수 생성기 - 같은 시간대 안에서는 항상 같은 결과를 냄
function seededRandom(seed){
  let t = seed + 0x6D2B79F5;
  return function(){
    t += 0x6D2B79F5;
    let r = Math.imul(t ^ (t >>> 15), 1 | t);
    r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffleWithSeed(arr, seed){
  const rand = seededRandom(seed);
  const result = arr.slice();
  for(let i = result.length - 1; i > 0; i--){
    const j = Math.floor(rand() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}

function pickSpotlightMessage(){
  const now = new Date();
  const hour = now.getHours();
  let period;
  if(hour < 6) period = 'dawn';
  else if(hour < 12) period = 'morning';
  else if(hour < 18) period = 'afternoon';
  else period = 'evening';

  // 6시간 단위 블록 ID - UTC가 아니라 이 기기의 로컬 자정을 기준으로 계산해야
  // 시간대(새벽/아침/오후/저녁) 경계랑 정확히 같은 시점에 멘트가 바뀜
  const localMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const hoursSinceLocalMidnight = (now - localMidnight) / (60 * 60 * 1000);
  const blockWithinDay = Math.floor(hoursSinceLocalMidnight / 6); // 0~3
  const daysSinceEpoch = Math.floor(localMidnight.getTime() / (24 * 60 * 60 * 1000));
  const blockId = daysSinceEpoch * 4 + blockWithinDay;

  const pool = SPOTLIGHT_MESSAGES_BY_TIME[period];
  // 같은 블록 안에서는 4개 카테고리가 셔플된 풀에서 서로 다른 자리를 배정받아서,
  // 여러 카테고리 화면에 동시에 같은 멘트가 겹쳐 뜨는 일이 없어짐
  const shuffled = shuffleWithSeed(pool, blockId);
  const catIndex = CATEGORIES.indexOf(currentCategory);
  return shuffled[(catIndex >= 0 ? catIndex : 0) % shuffled.length];
}

function shuffleArray(arr){
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// 카테고리를 볼 때마다 매번 다시 섞으면 별점/코멘트 등 사소한 변경에도 화면이 들썩여서,
// "같은 카테고리를 계속 보는 동안"에는 순서를 그대로 유지하고, 새로 추가/삭제된 것만 반영함.
// 카테고리를 실제로 전환할 때만 완전히 새로 섞임.
let shuffleState = { category: null, order: [] };

function getShuffledRest(restList){
  const restIds = new Set(restList.map(s => s.id));

  if(shuffleState.category !== currentCategory){
    const ids = restList.map(s => s.id);
    shuffleArray(ids);
    shuffleState = { category: currentCategory, order: ids };
  } else {
    let order = shuffleState.order.filter(id => restIds.has(id));
    const existingSet = new Set(order);
    const newIds = restList.map(s => s.id).filter(id => !existingSet.has(id));
    newIds.forEach(id => {
      const pos = Math.floor(Math.random() * (order.length + 1));
      order.splice(pos, 0, id);
    });
    shuffleState = { category: currentCategory, order };
  }

  const map = new Map(restList.map(s => [s.id, s]));
  return shuffleState.order.map(id => map.get(id)).filter(Boolean);
}

// 카테고리를 새로 들어올 때만 "가장 오래 안 만난 문장"을 새로 뽑고, 그 안에서 머무는 동안은 유지함.
// 멘트는 (시간대 + 카테고리)로 결정되는 값이라 매번 다시 계산해도 안전함 - 시간대가 안 바뀌면 그대로임.
let currentSpotlightId = null;
let currentSpotlightMessage = '';
let spotlightCategory = null;

function pickSpotlight(fullList){
  if(spotlightCategory !== currentCategory){
    const spotlight = fullList.reduce((oldest, s) => {
      const sSeen = s.lastSeenAt || s.ts || 0;
      const oldestSeen = oldest ? (oldest.lastSeenAt || oldest.ts || 0) : Infinity;
      return sSeen < oldestSeen ? s : oldest;
    }, null);
    currentSpotlightId = spotlight ? spotlight.id : null;
    spotlightCategory = currentCategory;
  }
  currentSpotlightMessage = pickSpotlightMessage();
  return fullList.find(s => s.id === currentSpotlightId) || null;
}

// 서버의 최신 문장 목록과 지금 이 브라우저의 문장 목록을 병합함.
// - 로컬에 있는 건 그대로 씀(방금 내가 만든 수정이 우선)
// - 서버에만 있고, 내가 마지막으로 불러온 시점에도 없었던 것 → 그 사이 다른 사람이
//   추가한 것이므로 살려서 합침
// - 서버에는 있는데 내가 불러온 시점엔 있었지만 지금 로컬엔 없는 것 → 내가 의도적으로
//   삭제한 것이므로 되살리지 않음
function mergeWithServer(serverSentences, localSentences){
  const merged = [];
  const seen = new Set();
  localSentences.forEach(s => {
    merged.push(s);
    seen.add(s.id);
  });
  serverSentences.forEach(s => {
    if(seen.has(s.id)) return;
    if(loadedSnapshotIds.has(s.id)) return; // 내가 지운 것 → 복원하지 않음
    merged.push(s); // 그 사이 다른 사람이 추가한 것 → 살림
  });
  return merged;
}

async function saveAll(){
  try{
    // 저장 직전에 서버 최신본을 한 번 더 확인해서 병합함 - 안 그러면 내가 저장하는 순간
    // 그 사이 다른 사람이 추가한 내용이 통째로 사라질 수 있음
    let serverBackup = null;
    try{
      const res = await storageAdapter.get(STORAGE_KEY);
      const parsed = res && res.value ? JSON.parse(res.value) : null;
      if(parsed && parsed.backup) serverBackup = parsed.backup;
      if(parsed && Array.isArray(parsed.sentences)){
        sentences = mergeWithServer(parsed.sentences, sentences);
        (parsed.recentSources || []).forEach(src => {
          if(!recentSources.includes(src)) recentSources.push(src);
        });
        recentSources = recentSources.slice(0, 3);
      }
    }catch(e){
      console.error('저장 전 병합 확인 실패 (그대로 저장 진행):', e);
    }

    const payload = { sentences, recentSources };
    if(serverBackup) payload.backup = serverBackup;

    await storageAdapter.set(STORAGE_KEY, JSON.stringify(payload));
    lastLocalSaveAt = Date.now();
    loadedSnapshotIds = new Set(sentences.map(s => s.id));
  }catch(e){
    console.error('저장 실패:', e);
    showToast('저장하지 못했습니다. 잠시 후 다시 시도해주세요.');
  }
}

// ── 다른 사람이 고친 내용 백그라운드로 확인하기 ─────────────
// Cloudflare KV는 최종 일관성 저장소라, 다른 곳에서 저장한 내용이 최대 1분 이상 늦게 반영될 수
// 있음. 그래서 주기적으로 조용히 다시 불러와서, 바뀐 게 있으면 화면만 갱신해줌.
let lastLocalSaveAt = 0;
let loadedSnapshotIds = new Set();
let pollTimer = null;

// "봤다" 기록처럼 사람이 알아챌 수 없는 필드는 변경 비교에서 제외함 -
// 안 그러면 그냥 스크롤하며 읽기만 해도 "변경사항 반영" 알림이 떠서 오해를 살 수 있음
function stripSilentFields(list){
  return list.map(({ lastSeenAt, ...rest }) => rest);
}

async function pollForUpdates(){
  // 뭔가 입력 중이거나 시트가 열려있으면 방해하지 않도록 건너뜀
  const anyOverlayOpen = document.querySelector(
    '.sheet-overlay.open, .modal-overlay.open, .ios-action-sheet.open, .ios-sheet-backdrop.open'
  );
  if(anyOverlayOpen) return;

  // 방금 로컬에서 저장했다면, 서버가 아직 그 이전 값을 캐시하고 있을 수 있어
  // 잠시 폴링을 건너뜀 (안 그러면 내가 방금 한 수정이 순간적으로 되돌아가 보일 수 있음)
  if(Date.now() - lastLocalSaveAt < 90000) return;

  try{
    const res = await storageAdapter.get(STORAGE_KEY);
    const parsed = res && res.value ? JSON.parse(res.value) : null;
    if(!parsed || !Array.isArray(parsed.sentences)) return;

    const anyDiff = JSON.stringify(parsed.sentences) !== JSON.stringify(sentences);
    if(!anyDiff) return;

    const meaningfulDiff = JSON.stringify(stripSilentFields(parsed.sentences)) !== JSON.stringify(stripSilentFields(sentences));

    sentences = parsed.sentences;
    recentSources = Array.isArray(parsed.recentSources) ? parsed.recentSources : [];
    loadedSnapshotIds = new Set(sentences.map(s => s.id));

    if(meaningfulDiff){
      renderArchive();
      showToast('새로운 변경사항을 반영했어요', 1800);
    }
    // 의미있는 변경이 아니면(예: 시청 기록만 달라짐) 화면을 다시 그리거나 알리지 않고
    // 최신 데이터로만 조용히 맞춰둠

  }catch(e){
    console.error('자동 새로고침 확인 실패:', e);
  }
}
function startPolling(){
  if(pollTimer) return;
  pollTimer = setInterval(pollForUpdates, 20000);
}
function stopPolling(){
  if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }
}
// 탭이 백그라운드로 가면 멈추고, 다시 돌아오면 바로 한 번 확인 후 재시작
document.addEventListener('visibilitychange', () => {
  if(document.hidden){
    stopPolling();
  } else {
    pollForUpdates();
    startPolling();
  }
});
startPolling();

// ── 백업 저장 ──────────────────────────────────────────
// Worker 변경 없이, 같은 저장 값 안에 "backup" 필드 하나를 추가하는 방식으로 구현함.
// 로고를 누르는 동작 자체는 이제 보기/편집 모드 전환에 쓰이므로, 백업은 모드를 바꿀 때마다
// 화면에 아무 티도 안 내고 조용히 같이 저장되도록 붙여둠.
async function handleBackupSave(silent){
  try{
    const res = await storageAdapter.get(STORAGE_KEY);
    const parsed = res && res.value ? JSON.parse(res.value) : null;
    const baseSentences = (parsed && Array.isArray(parsed.sentences)) ? parsed.sentences : sentences;
    const baseSources = (parsed && Array.isArray(parsed.recentSources)) ? parsed.recentSources : recentSources;

    await storageAdapter.set(STORAGE_KEY, JSON.stringify({
      sentences: baseSentences,
      recentSources: baseSources,
      backup: { sentences: baseSentences, recentSources: baseSources, savedAt: Date.now() }
    }));
    if(!silent) showToast('저장됐어요', 1200);
  }catch(e){
    console.error('백업 저장 실패:', e);
  }
}

  } else {
    // 틀리면 흔들리고 비워짐
    passcodeError.classList.add('show');
    passcodeDots.classList.remove('shake');
    void passcodeDots.offsetWidth;
    passcodeDots.classList.add('shake');
    setTimeout(() => {
      passcodeValue = '';
      passcodeInput.value = '';
      renderPasscodeDots();
    }, 420);
  }
});

// 로고를 짧게 탭하면 모드 전환, 길게 누르고 있으면(650ms) 전체 문장을 파일로 내보냄.
// 새 버튼을 안 만들고, 이미 있는 로고 제스처에 "누르는 길이"라는 새로운 구분을 얹은 것.
function exportAllData(){
  try{
    const payload = {
      exportedAt: new Date().toISOString(),
      sentenceCount: sentences.length,
      sentences,
      recentSources
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const dateStr = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = `soooozip-backup-${dateStr}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    showToast(`파일로 내보냈어요 (${sentences.length}개)`, 2000);
  }catch(e){
    console.error('내보내기 실패:', e);
    showToast('내보내지 못했어요', 1800);
  }
}

// ── 한글 검색: 타이핑 중인 모든 중간 상태를 인식 ──────────────
// "취향의 경제"를 치는 과정에서 나오는 상태들:
//   ㅊ → 추 → 취 → 츃 → 취햐 → 취향 → 취향ㅇ → 취향으 → 취향의
// 완성된 글자든 미완성이든, 글자를 전부 자모(첫소리·가운뎃소리·끝소리)로 풀어서
// 늘어놓고 비교하면 위 상태가 전부 "취향의"의 앞부분과 맞아떨어짐.
const HANGUL_BASE = 0xAC00, HANGUL_LAST = 0xD7A3;
const CHOSEONG = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const JUNGSEONG = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
const JONGSEONG = ['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];

// 겹받침·겹모음은 타이핑할 때 두 번에 나눠 눌리므로, 비교할 땐 낱개로 풀어둠
// (예: "취향" 입력 중 "ㅇ"만 눌린 상태 → 받침 ㅇ 과 맞아야 함)
const JONG_SPLIT = {
  'ㄳ':'ㄱㅅ','ㄵ':'ㄴㅈ','ㄶ':'ㄴㅎ','ㄺ':'ㄹㄱ','ㄻ':'ㄹㅁ','ㄼ':'ㄹㅂ',
  'ㄽ':'ㄹㅅ','ㄾ':'ㄹㅌ','ㄿ':'ㄹㅍ','ㅀ':'ㄹㅎ','ㅄ':'ㅂㅅ'
};
const JUNG_SPLIT = {
  'ㅘ':'ㅗㅏ','ㅙ':'ㅗㅐ','ㅚ':'ㅗㅣ','ㅝ':'ㅜㅓ','ㅞ':'ㅜㅔ','ㅟ':'ㅜㅣ','ㅢ':'ㅡㅣ'
};

function isCompleteHangul(ch){
  const code = ch.charCodeAt(0);
  return code >= HANGUL_BASE && code <= HANGUL_LAST;
}

// 문자열을 자모 단위로 풀어놓음. 한글이 아닌 글자는 그대로 둠.
function toJamo(str){
  let out = '';
  for(const ch of str){
    if(isCompleteHangul(ch)){
      const idx = ch.charCodeAt(0) - HANGUL_BASE;
      const cho = CHOSEONG[Math.floor(idx / 588)];
      const jung = JUNGSEONG[Math.floor((idx % 588) / 28)];
      const jong = JONGSEONG[idx % 28];
      out += cho + (JUNG_SPLIT[jung] || jung) + (JONG_SPLIT[jong] || jong);
    } else {
      out += (JUNG_SPLIT[ch] || JONG_SPLIT[ch] || ch);
    }
  }
  return out;
}

// 검색어가 대상 문자열 어딘가에 "타이핑 중인 상태로도" 맞는지 확인.
// 자모로 풀어서 비교하므로, 글자가 완성되기 전 어느 단계에서도 찾아짐.
function matchesTyping(text, query){
  if(!text || !query) return false;
  const t = text.toLowerCase();
  const q = query.toLowerCase();
  if(t.includes(q)) return true;          // 보통의 경우는 여기서 바로 끝남
  return toJamo(t).includes(toJamo(q));
}

function renderSearchResults(query){
  const q = query.trim().toLowerCase();
  if(!q){
    searchResultsList.innerHTML = `<div class="search-empty-hint">문장이나 책 제목을 입력해보세요</div>`;
    return;
  }
  const matches = sentences.filter(s =>
    matchesTyping(s.text, q) || matchesTyping(s.source, q)
  );
  if(matches.length === 0){
    searchResultsList.innerHTML = `<div class="search-empty-hint">찾는 문장이 없어요</div>`;
    return;
  }
  searchResultsList.innerHTML = matches.map(s => {
    const color = CATEGORY_COLORS[s.category] || CATEGORY_COLORS['삶'];
    const meta = [s.source, s.ref].filter(Boolean).map(escapeHtml).join(' · ');
    // 목록에서 보던 그대로 - 칠해둔 형광펜과 저장(책갈피) 표시를 검색 결과에도 그대로 보여줌
    const bookmark = s.important ? `<span class="search-result-bookmark">${BOOKMARK_SVG}</span>` : '';
    return `<div class="search-result-item" data-id="${s.id}">
      <span class="search-result-tag" style="color:${color}">${escapeHtml(s.category)}</span>
      <div class="search-result-text">${renderHighlightedText(s.text, s.highlights)}</div>
      ${(meta || bookmark) ? `<div class="search-result-meta">${bookmark}${meta}</div>` : ''}
    </div>`;
  }).join('');
}

function jumpToSentence(id){

    if(!el) return;
    el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    el.classList.remove('search-jump-flash');
    void el.offsetWidth;
    el.classList.add('search-jump-flash');
  }, 260);
}

// ── 검색 결과를 키보드로 고르기 (위/아래로 이동, 엔터로 이동) ──────
let searchActiveIdx = -1;
function updateSearchActive(){
  const items = searchResultsList.querySelectorAll('.search-result-item');
  items.forEach((el, i) => el.classList.toggle('active', i === searchActiveIdx));
  const cur = items[searchActiveIdx];
  if(cur) cur.scrollIntoView({ block: 'nearest' });
}
searchInput.addEventListener('keydown', (e) => {
  const items = searchResultsList.querySelectorAll('.search-result-item');
  if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    if(items.length === 0) return;
    e.preventDefault();
    e.stopPropagation();
    const dir = e.key === 'ArrowDown' ? 1 : -1;
    // 아직 아무것도 안 골랐으면 위/아래에 따라 처음 또는 마지막부터 시작
    if(searchActiveIdx === -1) searchActiveIdx = dir === 1 ? 0 : items.length - 1;
    else searchActiveIdx = (searchActiveIdx + dir + items.length) % items.length;
    updateSearchActive();
  } else if(e.key === 'Enter'){
    // 창을 닫으면 초점이 풀려서, 이 엔터가 전역 단축키까지 흘러가 검색창이 다시 열림.
    // 여기서 처리한 엔터는 위로 전달되지 않도록 막아둠.
    if(searchActiveIdx >= 0 && items[searchActiveIdx]){
      e.preventDefault();
      e.stopPropagation();
      jumpToSentence(items[searchActiveIdx].dataset.id);
    } else if(items.length === 1){
      // 결과가 하나뿐이면 굳이 고르지 않아도 바로 이동
      e.preventDefault();
      e.stopPropagation();
      jumpToSentence(items[0].dataset.id);
    }
  }
});

// ── 보관함(카테고리별 문장 목록) 렌더링 ──────────
function renderArchive(){
  applyCategoryColor();
  categoryTabs.querySelectorAll('.category-tab').forEach(tab => {
    tab.classList.toggle('active', tab.dataset.cat === currentCategory);
  });
  updateCategoryIndicator();

  const fullList = sentences.filter(s => s.category === currentCategory);

  if(fullList.length === 0){
    archiveList.innerHTML = `
      <div class="empty">
        <div class="empty-title">아직 남긴 문장이 없습니다.</div>
      </div>`;
    setupSeenTracking();
    return;
  }

  const spotlight = pickSpotlight(fullList);
  const withoutSpotlight = fullList.filter(s => !spotlight || s.id !== spotlight.id);

  // NEW 표시가 붙어있는(12시간 이내 추가된) 문장은 스포트라이트 바로 아래에 최신순으로 모아두고,
  // 나머지만 랜덤 셔플함. NEW 표시가 사라지면(12시간 지나면) 자연스럽게 셔플 그룹으로 옮겨감.
  const newOnes = withoutSpotlight
    .filter(s => isRecentlyAdded(s.ts))
    .sort((a, b) => (b.ts || 0) - (a.ts || 0));
  const others = withoutSpotlight.filter(s => !isRecentlyAdded(s.ts));

  const rest = getShuffledRest(others);
  const finalList = spotlight ? [spotlight, ...newOnes, ...rest] : [...newOnes, ...rest];

  archiveList.innerHTML = finalList.map(s => {
    const metaParts = [];
    if(s.source) metaParts.push(escapeHtml(s.source));
    if(s.ref) metaParts.push(escapeHtml(s.ref));
    const metaLine = metaParts.join(' · ');
    const bookmarkHtml = s.important ? `<span class="quote-bookmark" title="즐겨찾기">${BOOKMARK_SVG}</span>` : '';
    const newBadgeHtml = isRecentlyAdded(s.ts) ? `<span class="quote-new-badge">NEW</span>` : '';
    const showMetaRow = metaLine || s.important || newBadgeHtml;
    const isSpotlight = spotlight && s.id === spotlight.id;
    const spotlightLabelHtml = isSpotlight ? `<div class="spotlight-label">${escapeHtml(currentSpotlightMessage)}</div>` : '';
    return `
      <div class="quote-block${isSpotlight ? ' spotlight-card' : ''}" data-id="${s.id}">
        ${spotlightLabelHtml}
        <p class="quote-text">${renderHighlightedText(s.text, s.highlights)}</p>
        ${s.comment ? `<div class="quote-comment"><span class="quote-comment-mark"></span><span class="quote-comment-text">${escapeHtml(s.comment)}</span></div>` : ''}
        ${showMetaRow ? `<div class="quote-meta-line">${bookmarkHtml}${newBadgeHtml}${metaLine ? `<span>${metaLine}</span>` : ''}</div>` : ''}
      </div>
    `;
  }).join('');

  setupSeenTracking();
}

// ── "봤다" 추적: 화면에 5초 이상 실제로 보였을 때만 기록 ────────
// (그냥 리스트에 뜨기만 해도 "봤다"고 치면, 스크롤 안 하고 지나친 것까지 다 봤다고 착각하게 됨)
let seenObserver = null;
let seenTimers = new Map(); // element -> timeout id
let seenSaveDebounceTimer = null;

function scheduleSeenSave(){
  clearTimeout(seenSaveDebounceTimer);
  seenSaveDebounceTimer = setTimeout(() => { saveAll(); }, 2000);
}

function setupSeenTracking(){
  if(seenObserver) seenObserver.disconnect();
  seenTimers.forEach(t => clearTimeout(t));
  seenTimers.clear();

  seenObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if(entry.isIntersecting){
        if(!seenTimers.has(entry.target)){
          const id = entry.target.dataset.id;
          const timer = setTimeout(() => {
            const s = findSentence(id);
            if(s){
              s.lastSeenAt = Date.now();
              scheduleSeenSave();
            }
            seenTimers.delete(entry.target);
          }, 5000);
          seenTimers.set(entry.target, timer);
        }
      } else if(seenTimers.has(entry.target)){
        clearTimeout(seenTimers.get(entry.target));
        seenTimers.delete(entry.target);
      }
    });
  }, { threshold: 0.6 });

  archiveList.querySelectorAll('.quote-block').forEach(el => seenObserver.observe(el));
}

// 이벤트 위임: archiveList 자체는 재렌더링해도 그대로 유지되는 요소라, 리스너를 한 번만 붙여두고
// 클릭된 대상이 어느 quote-block인지는 매번 closest로 찾음.
// (이전엔 renderArchive가 실행될 때마다 문장 개수만큼 리스너를 새로 붙이고 있었음)
archiveList.addEventListener('click', async (e) => {
  const block = e.target.closest('.quote-block');
  if(!block) return;

  // 드래그로 문장을 선택한 상태면(하이라이트 하려는 것) 액션시트를 열지 않음
  const sel = window.getSelection();
  if(sel && !sel.isCollapsed && sel.toString().trim()) return;

  // 보기 모드에서는 고치는 메뉴를 아예 안 열고, 짧은 반응만 보여줌
  if(viewMode === 'view'){
    const tapped = findSentence(block.dataset.id);
    if(tapped) showToast(pickTapReaction(tapped), 1400);
    return;
  }

  // 이미 칠해진 하이라이트를 탭하면, 메뉴 대신 그 하이라이트를 바로 지움
  const markEl = e.target.closest('.quote-highlight');
  if(markEl){
    const idx = parseInt(markEl.dataset.hidx, 10);
    const s = findSentence(block.dataset.id);
    if(s && Array.isArray(s.highlights) && !isNaN(idx)){
      s.highlights.splice(idx, 1);
      await saveAll();
      renderArchive();
    }
    return;
  }

  openEntryAction(block.dataset.id);
});

// ── 카테고리 세그먼트 탭 (좌하단) ───────────────
// 카테고리를 전환할 때, 배열 순서상 다음/이전인지에 따라 아주 살짝 좌우로 미끄러지듯 바뀜.
// 화면을 통째로 넘기는 게 아니라 "약간의" 느낌만 주는 정도로, 이동 거리와 시간을 짧게 잡음.
function switchCategoryAnimated(newCat){
  if(newCat === currentCategory) return;
  const oldIdx = CATEGORIES.indexOf(currentCategory);
  const newIdx = CATEGORIES.indexOf(newCat);
  const forward = newIdx > oldIdx; // 배열상 오른쪽으로 이동하면 다음 화면이 오른쪽에서 들어옴

  // 탭 알약은 누르자마자 곧바로 움직이게 함.
  // 문장 목록을 다시 그리는 건 무거운 작업이라, 그게 끝난 뒤에 알약이 출발하면
  // 첫 프레임들이 잡아먹혀서 툭툭 끊겨 보임 (특히 문장이 많은 폰에서).
  currentCategory = newCat;
  saveLastCategory(currentCategory);
  applyCategoryColor();
  categoryTabs.querySelectorAll('.category-tab').forEach(tab => {
    tab.classList.toggle('active', tab.dataset.cat === currentCategory);
  });
  updateCategoryIndicator();

  archiveList.classList.remove('cat-anim-in-l', 'cat-anim-in-r');
  archiveList.classList.add(forward ? 'cat-anim-out-l' : 'cat-anim-out-r');

  setTimeout(() => {
    renderArchive();
    resetQuoteFocus();
    window.scrollTo({ top: 0, behavior: 'instant' });

    archiveList.classList.remove('cat-anim-out-l', 'cat-anim-out-r');
    archiveList.classList.add(forward ? 'cat-anim-in-r' : 'cat-anim-in-l');
    setTimeout(() => archiveList.classList.remove('cat-anim-in-l', 'cat-anim-in-r'), 240);
  }, 130);
}

categoryTabs.querySelectorAll('.category-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    if(tab.dataset.cat === currentCategory){
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }
    switchCategoryAnimated(tab.dataset.cat);
  });
});

// ── 위아래 화살표로 화면 부드럽게 스크롤 ──────────────────
// 브라우저 기본 동작은 몇십 픽셀씩 찔끔찔끔 끊겨 움직임.
// 대신 한 번에 적당한 양을 부드럽게 흘려보내서 읽는 흐름이 끊기지 않게 함.
// 키를 꾹 누르고 있으면 명령이 겹쳐 밀리므로, 진행 중일 땐 목표 위치만 더해나감.
let smoothScrollTarget = null;
let smoothScrollRaf = null;

// 위아래 키는 문장 하나씩 움직임. 멈추는 자리는 항상 "그 문장의 끝이 화면 아래에서
// SCROLL_EDGE_GAP만큼 떨어진 곳" - 그래서 문장이 중간에 잘리지 않고 매번 같은 자리에서 끝남.
// 문장 끝과 화면 아래 사이 여백.
// 예전엔 100px 고정이었는데, 그 공간에 다음 문장 글자가 3줄쯤 비집고 들어와 잘려 보였음.
// 카테고리 탭·검색 버튼이 문장과 가로로 겹치지 않는 넓은 화면(PC)에서는 여백을 확 줄여서
// 다음 문장이 아예 안 보이게 하고, 좁은 화면에서만 탭을 피할 만큼 띄움.
// 위아래 키로 문장 하나씩 이동. 멈추는 자리는 항상 "그 문장이 화면 한가운데"에 오도록 함.
// 문장 길이와 상관없이 늘 같은 자리에서 멈추게 하려는 것.
// (예전엔 문장 끝을 화면 아래에 맞췄는데, 그러면 다음 문장이 아래로 비집고 들어와 잘려 보였음)
function sentenceStopPoints(){
  const maxY = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
  const vh = window.innerHeight;
  const pts = [];
  archiveList.querySelectorAll('.quote-block').forEach(el => {
    const r = el.getBoundingClientRect();
    const centerInPage = r.top + r.height / 2 + window.scrollY;
    // 그 문장의 한가운데가 화면 한가운데에 오도록 하는 스크롤 위치
    pts.push(Math.round(centerInPage - vh / 2));
  });
  return { pts: pts.sort((a, b) => a - b), maxY, vh };
}

function scrollToNextSentenceEdge(dir){
  const base = smoothScrollTarget === null ? window.scrollY : smoothScrollTarget;
  const { pts, maxY, vh } = sentenceStopPoints();
  // 문장 하나가 화면보다 길 수도 있음. 그럴 땐 한 번에 화면 하나 넘게 건너뛰지 않도록 제한해서
  // 못 보고 지나치는 부분이 없게 함.
  const maxStep = Math.max(120, Math.round(vh * 0.8));

  let next;
  if(dir > 0){
    next = pts.find(y => y > base + 8);
    if(next === undefined) next = maxY;              // 마지막 문장까지 갔으면 맨 아래로
    next = Math.min(next, base + maxStep);
  } else {
    next = [...pts].reverse().find(y => y < base - 8);
    if(next === undefined) next = 0;                 // 첫 문장보다 위면 맨 위로
    next = Math.max(next, base - maxStep);
  }
  smoothScrollTo(Math.min(maxY, Math.max(0, next)));
}

function smoothScrollTo(targetY){
  const maxY = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
  smoothScrollTarget = Math.min(maxY, Math.max(0, targetY));

  if(smoothScrollRaf) return; // 이미 흐르는 중이면 목표만 갱신하고 끝
  const step = () => {
    const cur = window.scrollY;
    const diff = smoothScrollTarget - cur;
    // 남은 거리가 1.5px 안쪽이면 바로 목표에 붙임.
    // 예전엔 0.5px 기준이라, 2px쯤 남았을 때 한 프레임 이동량(0.36px)이 화면에 반영되지 않아
    // 제자리걸음에 빠지면서 늘 목표보다 2px 못 미친 자리에 멈췄음.
    if(Math.abs(diff) < 1.5){
      window.scrollTo(0, smoothScrollTarget);
      smoothScrollTarget = null;
      smoothScrollRaf = null;
      return;
    }
    let delta = diff * 0.18; // 남은 거리의 일부씩 좁혀가며 자연스럽게 감속
    // 이동량이 1px보다 작으면 화면에 반영되지 않으므로 최소 1px은 움직이게 함
    if(Math.abs(delta) < 1) delta = diff > 0 ? 1 : -1;
    window.scrollTo(0, cur + delta);
    smoothScrollRaf = requestAnimationFrame(step);
  };
  smoothScrollRaf = requestAnimationFrame(step);
}

document.addEventListener('keydown', (e) => {
  if(e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;

  const active = document.activeElement;
  const tag = active ? active.tagName : '';
  if(['INPUT', 'TEXTAREA'].includes(tag)) return;   // 입력 중일 땐 건드리지 않음
  const anyOverlayOpen = document.querySelector(
    '.sheet-overlay.open, .modal-overlay.open, .ios-action-sheet.open, .ios-sheet-backdrop.open'
  );
  if(anyOverlayOpen) return;

  e.preventDefault();
  scrollToNextSentenceEdge(e.key === 'ArrowDown' ? 1 : -1);
});

// 카테고리를 바꾸면 흐르던 스크롤을 멈춤 (새 목록에서 엉뚱한 위치로 흐르지 않도록)
function resetQuoteFocus(){
  if(smoothScrollRaf) cancelAnimationFrame(smoothScrollRaf);
  smoothScrollRaf = null;
  smoothScrollTarget = null;
}

// ── 메인 화면에서 좌우 화살표로 카테고리 전환 (일 · 관계 · 삶 · 사랑) ──────
// 입력칸/버튼 등 다른 걸 조작 중일 땐 건드리지 않고, 딱히 포커스된 게 없거나
// 카테고리 탭 자체에 포커스가 있을 때만 동작함.
document.addEventListener('keydown', (e) => {
  if(e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;

  const active = document.activeElement;
  const isCategoryTab = active && active.classList.contains('category-tab');
  const isGenericFocus = !active || active === document.body;
  if(!isCategoryTab && !isGenericFocus) return;

  const anyOverlayOpen = document.querySelector(
    '.sheet-overlay.open, .modal-overlay.open, .ios-action-sheet.open, .ios-sheet-backdrop.open'
  );
  if(anyOverlayOpen) return;

  e.preventDefault();
  const currentIdx = CATEGORIES.indexOf(currentCategory);
  const dir = e.key === 'ArrowRight' ? 1 : -1;
  const nextIdx = (currentIdx + dir + CATEGORIES.length) % CATEGORIES.length;

  switchCategoryAnimated(CATEGORIES[nextIdx]);

  // 예전엔 이동한 탭에 포커스를 넘겼는데, 그러면 검은 테두리가 생기고
  // 그 상태에서 엔터를 누르면 전역 단축키 대신 그 탭 버튼이 눌려버림.
  // 화살표 이동은 어차피 전역에서 처리하므로 포커스는 넘기지 않음.
  if(isCategoryTab && document.activeElement && document.activeElement.blur){
    document.activeElement.blur();
  }
});

// ── 문장 추가 시트 (우하단 +) ───────────────────
let pendingComposeCategory = CATEGORIES[0];

function renderCategoryChips(container, selected, onSelect){
  container.innerHTML = CATEGORIES.map(cat => `
    <button type="button" class="category-chip ${cat === selected ? 'active' : ''}" data-cat="${cat}" tabindex="${cat === selected ? '0' : '-1'}">${cat}</button>
  `).join('');
  const chips = Array.from(container.querySelectorAll('.category-chip'));
  chips.forEach((btn, idx) => {
    btn.addEventListener('click', () => {
      onSelect(btn.dataset.cat);
      chips.forEach(b => {
        const isActive = b === btn;
        b.classList.toggle('active', isActive);
        // 선택된 칩만 tab 순서에 남기고 나머지는 빼서(-1), Tab을 누르면 나머지 칩을
        // 거치지 않고 바로 다음 요소(출처 입력칸)로 넘어가도록 함
        b.setAttribute('tabindex', isActive ? '0' : '-1');
      });
      // 고른 카테고리에 맞춰 시트 전용 색(compose-color)만 갱신함.
      // 보관함/탭에 쓰이는 category-color는 절대 건드리지 않아서, 뒤에 깔린 화면 색이 같이 바뀌는 일이 없음.
      document.documentElement.style.setProperty('--compose-color', CATEGORY_COLORS[btn.dataset.cat] || CATEGORY_COLORS['삶']);
    });
    // 좌우 화살표로 칩 사이를 이동하면서 바로 선택까지 되도록 함 (양 끝은 순환)
    btn.addEventListener('keydown', (e) => {
      if(e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
      e.preventDefault();
      const dir = e.key === 'ArrowRight' ? 1 : -1;
      const nextIdx = (idx + dir + chips.length) % chips.length;
      chips[nextIdx].focus();
      chips[nextIdx].click();
    });
  });
}

// [1] 출처 입력칸을 포커스하면 최근 사용한 출처가 바로 아래 드롭다운으로 나타남.
// mousedown에서 처리해야 input의 blur보다 먼저 실행되어 클릭이 씹히지 않음.
function wireSourceSuggest(inputEl, suggestEl){
  let highlightedIndex = -1;

  function renderHighlight(){
    suggestEl.querySelectorAll('.source-suggest-item').forEach((btn, i) => {
      btn.classList.toggle('highlighted', i === highlightedIndex);
    });
  }

  inputEl.addEventListener('focus', () => {
    if(recentSources.length === 0) return;
    highlightedIndex = -1;
    suggestEl.innerHTML = recentSources.map(src => `
      <button type="button" class="source-suggest-item">${escapeHtml(src)}</button>
    `).join('');
    suggestEl.querySelectorAll('.source-suggest-item').forEach((btn, i) => {
      btn.addEventListener('mousedown', (e) => {
        e.preventDefault();
        inputEl.value = recentSources[i];
        suggestEl.classList.remove('open');
      });
    });
    suggestEl.classList.add('open');
  });
  // 드롭다운이 열려있을 때 위/아래로 항목을 옮기고, Tab으로 확정하면서 다음 칸(문장 입력)으로 넘어감
  inputEl.addEventListener('keydown', (e) => {
    if(!suggestEl.classList.contains('open')) return;
    const items = suggestEl.querySelectorAll('.source-suggest-item');
    if(items.length === 0) return;

    if(e.key === 'ArrowDown'){
      e.preventDefault();
      highlightedIndex = (highlightedIndex + 1) % items.length;
      renderHighlight();
    } else if(e.key === 'ArrowUp'){
      e.preventDefault();
      highlightedIndex = (highlightedIndex - 1 + items.length) % items.length;
      renderHighlight();
    } else if(e.key === 'Tab'){
      if(highlightedIndex >= 0) inputEl.value = recentSources[highlightedIndex];
      suggestEl.classList.remove('open');
      // Tab 기본 동작(다음 요소로 포커스 이동)은 그대로 두고 막지 않음
    }
  });
  inputEl.addEventListener('blur', () => {
    setTimeout(() => suggestEl.classList.remove('open'), 150);
  });
}
wireSourceSuggest(sourceInput, sourceSuggest);
wireSourceSuggest(editSourceInput, editSourceSuggest);

// 모드+입력값 → 저장용 문자열 ("51p" 또는 "2026.04.25")
function buildRefString(mode, pageVal, dateVal){
  if(mode === 'page'){
    const v = (pageVal || '').trim();
    return v ? `${v}p` : '';
  }
  return dateVal ? dateVal.replace(/-/g, '.') : '';
}
// 저장된 문자열 → 수정 시트를 열 때 모드+입력값 복원 (옛 형식/자유 입력도 최대한 추측해서 복원)
function parseRefString(ref){
  if(!ref) return { mode: 'page', page: '', date: '' };
  const pageMatch = ref.match(/^(\d+)\s*p$/i);
  if(pageMatch) return { mode: 'page', page: pageMatch[1], date: '' };
  const dateMatch = ref.match(/^(\d{4})[.\-](\d{2})[.\-](\d{2})$/);
  if(dateMatch) return { mode: 'date', page: '', date: `${dateMatch[1]}-${dateMatch[2]}-${dateMatch[3]}` };
  const digits = ref.match(/\d+/);
  return { mode: 'page', page: digits ? digits[0] : '', date: '' };
}

// 시트를 연 뒤 입력칸에 초점을 주기까지의 대기 시간.
// 모바일은 키보드가 올라오는 동안 기다려야 하지만, PC는 기다릴 이유가 없어서 즉시 초점을 줌
// (그냥 250ms를 다 기다리면 눌렀는데 잠깐 멈칫하는 느낌이 남).
function focusSoon(getEl){
  const isDesktop = window.matchMedia('(min-width: 900px) and (hover: hover)').matches;
  if(isDesktop) requestAnimationFrame(() => { const el = getEl(); if(el) el.focus(); });
  else setTimeout(() => { const el = getEl(); if(el) el.focus(); }, 250);
}

function openAddQuoteSheet(){
  pendingComposeCategory = currentCategory;
  document.documentElement.style.setProperty('--compose-color', CATEGORY_COLORS[pendingComposeCategory] || CATEGORY_COLORS['삶']);
  renderCategoryChips(composeCategoryChips, pendingComposeCategory, (cat) => { pendingComposeCategory = cat; });
  sourceInput.value = '';
  quoteTextInput.value = '';
  addRefMode = 'page';
  refPageInput.value = '';
  refDateInput.value = '';
  applyRefMode(addRefMode, refModeToggle, refModeLabel, refPageInput, refDateInput);
  addQuoteStatusMsg.classList.remove('show');
  // 이 창은 열자마자 키보드가 뜨지 않음(첫 초점이 카테고리 버튼).
  // 그래서 미리 위로 올리지 않고 평소처럼 가운데에 띄움 - PC에선 계속 가운데,
  // 폰에선 입력칸을 눌러 키보드가 올라올 때만 위로 옮겨감.
  addQuoteOverlay.classList.add('open');
  lockBodyScroll();
  syncDialogViewport();
  focusSoon(() => composeCategoryChips.querySelector('.category-chip.active') || sourceInput);
}
function closeAddQuoteSheet(){
  if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
  addQuoteOverlay.classList.remove('open');
  resetDialogViewport(addQuoteOverlay);
  unlockBodyScroll();
}
addQuoteOverlay.addEventListener('click', (e) => {
  if(e.target === addQuoteOverlay) closeAddQuoteSheet();
});

// 그 문장에 해당하는 성격들을 모아서, 그중 하나를 무작위로 고름.
// (여러 성격이 겹치면 매번 다른 결의 반응이 나와서 덜 뻔해짐)
function pickTapReaction(s){
  const pools = [];
  if(Array.isArray(s.highlights) && s.highlights.length) pools.push(VIEW_TAP_REACTIONS.highlighted);
  if(s.important) pools.push(VIEW_TAP_REACTIONS.favorite);
  if(s.comment && s.comment.trim()) pools.push(VIEW_TAP_REACTIONS.commented);

  const age = Date.now() - (s.ts || 0);
  const day = 24 * 60 * 60 * 1000;
  if(age < 3 * day) pools.push(VIEW_TAP_REACTIONS.fresh);
  else if(age > 60 * day) pools.push(VIEW_TAP_REACTIONS.old);

  const len = (s.text || '').replace(/\s/g, '').length;
  if(len >= 70) pools.push(VIEW_TAP_REACTIONS.long);
  else if(len <= 20) pools.push(VIEW_TAP_REACTIONS.short);

  pools.push(VIEW_TAP_REACTIONS.plain); // 항상 후보에 포함해서 너무 정형화되지 않게 함
  return pickFrom(pools[Math.floor(Math.random() * pools.length)]);
}

// 저장할 때마다 뜨는 확인 문구를 상황에 맞게 여러 개 두고 돌아가며 보여줌.
// 마스코트나 캐릭터 없이, 그 순간 사이트가 조용히 알아봐 주는 정도의 말투만 담음.
const SAVE_MESSAGES = {
  newBook: [
    '새 책이네요 반가워요',
    '이 책은 처음이네요',
    '새로운 책이에요 잘 부탁해요',
  ],
  continue: [
    (n) => `이 책에서 ${n}번째예요`,
    (n) => `이 책과 ${n}번 만났어요`,
    (n) => `${n}번째로 옮겨 적었어요`,
  ],
  milestone: [
    (n) => `어느새 ${n}개를 모았어요`,
    (n) => `${n}개 여기까지 왔네요`,
    (n) => `벌써 ${n}번째 문장이에요`,
  ],
  plain: [
    '잘 담아뒀어요',
    '여기 남겨뒀어요',
    '조용히 저장했어요',
  ],
};
function pickFrom(pool, ...args){
  const item = pool[Math.floor(Math.random() * pool.length)];
  return typeof item === 'function' ? item(...args) : item;
}
// 방금 문장이 sentences에 추가된 뒤에 호출된다고 가정함 (전체 개수·같은 출처 개수에 그걸 포함해서 셈)
function pickSaveMessage(source){
  const total = sentences.length;
  if(total > 0 && total % 50 === 0) return pickFrom(SAVE_MESSAGES.milestone, total);

  if(source){
    const sameSourceCount = sentences.filter(s => s.source === source).length;
    if(sameSourceCount === 1) return pickFrom(SAVE_MESSAGES.newBook);
    return pickFrom(SAVE_MESSAGES.continue, sameSourceCount);
  }
  return pickFrom(SAVE_MESSAGES.plain);
}

// ── 중앙 Dialog가 visual viewport(키보드 열림 등) 안에 오도록 위치 보정 ──
// 키보드가 올라왔을 때의 처리.
// 예전엔 창 전체를 키보드 위 공간에 맞춰 줄였는데, iOS에서 그 크기 계산이 정확히 안 맞아
// 어두운 배경이 화면 중간에서 끊기고 아래로 원래 내용이 비쳐 보였음.
// 그래서 배경은 항상 화면 전체를 덮게 두고(틈이 안 생김), 실제로 쓸 수 있는 높이만
// CSS 변수로 알려줘서 시트가 그 안에 들어가도록 함.
// "실제로 보이는 영역"의 위치와 크기를 알려줌.
// 창(팝업)은 이 값을 그대로 써서 늘 보이는 영역에 딱 맞게 놓임.
function syncDialogViewport(){
  const vv = window.visualViewport;
  if(!vv) return;
  // 화면 위/아래에서 각각 얼마나 가려져 있는지(주소창·키보드 등).
  // 이 값만큼 창 바깥에 여백을 줘서, 창이 실제로 보이는 영역 안에 놓이게 함.
  const padTop = Math.max(0, Math.round(vv.offsetTop));
  const padBottom = Math.max(0, Math.round(window.innerHeight - (vv.offsetTop + vv.height)));
  document.documentElement.style.setProperty('--vv-pad-top', padTop + 'px');
  document.documentElement.style.setProperty('--vv-pad-bottom', padBottom + 'px');
  // 폰 전체화면 창이 쓸 높이 = 키보드를 뺀 실제로 보이는 높이
  document.documentElement.style.setProperty('--visible-h', Math.round(vv.height) + 'px');
}
// 창을 닫을 때 여백을 원래대로 되돌림
function resetDialogViewport(){
  document.documentElement.style.removeProperty('--visible-h');
  document.documentElement.style.setProperty('--vv-pad-top', '0px');
  document.documentElement.style.setProperty('--vv-pad-bottom', '0px');
}

// 창이 열려 있을 때만 반응함. 평소 스크롤 중에는 아무것도 계산하지 않아서
// 사파리가 주소창을 움직이는 걸 방해하지 않음.
function anySheetOpen(){ return !!document.querySelector('.sheet-overlay.open'); }
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', () => { if(anySheetOpen()) syncDialogViewport(); });
  window.visualViewport.addEventListener('scroll', () => { if(anySheetOpen()) syncDialogViewport(); });
}
syncDialogViewport();

// ── 배경 스크롤 잠금 (Dialog 열림 중) ────────────
let scrollLockCount = 0;
let savedScrollY = 0;
// 화면 키보드가 올라오는 기기인지 (PC는 물리 키보드)
const HAS_ONSCREEN_KEYBOARD = window.matchMedia('(pointer: coarse)').matches;

// 폰에서는 body를 통째로 고정시키지 않음.
// 그렇게 하면 창을 닫을 때 window.scrollTo로 강제 스크롤을 해야 하는데,
// 아이폰 사파리는 강제로 스크롤당하면 주소창 상태와 화면 높이 계산이 어긋난 채로 남아서
// 그 뒤로 떠 있는 요소들이 계속 어긋나고 덜덜거렸음.
// 폰에서는 창이 화면 전체를 덮으므로 뒤가 안 보여서 굳이 고정할 필요도 없음.
function lockBodyScroll(){
  if(scrollLockCount === 0){
    document.body.classList.add('modal-open');
    if(!HAS_ONSCREEN_KEYBOARD){
      savedScrollY = window.scrollY || window.pageYOffset || 0;
      document.body.style.position = 'fixed';
      document.body.style.top = `-${savedScrollY}px`;
      document.body.style.width = '100%';
    }
  }
  scrollLockCount++;
}
function unlockBodyScroll(){
  scrollLockCount = Math.max(0, scrollLockCount - 1);
  if(scrollLockCount === 0){
    document.body.classList.remove('modal-open');
    if(!HAS_ONSCREEN_KEYBOARD){
      document.body.style.position = '';
      document.body.style.top = '';
      document.body.style.width = '';
      window.scrollTo(0, savedScrollY);
    }
  }
}

// ── 드래그로 문장 선택 → + 버튼이 잠깐 하이라이트 버튼으로 바뀜 ────────
// 새 버튼을 따로 띄우지 않고, 이미 있는 + 버튼(우하단)이 상황에 맞게 모습을 바꿈:

// 선택해서 지울 수 있으면 빨강)으로 전환됨.
const HIGHLIGHTER_ICON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 11-6 6v3h9l3-3"/><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/></svg>';
const SEARCH_ICON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>';
let pendingHighlight = null;

// 보기 모드면 돋보기(검색), 편집 모드면 + 로 - 우하단 버튼 하나가 모드에 따라 역할을 바꿈
