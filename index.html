<style>
  :root{
    --bg: #FFFFFF;
    --surface: #FCFCFC;
    --text: #181818;
    --text-secondary: #666666;
    --text-tertiary: #A0A0A0;
    --border: #ECECEC;
    --category-color: #C6F24E;
    --compose-color: #C6F24E;
    --hover: #F5F5F5;
    --danger: #B23A2E;
    --danger-soft: #F5E6E4;
    --highlight-bg: #FFF176;
    --highlight-text: #2E7D32;
    --cancel-bg: #FFEBEE;
    --cancel-text: #C62828;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0;
    width: 100%;
    max-width: 100%;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", sans-serif;
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
  }
  body.modal-open{
    overflow: hidden;
    touch-action: none;
  }

  .wrap{
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
    padding: max(28px, env(safe-area-inset-top)) 22px 120px;
  }

  /* ── 시작 스플래시 화면 ─────────────────────── */
  .splash-overlay{
    position: fixed;
    inset: 0;
    z-index: 300;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.4s ease;
  }
  .splash-overlay.hide{
    opacity: 0;
    pointer-events: none;
  }
  .splash-logo{
    width: 108px;
    height: 108px;
    animation: splashPop 0.35s ease-out;
  }
  @keyframes splashPop{
    from{ opacity: 0; transform: scale(0.9); }
    to{ opacity: 1; transform: scale(1); }
  }

  /* ── 보관함 (카테고리별 문장 목록) - 메인 화면 ──── */
  .archive-header{
    display: flex;
    justify-content: center;
    margin-bottom: 24px;
  }
  .archive-header img{
    width: 40px;
    height: 40px;
    display: block;
    cursor: pointer;
  }
  /* 로고를 탭하면 백업이 저장됨(숨겨진 기능) - 문구 없이 살짝 반짝이는 정도로만 확인해줌 */
  .archive-header img.logo-pulse{
    animation: logoPulse 0.4s ease;
  }
  @keyframes logoPulse{
    0%{ opacity: 1; transform: scale(1); }
    40%{ opacity: 0.55; transform: scale(0.92); }
    100%{ opacity: 1; transform: scale(1); }
  }
  .archive-list{ max-width: 560px; margin: 0 auto; }

  /* 문장 목록 맨 아래 - 맞춤법 확인 트리거 */
  .spell-check-trigger{
    display: block;
    width: 100%;
    max-width: 560px;
    margin: 24px auto 0;
    padding: 8px 0;
    border: none;
    background: none;
    color: var(--text-tertiary);
    font-family: 'Pretendard', sans-serif;
    font-size: 11.5px;
    font-weight: 500;
    cursor: pointer;
  }
  .spell-check-trigger:disabled{ opacity: 0.5; cursor: default; }

  /* 맞춤법 확인 결과 검토 목록 */
  .spell-check-item{
    border-bottom: 1px solid var(--border);
    padding: 14px 0;
  }
  .spell-check-item:last-child{ border-bottom: none; }
  .spell-check-item-header{
    display: flex;
    align-items: flex-start;
    gap: 10px;
    cursor: pointer;
  }
  .spell-check-checkbox{
    margin-top: 4px;
    flex-shrink: 0;
    width: 17px; height: 17px;
    accent-color: var(--category-color);
  }
  .spell-check-texts{ flex: 1; min-width: 0; }
  .spell-check-category{
    display: block;
    font-size: 10.5px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .spell-check-original{
    font-size: 13px;
    color: var(--text-tertiary);
    margin-bottom: 5px;
    line-height: 1.55;
    word-break: keep-all;
  }
  .spell-check-corrected{
    font-size: 14.5px;
    color: var(--text);
    line-height: 1.55;
    word-break: keep-all;
  }
  .diff-del{
    background: var(--cancel-bg);
    color: var(--cancel-text);
    text-decoration: line-through;
    border-radius: 2px;
  }
  .diff-ins{
    background: #E8F5E9;
    color: var(--highlight-text);
    font-weight: 700;
    border-radius: 2px;
  }
  .diff-space-mark{
    display: inline-block;
    color: var(--highlight-text);
    font-weight: 700;
    font-size: 10px;
    vertical-align: super;
    line-height: 1;
    margin: 0 1px;
  }

  .quote-block{
    position: relative;
    padding: 20px 0;
    cursor: pointer;
  }
  .quote-block:active{ background: var(--hover); }
  .quote-block + .quote-block{
    border-top: 1px solid var(--border);
  }
  /* 오래 안 만난 문장(스포트라이트)은 옅은 배경 칠로만 강조함(화면 끝까지 배경이 번짐).
     위/아래 여백을 정확히 맞추기 위해: 로고→스포트라이트 간격(archive-header의 margin-bottom)과
     스포트라이트→다음 문장 간격(margin-bottom)을 같은 값으로 맞추고, 다음 항목의 자체
     top padding은 0으로 상쇄시켜서 두 간격이 픽셀 단위로 동일해지도록 함. */
  .quote-block.spotlight-card{
    background: color-mix(in srgb, var(--category-color) 7%, white);
    margin: 0 -22px 24px;
    padding: 20px 22px;
  }
  .quote-block.spotlight-card + .quote-block{
    border-top: none;
    padding-top: 0;
  }
  .spotlight-label{
    font-size: 11.5px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 8px;
    padding-left: 18px;
  }
  .quote-text{
    border-left: 4px solid var(--category-color);
    padding-left: 14px;
    font-size: 16px;
    font-weight: 400;
    line-height: 1.6;
    color: var(--text);
    margin: 0;
    text-align: left;
    word-break: keep-all;
    overflow-wrap: break-word;
  }
  .quote-comment{
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin-top: 10px;
    padding-left: 18px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    line-height: 1.5;
  }
  .quote-comment-mark{
    display: inline-block;
    width: 10px;
    height: 2px;
    border-radius: 1px;
    background: var(--category-color);
    flex-shrink: 0;
    margin-top: 8px;
  }
  .quote-comment-text{
    word-break: keep-all;
  }
  .quote-meta-line{
    position: relative;
    margin-top: 10px;
    padding-left: 18px;
    font-size: 12px;
    color: var(--text-tertiary);
    min-height: 13px;
    display: flex;
    align-items: center;
  }
  /* 책갈피는 항상 세로 선과 같은 x위치(왼쪽 끝)에 고정되도록 절대 위치로 둠.
     출처/페이지 텍스트의 들여쓰기(padding-left:18px)와는 서로 영향을 주지 않아서,
     책갈피가 있든 없든 텍스트 위치는 항상 같고, 책갈피는 항상 선 바로 아래에 옴. */
  .quote-bookmark{
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    color: var(--category-color);
  }
  /* 추가된 지 24시간 안쪽인 문장에만 표시됨. 카테고리 색을 그대로 쓰면 파스텔톤이라
     작은 글자에서는 잘 안 보일 수 있어, 살짝 어둡게 섞어서 가독성을 확보함. */
  .quote-new-badge{
    color: color-mix(in srgb, var(--category-color) 60%, black);
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.02em;
    margin-right: 6px;
  }

  .empty{
    text-align:center;
    padding: 64px 20px;
    color: var(--text-tertiary);
    font-size: 13.5px;
    line-height: 1.9;
  }
  .empty-title{
    font-size: 14px;
    font-weight: 600;
    color: var(--text-secondary);
  }

  /* ── 하단 좌: 카테고리 세그먼트 탭 ──────────── */
  .category-tabs{
    position: fixed;
    left: 20px;
    bottom: max(20px, env(safe-area-inset-bottom));
    display: flex;
    gap: 2px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px;
    box-shadow: 0 4px 14px rgba(24,24,24,0.1);
    z-index: 70;
  }
  /* 탭 뒤에서 좌우로 슬라이드하는 필 - 애플 세그먼트 컨트롤 느낌 */
  .category-tab-indicator{
    position: absolute;
    top: 4px;
    bottom: 4px;
    left: 0;
    border-radius: 999px;
    background: var(--category-color);
    transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1), width 0.32s cubic-bezier(0.32, 0.72, 0, 1), background 0.25s ease;
    z-index: 0;
  }
  .category-tab{
    position: relative;
    z-index: 1;
    border: none;
    background: none;
    border-radius: 999px;
    padding: 9px 14px;
    font-family: 'Pretendard', sans-serif;
    font-size: 13.5px;
    font-weight: 700;
    color: var(--text-secondary);
    cursor: pointer;
    transition: color 0.2s ease;
  }
  .category-tab.active{
    color: var(--text);
  }

  /* ── 하단 우: + 버튼 ─────────────────────── */
  .add-quote-trigger-btn{
    position: fixed;
    right: 20px;
    bottom: max(20px, env(safe-area-inset-bottom));
    width: 48px; height: 48px;
    border-radius: 50%;
    border: none;
    background: var(--text);
    color: #FFFFFF;
    font-size: 22px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(24,24,24,0.22);
    z-index: 70;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .add-quote-trigger-btn:active{ transform: scale(0.94); }
  /* 문장을 드래그로 선택하면, 새 버튼을 따로 띄우는 대신 이미 익숙한 이 자리(우하단)를
     그대로 재사용해서 "하이라이트" 버튼으로 잠깐 바뀜. 선택이 풀리면 다시 +로 돌아옴. */
  .add-quote-trigger-btn.highlight-mode{
    background: var(--highlight-bg);
    color: #3D3200;
  }
  .add-quote-trigger-btn.highlight-mode.cancel-mode{
    background: var(--cancel-bg);
    color: var(--cancel-text);
  }

  /* 형광펜 하이라이트 - 카테고리 색과 무관하게 항상 통일된 노랑 */
  .quote-highlight{
    background: var(--highlight-bg);
    padding: 1px 0;
    border-radius: 2px;
    cursor: pointer;
  }

  /* ── 확인 다이얼로그 ──────────────────────── */
  .modal-overlay{
    position: fixed;
    inset: 0;
    background: rgba(31,35,40,0.32);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
  }
  .modal-overlay.open{ display: flex; }
  .modal-box{
    background: var(--surface);
    border-radius: 14px;
    width: 100%;
    max-width: 440px;
    box-shadow: 0 12px 32px rgba(31,35,40,0.16);
    animation: fadeIn 0.18s ease;
  }
  .confirm-box{
    max-width: 300px;
    padding: 26px 22px 20px;
  }
  .confirm-message{
    margin: 0 0 20px;
    font-size: 14px;
    line-height: 1.75;
    color: var(--text);
    text-align: center;
  }
  .spell-error-text{
    text-align: left;
    font-size: 12.5px;
    line-height: 1.6;
    color: var(--text-secondary);
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 50vh;
    overflow-y: auto;
  }
  .confirm-actions{ display:flex; gap: 8px; }
  .confirm-btn{
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 0;
    font-family: 'Pretendard', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    background: var(--surface);
  }
  .confirm-cancel{ color: var(--text-secondary); }
  .confirm-cancel:hover{ background: var(--hover); }
  .confirm-ok{ color: var(--danger); border-color: var(--danger-soft); background: var(--danger-soft); }
  .confirm-ok:hover{ background: #EBDAD6; }

  @keyframes fadeIn{
    from{ opacity: 0; transform: translateY(2px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  /* ── 중앙 Dialog 공통 ──────────────────────── */
  .sheet-overlay{
    position: fixed;
    inset: 0;
    background: rgba(24,24,24,0.28);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 90;
  }
  .sheet-overlay.open{ display: flex; }
  .bottom-sheet{
    width: 100%;
    max-width: 480px;
    height: auto;
    max-height: min(82dvh, 720px);
    background: var(--surface);
    border-radius: 20px;
    box-shadow: 0 20px 50px rgba(24,24,24,0.18);
    opacity: 0;
    transform: scale(0.97) translateY(4px);
    transition: opacity 0.2s ease, transform 0.2s ease;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }
  .sheet-overlay.open .bottom-sheet{
    opacity: 1;
    transform: scale(1) translateY(0);
  }
  .sheet-overlay.keyboard-open{
    align-items: flex-start;
    padding-top: 10px;
  }
  .sheet-overlay.keyboard-open .bottom-sheet{
    max-height: calc(100% - 20px);
    transform: none;
  }
  .sheet-title{
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    margin: 0 0 14px;
  }
  .sheet-body{
    padding: 22px;
    overflow-y: auto;
    overscroll-behavior: contain;
  }

  /* ── 문장 추가/수정 시트 공통 입력 요소 ────── */
  .category-chip-row{
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .category-chip{
    flex: 1;
    text-align: center;
    border: 1px solid var(--border);
    background: var(--bg);
    border-radius: 10px;
    padding: 10px 0;
    font-family: 'Pretendard', sans-serif;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text-secondary);
    cursor: pointer;
  }
  .category-chip.active{
    background: var(--compose-color);
    border-color: var(--compose-color);
    color: var(--text);
  }

  /* [1] 출처: 입력칸을 포커스하면 최근 사용한 출처가 바로 아래 드롭다운으로 나타남 */
  .source-field-wrap{ position: relative; }
  .source-suggest{
    display: none;
    position: absolute;
    top: calc(100% - 8px);
    left: 0; right: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 10px 24px rgba(24,24,24,0.14);
    z-index: 5;
    overflow: hidden;
  }
  .source-suggest.open{ display: block; }
  .source-suggest-item{
    display: block;
    width: 100%;
    text-align: left;
    padding: 12px 14px;
    background: none;
    border: none;
    border-bottom: 1px solid var(--border);
    font-family: 'Pretendard', sans-serif;
    font-size: 14px;
    color: var(--text);
    cursor: pointer;
  }
  .source-suggest-item:last-child{ border-bottom: none; }
  .source-suggest-item:active{ background: var(--hover); }
  .source-suggest-item.highlighted{ background: var(--hover); }

  /* [2] 페이지/일자 토글 + 전용 입력 */
  .ref-field-row{
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 12px;
  }
  .ref-mode-toggle{
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--border);
    background: var(--bg);
    border-radius: 8px;
    padding: 0;
    color: var(--text-secondary);
    cursor: pointer;
  }
  .ref-mode-label{
    flex-shrink: 0;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-secondary);
    white-space: nowrap;
  }
  .ref-input{
    flex: 1;
    min-width: 0;
    margin-bottom: 0 !important;
  }
  .add-book-input{
    width: 100%;
    height: 52px;
    box-sizing: border-box;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0 14px;
    font-family: 'Pretendard', sans-serif;
    font-size: 16px;
    color: var(--text);
    outline: none;
    margin-bottom: 12px;
    background: var(--bg);
  }
  .add-book-input:focus{ border-color: var(--category-color); }
  .quote-textarea{
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    font-family: 'Pretendard', sans-serif;
    font-size: 16px;
    line-height: 1.65;
    color: var(--text);
    outline: none;
    margin-bottom: 12px;
    background: var(--bg);
    resize: none;
  }
  .quote-textarea:focus{ border-color: var(--category-color); }
  .quote-textarea::placeholder, .add-book-input::placeholder{ color: var(--text-tertiary); }

  .cta-btn{
    pointer-events: auto;
    border: none;
    border-radius: 999px;
    font-family: 'Pretendard', sans-serif;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  }
  .cta-primary{
    background: var(--category-color);
    color: var(--text);
    font-size: 14px;
    font-weight: 700;
    padding: 14px 26px;
    box-shadow: 0 3px 10px rgba(24,24,24,0.16);
  }
  .cta-primary:hover{ box-shadow: 0 4px 13px rgba(24,24,24,0.2); }
  .cta-btn:active{ transform: scale(0.96); }
  /* 문장 작성/수정 시트 안에서는 저장 버튼/포커스 테두리가 시트 전용 미리보기 색(compose-color)을
     따로 쓰도록 덮어씀 - 보관함 화면의 색과는 완전히 분리되어 서로 영향을 주지 않음 */
  #addQuoteOverlay .cta-primary,
  #editSheetOverlay .cta-primary{ background: var(--compose-color); }
  #addQuoteOverlay .add-book-input:focus,
  #addQuoteOverlay .quote-textarea:focus,
  #editSheetOverlay .add-book-input:focus,
  #editSheetOverlay .quote-textarea:focus{ border-color: var(--compose-color); }
  .add-book-submit{
    width: 100%;
    margin-top: 6px;
    padding: 13px 0;
  }
  .add-book-submit:disabled{ opacity: 0.5; cursor: default; }

  .status-msg{
    font-size: 12px;
    color: var(--text-secondary);
    min-height: 0;
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    transition: opacity 0.3s ease, max-height 0.3s ease, margin 0.3s ease;
  }
  .status-msg.show{
    opacity: 1;
    max-height: 30px;
    margin-top: 8px;
    margin-bottom: 8px;
  }
  .status-msg.error{ color: var(--danger); }

  /* ── 저장 완료 토스트 ─────────────────────── */
  .toast{
    position: fixed;
    top: max(20px, env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%) translateY(-6px);
    background: var(--category-color);
    color: var(--text);
    font-size: 12.5px;
    font-weight: 600;
    padding: 9px 18px;
    border-radius: 999px;
    box-shadow: 0 6px 18px rgba(24,24,24,0.2);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 200;
    white-space: nowrap;
  }
  .toast.show{
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ── 문장 ··· 액션 (아이폰 기본 선택 버튼/액션시트 스타일) ──── */
  .ios-sheet-backdrop{
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(24,24,24,0.32);
    z-index: 96;
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  .ios-sheet-backdrop.open{ display: block; opacity: 1; }
  .ios-action-sheet{
    position: fixed;
    left: 12px; right: 12px;
    bottom: max(12px, env(safe-area-inset-bottom));
    z-index: 97;
    display: flex;
    flex-direction: column;
    gap: 8px;
    transform: translateY(100%);
    opacity: 0;
    transition: transform 0.22s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.2s ease;
    pointer-events: none;
  }
  .ios-action-sheet.open{
    transform: translateY(0);
    opacity: 1;
    pointer-events: auto;
  }
  .ios-action-group{
    background: var(--surface);
    border-radius: 14px;
    overflow: hidden;
  }
  .ios-action-item{
    display: block;
    width: 100%;
    padding: 16px;
    background: none;
    border: none;
    border-bottom: 1px solid var(--border);
    font-family: 'Pretendard', sans-serif;
    font-size: 16px;
    color: var(--text);
    text-align: center;
    cursor: pointer;
  }
  .ios-action-item:last-child{ border-bottom: none; }
  .ios-action-item:active{ background: var(--hover); }
  .ios-action-item.danger{ color: var(--danger); }
  .ios-action-item.cancel{ font-weight: 700; }

  /* ── 그래프(캔버스) 화면 ───────────────────── */
  .graph-overlay{
    position: fixed;
    inset: 0;
    z-index: 250;
    background: #FBFBFA;
    display: none;
    flex-direction: column;
  }
  .graph-overlay.open{ display: flex; }
  .graph-toolbar{
    flex-shrink: 0;
    height: 52px;
    padding: 0 18px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .graph-title{
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.01em;
  }
  .graph-toolbar-actions{
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .graph-hint{
    font-size: 11.5px;
    color: var(--text-tertiary);
  }
  .graph-tool-btn{
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-secondary);
    border-radius: 999px;
    padding: 7px 14px;
    font-family: 'Pretendard', sans-serif;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .graph-tool-btn.primary{
    background: var(--text);
    border-color: var(--text);
    color: #FFFFFF;
  }

  /* 격자 배경을 깔아서 화면을 끌 때 움직임이 눈에 보이도록 함 */
  .graph-viewport{
    flex: 1;
    position: relative;
    overflow: hidden;
    cursor: grab;
    background-image:
      radial-gradient(circle, #DCDCDC 1px, transparent 1px);
    background-size: 22px 22px;
  }
  .graph-viewport.panning{ cursor: grabbing; }
  .graph-world{
    position: absolute;
    left: 0; top: 0;
    width: 0; height: 0;
    transform-origin: 0 0;
  }
  /* 크기를 0으로 두고 overflow를 열어둬서, 좌표가 화면 밖이어도 선이 그려지게 함 */
  .graph-links{
    position: absolute;
    left: 0; top: 0;
    width: 1px; height: 1px;
    overflow: visible;
    pointer-events: none;
  }
  .graph-link-line{
    fill: none;
    stroke: #C9C9C9;
    stroke-width: 1.6;
  }
  .graph-link-hit{
    fill: none;
    stroke: transparent;
    stroke-width: 14;
    pointer-events: stroke;
    cursor: pointer;
  }
  .graph-link-group:hover .graph-link-line{ stroke: var(--danger); stroke-width: 2.2; }
  .graph-link-temp{
    fill: none;
    stroke: var(--text-tertiary);
    stroke-width: 1.8;
    stroke-dasharray: 5 4;
  }

  .graph-nodes{ position: absolute; left: 0; top: 0; width: 0; height: 0; }
  .graph-node{
    position: absolute;
    width: 240px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-left: 4px solid var(--category-color);
    border-radius: 10px;
    padding: 12px 14px;
    box-shadow: 0 1px 4px rgba(24,24,24,0.06);
    cursor: grab;
    user-select: none;
  }
  .graph-node.dragging{
    cursor: grabbing;
    box-shadow: 0 6px 20px rgba(24,24,24,0.16);
    z-index: 5;
  }
  .graph-node-text{
    font-size: 13px;
    line-height: 1.55;
    color: var(--text);
    word-break: keep-all;
    overflow-wrap: break-word;
  }
  .graph-node-meta{
    margin-top: 8px;
    font-size: 11px;
    color: var(--text-tertiary);
  }
  /* 연결 시작점 - 평소엔 숨어있다가 카드에 마우스를 올리면 나타남 */
  .graph-node-handle{
    position: absolute;
    right: -7px;
    top: 50%;
    transform: translateY(-50%);
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--bg);
    border: 2px solid var(--text-tertiary);
    opacity: 0;
    transition: opacity 0.12s ease;
    cursor: crosshair;
  }
  .graph-node:hover .graph-node-handle{ opacity: 1; }
  .graph-node-handle:hover{ border-color: var(--text); }
  .graph-node.link-target{ border-color: var(--text); }

  /* ── 유영 모드: 선을 따라 천천히 흘러다니며 문장을 만나는 상태 ── */
  .graph-tool-btn.active{
    background: var(--text);
    border-color: var(--text);
    color: #FFFFFF;
  }
  /* 유영 중에는 지금 보는 카드만 또렷하게 두고 나머지는 조용히 물러나게 함 */
  .graph-viewport.drifting .graph-node{
    opacity: 0.22;
    transition: opacity 0.7s ease, box-shadow 0.7s ease;
  }
  .graph-viewport.drifting .graph-node.drift-focus{
    opacity: 1;
    box-shadow: 0 6px 26px rgba(24,24,24,0.14);
  }
  .graph-viewport.drifting .graph-link-line{
    opacity: 0.18;
    transition: opacity 0.7s ease;
  }
  .graph-viewport.drifting .graph-link-group.drift-path .graph-link-line{
    opacity: 1;
    stroke: var(--text-tertiary);
  }
  /* 유영 중엔 손대지 않아도 되도록 커서와 조작 힌트를 바꿈 */
  .graph-viewport.drifting{ cursor: default; }
  .graph-viewport.drifting .graph-node{ cursor: default; }
  .graph-viewport.drifting .graph-node-handle{ display: none; }

  /* ── 카드 접기 / 펼치기 ─────────────────────────
     평소엔 라벨만 짧게. 마우스를 올리거나, 유영 중 도착했거나, 충분히 확대하면 전문이 보임. */
  .graph-node-label{
    font-size: 13px;
    line-height: 1.5;
    font-weight: 600;
    color: var(--text);
    word-break: keep-all;
  }
  .graph-node-full{ display: none; }
  .graph-node-comment{
    margin-top: 8px;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-secondary);
    line-height: 1.5;
    word-break: keep-all;
  }
  .graph-node:hover .graph-node-label,
  .graph-node.drift-focus .graph-node-label,
  .graph-viewport.zoom-detail .graph-node .graph-node-label{ display: none; }
  .graph-node:hover .graph-node-full,
  .graph-node.drift-focus .graph-node-full,
  .graph-viewport.zoom-detail .graph-node .graph-node-full{ display: block; }
  /* 펼쳐진 카드가 옆 카드에 가리지 않도록 위로 올림 */
  .graph-node:hover, .graph-node.drift-focus{ z-index: 4; }

  /* 많이 축소하면 글자는 지우고 점만 남겨서, 전체 지형이 한눈에 들어오게 함 */
  .graph-viewport.zoom-far .graph-node{
    width: 26px;
    min-height: 26px;
    padding: 0;
    border-radius: 50%;
    border: none;
    background: var(--category-color);
    box-shadow: none;
    overflow: hidden;
  }
  .graph-viewport.zoom-far .graph-node > *{ display: none !important; }
  .graph-viewport.zoom-far .graph-node:hover{ z-index: 4; }

  .graph-tool-btn.has-badge{
    background: var(--category-color);
    border-color: var(--category-color);
    color: var(--text);
    font-weight: 700;
  }
  .graph-tool-btn:disabled{ opacity: 0.55; cursor: default; }

  /* ── 비슷한 생각 제안 목록 ───────────────────── */
  .suggest-item{
    border-bottom: 1px solid var(--border);
    padding: 14px 0;
  }
  .suggest-item:last-child{ border-bottom: none; }
  .suggest-item-header{
    display: flex;
    align-items: flex-start;
    gap: 10px;
    cursor: pointer;
  }
  .suggest-checkbox{
    margin-top: 4px;
    flex-shrink: 0;
    width: 17px; height: 17px;
    accent-color: var(--category-color);
  }
  .suggest-texts{ flex: 1; min-width: 0; }
  .suggest-sentence{
    font-size: 13.5px;
    line-height: 1.55;
    color: var(--text);
    word-break: keep-all;
    padding-left: 10px;
    border-left: 3px solid var(--border);
    margin-bottom: 6px;
  }
  .suggest-reason{
    margin-top: 8px;
    font-size: 12px;
    color: var(--text-secondary);
    line-height: 1.5;
  }

  .graph-empty{
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: var(--text-tertiary);
  }

  /* iOS Safari는 input/textarea의 font-size가 16px 미만이면 포커스 시 화면을 자동으로 확대함.
     margin-bottom을 12px로 잡은 입력 필드들 폰트는 14~15.5px라 확대가 걸릴 수 있어
     16px 미만 필드는 아래에서 별도로 보정함(선택 사항, 현재는 유지). */
</style>

// 겹치거나 인접한 구간을 하나로 합쳐서, 항상 정렬되고 겹치지 않는 배열로 유지함.
// 이렇게 저장해두면 화면에 그려지는 <mark> 개수와 실제 저장된 구간 개수가 항상 1:1로 맞아서,
// "이 마크를 탭하면 지운다"를 인덱스로 안전하게 매칭할 수 있음.
function mergeHighlights(list){
  const sorted = [...list].sort((a, b) => a.start - b.start);
  const merged = [];
  sorted.forEach(h => {
    const last = merged[merged.length - 1];
    if(last && h.start <= last.end){
      last.end = Math.max(last.end, h.end);
    } else {
      merged.push({ start: h.start, end: h.end });
    }
  });
  return merged;
}

// 하이라이트 버튼을 다시 누르면 취소되도록 하는 토글 로직.
// 선택한 구간이 기존 하이라이트와 조금이라도 겹치면, 그 겹치는 부분만 정확히 빼냄
// (겹치는 하이라이트가 딱 그 구간이면 통째로 사라지고, 일부만 겹치면 안 겹치는 조각만 남음).
// 전혀 안 겹치면 새 하이라이트로 추가함.
function toggleHighlightRange(existing, range){
  const overlapping = existing.some(h => range.start < h.end && range.end > h.start);
  if(!overlapping){
    return mergeHighlights([...existing, range]);
  }
  const result = [];
  existing.forEach(h => {
    if(range.end <= h.start || range.start >= h.end){
      result.push(h); // 안 겹치는 기존 구간은 그대로 유지
      return;
    }
    if(h.start < range.start) result.push({ start: h.start, end: range.start });
    if(h.end > range.end) result.push({ start: range.end, end: h.end });
  });
  return mergeHighlights(result);
}

// 문장 텍스트를 하이라이트 구간에 따라 <mark>로 감싸서 HTML로 만듦.
// 하이라이트가 아닌 부분은 그대로 escapeHtml 처리함.
function renderHighlightedText(text, highlights){
  if(!highlights || highlights.length === 0) return escapeHtml(text);
  let result = '';
  let cursor = 0;
  highlights.forEach((h, i) => {
    const start = Math.max(0, Math.min(h.start, text.length));
    const end = Math.max(0, Math.min(h.end, text.length));
    if(start > cursor) result += escapeHtml(text.slice(cursor, start));
    if(end > start) result += `<mark class="quote-highlight" data-hidx="${i}">${escapeHtml(text.slice(start, end))}</mark>`;
    cursor = Math.max(cursor, end);
  });
  if(cursor < text.length) result += escapeHtml(text.slice(cursor));
  return result;
}

// 드래그로 선택한 영역(range)의 시작/끝이, 문장 컨테이너 기준으로 순수 텍스트에서
// 몇 번째 글자에 해당하는지 계산함. 이미 <mark>가 섞여 있어도 정확히 셀 수 있도록
// 컨테이너의 자식 노드를 순서대로 훑으면서 글자 수를 누적함.
function getTextOffset(container, targetNode, targetOffset){
  let charCount = 0;
  let found = false;
  function walk(el){
    for(const child of el.childNodes){
      if(found) return;
      if(child === targetNode){
        charCount += targetOffset;
        found = true;
        return;
      }
      if(child.nodeType === Node.TEXT_NODE){
        charCount += child.textContent.length;
      } else if(child.nodeType === Node.ELEMENT_NODE){
        walk(child);
      }
    }
  }
  walk(container);
  return charCount;
}

// 추가된 지 12시간 안쪽인지 확인 (수정 시에는 ts를 안 건드리므로, 순수하게 "새로 추가됨"만 반영함)

// 시간대(0-6/6-12/12-18/18-24시)별로 어울리는 멘트를 따로 두고,

const SPOTLIGHT_MESSAGES_BY_TIME = {

// blockId를 시드로 쓰는 결정적 난수 생성기 - 같은 시간대 안에서는 항상 같은 결과를 냄
function seededRandom(seed){
  let t = seed + 0x6D2B79F5;
  return function(){
    t += 0x6D2B79F5;
    let r = Math.imul(t ^ (t >>> 15), 1 | t);
    r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffleWithSeed(arr, seed){
  const rand = seededRandom(seed);
  const result = arr.slice();
  for(let i = result.length - 1; i > 0; i--){
    const j = Math.floor(rand() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}

function pickSpotlightMessage(){
  const now = new Date();
  const hour = now.getHours();
  let period;
  if(hour < 6) period = 'dawn';
  else if(hour < 12) period = 'morning';
  else if(hour < 18) period = 'afternoon';
  else period = 'evening';

  // 6시간 단위 블록 ID - UTC가 아니라 이 기기의 로컬 자정을 기준으로 계산해야
  // 시간대(새벽/아침/오후/저녁) 경계랑 정확히 같은 시점에 멘트가 바뀜
  const localMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const hoursSinceLocalMidnight = (now - localMidnight) / (60 * 60 * 1000);
  const blockWithinDay = Math.floor(hoursSinceLocalMidnight / 6); // 0~3
  const daysSinceEpoch = Math.floor(localMidnight.getTime() / (24 * 60 * 60 * 1000));
  const blockId = daysSinceEpoch * 4 + blockWithinDay;

  const pool = SPOTLIGHT_MESSAGES_BY_TIME[period];
  // 같은 블록 안에서는 4개 카테고리가 셔플된 풀에서 서로 다른 자리를 배정받아서,
  // 여러 카테고리 화면에 동시에 같은 멘트가 겹쳐 뜨는 일이 없어짐
  const shuffled = shuffleWithSeed(pool, blockId);
  const catIndex = CATEGORIES.indexOf(currentCategory);
  return shuffled[(catIndex >= 0 ? catIndex : 0) % shuffled.length];
}

function shuffleArray(arr){
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// 카테고리를 볼 때마다 매번 다시 섞으면 별점/코멘트 등 사소한 변경에도 화면이 들썩여서,
// "같은 카테고리를 계속 보는 동안"에는 순서를 그대로 유지하고, 새로 추가/삭제된 것만 반영함.
// 카테고리를 실제로 전환할 때만 완전히 새로 섞임.
let shuffleState = { category: null, order: [] };

function getShuffledRest(restList){
  const restIds = new Set(restList.map(s => s.id));

  if(shuffleState.category !== currentCategory){
    const ids = restList.map(s => s.id);
    shuffleArray(ids);
    shuffleState = { category: currentCategory, order: ids };
  } else {
    let order = shuffleState.order.filter(id => restIds.has(id));
    const existingSet = new Set(order);
    const newIds = restList.map(s => s.id).filter(id => !existingSet.has(id));
    newIds.forEach(id => {
      const pos = Math.floor(Math.random() * (order.length + 1));
      order.splice(pos, 0, id);
    });
    shuffleState = { category: currentCategory, order };
  }

  const map = new Map(restList.map(s => [s.id, s]));
  return shuffleState.order.map(id => map.get(id)).filter(Boolean);
}

// 카테고리를 새로 들어올 때만 "가장 오래 안 만난 문장"을 새로 뽑고, 그 안에서 머무는 동안은 유지함.
// 멘트는 (시간대 + 카테고리)로 결정되는 값이라 매번 다시 계산해도 안전함 - 시간대가 안 바뀌면 그대로임.
let currentSpotlightId = null;
let currentSpotlightMessage = '';
let spotlightCategory = null;

function pickSpotlight(fullList){
  if(spotlightCategory !== currentCategory){
    const spotlight = fullList.reduce((oldest, s) => {
      const sSeen = s.lastSeenAt || s.ts || 0;
      const oldestSeen = oldest ? (oldest.lastSeenAt || oldest.ts || 0) : Infinity;
      return sSeen < oldestSeen ? s : oldest;
    }, null);
    currentSpotlightId = spotlight ? spotlight.id : null;
    spotlightCategory = currentCategory;
  }
  currentSpotlightMessage = pickSpotlightMessage();
  return fullList.find(s => s.id === currentSpotlightId) || null;
}

// [대개편] 예전엔 책(groups/books) 기준 구조였는데, 이제 카테고리(sentences 배열) 기준으로 바뀜.
// 예전 구조가 KV에 남아있으면 이 브라우저의 localStorage에 안전하게 백업해두고, 새 구조로 새로 시작함.

// 서버의 최신 문장 목록과 지금 이 브라우저의 문장 목록을 병합함.
// - 로컬에 있는 건 그대로 씀(방금 내가 만든 수정이 우선)
// - 서버에만 있고, 내가 마지막으로 불러온 시점에도 없었던 것 → 그 사이 다른 사람이
//   추가한 것이므로 살려서 합침
// - 서버에는 있는데 내가 불러온 시점엔 있었지만 지금 로컬엔 없는 것 → 내가 의도적으로
//   삭제한 것이므로 되살리지 않음
function mergeWithServer(serverSentences, localSentences){
  const merged = [];
  const seen = new Set();
  localSentences.forEach(s => {
    merged.push(s);
    seen.add(s.id);
  });
  serverSentences.forEach(s => {
    if(seen.has(s.id)) return;
    if(loadedSnapshotIds.has(s.id)) return; // 내가 지운 것 → 복원하지 않음
    merged.push(s); // 그 사이 다른 사람이 추가한 것 → 살림
  });
  return merged;
}

async function saveAll(){
  try{
    // 저장 직전에 서버 최신본을 한 번 더 확인해서 병합함 - 안 그러면 내가 저장하는 순간
    // 그 사이 다른 사람이 추가한 내용이 통째로 사라질 수 있음
    let serverBackup = null;
    try{
      const res = await storageAdapter.get(STORAGE_KEY);
      const parsed = res && res.value ? JSON.parse(res.value) : null;
      if(parsed && parsed.backup) serverBackup = parsed.backup;
      if(parsed && Array.isArray(parsed.sentences)){
        sentences = mergeWithServer(parsed.sentences, sentences);
        (parsed.recentSources || []).forEach(src => {
          if(!recentSources.includes(src)) recentSources.push(src);
        });
        recentSources = recentSources.slice(0, 3);
      }
    }catch(e){
      console.error('저장 전 병합 확인 실패 (그대로 저장 진행):', e);
    }

    // 문장 외의 부가 데이터(백업 · 그래프 배치)도 같이 실어서 저장함.
    // 예전엔 sentences/recentSources만 저장해서, 저장이 한 번 일어날 때마다
    // 로고 탭으로 만들어둔 백업이 조용히 지워지고 있었음.
    const payload = { sentences, recentSources, graph: graphState };
    if(serverBackup) payload.backup = serverBackup;

    await storageAdapter.set(STORAGE_KEY, JSON.stringify(payload));
    lastLocalSaveAt = Date.now();
    loadedSnapshotIds = new Set(sentences.map(s => s.id));
  }catch(e){
    console.error('저장 실패:', e);
    showToast('저장하지 못했습니다. 잠시 후 다시 시도해주세요.');
  }
}

// ── 다른 사람이 고친 내용 백그라운드로 확인하기 ─────────────
// Cloudflare KV는 최종 일관성 저장소라, 다른 곳에서 저장한 내용이 최대 1분 이상 늦게 반영될 수
// 있음. 그래서 주기적으로 조용히 다시 불러와서, 바뀐 게 있으면 화면만 갱신해줌.
let lastLocalSaveAt = 0;
let loadedSnapshotIds = new Set();
let pollTimer = null;

// "봤다" 기록처럼 사람이 알아챌 수 없는 필드는 변경 비교에서 제외함 -
// 안 그러면 그냥 스크롤하며 읽기만 해도 "변경사항 반영" 알림이 떠서 오해를 살 수 있음
function stripSilentFields(list){
  return list.map(({ lastSeenAt, ...rest }) => rest);
}

async function pollForUpdates(){
  // 뭔가 입력 중이거나 시트가 열려있으면 방해하지 않도록 건너뜀.
  // 그래프 화면을 보고 있을 때도 건너뜀 - 배치하던 중에 서버 값으로 덮어써지면 작업이 날아감.
  const anyOverlayOpen = document.querySelector(
    '.sheet-overlay.open, .modal-overlay.open, .ios-action-sheet.open, .ios-sheet-backdrop.open'
  );
  if(anyOverlayOpen || graphOpen) return;

  // 방금 로컬에서 저장했다면, 서버가 아직 그 이전 값을 캐시하고 있을 수 있어
  // 잠시 폴링을 건너뜀 (안 그러면 내가 방금 한 수정이 순간적으로 되돌아가 보일 수 있음)
  if(Date.now() - lastLocalSaveAt < 90000) return;

  try{
    const res = await storageAdapter.get(STORAGE_KEY);
    const parsed = res && res.value ? JSON.parse(res.value) : null;
    if(!parsed || !Array.isArray(parsed.sentences)) return;

    graphState = normalizeGraphState(parsed.graph);

    const anyDiff = JSON.stringify(parsed.sentences) !== JSON.stringify(sentences);
    if(!anyDiff) return;

    const meaningfulDiff = JSON.stringify(stripSilentFields(parsed.sentences)) !== JSON.stringify(stripSilentFields(sentences));

    sentences = parsed.sentences;
    recentSources = Array.isArray(parsed.recentSources) ? parsed.recentSources : [];
    loadedSnapshotIds = new Set(sentences.map(s => s.id));

    if(meaningfulDiff){
      renderArchive();
      showToast('새로운 변경사항을 반영했어요', 1800);
    }
    // 의미있는 변경이 아니면(예: 시청 기록만 달라짐) 화면을 다시 그리거나 알리지 않고
    // 최신 데이터로만 조용히 맞춰둠

  }catch(e){
    console.error('자동 새로고침 확인 실패:', e);
  }
}
function startPolling(){
  if(pollTimer) return;
  pollTimer = setInterval(pollForUpdates, 20000);
}
function stopPolling(){
  if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }
}
// 탭이 백그라운드로 가면 멈추고, 다시 돌아오면 바로 한 번 확인 후 재시작
document.addEventListener('visibilitychange', () => {
  if(document.hidden){
    stopPolling();
  } else {
    pollForUpdates();
    startPolling();
  }
});
startPolling();

const graphViewportEl = document.getElementById('graphViewport');
const graphWorldEl = document.getElementById('graphWorld');
const graphLinksEl = document.getElementById('graphLinks');
const graphNodesEl = document.getElementById('graphNodes');

const suggestApplyBtn = document.getElementById('suggestApplyBtn');
const graphDriftBtn = document.getElementById('graphDriftBtn');
const graphFitBtn = document.getElementById('graphFitBtn');
const graphCloseBtn = document.getElementById('graphCloseBtn');

const GRAPH_CARD_W = 240;
const GRAPH_COL_STEP = 300;
const GRAPH_ROW_STEP = 185;
const GRAPH_COLS = 5;

let graphOpen = false;
let graphNodeEls = {};
let graphNodeSizes = {};
let gPanX = 0, gPanY = 0, gScale = 1;
let gDragId = null, gDragOffset = null;
let gConnectFrom = null;
let gPanning = false, gPanStart = null;

// 저장된 값이 깨져 있어도 앱이 멈추지 않도록 형태를 한 번 다듬어서 받음
function normalizeGraphState(raw){
  const out = { positions: {}, links: [], rejected: [], lastSuggestRunAt: 0 };
  if(!raw || typeof raw !== 'object') return out;
  if(raw.positions && typeof raw.positions === 'object'){
    Object.keys(raw.positions).forEach(id => {
      const p = raw.positions[id];
      if(p && typeof p.x === 'number' && typeof p.y === 'number'){
        out.positions[id] = { x: p.x, y: p.y };
      }
    });
  }
  if(Array.isArray(raw.links)){
    raw.links.forEach(l => {
      if(l && typeof l.a === 'string' && typeof l.b === 'string') out.links.push({ a: l.a, b: l.b });
    });
  }
  // "이건 안 겹쳐요" 하고 넘긴 짝 - 다시 제안하지 않기 위해 기억해둠
  if(Array.isArray(raw.rejected)){
    raw.rejected.forEach(l => {
      if(l && typeof l.a === 'string' && typeof l.b === 'string') out.rejected.push({ a: l.a, b: l.b });
    });
  }
  if(typeof raw.lastSuggestRunAt === 'number') out.lastSuggestRunAt = raw.lastSuggestRunAt;
  return out;
}

function isRejectedPair(a, b){
  return graphState.rejected.some(l => (l.a === a && l.b === b) || (l.a === b && l.b === a));
}

function hasGraphLink(a, b){
  return graphState.links.some(l => (l.a === a && l.b === b) || (l.a === b && l.b === a));
}
function addGraphLink(a, b){
  if(a === b || hasGraphLink(a, b)) return false;
  graphState.links.push({ a, b });
  return true;
}

// 삭제된 문장의 카드와 그 카드에 붙어있던 선을 정리함
function pruneGraph(){
  const valid = new Set(sentences.map(s => s.id));
  let changed = false;
  Object.keys(graphState.positions).forEach(id => {
    if(!valid.has(id)){ delete graphState.positions[id]; changed = true; }
  });
  const before = graphState.links.length;
  graphState.links = graphState.links.filter(l => valid.has(l.a) && valid.has(l.b));
  if(graphState.links.length !== before) changed = true;
  return changed;
}

// 아직 카드가 없는 문장에 자리를 만들어주고, 같은 출처끼리 이어줌.
// 이미 자리가 있던 카드끼리는 건드리지 않아서, 예전에 지운 선이 되살아나지 않음.
function ensureGraphNodes(){
  const existingIds = new Set(Object.keys(graphState.positions));
  const missing = sentences.filter(s => !existingIds.has(s.id));
  if(missing.length === 0) return false;

  // 같은 출처가 서로 가까이 놓이도록 출처 기준으로 정렬해서 배치
  missing.sort((a, b) =>
    (a.source || '').localeCompare(b.source || '') || (a.ts || 0) - (b.ts || 0)
  );
  let slot = existingIds.size;
  missing.forEach(s => {
    graphState.positions[s.id] = {
      x: (slot % GRAPH_COLS) * GRAPH_COL_STEP,
      y: Math.floor(slot / GRAPH_COLS) * GRAPH_ROW_STEP
    };
    slot++;
  });

  // 같은 출처끼리는 사슬처럼 이어줌. 모든 쌍을 다 이으면 선이 너무 많아져서
  // 오래된 것 → 새것 순서로 한 줄로만 연결함.
  const bySource = {};
  sentences.forEach(s => {
    const key = (s.source || '').trim();
    if(!key) return;
    (bySource[key] = bySource[key] || []).push(s);
  });
  Object.keys(bySource).forEach(key => {
    const group = bySource[key].slice().sort((a, b) => (a.ts || 0) - (b.ts || 0));
    for(let i = 1; i < group.length; i++){
      const prev = group[i - 1], cur = group[i];
      // 둘 다 원래 있던 카드면 건드리지 않음
      if(existingIds.has(prev.id) && existingIds.has(cur.id)) continue;
      addGraphLink(prev.id, cur.id);
    }
  });
  return true;
}

function scheduleGraphSave(){
  clearTimeout(graphSaveTimer);
  graphSaveTimer = setTimeout(() => { saveAll(); }, 900);
}

// 접었을 때 보여줄 짧은 라벨.
// 형광펜으로 칠해둔 부분이 있으면 그걸 씀 - 사용자가 직접 "여기가 핵심"이라고 고른 부분이라
// 새로 뭘 적지 않아도 가장 정확한 요약이 됨. 없으면 문장 앞부분을 씀.
function cardLabel(s){
  const cut = (t) => {
    const v = (t || '').replace(/\s+/g, ' ').trim();
    return v.length > 32 ? v.slice(0, 32) + '…' : v;
  };
  if(Array.isArray(s.highlights) && s.highlights.length){
    const h = s.highlights[0];
    const picked = (s.text || '').slice(h.start, h.end);
    if(picked && picked.trim()) return cut(picked);
  }
  return cut(s.text);
}

// 지도처럼, 멀리서 보면 점만 / 중간이면 라벨 / 가까이 가면 문장 전체가 보이게 함
const ZOOM_FAR_BELOW = 0.5;
const ZOOM_DETAIL_ABOVE = 1.15;
function applyZoomDetailLevel(){
  graphViewportEl.classList.toggle('zoom-far', gScale < ZOOM_FAR_BELOW);
  graphViewportEl.classList.toggle('zoom-detail', gScale >= ZOOM_DETAIL_ABOVE);
}

function applyGraphTransform(){
  graphWorldEl.style.transform = `translate(${gPanX}px, ${gPanY}px) scale(${gScale})`;
  applyZoomDetailLevel();
}
function screenToWorld(clientX, clientY){
  const rect = graphViewportEl.getBoundingClientRect();
  return {
    x: (clientX - rect.left - gPanX) / gScale,
    y: (clientY - rect.top - gPanY) / gScale
  };
}
function nodeCenter(id){
  const p = graphState.positions[id];
  if(!p) return null;
  const size = graphNodeSizes[id] || { w: GRAPH_CARD_W, h: 90 };
  return { x: p.x + size.w / 2, y: p.y + size.h / 2 };
}
function linkPath(aId, bId){
  const A = nodeCenter(aId), B = nodeCenter(bId);
  if(!A || !B) return '';
  const dx = Math.max(40, Math.abs(B.x - A.x) * 0.5);
  return `M ${A.x} ${A.y} C ${A.x + dx} ${A.y}, ${B.x - dx} ${B.y}, ${B.x} ${B.y}`;
}

function measureGraphNodes(){
  graphNodeSizes = {};
  Object.keys(graphNodeEls).forEach(id => {
    const el = graphNodeEls[id];
    graphNodeSizes[id] = { w: el.offsetWidth, h: el.offsetHeight };
  });
}

let graphLinkGroupEls = [];
function renderGraphLinks(){
  const parts = graphState.links.map((l, i) => {
    const d = linkPath(l.a, l.b);
    if(!d) return '';
    return `<g class="graph-link-group" data-idx="${i}">`
      + `<path class="graph-link-line" d="${d}" vector-effect="non-scaling-stroke"/>`
      + `<path class="graph-link-hit" d="${d}" vector-effect="non-scaling-stroke"/>`
      + `</g>`;
  });
  graphLinksEl.innerHTML = parts.join('')
    + '<path class="graph-link-temp" id="graphTempLink" style="display:none" vector-effect="non-scaling-stroke"/>';
  // 매번 DOM을 뒤지지 않도록 미리 담아둠 (배치 애니메이션에서 매 프레임 갱신해야 해서)
  graphLinkGroupEls = Array.from(graphLinksEl.querySelectorAll('.graph-link-group'));
}
// 모든 선을 한 번에 다시 그림 - 자동 배치처럼 카드가 한꺼번에 움직일 때 씀
function updateAllLinkPaths(){
  graphState.links.forEach((l, i) => {
    const g = graphLinkGroupEls[i];
    if(!g) return;
    const d = linkPath(l.a, l.b);
    g.querySelectorAll('path').forEach(p => p.setAttribute('d', d));
  });
}
// 카드를 끄는 동안에는 그 카드에 붙은 선만 다시 그려서 부드럽게 따라오게 함
function updateLinksTouching(id){
  graphState.links.forEach((l, i) => {
    if(l.a !== id && l.b !== id) return;
    const g = graphLinksEl.querySelector(`.graph-link-group[data-idx="${i}"]`);
    if(!g) return;
    const d = linkPath(l.a, l.b);
    g.querySelectorAll('path').forEach(p => p.setAttribute('d', d));
  });
}

function renderGraph(){
  graphNodeEls = {};
  graphNodesEl.innerHTML = '';

  const placed = sentences.filter(s => graphState.positions[s.id]);
  if(placed.length === 0){
    graphLinksEl.innerHTML = '';
    graphNodesEl.innerHTML = '';
    if(!graphViewportEl.querySelector('.graph-empty')){
      const empty = document.createElement('div');
      empty.className = 'graph-empty';
      empty.textContent = '아직 남긴 문장이 없습니다.';
      graphViewportEl.appendChild(empty);
    }
    return;
  }
  const oldEmpty = graphViewportEl.querySelector('.graph-empty');
  if(oldEmpty) oldEmpty.remove();

  const frag = document.createDocumentFragment();
  placed.forEach(s => {
    const pos = graphState.positions[s.id];
    const el = document.createElement('div');
    el.className = 'graph-node';
    el.dataset.id = s.id;
    el.style.left = pos.x + 'px';
    el.style.top = pos.y + 'px';
    el.style.setProperty('--category-color', CATEGORY_COLORS[s.category] || CATEGORY_COLORS['삶']);

    const metaParts = [];
    if(s.source) metaParts.push(escapeHtml(s.source));
    if(s.ref) metaParts.push(escapeHtml(s.ref));
    const metaHtml = metaParts.length ? `<div class="graph-node-meta">${metaParts.join(' · ')}</div>` : '';

    // 접었을 땐 라벨만, 펼치면 전체 문장과 코멘트까지 보여줌
    el.innerHTML = `<div class="graph-node-label">${escapeHtml(cardLabel(s))}</div>`
      + `<div class="graph-node-full">`
      +   `<div class="graph-node-text">${escapeHtml(s.text)}</div>`
      +   (s.comment ? `<div class="graph-node-comment">${escapeHtml(s.comment)}</div>` : '')
      + `</div>`
      + metaHtml
      + `<div class="graph-node-handle"></div>`;
    frag.appendChild(el);
    graphNodeEls[s.id] = el;
  });
  graphNodesEl.appendChild(frag);
  // 접힌 상태에서 크기를 재둠. 펼쳐져도 이 값을 계속 써서 선이 흔들리지 않게 함.
  measureGraphNodes();
  renderGraphLinks();
  applyZoomDetailLevel();
}

function fitGraphView(){
  const ids = Object.keys(graphState.positions).filter(id => graphNodeEls[id]);
  if(ids.length === 0){ gPanX = 40; gPanY = 40; gScale = 1; applyGraphTransform(); return; }

  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  ids.forEach(id => {
    const p = graphState.positions[id];
    const size = graphNodeSizes[id] || { w: GRAPH_CARD_W, h: 90 };
    minX = Math.min(minX, p.x); minY = Math.min(minY, p.y);
    maxX = Math.max(maxX, p.x + size.w); maxY = Math.max(maxY, p.y + size.h);
  });

  const vw = graphViewportEl.clientWidth, vh = graphViewportEl.clientHeight;
  const pad = 60;
  const spanX = Math.max(1, maxX - minX), spanY = Math.max(1, maxY - minY);
  gScale = Math.max(0.25, Math.min(1, Math.min((vw - pad * 2) / spanX, (vh - pad * 2) / spanY)));
  gPanX = (vw - spanX * gScale) / 2 - minX * gScale;
  gPanY = (vh - spanY * gScale) / 2 - minY * gScale;
  applyGraphTransform();
}

function isDesktopWidth(){
  return window.matchMedia('(min-width: 900px)').matches;
}
function openGraphView(){
  if(!isDesktopWidth()) return; // 데스크톱 전용
  graphOpen = true;
  pruneGraph();
  const wasEmpty = Object.keys(graphState.positions).length === 0;
  const added = ensureGraphNodes();
  graphOverlay.classList.add('open');
  lockBodyScroll();
  renderGraph();

  // 처음 지도를 만드는 경우엔 밋밋한 격자 대신 자동 배치로 시작
  if(wasEmpty && added){
    const target = computeAutoLayout();
    if(target){
      Object.keys(target).forEach(id => { graphState.positions[id] = target[id]; });
      Object.keys(graphNodeEls).forEach(id => {
        const p = graphState.positions[id];
        if(p){ graphNodeEls[id].style.left = p.x + 'px'; graphNodeEls[id].style.top = p.y + 'px'; }
      });
      updateAllLinkPaths();
    }
  }

  fitGraphView();
  updateSuggestBtn();
  if(added) scheduleGraphSave();
  // 자정이 지난 뒤 처음 열었으면, 화면을 막지 않고 뒤에서 조용히 한 번 훑음
  if(shouldAutoScanToday() && sentences.length >= 2){
    setTimeout(() => { if(graphOpen) runSuggestionScan(true); }, 800);
  }
}
function closeGraphView(){
  stopDrift();
  graphOpen = false;
  graphOverlay.classList.remove('open');
  unlockBodyScroll();
}
graphCloseBtn.addEventListener('click', closeGraphView);
graphFitBtn.addEventListener('click', () => { stopDrift(); fitGraphView(); });

// ── 유영 모드 ────────────────────────────────────────────
// 선을 따라 카드에서 카드로 천천히 떠다니며 문장을 다시 만나는 모드.
// 찾아가는 게 아니라 흘러가면서 만나게 하는 게 목적이라, 속도를 일부러 느리게 뒀음.
const DRIFT_MOVE_MS = 1600;   // 카드에서 카드로 옮겨가는 시간
const DRIFT_DWELL_MS = 3800;  // 한 카드에 머무르며 읽는 시간
const DRIFT_SCALE = 1.05;

let driftActive = false;
let driftCurrentId = null;
let driftPrevId = null;
let driftDwellTimer = null;
let driftRaf = null;
let driftVisited = new Set();
let driftStaleSteps = 0; // 새 카드를 못 만난 채 지나간 걸음 수

function neighborsOf(id){
  const out = [];
  graphState.links.forEach(l => {
    if(l.a === id) out.push(l.b);
    else if(l.b === id) out.push(l.a);
  });
  return out.filter(n => graphState.positions[n]);
}

// 다음에 갈 카드를 고름.
// 기본은 이어진 카드를 따라가되, 방금 온 곳으로 바로 되돌아가진 않음.
// 책이 다르면 선이 안 이어져 있어서 한 무리 안에서만 맴돌 수 있는데,
// 그럴 땐 아직 못 본 카드로 건너뛰어서 결국 전부 만나게 함.
function pickNextDriftId(){
  const all = Object.keys(graphState.positions).filter(id => graphNodeEls[id]);
  if(all.length === 0) return null;
  if(!driftCurrentId) return all[Math.floor(Math.random() * all.length)];

  const unvisitedAll = all.filter(id => !driftVisited.has(id));
  // 다 봤으면 기억을 비우고 다시 한 바퀴
  if(unvisitedAll.length === 0){
    driftVisited = new Set([driftCurrentId]);
    driftStaleSteps = 0;
  }

  const near = neighborsOf(driftCurrentId);
  const notBack = near.filter(n => n !== driftPrevId);
  const pool = notBack.length ? notBack : near;

  // 같은 자리를 세 걸음 넘게 맴돌면, 아직 안 본 곳으로 건너뜀
  if(driftStaleSteps >= 3){
    const remaining = all.filter(id => !driftVisited.has(id));
    if(remaining.length) return remaining[Math.floor(Math.random() * remaining.length)];
  }

  // 이어진 카드 중에서도 아직 안 본 곳을 먼저 고름
  const freshNear = pool.filter(n => !driftVisited.has(n));
  if(freshNear.length) return freshNear[Math.floor(Math.random() * freshNear.length)];
  if(pool.length) return pool[Math.floor(Math.random() * pool.length)];

  const others = all.filter(id => id !== driftCurrentId);
  return others.length ? others[Math.floor(Math.random() * others.length)] : null;
}

function easeInOutCubic(t){
  return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
}

// 특정 카드가 화면 가운데 오도록 카메라를 부드럽게 옮김
function animateCameraTo(id, done){
  const center = nodeCenter(id);
  if(!center){ if(done) done(); return; }
  const vw = graphViewportEl.clientWidth, vh = graphViewportEl.clientHeight;
  const fromX = gPanX, fromY = gPanY, fromS = gScale;
  const toS = DRIFT_SCALE;
  const toX = vw / 2 - center.x * toS;
  const toY = vh / 2 - center.y * toS;
  const start = performance.now();

  cancelAnimationFrame(driftRaf);
  function step(now){
    if(!driftActive) return;
    const t = Math.min(1, (now - start) / DRIFT_MOVE_MS);
    const e = easeInOutCubic(t);
    gPanX = fromX + (toX - fromX) * e;
    gPanY = fromY + (toY - fromY) * e;
    gScale = fromS + (toS - fromS) * e;
    applyGraphTransform();
    if(t < 1) driftRaf = requestAnimationFrame(step);
    else if(done) done();
  }
  driftRaf = requestAnimationFrame(step);
}

function highlightDrift(fromId, toId){
  Object.keys(graphNodeEls).forEach(id => {
    graphNodeEls[id].classList.toggle('drift-focus', id === toId);
  });
  // 방금 지나온 선을 잠깐 진하게 보여줘서 어디서 흘러왔는지 알 수 있게 함
  graphLinksEl.querySelectorAll('.graph-link-group').forEach(g => g.classList.remove('drift-path'));
  if(fromId){
    graphState.links.forEach((l, i) => {
      const match = (l.a === fromId && l.b === toId) || (l.b === fromId && l.a === toId);
      if(!match) return;
      const g = graphLinksEl.querySelector(`.graph-link-group[data-idx="${i}"]`);
      if(g) g.classList.add('drift-path');
    });
  }
}

function driftStep(){
  if(!driftActive) return;
  const nextId = pickNextDriftId();
  if(!nextId){ stopDrift(); return; }

  const fromId = driftCurrentId;
  driftPrevId = driftCurrentId;
  driftCurrentId = nextId;

  // 처음 만나는 카드면 기록해두고, 이미 본 카드면 맴돈 걸음으로 셈
  if(driftVisited.has(nextId)) driftStaleSteps++;
  else { driftVisited.add(nextId); driftStaleSteps = 0; }

  highlightDrift(fromId, nextId);
  animateCameraTo(nextId, () => {
    driftDwellTimer = setTimeout(driftStep, DRIFT_DWELL_MS);
  });
}

function startDrift(){
  const count = Object.keys(graphState.positions).filter(id => graphNodeEls[id]).length;
  if(count === 0) return;
  driftActive = true;
  driftCurrentId = null;
  driftPrevId = null;
  driftVisited = new Set();
  driftStaleSteps = 0;
  graphViewportEl.classList.add('drifting');
  graphDriftBtn.classList.add('active');
  graphDriftBtn.textContent = '유영 멈추기';
  driftStep();
}
function stopDrift(){
  if(!driftActive) return;
  driftActive = false;
  clearTimeout(driftDwellTimer);
  cancelAnimationFrame(driftRaf);
  driftCurrentId = null;
  driftPrevId = null;
  graphViewportEl.classList.remove('drifting');
  graphDriftBtn.classList.remove('active');
  graphDriftBtn.textContent = '유영 모드';
  Object.keys(graphNodeEls).forEach(id => graphNodeEls[id].classList.remove('drift-focus'));
  graphLinksEl.querySelectorAll('.graph-link-group').forEach(g => g.classList.remove('drift-path'));
}
graphDriftBtn.addEventListener('click', () => {
  if(driftActive) stopDrift();
  else startDrift();
});
// 화면을 직접 만지면(끌기·확대 등) 유영을 멈춤 - 흐름을 보다가 손대는 순간 내 조작이 우선
graphViewportEl.addEventListener('mousedown', () => { if(driftActive) stopDrift(); });
graphViewportEl.addEventListener('wheel', () => { if(driftActive) stopDrift(); }, { passive: true });

// ── 자동 배치 ────────────────────────────────────────────
// 서로 이어진 카드끼리는 끌어당기고 모든 카드는 서로 밀어내게 해서, 연결된 무리가
// 자연스럽게 뭉치도록 함. 무리끼리는 겹치지 않게 따로 자리를 잡아줌.
const LAYOUT_CARD_W = 240;
const LAYOUT_CARD_H = 84;
const LAYOUT_GAP = 34;
const LAYOUT_GROUP_GAP = 110;

// 선으로 이어진 카드들을 무리(연결 요소) 단위로 묶음
function findGraphComponents(){
  const ids = Object.keys(graphState.positions).filter(id => graphNodeEls[id]);
  const adj = {};
  ids.forEach(id => { adj[id] = []; });
  graphState.links.forEach(l => {
    if(adj[l.a] && adj[l.b]){ adj[l.a].push(l.b); adj[l.b].push(l.a); }
  });

  const seen = new Set();
  const comps = [];
  ids.forEach(id => {
    if(seen.has(id)) return;
    const comp = [];
    const stack = [id];
    seen.add(id);
    while(stack.length){
      const cur = stack.pop();
      comp.push(cur);
      adj[cur].forEach(nb => { if(!seen.has(nb)){ seen.add(nb); stack.push(nb); } });
    }
    comps.push(comp);
  });
  return { comps, adj };
}

// 한 무리 안에서의 배치. 밀어내는 힘과 당기는 힘을 번갈아 적용하면서
// 조금씩 흔들림을 줄여가는 방식(온도를 낮춰가며 안정시킴).
function layoutOneComponent(ids, adj){
  const n = ids.length;
  if(n === 1) return { [ids[0]]: { x: 0, y: 0 } };

  const idx = {};
  ids.forEach((id, i) => { idx[id] = i; });

  // 처음엔 원형으로 벌려두고 시작 - 한 점에 뭉쳐 있으면 잘 안 풀림
  const R = Math.max(200, n * 36);
  const pos = ids.map((id, i) => ({
    x: R * Math.cos(2 * Math.PI * i / n),
    y: R * Math.sin(2 * Math.PI * i / n) * 0.72 // 가로로 살짝 납작하게
  }));

  const edges = [];
  ids.forEach(id => adj[id].forEach(nb => {
    if(idx[nb] !== undefined && idx[id] < idx[nb]) edges.push([idx[id], idx[nb]]);
  }));

  const k = Math.sqrt((n * (LAYOUT_CARD_W + LAYOUT_GAP) * (LAYOUT_CARD_H + LAYOUT_GAP) * 1.25) / n);
  const iters = n > 200 ? 160 : (n > 80 ? 260 : 380);
  let temp = k * 1.1;

  for(let it = 0; it < iters; it++){
    const disp = pos.map(() => ({ x: 0, y: 0 }));

    for(let i = 0; i < n; i++){
      for(let j = i + 1; j < n; j++){
        let dx = pos[i].x - pos[j].x, dy = pos[i].y - pos[j].y;
        let d = Math.hypot(dx, dy) || 0.01;
        const f = (k * k) / d;
        const ux = dx / d, uy = dy / d;
        disp[i].x += ux * f; disp[i].y += uy * f;
        disp[j].x -= ux * f; disp[j].y -= uy * f;
      }
    }
    edges.forEach(([i, j]) => {
      let dx = pos[i].x - pos[j].x, dy = pos[i].y - pos[j].y;
      let d = Math.hypot(dx, dy) || 0.01;
      const f = (d * d) / k;
      const ux = dx / d, uy = dy / d;
      disp[i].x -= ux * f; disp[i].y -= uy * f;
      disp[j].x += ux * f; disp[j].y += uy * f;
    });

    for(let i = 0; i < n; i++){
      const d = Math.hypot(disp[i].x, disp[i].y) || 0.01;
      const lim = Math.min(d, temp);
      pos[i].x += disp[i].x / d * lim;
      pos[i].y += disp[i].y / d * lim;
    }
    temp *= 0.976;
  }

  const out = {};
  ids.forEach((id, i) => { out[id] = { x: pos[i].x, y: pos[i].y }; });
  return out;
}

// 카드는 점이 아니라 네모라, 힘 계산만으로는 겹칠 수 있어서 마지막에 밀어내 떼어놓음
function resolveOverlaps(posMap, ids){
  const W = LAYOUT_CARD_W + LAYOUT_GAP;
  const H = LAYOUT_CARD_H + LAYOUT_GAP;
  for(let it = 0; it < 80; it++){
    let moved = false;
    for(let i = 0; i < ids.length; i++){
      for(let j = i + 1; j < ids.length; j++){
        const A = posMap[ids[i]], B = posMap[ids[j]];
        const dx = B.x - A.x, dy = B.y - A.y;
        const ox = W - Math.abs(dx);
        const oy = H - Math.abs(dy);
        if(ox > 0 && oy > 0){
          moved = true;
          if(ox < oy){
            const push = (ox / 2) * (dx < 0 ? -1 : 1);
            A.x -= push; B.x += push;
          } else {
            const push = (oy / 2) * (dy < 0 ? -1 : 1);
            A.y -= push; B.y += push;
          }
        }
      }
    }
    if(!moved) break;
  }
}

function computeAutoLayout(){
  const { comps, adj } = findGraphComponents();
  if(comps.length === 0) return null;

  // 큰 무리부터 배치해서 화면 왼쪽 위가 비어 보이지 않게 함
  const laid = comps.map(ids => {
    const posMap = layoutOneComponent(ids, adj);
    resolveOverlaps(posMap, ids);
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    ids.forEach(id => {
      const p = posMap[id];
      minX = Math.min(minX, p.x); minY = Math.min(minY, p.y);
      maxX = Math.max(maxX, p.x); maxY = Math.max(maxY, p.y);
    });
    ids.forEach(id => { posMap[id].x -= minX; posMap[id].y -= minY; });
    return { ids, posMap, w: (maxX - minX) + LAYOUT_CARD_W, h: (maxY - minY) + LAYOUT_CARD_H };
  }).sort((a, b) => b.ids.length - a.ids.length);

  // 무리들을 줄 세워 배치. 줄 너비는 전체 넓이를 보고 정해서, 결과가
  // 세로로만 길쭉해지지 않고 화면 비율에 가깝게 나오도록 함.
  const totalArea = laid.reduce((sum, c) => sum + c.w * c.h, 0);
  const widestComp = laid.reduce((m, c) => Math.max(m, c.w), 0);
  const rowWidth = Math.max(widestComp, Math.sqrt(totalArea * 3.2));

  const target = {};
  let cx = 0, cy = 0, rowH = 0;
  laid.forEach(c => {
    if(cx > 0 && cx + c.w > rowWidth){
      cx = 0; cy += rowH + LAYOUT_GROUP_GAP; rowH = 0;
    }
    c.ids.forEach(id => {
      target[id] = { x: c.posMap[id].x + cx, y: c.posMap[id].y + cy };
    });
    cx += c.w + LAYOUT_GROUP_GAP;
    rowH = Math.max(rowH, c.h);
  });
  return target;
}

let layoutRaf = null;
function animateToPositions(target, ms, onDone){
  const from = {};
  Object.keys(target).forEach(id => {
    const cur = graphState.positions[id];
    from[id] = cur ? { x: cur.x, y: cur.y } : { x: target[id].x, y: target[id].y };
  });
  const start = performance.now();
  cancelAnimationFrame(layoutRaf);

  function step(now){
    const t = Math.min(1, (now - start) / ms);
    const e = easeInOutCubic(t);
    Object.keys(target).forEach(id => {
      const x = from[id].x + (target[id].x - from[id].x) * e;
      const y = from[id].y + (target[id].y - from[id].y) * e;
      graphState.positions[id] = { x, y };
      const el = graphNodeEls[id];
      if(el){ el.style.left = x + 'px'; el.style.top = y + 'px'; }
    });
    updateAllLinkPaths();
    if(t < 1) layoutRaf = requestAnimationFrame(step);
    else if(onDone) onDone();
  }
  layoutRaf = requestAnimationFrame(step);
}

// ── 비슷한 생각 찾기 ─────────────────────────────────────
// 2단계로 나눠서 비용을 잡음:
//  1) 문장마다 "무엇에 대한 글인지" 태그를 한 번만 뽑아둠 (문장당 딱 한 번)
//  2) 태그가 겹치는 짝만 후보로 추려서, 그 후보만 AI에게 진짜 통하는지 물어봄
// 후보 개수를 정해두기 때문에 문장이 100개든 1000개든 2단계 비용은 거의 안 변함.
const TAG_BATCH_SIZE = 12;
const MAX_CANDIDATE_PAIRS = 30;
const TAG_TOO_COMMON = 25; // 이만큼 많은 문장에 붙은 태그는 너무 흔해서 후보 선정에서 제외

let pendingSuggestions = [];
let suggestRunning = false;

async function requestTagsForChunk(chunk){
  const payload = chunk.map(s => ({ id: s.id, text: s.text.replace(/\r?\n/g, ' ') }));
  const prompt = `다음 문장들이 각각 "무엇에 대한 글인지"를 나타내는 주제 태그를 3~5개씩 뽑아주세요.
문장에 나온 단어를 그대로 쓰지 말고, 그 문장이 다루는 주제를 나타내는 말로 뽑아주세요.
예: "혼자 있는 시간이 결국 나를 만든다" -> 고독,자기형성,성장

문장 목록(JSON):
${JSON.stringify(payload)}

결과를 한 줄에 하나씩, 아래 형식으로만 출력하세요. 설명 없이 이 줄들만 출력하세요:
id|||태그1,태그2,태그3`;

  const res = await fetch(WORKER_URL + '/classify', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-6', max_tokens: 2000,
      messages: [{ role: 'user', content: prompt }]
    })
  });
  if(!res.ok) throw new Error('태그 요청 실패: ' + res.status);
  const data = await res.json();
  const raw = (data.content || []).map(b => b.text || '').join('');

  const out = [];
  raw.split('\n').map(l => l.trim()).filter(Boolean).forEach(line => {
    const i = line.indexOf('|||');
    if(i === -1) return;
    const id = line.slice(0, i).trim();
    const tags = line.slice(i + 3).split(',').map(t => t.trim()).filter(Boolean).slice(0, 5);
    if(id && tags.length) out.push({ id, tags });
  });
  return out;
}

// 아직 태그가 없는 문장에만 태그를 붙임. 한 번 붙으면 문장을 고치기 전까진 다시 안 함.
async function ensureTags(){
  const need = sentences.filter(s => !Array.isArray(s.tags) || s.tags.length === 0);
  if(need.length === 0) return 0;

  let tagged = 0;
  for(let i = 0; i < need.length; i += TAG_BATCH_SIZE){
    const chunk = need.slice(i, i + TAG_BATCH_SIZE);
    try{
      const results = await requestTagsForChunk(chunk);
      results.forEach(r => {
        const s = findSentence(r.id);
        if(s){ s.tags = r.tags; tagged++; }
      });
    }catch(e){
      console.error('태그 추출 실패(이 묶음은 건너뜀):', e);
    }
  }
  if(tagged > 0) await saveAll();
  return tagged;
}

// 태그가 겹치는 짝을 후보로 추림 (여기까지는 전부 브라우저에서 공짜로 계산)
function buildCandidatePairs(){
  const tagged = sentences.filter(s => Array.isArray(s.tags) && s.tags.length);
  const byTag = {};
  tagged.forEach(s => s.tags.forEach(t => {
    const key = t.toLowerCase();
    (byTag[key] = byTag[key] || []).push(s.id);
  }));

  const score = {};
  Object.keys(byTag).forEach(t => {
    const ids = byTag[t];
    if(ids.length < 2 || ids.length > TAG_TOO_COMMON) return;
    for(let i = 0; i < ids.length; i++){
      for(let j = i + 1; j < ids.length; j++){
        const key = [ids[i], ids[j]].sort().join('|');
        score[key] = (score[key] || 0) + 1;
      }
    }
  });

  return Object.keys(score)
    .map(k => { const [a, b] = k.split('|'); return { a, b, shared: score[k] }; })
    .filter(p => !hasGraphLink(p.a, p.b) && !isRejectedPair(p.a, p.b))
    .sort((x, y) => y.shared - x.shared)
    .slice(0, MAX_CANDIDATE_PAIRS);
}

// 추린 후보만 AI에게 보내서 진짜 통하는 짝을 가려냄.
// 태그가 겹쳐도 정반대 얘기일 수 있어서(예: "사랑은 아름답다" vs "사랑은 지옥이다") 이 단계가 꼭 필요함.
async function judgeCandidates(pairs){
  if(pairs.length === 0) return [];
  const payload = pairs.map((p, i) => {
    const A = findSentence(p.a), B = findSentence(p.b);
    return { no: i, a: (A ? A.text : '').replace(/\r?\n/g, ' '), b: (B ? B.text : '').replace(/\r?\n/g, ' ') };
  });
  const prompt = `아래는 문장 짝 목록입니다. 각 짝이 서로 "통하는 생각"인지 판단해주세요.
같은 주제를 다루더라도 서로 반대되는 주장이면 통하는 것이 아닙니다.
표현이 달라도 결국 같은 이야기를 하고 있다면 통하는 것입니다.
확실히 통하는 짝만 골라주세요. 애매하면 빼주세요.

짝 목록(JSON):
${JSON.stringify(payload)}

통하는 짝만 한 줄에 하나씩, 아래 형식으로만 출력하세요. 이유는 20자 이내로 짧게 쓰세요.
통하는 짝이 하나도 없으면 아무것도 출력하지 마세요:
번호|||이유`;

  const res = await fetch(WORKER_URL + '/classify', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-6', max_tokens: 1500,
      messages: [{ role: 'user', content: prompt }]
    })
  });
  if(!res.ok) throw new Error('제안 요청 실패: ' + res.status);
  const data = await res.json();
  const raw = (data.content || []).map(b => b.text || '').join('');

  const out = [];
  raw.split('\n').map(l => l.trim()).filter(Boolean).forEach(line => {
    const i = line.indexOf('|||');
    if(i === -1) return;
    const no = parseInt(line.slice(0, i).trim(), 10);
    const reason = line.slice(i + 3).trim();
    if(!isNaN(no) && pairs[no]) out.push({ ...pairs[no], reason });
  });
  return out;
}

  if(suggestRunning){

  }

    graphSuggestBtn.classList.add('has-badge');

async function runSuggestionScan(silent){
  if(suggestRunning) return;
  suggestRunning = true;
  updateSuggestBtn();
  try{
    await ensureTags();
    const candidates = buildCandidatePairs();
    const judged = await judgeCandidates(candidates);
    pendingSuggestions = judged;

    graphState.lastSuggestRunAt = Date.now();
    await saveAll();

    if(!silent){
      if(judged.length === 0) showToast('새로 이어줄 만한 짝을 찾지 못했어요', 2200);
      else openSuggestSheet();
    }
  }catch(e){
    console.error('비슷한 생각 찾기 실패:', e);
    if(!silent) showToast('찾는 데 실패했어요. 잠시 후 다시 시도해주세요.', 2600);
  }finally{
    suggestRunning = false;
    updateSuggestBtn();
  }
}

// 휠로 확대/축소 - 마우스 커서가 가리키던 지점이 그대로 있도록 이동값도 같이 보정함
graphViewportEl.addEventListener('wheel', (e) => {
  if(!graphOpen) return;
  e.preventDefault();
  const rect = graphViewportEl.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const prev = gScale;
  const next = Math.min(2.2, Math.max(0.25, gScale * (e.deltaY < 0 ? 1.1 : 1 / 1.1)));
  if(next === prev) return;
  gPanX = mx - (mx - gPanX) * (next / prev);
  gPanY = my - (my - gPanY) * (next / prev);
  gScale = next;
  applyGraphTransform();
}, { passive: false });

    Object.keys(graphNodeEls).forEach(id => {
      graphNodeEls[id].classList.toggle(

  const newOnes = withoutSpotlight
    .filter(s => isRecentlyAdded(s.ts))
    .sort((a, b) => (b.ts || 0) - (a.ts || 0));
  const others = withoutSpotlight.filter(s => !isRecentlyAdded(s.ts));

  const rest = getShuffledRest(others);
  const finalList = spotlight ? [spotlight, ...newOnes, ...rest] : [...newOnes, ...rest];

  archiveList.innerHTML = finalList.map(s => {

    const newBadgeHtml = isRecentlyAdded(s.ts) ? `<span class="quote-new-badge">NEW</span>` : '';
    const showMetaRow = metaLine || s.important || newBadgeHtml;

// (그냥 리스트에 뜨기만 해도 "봤다"고 치면, 스크롤 안 하고 지나친 것까지 다 봤다고 착각하게 됨)
let seenObserver = null;
let seenTimers = new Map(); // element -> timeout id
let seenSaveDebounceTimer = null;

function scheduleSeenSave(){
  clearTimeout(seenSaveDebounceTimer);
  seenSaveDebounceTimer = setTimeout(() => { saveAll(); }, 2000);
}

function setupSeenTracking(){
  if(seenObserver) seenObserver.disconnect();
  seenTimers.forEach(t => clearTimeout(t));
  seenTimers.clear();

  seenObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if(entry.isIntersecting){
        if(!seenTimers.has(entry.target)){
          const id = entry.target.dataset.id;
          const timer = setTimeout(() => {
            const s = findSentence(id);
            if(s){
              s.lastSeenAt = Date.now();
              scheduleSeenSave();
            }
            seenTimers.delete(entry.target);
          }, 5000);
          seenTimers.set(entry.target, timer);
        }
      } else if(seenTimers.has(entry.target)){
        clearTimeout(seenTimers.get(entry.target));
        seenTimers.delete(entry.target);
      }
    });
  }, { threshold: 0.6 });

  archiveList.querySelectorAll('.quote-block').forEach(el => seenObserver.observe(el));
}

// 이벤트 위임: archiveList 자체는 재렌더링해도 그대로 유지되는 요소라, 리스너를 한 번만 붙여두고
// 클릭된 대상이 어느 quote-block인지는 매번 closest로 찾음.
// (이전엔 renderArchive가 실행될 때마다 문장 개수만큼 리스너를 새로 붙이고 있었음)
archiveList.addEventListener('click', async (e) => {
  const block = e.target.closest('.quote-block');
  if(!block) return;

  // 드래그로 문장을 선택한 상태면(하이라이트 하려는 것) 액션시트를 열지 않음
  const sel = window.getSelection();
  if(sel && !sel.isCollapsed && sel.toString().trim()) return;

  // 이미 칠해진 하이라이트를 탭하면, 메뉴 대신 그 하이라이트를 바로 지움
  const markEl = e.target.closest('.quote-highlight');
  if(markEl){
    const idx = parseInt(markEl.dataset.hidx, 10);
    const s = findSentence(block.dataset.id);
    if(s && Array.isArray(s.highlights) && !isNaN(idx)){
      s.highlights.splice(idx, 1);
      await saveAll();
      renderArchive();
    }
    return;
  }

  openEntryAction(block.dataset.id);
});

// ── 카테고리 세그먼트 탭 (좌하단) ───────────────
categoryTabs.querySelectorAll('.category-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    if(tab.dataset.cat === currentCategory){
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }
    currentCategory = tab.dataset.cat;
    saveLastCategory(currentCategory);
    renderArchive();
    window.scrollTo({ top: 0, behavior: 'instant' });
  });
});

// ── 메인 화면에서 좌우 화살표로 카테고리 전환 (일 · 관계 · 삶 · 사랑) ──────
// 입력칸/버튼 등 다른 걸 조작 중일 땐 건드리지 않고, 딱히 포커스된 게 없거나
// 카테고리 탭 자체에 포커스가 있을 때만 동작함.
document.addEventListener('keydown', (e) => {
  if(e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  if(graphOpen) return;

  const active = document.activeElement;
  const isCategoryTab = active && active.classList.contains('category-tab');
  const isGenericFocus = !active || active === document.body;
  if(!isCategoryTab && !isGenericFocus) return;

  const anyOverlayOpen = document.querySelector(
    '.sheet-overlay.open, .modal-overlay.open, .ios-action-sheet.open, .ios-sheet-backdrop.open'
  );
  if(anyOverlayOpen) return;

  e.preventDefault();
  const currentIdx = CATEGORIES.indexOf(currentCategory);
  const dir = e.key === 'ArrowRight' ? 1 : -1;
  const nextIdx = (currentIdx + dir + CATEGORIES.length) % CATEGORIES.length;

  currentCategory = CATEGORIES[nextIdx];
  saveLastCategory(currentCategory);
  renderArchive();
  window.scrollTo({ top: 0, behavior: 'instant' });

  // 탭 자체에 포커스가 있었다면, 이동한 새 활성 탭에도 계속 포커스를 둬서 연속 탐색이 되게 함
  if(isCategoryTab){
    const newActiveTab = categoryTabs.querySelector('.category-tab.active');
    if(newActiveTab) newActiveTab.focus();
  }
});

// ── 문장 추가 시트 (우하단 +) ───────────────────
let pendingComposeCategory = CATEGORIES[0];

function renderCategoryChips(container, selected, onSelect){
  container.innerHTML = CATEGORIES.map(cat => `
    <button type="button" class="category-chip ${cat === selected ? 'active' : ''}" data-cat="${cat}" tabindex="${cat === selected ? '0' : '-1'}">${cat}</button>
  `).join('');
  const chips = Array.from(container.querySelectorAll('.category-chip'));
  chips.forEach((btn, idx) => {
    btn.addEventListener('click', () => {
      onSelect(btn.dataset.cat);
      chips.forEach(b => {
        const isActive = b === btn;
        b.classList.toggle('active', isActive);
        // 선택된 칩만 tab 순서에 남기고 나머지는 빼서(-1), Tab을 누르면 나머지 칩을
        // 거치지 않고 바로 다음 요소(출처 입력칸)로 넘어가도록 함
        b.setAttribute('tabindex', isActive ? '0' : '-1');
      });
      // 고른 카테고리에 맞춰 시트 전용 색(compose-color)만 갱신함.
      // 보관함/탭에 쓰이는 category-color는 절대 건드리지 않아서, 뒤에 깔린 화면 색이 같이 바뀌는 일이 없음.
      document.documentElement.style.setProperty('--compose-color', CATEGORY_COLORS[btn.dataset.cat] || CATEGORY_COLORS['삶']);
    });
    // 좌우 화살표로 칩 사이를 이동하면서 바로 선택까지 되도록 함 (양 끝은 순환)
    btn.addEventListener('keydown', (e) => {
      if(e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
      e.preventDefault();
      const dir = e.key === 'ArrowRight' ? 1 : -1;
      const nextIdx = (idx + dir + chips.length) % chips.length;
      chips[nextIdx].focus();
      chips[nextIdx].click();
    });
  });
}

// [1] 출처 입력칸을 포커스하면 최근 사용한 출처가 바로 아래 드롭다운으로 나타남.
// mousedown에서 처리해야 input의 blur보다 먼저 실행되어 클릭이 씹히지 않음.
function wireSourceSuggest(inputEl, suggestEl){
  let highlightedIndex = -1;

  function renderHighlight(){
    suggestEl.querySelectorAll('.source-suggest-item').forEach((btn, i) => {
      btn.classList.toggle('highlighted', i === highlightedIndex);
    });
  }

  inputEl.addEventListener('focus', () => {
    if(recentSources.length === 0) return;
    highlightedIndex = -1;
    suggestEl.innerHTML = recentSources.map(src => `
      <button type="button" class="source-suggest-item">${escapeHtml(src)}</button>
    `).join('');
    suggestEl.querySelectorAll('.source-suggest-item').forEach((btn, i) => {
      btn.addEventListener('mousedown', (e) => {
        e.preventDefault();
        inputEl.value = recentSources[i];
        suggestEl.classList.remove('open');
      });
    });
    suggestEl.classList.add('open');
  });
  // 드롭다운이 열려있을 때 위/아래로 항목을 옮기고, Tab으로 확정하면서 다음 칸(문장 입력)으로 넘어감
  inputEl.addEventListener('keydown', (e) => {
    if(!suggestEl.classList.contains('open')) return;
    const items = suggestEl.querySelectorAll('.source-suggest-item');
    if(items.length === 0) return;

    if(e.key === 'ArrowDown'){
      e.preventDefault();
      highlightedIndex = (highlightedIndex + 1) % items.length;
      renderHighlight();
    } else if(e.key === 'ArrowUp'){
      e.preventDefault();
      highlightedIndex = (highlightedIndex - 1 + items.length) % items.length;
      renderHighlight();
    } else if(e.key === 'Tab'){
      if(highlightedIndex >= 0) inputEl.value = recentSources[highlightedIndex];
      suggestEl.classList.remove('open');
      // Tab 기본 동작(다음 요소로 포커스 이동)은 그대로 두고 막지 않음
    }
  });
  inputEl.addEventListener('blur', () => {
    setTimeout(() => suggestEl.classList.remove('open'), 150);
  });
}
wireSourceSuggest(sourceInput, sourceSuggest);
wireSourceSuggest(editSourceInput, editSourceSuggest);

// [1,2] 페이지/일자 모드 토글 - 버튼은 항상 같은 크기의 아이콘만 담고, 어떤 모드인지는
// 옆의 별도 텍스트로 보여줌 (그래야 "페이지"/"일자" 글자 길이가 달라도 버튼 크기가 안 흔들림)
let addRefMode = 'page';
let editRefMode = 'page';

const REF_MODE_ICONS = {
  page: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/></svg>',
  date: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>'
};

function applyRefMode(mode, toggleBtn, labelEl, pageInput, dateInput){
  toggleBtn.innerHTML = REF_MODE_ICONS[mode];
  labelEl.textContent = mode === 'page' ? '페이지' : '일자';
  pageInput.style.display = mode === 'page' ? 'block' : 'none';
  dateInput.style.display = mode === 'page' ? 'none' : 'block';
}
refModeToggle.addEventListener('click', () => {
  addRefMode = addRefMode === 'page' ? 'date' : 'page';
  applyRefMode(addRefMode, refModeToggle, refModeLabel, refPageInput, refDateInput);
});
editRefModeToggle.addEventListener('click', () => {
  editRefMode = editRefMode === 'page' ? 'date' : 'page';
  applyRefMode(editRefMode, editRefModeToggle, editRefModeLabel, editRefPageInput, editRefDateInput);
});

// 모드+입력값 → 저장용 문자열 ("51p" 또는 "2026.04.25")
function buildRefString(mode, pageVal, dateVal){
  if(mode === 'page'){
    const v = (pageVal || '').trim();
    return v ? `${v}p` : '';
  }
  return dateVal ? dateVal.replace(/-/g, '.') : '';
}
// 저장된 문자열 → 수정 시트를 열 때 모드+입력값 복원 (옛 형식/자유 입력도 최대한 추측해서 복원)
function parseRefString(ref){
  if(!ref) return { mode: 'page', page: '', date: '' };
  const pageMatch = ref.match(/^(\d+)\s*p$/i);
  if(pageMatch) return { mode: 'page', page: pageMatch[1], date: '' };
  const dateMatch = ref.match(/^(\d{4})[.\-](\d{2})[.\-](\d{2})$/);
  if(dateMatch) return { mode: 'date', page: '', date: `${dateMatch[1]}-${dateMatch[2]}-${dateMatch[3]}` };
  const digits = ref.match(/\d+/);
  return { mode: 'page', page: digits ? digits[0] : '', date: '' };
}

function openAddQuoteSheet(){
  pendingComposeCategory = currentCategory;
  document.documentElement.style.setProperty('--compose-color', CATEGORY_COLORS[pendingComposeCategory] || CATEGORY_COLORS['삶']);
  renderCategoryChips(composeCategoryChips, pendingComposeCategory, (cat) => { pendingComposeCategory = cat; });
  sourceInput.value = '';
  quoteTextInput.value = '';
  addRefMode = 'page';
  refPageInput.value = '';
  refDateInput.value = '';
  applyRefMode(addRefMode, refModeToggle, refModeLabel, refPageInput, refDateInput);
  addQuoteStatusMsg.classList.remove('show');
  addQuoteOverlay.classList.add('open');
  lockBodyScroll();
  syncDialogViewport();
  setTimeout(() => {
    const activeChip = composeCategoryChips.querySelector('.category-chip.active');
    (activeChip || sourceInput).focus();
  }, 250);
}
function closeAddQuoteSheet(){
  if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
  addQuoteOverlay.classList.remove('open');
  resetDialogViewport(addQuoteOverlay);
  unlockBodyScroll();
}
addQuoteOverlay.addEventListener('click', (e) => {
  if(e.target === addQuoteOverlay) closeAddQuoteSheet();
});

async function handleAddQuoteSubmit(){
  const text = quoteTextInput.value.trim();
  if(!text){
    showStatus(addQuoteStatusMsg, '문장을 입력해주세요.', 'error', 1800);
    return;
  }
  const source = sourceInput.value.trim();
  const ref = buildRefString(addRefMode, refPageInput.value, refDateInput.value);

  addQuoteSubmitBtn.disabled = true;

  sentences.push({
    id: genId(),
    category: pendingComposeCategory,
    source,
    text,
    ref,
    important: false,
    highlights: [],
    spellChecked: false,
    tags: [],
    comment: '',
    ts: Date.now(),
    lastSeenAt: Date.now()
  });
  if(source) addRecentSource(source);

  await saveAll();
  addQuoteSubmitBtn.disabled = false;
  closeAddQuoteSheet();

  currentCategory = pendingComposeCategory;
  saveLastCategory(currentCategory);
  renderArchive();
  showToast('✓ 저장했어요');
}
addQuoteSubmitBtn.addEventListener('click', handleAddQuoteSubmit);
quoteTextInput.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && (e.metaKey || e.ctrlKey)){
    e.preventDefault();
    handleAddQuoteSubmit();
  }
});
[sourceInput, refPageInput, refDateInput].forEach(el => {
  el.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){
      e.preventDefault();
      handleAddQuoteSubmit();
    }
  });
});

}

}

actionCancelBtn.addEventListener('click', closeEntryAction);

  renderArchive();

});

actionEditBtn.addEventListener('click', () => {

// ── 문장 수정 시트 ─────────────────────────────
let editContext = null;
let pendingEditCategory = CATEGORIES[0];

function openEditSheet(id){
  const s = findSentence(id);
  if(!s) return;
  editContext = id;
  pendingEditCategory = s.category;
  document.documentElement.style.setProperty('--compose-color', CATEGORY_COLORS[pendingEditCategory] || CATEGORY_COLORS['삶']);
  renderCategoryChips(editCategoryChips, pendingEditCategory, (cat) => { pendingEditCategory = cat; });
  editSourceInput.value = s.source || '';
  editQuoteTextInput.value = s.text || '';

  const parsed = parseRefString(s.ref);
  editRefMode = parsed.mode;
  editRefPageInput.value = parsed.page;
  editRefDateInput.value = parsed.date;
  applyRefMode(editRefMode, editRefModeToggle, editRefModeLabel, editRefPageInput, editRefDateInput);

  editStatusMsg.classList.remove('show');
  editSheetOverlay.classList.add('open');
  lockBodyScroll();
  syncDialogViewport();
  setTimeout(() => editQuoteTextInput.focus(), 250);
}
function closeEditSheet(){
  if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
  editSheetOverlay.classList.remove('open');
  resetDialogViewport(editSheetOverlay);
  unlockBodyScroll();
}
editSheetOverlay.addEventListener('click', (e) => {
  if(e.target === editSheetOverlay) closeEditSheet();
});

async function handleEditSubmit(){
  const id = editContext;
  if(!id) return;
  const s = findSentence(id);
  if(!s) return;

  const text = editQuoteTextInput.value.trim();
  if(!text){
    showStatus(editStatusMsg, '문장을 입력해주세요.', 'error', 1800);
    return;
  }
  const source = editSourceInput.value.trim();
  const categoryChanged = s.category !== pendingEditCategory;

  editSubmitBtn.disabled = true;
  if(s.text !== text){
    s.highlights = []; // 텍스트가 바뀌면 글자 위치가 어긋나므로 하이라이트 초기화
    s.spellChecked = false; // 내용이 바뀌었으니 맞춤법 재점검 대상으로 되돌림
    s.tags = [];            // 주제가 달라졌을 수 있으니 의미 태그도 다시 뽑도록 비움
  }
  s.text = text;
  s.source = source;
  s.category = pendingEditCategory;
  s.ref = buildRefString(editRefMode, editRefPageInput.value, editRefDateInput.value);
  if(source) addRecentSource(source);

  await saveAll();
  editSubmitBtn.disabled = false;
  closeEditSheet();
  // 카테고리를 바꿨다면 그 문장이 옮겨간 카테고리로 화면도 같이 전환해서 보여줌
  if(categoryChanged){
    currentCategory = pendingEditCategory;
    saveLastCategory(currentCategory);
  }
  renderArchive();
  showToast('✓ 수정했어요');
}
editSubmitBtn.addEventListener('click', handleEditSubmit);
[editSourceInput, editRefPageInput, editRefDateInput].forEach(el => {
  el.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){
      e.preventDefault();
      handleEditSubmit();
    }
  });
});
