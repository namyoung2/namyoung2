<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>soooo.zip</title>
<link rel="icon" type="image/png" id="faviconLink">
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root{
    --bg: #FFFFFF;
    --surface: #FCFCFC;
    --text: #181818;
    --text-secondary: #666666;
    --text-tertiary: #A0A0A0;
    --border: #ECECEC;
    --category-color: #C6F24E;
    --compose-color: #C6F24E;
    --hover: #F5F5F5;
    --danger: #B23A2E;
    --danger-soft: #F5E6E4;
    --highlight-bg: #FFF176;
    --highlight-text: #2E7D32;
    --cancel-bg: #FFEBEE;
    --cancel-text: #C62828;
  }
  *{ box-sizing: border-box; }
  html{
    /* 스크롤바가 있고 없고에 따라 화면 폭이 미세하게 바뀌면서 콘텐츠가 좌우로
       움찔거리는 걸 막기 위해, 스크롤바 자리를 항상 비워둠. 모달을 열어 스크롤이
       잠기거나(body가 fixed가 되며 스크롤바가 사라짐), 문장이 늘어 스크롤이
       생기거나 하는 두 경우 다 이걸로 해결됨. */
    overflow-y: scroll;
    scrollbar-gutter: stable;
  }
  html,body{
    margin:0; padding:0;
    width: 100%;
    max-width: 100%;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", sans-serif;
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
  }
  body.modal-open{
    overflow: hidden;
    touch-action: none;
  }
  html.modal-open-html{
    overflow: hidden !important;
    touch-action: none;
  }
  /* ⚠️ 아이폰 사파리는 overflow:hidden 만으로는 뒤 화면 스크롤이 막히지 않음(사파리의 알려진 한계).
     그래서 창이 떠 있는 동안엔 "읽던 화면 판"을 그 자리에 통째로 고정시켜버림 - 이게 실제로
     듣는 유일한 방법.
     예전에 이 방식으로 주소창이 꼬이는 문제가 있었는데, 그건 화면 전체(body)를 고정했기 때문이었음.
     여기서는 읽기 화면 판(.scroll-region)만 고정하고 팝업·메모화면은 그대로 두므로 그 문제가 없음.
     고정하는 순간 판이 맨 위로 튀어 올라가지 않게, 읽던 위치만큼 위로 끌어올려서(top: -Npx)
     눈에 보이는 자리는 그대로 유지함. */
  body.bg-frozen .scroll-region{
    position: fixed;
    left: 0;
    right: 0;
    width: 100%;
    overflow: hidden;
  }

  .wrap{
    width: 100%;
    max-width: 700px;
    margin: 0 auto;
    /* 예전엔 이 여백을 260px이나 되게 넉넉히 뒀음 - 탭·버튼이 fixed가 아니라
       .float-layer의 dvh 계산에 얹혀 있던 시절엔, 주소창이 갑자기 나타나며 그 계산이
       살짝 어긋나도 안 겹치도록 하려면 이만큼 큰 안전 마진이 필요했음. 이제 탭·버튼이
       각자 직접 position:fixed로 화면 바닥에 정확히 붙으므로(더는 계산이 어긋날 일이
       없음), 실제로 필요한 만큼(탭 높이+여백)만 남기고 크게 줄임 - 화면 아래에
       불필요하게 남던 흰 여백을 없앰. */
    padding: max(28px, env(safe-area-inset-top)) 22px 100px;
  }
  /* 평소엔 그냥 투명한 감싸개일 뿐이고(폭도 안 건드림), 컴퓨터 편집 모드일 때만
     화면 전체 폭짜리 스크롤 판이 됨(위 CSS 참고) */
  .scroll-region{ width: 100%; }

  /* ── 시작 스플래시 화면 ─────────────────────── */
  .splash-overlay{
    position: fixed;
    inset: 0;
    /* inset:0만으로는(위아래 이 위치에 맞춰 늘어나는 방식) 사파리가 페이지를 막 열어서
       주소창이 아직 다 펼쳐진 채인 바로 그 순간엔 실제 보이는 높이와 다르게 계산될 때가
       있음(사파리의 알려진 특성 - 이 앱에서 하단 탭이 겪던 문제와 같은 종류). 그래서
       dvh로 명시적으로도 한 번 더 못박아, 지금 실제로 보이는 화면 높이에 맞춰지게 함. */
    width: 100vw;
    width: 100dvw;
    height: 100vh;
    height: 100dvh;
    z-index: 500;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* 그냥 사라지는(opacity) 대신, 화면 전체가 위로 슥 밀려 올라가며 사라지게 함 -
     블라인드가 걷히는 듯한 "스와아아악" 느낌. 로고는 그 안에서 아주 살짝 더 빠르게
     옅어지며 커져서, 배경과 로고가 미묘하게 다른 속도로 움직이는 깊이감을 줌.
     translate를 쓰지 않고 top을 움직여서 사라지게 함 - JS가 화면 위치를 맞추느라
     transform을 쓰고 있어서, 여기서도 transform을 쓰면 서로 덮어써 튀어 보임. */
  @keyframes splashSweepOut{
    0%{ margin-top: 0; opacity: 1; }
    100%{ margin-top: -6vh; opacity: 0; }
  }
  .splash-overlay.hide{
    animation: splashSweepOut 0.6s cubic-bezier(.22,1,.36,1) forwards;
    pointer-events: none;
  }
  /* 이미지 로고 대신 헤더와 같은 워드마크 스타일 - "처음 켜는 순간"부터 일관된 인상을 줌 */
  .splash-wordmark{
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'Pretendard', sans-serif;
    font-size: 26px;
    font-weight: 800;
    color: var(--text);
    letter-spacing: -0.3px;
    animation: splashPop 0.35s ease-out;
  }
  /* Pretendard 웹폰트가 네트워크로 늦게 로드되는 동안 시스템 기본 폰트로 먼저 그려지다가
     로드 완료 후 폰트가 바뀌면서(폰트 스와프) 줄 높이가 미묘하게 달라짐 - 이 텍스트 박스
     높이가 바뀌면 옆의 align-items:center로 정렬된 점의 위치도 따라 재계산되어, 폰트가
     늦게 뜰 때 점이 스르륵 움직이는 것처럼 보이는 버그였음(실제 녹화로 확인 - 폰트 로드
     시점에 최대 6px 정도 계속 흘러 움직임). line-height를 폰트 종류와 무관한 고정값으로
     못박아서, 어떤 폰트로 그려지든 박스 높이 자체는 절대 안 바뀌게 함. */
  .splash-wordmark span:not(.splash-wordmark-dot){
    line-height: 1;
  }
  /* 카테고리 색(--category-color)을 그대로 쓰면, 데이터를 아직 못 불러온 이 이른
     시점엔 기본값으로 있다가 실제 데이터가 로드되며 진짜 카테고리 색으로 "탁" 바뀌어
     보이는 문제가 있었음(스플래시가 잠깐 떠 있는 그 짧은 순간에 색이 눈에 띄게 변함).
     스플래시는 어차피 아주 짧게 스쳐가는 화면이라 "지금 카테고리 색"일 필요가 없어서,
     고정된 색 하나로 못박아 이 문제 자체를 없앰. */
  .splash-wordmark-dot{
    flex-shrink: 0;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #7FD8F0;
    transform: translateY(0.5px); /* 글자와 세로 중심이 아주 살짝 안 맞아서 미세 보정 */
  }
  @keyframes splashPop{
    from{ opacity: 0; transform: scale(0.9); }
    to{ opacity: 1; transform: scale(1); }
  }

  /* ── 보관함 (카테고리별 문장 목록) - 메인 화면 ──── */
  .archive-header{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-bottom: 24px;
    position: relative;
  }
  /* 로고 대신 워드마크 - 점 하나로만 브랜드 색의 흔적을 남기고 나머지는 단정한 텍스트.
     보기 모드에선 눌러서 편집 모드로 들어가는 빠른 길로 그대로 쓰이고, 편집 모드에선
     이미 편집 중이라 누를 이유가 없어서 그냥 조용한 글자로만 남음(커서도 default로). */
  .wordmark{
    display: flex;
    align-items: center;
    gap: 7px;
    border: none;
    background: none;
    padding: 4px 2px;
    font-family: 'Pretendard', sans-serif;
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.2px;
    cursor: pointer;
  }
  body.mode-view .wordmark:hover .wordmark-text{ color: var(--text-secondary); }
  body:not(.mode-view) .wordmark{ cursor: default; }
  /* 스플래시와 같은 이유(폰트 스와프로 인한 줄 높이 변화) - 여긴 폰트가 이미 다 로드된
     뒤에 뜰 때가 많아 잘 안 보이지만, 안전하게 똑같이 고정해둠 */
  .wordmark-text{ line-height: 1; }
  .wordmark-dot{
    flex-shrink: 0;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--category-color);
    transform: translateY(0.5px); /* 글자와 세로 중심이 아주 살짝 안 맞아서 미세 보정 */
  }
  /* 톱니바퀴는 편집 모드에서만 - 가끔 쓰는 기능들(보기 모드로/맞춤법/내보내기/가져오기)의
     유일한 진입점. 로고(워드마크)가 하던 두 가지 역할(모드 전환/설정 열기)을 여기서부터는
     완전히 나눠서, 워드마크는 "브랜드+빠른 진입"만, 톱니는 "설정"만 맡음. */
  .settings-gear-btn{
    display: none;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    border: none;
    border-radius: 50%;
    background: none;
    color: var(--text-tertiary);
    cursor: pointer;
  }
  body.compose-active .settings-gear-btn{ display: flex; }
  /* 폰(터치 기기)엔 아예 안 둠 - 메모 기능 외엔 필요 없다고 하셨음(설정은 PC 전용) */
  @media (pointer: coarse){ .settings-gear-btn{ display: none !important; } }
  .settings-gear-btn:hover{ background: var(--hover); color: var(--text-secondary); }

  /* ── 설정 드롭다운(톱니바퀴 눌렀을 때) ──────────────
     노션·리니어 같은 툴들의 작은 드롭다운 느낌 - 화면을 안 덮고, 톱니 바로 아래 작게 뜸.
     위치(top/left)는 톱니바퀴의 실제 화면 좌표를 재서 JS가 정확히 맞춤. */
  .settings-dropdown{
    display: none;
    position: fixed;
    width: 190px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(24,24,24,0.14);
    padding: 6px;
    z-index: 90;
  }
  .settings-dropdown.open{ display: block; }
  .settings-dropdown-item{
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 8px 10px;
    border: none;
    background: none;
    border-radius: 7px;
    font-family: 'Pretendard', sans-serif;
    font-size: 13.5px;
    font-weight: 500;
    color: var(--text);
    text-align: left;
    cursor: pointer;
  }
  .settings-dropdown-item svg{ flex-shrink: 0; color: var(--text-tertiary); }
  .settings-dropdown-item:hover{ background: var(--hover); }
  .settings-dropdown-divider{
    height: 1px;
    background: var(--border);
    margin: 5px 4px;
  }
  /* 평소엔 완전히 안 보이다가, 서버 재시도를 기다리는 동안에만 워드마크 옆에 아주
     작게 나타남 - 정상일 때 뭔가 보이면 그게 오히려 노이즈라는 원칙으로 최대한 조용하게.
     이제 워드마크 폭이 내용에 따라 달라져서, 예전처럼 %로 위치를 못박지 않고
     그냥 옆에 나란히 놓이는 자연스러운 흐름으로 둠. */
  .sync-pending-dot{
    display: none;
    flex-shrink: 0;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #FFD874;
    margin-left: -2px;
  }
  .sync-pending-dot.show{ display: block; }
  /* 로고를 누르면 보기/편집 모드가 전환됨 - 화면 전체가 아주 잠깐 흐려졌다 돌아옴 */
  @keyframes modeSwitchFade{
    0%{ opacity: 1; }
    45%{ opacity: 0.62; }
    100%{ opacity: 1; }
  }
  .wrap.mode-switch-fade{ animation: modeSwitchFade 0.36s ease; }
  /* 모드가 바뀌면서 우하단 아이콘(+/돋보기)이 통통 튀듯 나타남 */
  @keyframes fabIconPop{
    0%{ transform: scale(1); }
    45%{ transform: scale(0.82); opacity: 0.5; }
    100%{ transform: scale(1); opacity: 1; }
  }
  .fab-icon-pop{ animation: fabIconPop 0.32s cubic-bezier(.2,.8,.3,1); }
  .archive-list{ max-width: 620px; margin: 0 auto; }
  /* 카테고리를 바꿀 때 아주 살짝 좌우로 미끄러지는 느낌 (토스 스타일의 미세한 전환) */
  @keyframes catOutToLeft{ to{ transform: translateX(-10px); opacity: 0; } }
  @keyframes catOutToRight{ to{ transform: translateX(10px); opacity: 0; } }
  @keyframes catInFromRight{ from{ transform: translateX(10px); opacity: 0; } to{ transform: translateX(0); opacity: 1; } }
  @keyframes catInFromLeft{ from{ transform: translateX(-10px); opacity: 0; } to{ transform: translateX(0); opacity: 1; } }
  .archive-list.cat-anim-out-l{ animation: catOutToLeft 0.13s ease forwards; }
  .archive-list.cat-anim-out-r{ animation: catOutToRight 0.13s ease forwards; }
  .archive-list.cat-anim-in-r{ animation: catInFromRight 0.24s cubic-bezier(.22,.7,.3,1); }
  .archive-list.cat-anim-in-l{ animation: catInFromLeft 0.24s cubic-bezier(.22,.7,.3,1); }

  /* 문장 목록 맨 아래 - 맞춤법 확인 트리거 */
  .spell-check-trigger{
    display: block;
    width: 100%;
    max-width: 560px;
    margin: 24px auto 0;
    padding: 8px 0;
    border: none;
    background: none;
    color: var(--text-tertiary);
    font-family: 'Pretendard', sans-serif;
    font-size: 11.5px;
    font-weight: 500;
    cursor: pointer;
  }
  .spell-check-trigger:disabled{ opacity: 0.5; cursor: default; }
  /* 보기 모드에서는 고치는 기능 버튼을 감춤 */
  body.mode-view .spell-check-trigger{ display: none; }

  /* ── 편집 모드 비밀번호 ─────────────────────── */
  .bottom-sheet.passcode-sheet{
    max-width: 460px;
    position: relative; /* 별자리보다 위에 뜨도록(z-index 기준을 여기서 잡음) */
    z-index: 1;
    /* 박스 자체는 또렷한 카드로 남아야 하니 배경을 확실히 깔아서 뒤 별자리가 안 비치게 함 */
    background: var(--bg);
  }
  .passcode-sheet .sheet-body{
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 56px 40px 46px;
    min-height: 320px;
    justify-content: center;
  }
  /* 오로라처럼 천천히 흐르는 그라데이션 - 로고에 쓰인 색(카테고리 4색과 동일 팔레트)을
     그대로 가져와서, 로고가 배경으로 은은하게 번진 듯한 느낌. 2026년 기준 AI 제품들이
     많이 쓰는 "메시 그라데이션 / 오로라" 스타일 참고함(Stripe, Apple Music 등).
     팝업 박스 "안"이 아니라 화면 전체(오버레이)를 덮어서, 박스는 그 위에 뜬 또렷한
     카드로 보이고 그 주변 화면에서 색이 흐르는 구조. */
  .passcode-aurora{
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: 0;
    pointer-events: none;
  }
  .passcode-aurora-blob{
    position: absolute;
    width: 42vmax;
    height: 42vmax;
    border-radius: 50%;
    filter: blur(70px);
    opacity: 0.4;
    will-change: transform;
  }
  .passcode-aurora-blob.b1{
    top: -12%; left: -14%;
    background: radial-gradient(circle, #7FD8F0, transparent 70%);
    animation: auroraDrift1 15s ease-in-out infinite;
  }
  .passcode-aurora-blob.b2{
    bottom: -18%; right: -12%;
    background: radial-gradient(circle, #FF9EC4, transparent 70%);
    animation: auroraDrift2 19s ease-in-out infinite;
  }
  .passcode-aurora-blob.b3{
    top: 22%; right: 8%;
    width: 34vmax; height: 34vmax;
    background: radial-gradient(circle, #C6F24E, transparent 70%);
    animation: auroraDrift3 13s ease-in-out infinite;
  }
  .passcode-aurora-blob.b4{
    bottom: 8%; left: 10%;
    width: 30vmax; height: 30vmax;
    background: radial-gradient(circle, #FFAB91, transparent 70%);
    animation: auroraDrift1 17s ease-in-out infinite reverse;
  }
  @keyframes auroraDrift1{
    0%, 100%{ transform: translate(0,0) scale(1); }
    33%{ transform: translate(6vmax, 4vmax) scale(1.12); }
    66%{ transform: translate(-3vmax, 7vmax) scale(0.94); }
  }
  @keyframes auroraDrift2{
    0%, 100%{ transform: translate(0,0) scale(1); }
    50%{ transform: translate(-7vmax, -5vmax) scale(1.15); }
  }
  @keyframes auroraDrift3{
    0%, 100%{ transform: translate(0,0) scale(1); }
    40%{ transform: translate(5vmax, -6vmax) scale(1.08); }
    70%{ transform: translate(-4vmax, -2vmax) scale(0.92); }
  }
  @media (prefers-reduced-motion: reduce){
    .passcode-aurora-blob{ animation: none !important; }
  }

  /* 시네마틱하게: 밝기가 한 번 세졌다가 사라지는 구간이 있으면(오로라가 부풀며 진해지는
     부분) 그게 "번쩍"하는 느낌으로 읽힘 - 그래서 이번엔 밝기가 오르는 구간을 완전히 없애고,
     대신 "초점이 빠지며 멀어지는" 느낌(블러 + 살짝 커짐)으로 깊이감을 냄. 카메라가 팬
     포커스를 옮기는 것과 같은 원리 - 카드는 흐려지며 멀어지고, 뒤 내용은 흐린 상태에서
     또렷하게 초점이 맞아 들어옴. 시간도 살짝 늘리고(0.55s) 더 부드러운 감속 곡선을 씀. */
  @keyframes passcodeCardDissolve{
    0%{ transform: scale(1); opacity: 1; filter: blur(0px); }
    100%{ transform: scale(1.05); opacity: 0; filter: blur(14px); }
  }
  @keyframes passcodeAuroraSweep{
    0%{ opacity: 0.38; }
    100%{ opacity: 0; }
  }
  @keyframes contentRevealIn{
    0%{ transform: scale(0.98); opacity: 0; filter: blur(10px); }
    100%{ transform: scale(1); opacity: 1; filter: blur(0px); }
  }
  .passcode-sheet.transitioning-out{
    animation: passcodeCardDissolve 0.55s cubic-bezier(.22,1,.36,1) forwards;
  }
  .passcode-aurora.transitioning-out .passcode-aurora-blob{
    animation: passcodeAuroraSweep 0.55s cubic-bezier(.22,1,.36,1) forwards;
  }
  .content-reveal-in{
    animation: contentRevealIn 0.5s cubic-bezier(.22,1,.36,1) 0.1s backwards;
  }
  @media (prefers-reduced-motion: reduce){
    .passcode-sheet.transitioning-out,
    .passcode-aurora.transitioning-out .passcode-aurora-blob,
    .content-reveal-in{ animation: none !important; }
  }
  .passcode-title{
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
  }
  .passcode-desc{
    margin-top: 7px;
    font-size: 15px;
    color: var(--text-tertiary);
  }
  .passcode-dots{
    display: flex;
    gap: 17px;
    margin-top: 30px;
    height: 16px;
  }
  .passcode-dot{
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: transparent;
    transition: background 0.16s ease, border-color 0.16s ease;
  }
  /* 방금 입력한 점 "하나만" 톡 튀어오름 - 예전엔 이 애니메이션이 .filled 전체에 걸려있어서,
     매번 다시 그릴 때마다 이미 채워둔 점들까지 같이 다시 튀어 정신없었음(막 입력한 것만
     반응해야 하는데 전부 반응). 그래서 "방금 채워진 바로 그 점"에만 별도 클래스로 붙임.
     바운스도 과했다는 얘기가 있어서 튀어오르는 폭을 확 줄임(1.35→1.2). */
  @keyframes passcodeDotFill{
    0%{ transform: scale(0.6); }
    55%{ transform: scale(1.2); }
    100%{ transform: scale(1.12); }
  }
  .passcode-dot.filled{
    background: var(--category-color);
    border-color: var(--category-color);
    transform: scale(1.12);
  }
  .passcode-dot.just-filled{
    animation: passcodeDotFill 0.24s cubic-bezier(.34,1.56,.64,1);
  }
  /* 실제 입력은 보이지 않는 칸이 받고, 화면에는 점만 보여줌 */
  .passcode-hidden-input{
    position: absolute;
    opacity: 0;
    pointer-events: none;
    width: 1px; height: 1px;
    font-size: 16px; /* iOS에서 포커스 시 화면이 확대되는 것 방지 */
  }
  .passcode-error{

    font-size: 12px;
    color: var(--danger);
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  .passcode-error.show{ opacity: 1; }
  @keyframes passcodeShake{
    0%,100%{ transform: translateX(0); }
    20%{ transform: translateX(-7px); }
    40%{ transform: translateX(7px); }
    60%{ transform: translateX(-4px); }
    80%{ transform: translateX(4px); }
  }
  .passcode-dots.shake{ animation: passcodeShake 0.4s ease; }

  /* 비밀번호가 맞았을 때: 점들이 잠깐 밝아지고 커졌다가 시트가 닫힘 */
  .sheet-overlay.unlocked .passcode-dot{

  /* 시트 우측 상단 닫기 버튼 - 키보드가 올라오면 바깥을 누르기 어려워서 필요함 */

  /* ── 보기 모드 전용 검색 ─────────────────────── */
  /* 높이를 vh(화면 전체)로 잡으면 키보드가 올라왔을 때 실제 남은 공간보다 커져서
     시트가 위로 밀려 올라감. 부모(.bottom-sheet)가 이미 남은 공간에 맞춰 크기를
     제한하고 있으므로, 여기서는 그 안을 100%로 채우기만 함. */
  .search-sheet .sheet-body{
    position: relative;
    /* 아래쪽이 비어 보이지 않도록 위아래 여백을 같게 맞춤 */
    padding-bottom: 22px;
    display: flex;
    flex-direction: column;
    /* 부모(.bottom-sheet)가 flex 컨테이너라, max-height(%)로는 제대로 안 줄어듦.
       flex:1 + min-height:0 으로 남은 공간에 정확히 맞춰 줄어들게 함. */
    flex: 1 1 auto;
    min-height: 0;
  }
  .search-input-field{
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    font-family: 'Pretendard', sans-serif;

  .search-input-field:focus{ outline: none; border-color: var(--text-tertiary); }
  .search-results-list{ overflow-y: auto; flex: 1; min-height: 0; margin-top: 8px; }
  .search-result-item{
    padding: 12px 2px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    text-align: left;
  }
  .search-result-item:last-child{ border-bottom: none; }
  .search-result-item:active{ background: var(--hover); }
  /* 키보드 위/아래로 고른 항목 - 회색 배경과 색 막대를 같이 쓰니 지저분해서,
     카테고리 색이 아주 옅게 깔리는 정도로만 표시함 */
  /* 키보드로 고른 항목 - 카테고리와 상관없이 늘 같은 색으로.
     글자색을 아주 옅게 깐 느낌이라 어떤 카테고리에서도 튀지 않음. */
  .search-result-item.active{

  /* 문장을 추가/삭제할 때 목록이 갑자기 훅 바뀌지 않고 한 박자 부드럽게 이어지도록 함.

     위/아래 여백을 정확히 맞추기 위해: 로고→스포트라이트 간격(archive-header의 margin-bottom)과
     스포트라이트→다음 문장 간격(margin-bottom)을 같은 값으로 맞추고, 다음 항목의 자체
     top padding은 0으로 상쇄시켜서 두 간격이 픽셀 단위로 동일해지도록 함. */

  /* 책갈피는 항상 세로 선과 같은 x위치(왼쪽 끝)에 고정되도록 절대 위치로 둠.
     출처/페이지 텍스트의 들여쓰기(padding-left:18px)와는 서로 영향을 주지 않아서,
     책갈피가 있든 없든 텍스트 위치는 항상 같고, 책갈피는 항상 선 바로 아래에 옴. */

  /* 추가된 지 24시간 안쪽인 문장에만 표시됨. 카테고리 색을 그대로 쓰면 파스텔톤이라

     카테고리 색 대신 차분한 회색으로 둠(NEW가 더 눈에 띄어야 하므로) */
  .quote-edit-badge{

  .empty{

  /* 아래 키로 문장 끝에 맞춰 멈춰도, 그 아래 여백에 다음 문장 글자가 두어 줄 비집고 들어와
     "중간에서 잘린" 것처럼 보였음. 딱 자르는 대신 서서히 흐려지게 해서 자연스럽게 마무리함.
     (카테고리 탭·버튼보다는 아래층에 있어서 그것들은 그대로 또렷하게 보임) */
  /* 떠 있는 요소들(카테고리 탭, +버튼)을 담는 판.
     iOS 사파리는 주소창이 접히고 펴지는 "애니메이션이 진행되는 동안"에는 position:fixed
     요소를 실제 보이는 영역(visual viewport)이 아니라 레이아웃 뷰포트 기준으로 잡아둠 -
     그래서 fixed만으로는 스크롤 도중 탭이 화면 바닥에 안 붙고 문장 중간에 붕 떠 보였음
     (실제 녹화 프레임 분석에서 탭이 바닥으로부터 1px~125px까지 계속 요동치는 걸 확인).
     이건 CSS(dvh, fixed)만으로는 못 고치는 사파리의 알려진 한계라, JS로 visualViewport의
     offsetTop/height를 매 프레임 읽어서 직접 위치를 잡아줌 - 이 값은 애니메이션 도중에도
     정확해서, 주소창이 어떻게 움직이든 탭이 항상 화면 바닥에 착 붙어 따라옴. */
  /* 떠 있는 요소들(카테고리 탭, +버튼)을 담는 판.
     [세 번째 접근] 앞서 두 번의 시도가 모두 실패했음:
       1) CSS의 dvh + position:fixed → 사파리가 주소창 애니메이션 중엔 fixed를
          실제 보이는 영역이 아니라 레이아웃 뷰포트 기준으로 잡아서 탭이 붕 떴음
       2) JS로 visualViewport를 읽어 매 프레임 따라가기 → 사파리의 주소창 애니메이션이
          JS 이벤트보다 먼저 움직여서, JS가 늘 한 박자 늦게 쫓아가느라 오히려 더 심하게
          요동쳤음(녹화 분석에서 바닥으로부터 15px~458px까지 튀는 걸 확인)
     그래서 이번엔 "바닥에 붙인다"는 생각 자체를 버림. bottom이 아니라 top을 기준으로
     잡으면(즉 화면 위에서부터 거리를 재면), 주소창이 어떻게 움직이든 그 계산에 전혀
     휘둘리지 않음 - 사파리에서 위쪽 기준은 항상 안정적이기 때문. 판의 높이를 JS로
     맞출 필요도, 매 프레임 따라갈 필요도 없어짐. */
  .float-layer{
    position: fixed;
    left: 0; right: 0;
    top: 0;
    height: 100dvh;
    pointer-events: none;
    z-index: 70;
  }
  .float-layer > *{ pointer-events: auto; }

  /* ── 컴퓨터 전용: Tab으로 목록 훑어보기에 들어갈 때 잠깐 뜨는 말풍선 ──────────
     예전엔 우상단에 숫자 배지가 늘 떠 있었는데, "평소에도 계속 보여서 시각적으로
     많다"는 얘기가 있어서 없앰. 손이 비는 순간(Tab으로 타이핑을 잠깐 멈출 때)에만
     "아 맞다 메모"하고 떠올릴 정도로만 짧게 알려주는 게 훨씬 조용함. */
  .compose-memo-hint{
    display: none;
    position: absolute;
    left: 50%;
    bottom: calc(100% + 14px);
    transform: translateX(-50%);
    background: #FFD874;
    color: var(--text);
    opacity: 1; /* 명시적으로 항상 불투명 - 예전엔 부모(.compose-bar)가 흐려질 때 같이
                   흐려졌었는데, 이제 그 부모 밖(구조상 형제)으로 옮겨서 이 값 그대로 지켜짐 */
    font-size: 13px;
    font-weight: 700;
    padding: 8px 16px;
    border-radius: 14px;
    white-space: nowrap;
    box-shadow: 0 6px 16px rgba(24,24,24,0.16);
    z-index: 3;
    cursor: pointer;
    transition: transform 0.16s ease, box-shadow 0.16s ease, filter 0.16s ease;
  }
  /* 누를 수 있다는 걸 손 안 대봐도 느끼게 - 살짝 커지고 그림자도 더 또렷해짐 */
  .compose-memo-hint:hover{
    transform: translateX(-50%) scale(1.07);
    box-shadow: 0 9px 22px rgba(24,24,24,0.24);
    filter: brightness(1.03);
  }
  .compose-memo-hint::after{
    content: '';
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    border: 7px solid transparent;
    border-top-color: #FFD874;
  }
  /* "M 눌러서 쓸 수 있다"는 걸 글자보다 뚜렷하게 - 노란 바탕 위에 살짝 어두운
     원형 배지로 키캡(keycap)처럼 보이게 함.
     예전엔 vertical-align으로 위치를 맞췄는데 글자 기준선과 미묘하게 안 맞았음 -
     지금은 감싼 줄 자체를 flex로 세로 중앙 정렬해서(아래) 확실하게 맞춤. */
  .compose-memo-hint-m{
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: rgba(36,41,31,0.16);
    font-size: 10.5px;
    font-weight: 800;
  }
  @keyframes composeMemoHintPop{
    0%{ transform: translateX(-50%) scale(0.7); opacity: 0; }
    100%{ transform: translateX(-50%) scale(1); opacity: 1; }
  }
  .compose-memo-hint.show{
    display: flex;
    align-items: center;
    gap: 5px;
    animation: composeMemoHintPop 0.28s cubic-bezier(.34,1.56,.64,1);
  }
  /* 사라질 때도 뚝 끊기지 않고 옅어지며 살짝 오므라들게 함 */
  @keyframes composeMemoHintOut{
    0%{ transform: translateX(-50%) scale(1); opacity: 1; }
    100%{ transform: translateX(-50%) scale(0.85); opacity: 0; }
  }
  .compose-memo-hint.hiding{
    display: flex;
    align-items: center;
    gap: 5px;
    animation: composeMemoHintOut 0.22s ease forwards;
  }
  /* 폰(터치 기기)에는 아예 안 둠 - Tab 자체가 컴퓨터 전용 동작이라 */
  @media (pointer: coarse){ .compose-memo-hint{ display: none !important; } }

  /* 편집 모드가 메모 화면으로 바뀐 폰에서는 탭·+버튼을 다 감춤 (메모 화면이 전부를 대체함) */
  body.mode-memo .category-tabs,
  body.mode-memo .add-quote-trigger-btn{ display: none !important; }
  /* 메모 화면이 뜬 동안 뒤(읽기 화면)가 같이 스크롤되지 않게 잠금.
     예전에 이걸 position:fixed + 스크롤 위치 강제 이동으로 처리했다가 아이폰 사파리에서
     주소창 상태가 꼬이는 심각한 버그가 났었음(편집 화면 갔다 오면 위치가 이상해지던 문제).
     그래서 그 방식은 다시 안 쓰고, overflow만 잠그는 훨씬 단순한 방식을 씀 - 이러면
     scrollTop이 그대로 보존돼 있어서 나중에 풀어도 자동으로 원래 있던 자리 그대로임
     (강제로 옮길 필요 자체가 없음). 컴퓨터 채팅줄에서 이미 검증된 것과 같은 방식. */
  /* 뒤 화면 잠금은 팝업과 똑같이 .bg-frozen 방식을 씀 (freezeBackground 참고) */

  /* ── 폰 전용 메모 화면 ─────────────────────────
     읽기 화면은 이미 여러 번 다듬어져서 그대로 두고, 이 화면만 완전히 새로 그림.
     목록도 탭도 없이 입력칸 두 개뿐이라 구조가 단순해서, 지금까지 골치였던
     "떠 있는 요소 위치" 문제 자체가 생기지 않음 (뭔가 떠 있을 이유가 없음). */
  .memo-screen{
    position: fixed;
    inset: 0;
    height: 100vh;    /* dvh를 모르는 옛 브라우저용 */
    height: 100dvh;
    background: var(--bg);
    z-index: 60;      /* float-layer(70)보다 낮게 둬서, 저장 알림(토스트)은 이 화면 위로도 계속 보임 */
    display: none;
    flex-direction: column;
  }
  body.mode-memo .memo-screen{ display: flex; }
  .memo-screen-top{
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
    padding: max(20px, env(safe-area-inset-top)) 18px 14px;
    border-bottom: 1px solid var(--border);
  }
  .memo-exit-btn{
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    border: none; background: none; color: var(--text);
    border-radius: 50%;
    padding: 0;
    cursor: pointer;
  }
  .memo-exit-btn:active{ background: var(--hover); }
  .memo-screen-title{ font-size: 15.5px; font-weight: 700; flex: 1; }
  .memo-screen-count{ font-size: 12px; color: var(--text-tertiary); }
  .memo-screen-body{
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 30px 22px calc(30px + env(safe-area-inset-bottom));
  }
  .memo-field-label{
    font-size: 13px;
    font-weight: 600;
    color: var(--text-tertiary);
    margin: 22px 0 8px;
  }
  .memo-field-label:first-child{ margin-top: 4px; }
  .memo-big-input{
    width: 100%;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 15px 16px;
    font-size: 16px;   /* iOS 자동 확대 방지 */
    font-family: 'Pretendard', sans-serif;
    color: var(--text);
    background: var(--surface);
  }
  .memo-big-input:focus{ outline: none; border-color: var(--category-color); }
  .memo-big-input.shake{ animation: passcodeShake 0.4s ease; }
  .memo-save-btn{
    width: 100%;
    margin-top: 30px;
    padding: 16px 0;
    border: none;
    border-radius: 14px;
    background: var(--category-color);
    color: var(--text);
    font-family: 'Pretendard', sans-serif;
    font-size: 15.5px;
    font-weight: 700;
    cursor: pointer;
  }
  .memo-save-btn:active{ transform: scale(0.98); }

  /* ── 컴퓨터 편집 모드 전용: 채팅형 입력줄 ─────────────────────
     클로드 입력창과 같은 구조: 입력칸이 위에서 위로 자라나고, 상태 줄(카테고리·페이지·출처)과
     전송 버튼은 항상 맨 아래에 고정됨 - 문장을 아무리 많이 쳐도 버튼 위치가 안 움직임. */
  .compose-bar{
    display: none;
    position: fixed;
    left: 50%;
    bottom: max(20px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    width: min(700px, calc(100% - 40px));
    z-index: 65;
    /* 이 판 자체는 이제 위치만 잡는 투명한 틀 - 실제 보이는 박스(배경·테두리 등)와
       초점 빠졌을 때 흐려지는 효과는 안쪽 판(.compose-bar-inner)이 담당함. 말풍선은
       이 틀의 형제로 남아서, 안쪽 판이 흐려질 때도 항상 또렷하게 보임(CSS 투명도는
       자식에서 다시 불투명하게 되돌릴 수 없어서, 아예 그 영향 밖에 둔 것). */
  }
  body.compose-active .compose-bar{ display: block; }
  .compose-bar-inner{
    position: relative; /* 메모줄·수정줄이 "이 판" 기준으로 위에 뜨도록(우연이 아니라 명시적으로) */
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(24,24,24,0.12);
    padding: 12px 12px 10px;
    opacity: 1;
    transform: scale(1);
    /* 입력줄에서 초점이 빠지면("문장 집중 모드") 살짝 흐려지고 작아져서,
       지금 화살표가 문장 훑어보기에 쓰이는 중이라는 걸 은은하게 알려줌 */
    transition: opacity 0.22s ease, transform 0.22s ease;
  }
  .compose-bar:not(.compose-bar-focused) .compose-bar-inner{
    opacity: 0.68;
    transform: scale(0.975);
  }
  /* 채팅줄이 떠 있는 동안엔 카테고리 탭이 중복이라 감춤 - 채팅줄 안 카테고리 알약이 그 역할을 대신함 */
  body.compose-active .category-tabs{ display: none; }
  /* 목록이 페이지 전체(window)가 아니라 이 안에서만 스크롤되게 함.
     그래야 스크롤을 아무리 내려도 문장이 입력줄 밑으로 들어가 가려지는 일이 없고,
     항상 입력줄 바로 위에서 깔끔하게 멈춤 - 클로드 채팅창에서 메시지 목록이 입력창
     위 칸에 얌전히 갇혀 있는 것과 같은 구조. */
  body.compose-active{ overflow: hidden; }
  /* 목록이 이제 .scroll-region 안에서만 스크롤되므로(아래 참고), 이 상태에선 바깥(html)
     스크롤바가 할 일이 없는데도 계속 떠 있었음 - 그 빈 스크롤바를 꺼둠.
     :has()는 오래된 브라우저에서 안 먹힐 수 있어 JS로 html에 직접 클래스를 붙여 확실하게 처리하고,
     혹시 다른 규칙과 부딪혀도 확실히 이기도록 !important를 둠. */
  html.compose-active-html{ overflow-y: hidden !important; scrollbar-gutter: auto !important; }
  /* 실제 스크롤은 이 판(화면 전체 폭)이 담당함 - 안쪽 .wrap은 700px로 좁게 배치만 될 뿐이라,
     예전엔 그 좁은 폭 밖(양옆 여백)에 마우스가 있으면 휠을 굴려도 반응이 없었음.
     이 판을 화면 전체 폭으로 넓혀서, 어디에 마우스가 있든 휠이 먹히게 함. */
  body.compose-active .scroll-region{
    height: calc(100vh - var(--compose-reserve, 160px));
    overflow-y: auto;
    overscroll-behavior: contain;
    /* 스크롤은 마우스 휠·화살표 키로 그대로 되지만, 막대는 안 보이게 함 - 클로드 채팅창처럼
       "스크롤 되는데 막대가 안 보이는" 조용한 느낌. (윈도우 크롬/엣지는 막대가 항상 두껍게
       보여서 특히 도움이 됨) */
    scrollbar-width: none;           /* Firefox */
    -ms-overflow-style: none;        /* 옛 엣지 */
  }
  body.compose-active .scroll-region::-webkit-scrollbar{ display: none; } /* 크롬·사파리·새 엣지 */

  /* 위로 스크롤할 때 문장이 화면 위 끝에서 뚝 잘리지 않고 옅게 흐려지며 사라지게 함
     (클로드 채팅창의 위쪽 페이드와 같은 느낌). 흐림 자체도 아래로 갈수록 옅어지게
     mask를 같이 써서 "흐릿함이 서서히 걷히는" 자연스러운 그라데이션을 만듦. */
  .compose-top-fade{
    display: none;
    position: fixed;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: min(700px, calc(100% - 40px));
    height: 56px;
    pointer-events: none;
    z-index: 64;
    background: var(--bg);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    mask-image: linear-gradient(to bottom, black 0%, transparent 100%);
    -webkit-mask-image: linear-gradient(to bottom, black 0%, transparent 100%);
  }
  body.compose-active .compose-top-fade{ display: block; }
  @media (pointer: coarse){ .compose-top-fade{ display: none !important; } }

  .compose-input-row{ display: flex; }

  /* 메모를 문장으로 옮기는 중에만 나타나는 줄. 입력줄 박스 "안"에 한 줄로 끼어들어서
     박스 크기 자체가 늘어나는 게 아니라, 박스 바깥(바로 위)에 따로 떠 있는 라벨임 -
     그래서 입력줄 박스는 메모를 켜고 끄고와 무관하게 항상 정확히 똑같은 모양을 유지함. */
  .compose-memo-row{
    display: none;
    position: absolute;
    left: 50%;
    bottom: 100%;
    margin-bottom: 10px;
    transform: translateX(-50%);
  }
  .compose-memo-row.show{ display: flex; }
  /* 페이지·키워드는 입력칸 placeholder에 직접 들어감(JS) - 입력칸 자체의 불투명한
     배경을 그대로 쓰니 뒤에 깔린 문장 때문에 안 보이는 문제 자체가 안 생김. 여기 뜨는 건
     그만두는 X 버튼 하나뿐 - 카테고리 색 원형 배경(90% 불투명)을 줘서 또렷하게 보이게 함. */
  .compose-memo-discard{
    display: flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    border: none;
    border-radius: 50%;
    background: color-mix(in srgb, var(--category-color) 90%, transparent);
    color: #FFFFFF;
    padding: 0;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .compose-memo-discard:hover{ transform: scale(1.08); }
  /* 눌러서 메모를 지울 때 그냥 뚝 사라지면 심심하니, 통통 튀며 뱅글 돌아 사라지는
     맛을 더함 - 다음 메모(또는 빈 상태)로 넘어가기 직전 짧게 재생됨 */
  @keyframes memoDiscardPop{
    0%{ transform: scale(1) rotate(0deg); opacity: 1; }
    35%{ transform: scale(1.35) rotate(90deg); opacity: 1; }
    100%{ transform: scale(0.2) rotate(200deg); opacity: 0; }
  }
  .compose-memo-discard.discarding{
    animation: memoDiscardPop 0.28s cubic-bezier(.4,0,.2,1) forwards;
  }
  /* 메모줄과 같은 자리·같은 방식으로 뜸(동시에 켜질 일은 없음 - 메모 처리 중엔 수정 못 열고,
     수정 중엔 메모 처리를 못 엶) */
  .compose-edit-row{
    display: none;
    position: absolute;
    left: 0;
    right: 0;
    bottom: 100%;
    margin-bottom: 10px;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 11.5px;
    color: var(--text-tertiary);
  }
  .compose-edit-row.show{ display: flex; }
  .compose-textarea{
    flex: 1;
    resize: none;
    border: none;
    background: none;
    font-family: 'Pretendard', sans-serif;
    font-size: 14.5px;
    line-height: 1.5;
    color: var(--text);
    padding: 6px 4px 10px;
    /* 문장이 이 정도로 길어질 일은 거의 없어서, 안에서 따로 스크롤되지 않고 그냥 계속
       위로 자라나게 둠(클로드 입력창과 같은 방식) - 스크롤바가 뜨면서 폭이 줄어드는
       느낌도 없어짐 */
    overflow-y: hidden;
  }
  .compose-textarea:focus{ outline: none; }

  .compose-status-row{
    display: flex;
    align-items: center;
    gap: 8px;
    padding-top: 9px;
    border-top: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .compose-cat-pill{
    display: flex;
    align-items: center;
    gap: 6px;
    border: none;
    background: var(--hover);
    border-radius: 999px;
    padding: 5px 11px 5px 9px;
    font-family: 'Pretendard', sans-serif;
    font-size: 12px;
    font-weight: 700;
    color: var(--text);
    cursor: pointer;
    flex-shrink: 0;
  }
  .compose-cat-pill:active{ transform: scale(0.96); }
  .compose-cat-dot{
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--category-color);
    flex-shrink: 0;
  }
  .compose-page-field{
    display: flex;
    align-items: center;
    gap: 2px;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 5px 11px;
    flex-shrink: 0;
  }
  .compose-page-hash{ font-size: 12px; color: var(--text-tertiary); }
  .compose-page-input{
    width: 42px;
    border: none;
    background: none;
    font-family: 'Pretendard', sans-serif;
    font-size: 12px;
    color: var(--text);
    padding: 0;
  }
  .compose-page-input:focus{ outline: none; }
  /* 출처·쪽수를 한 덩어리로 - 문장 목록에 보이는 "출처 · 47p" 표기와 똑같은 형식이라
     쪽수만 따로 두드러지지 않고, 출처와 같은 무게로 조용히 자리함 */
  .compose-meta-pill{
    border: none;
    background: none;
    color: var(--text-tertiary);
    font-family: 'Pretendard', sans-serif;
    font-size: 12px;
    padding: 5px 4px;
    cursor: pointer;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 260px;
  }
  .compose-meta-pill:hover{ color: var(--text); }
  .compose-meta-edit{
    display: none;
    position: relative;
    align-items: center;
    gap: 6px;
    flex: 1 1 160px;
    min-width: 140px;
  }
  .compose-meta-edit.show{ display: flex; }
  .compose-source-input{
    flex: 1;
    min-width: 0;
    border: 1px solid var(--category-color);
    border-radius: 999px;
    padding: 5px 12px;
    font-family: 'Pretendard', sans-serif;
    font-size: 12px;
    color: var(--text);
    background: var(--bg);
  }
  .compose-source-input:focus{ outline: none; }
  .compose-meta-edit .source-suggest{ bottom: calc(100% + 6px); top: auto; left: 0; }
  .compose-meta-edit .compose-page-field{ background: var(--bg); }

  .compose-send-btn{
    flex-shrink: 0;
    margin-left: auto;
    width: 30px; height: 30px;
    border: none;
    border-radius: 50%;
    background: var(--category-color);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .compose-send-btn:active{ transform: scale(0.94); }
  .compose-send-btn:disabled{ opacity: 0.5; cursor: default; }
  /* 화살표는 항상 고정 - 대신 "지금 눌러도 되는지"를 색으로만 알려줌.
     문장칸이 비어있으면(보낼 게 없으면) 회색으로 가라앉고, 뭔가 쓰면 카테고리 색으로
     돌아옴. 메모 시작은 이제 버튼이 아니라 말풍선(M 아이콘)이나 키보드 M이 담당함 -
     버튼 자체는 "보내기"라는 역할 하나로만 단순하게 둠. */
  body.compose-active.send-btn-empty .compose-send-btn{
    background: var(--border);
    color: var(--text-tertiary);
  }
  /* 폰에는 이 채팅줄 자체가 없음 - 폰의 편집 모드는 완전히 다른(메모) 화면이라 */
  @media (pointer: coarse){ .compose-bar{ display: none !important; } }

  /* 채팅줄이 뜬 상태에선 이 버튼(우하단 +/검색)이 할 일이 없음 - 문장 추가는 채팅줄이,
     하이라이트는 이제 별도의 플로팅 툴바(.highlight-float-btn)가 담당함. 그냥 완전히 숨김. */
  body.compose-active .add-quote-trigger-btn{
    opacity: 0;
    pointer-events: none;
  }

  /* ── 문장을 드래그로 선택하면 뜨는 플로팅 하이라이트 버튼 ──────
     선택 영역 바로 위(공간이 부족하면 아래)에 붙어서, "방금 선택한 것 = 이 버튼"이라는
     연결이 바로 보이게 함. 노션·미디엄 등에서 흔히 쓰는 텍스트 선택 툴바 패턴. */
  .highlight-float-btn{
    display: none;
    position: fixed;
    z-index: 85;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border: none;
    border-radius: 9px;
    background: #181818;
    color: var(--highlight-bg);
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(0,0,0,0.28);
    transform: translate(-50%, -100%);
    transition: transform 0.12s ease, background 0.12s ease;
  }
  /* 스르륵 튀어오르듯 나타나는 등장 애니메이션 - 살짝 작고 투명한 상태에서 시작해서
     원래 크기로 통통 튀며 자리 잡음. flip-down(아래로 뒤집힌 경우)은 튀어오르는 방향이
     반대라 각도(translateY)를 다르게 준 별도 keyframe을 씀. 이미 떠 있는 버튼이
     스크롤 등으로 위치만 재조정될 땐(show 클래스가 이미 붙어있어 다시 안 붙음)
     재생되지 않음 - 새로 나타날 때만 한 번. */
  @keyframes highlightBtnPopUp{
    0%{ transform: translate(-50%, calc(-100% + 6px)) scale(0.55); opacity: 0; }
    100%{ transform: translate(-50%, -100%) scale(1); opacity: 1; }
  }
  @keyframes highlightBtnPopDown{
    0%{ transform: translate(-50%, 6px) scale(0.55); opacity: 0; }
    100%{ transform: translate(-50%, 12px) scale(1); opacity: 1; }
  }
  .highlight-float-btn.show{
    display: flex;
    animation: highlightBtnPopUp 0.24s cubic-bezier(.34,1.56,.64,1);
  }
  .highlight-float-btn.show.flip-down{
    animation: highlightBtnPopDown 0.24s cubic-bezier(.34,1.56,.64,1);
  }
  .highlight-float-btn.cancel-mode{ color: #FF9E9E; }
  .highlight-float-btn::after{
    content: '';
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    border: 6px solid transparent;
    border-top-color: #181818;
  }
  /* 커서를 가져다 대면 살짝 커지고 밝아짐, 누르는 순간엔 반대로 살짝 눌려 작아짐 -
     두 상태가 서로 다른 피드백이라 "지금 뭘 하고 있는지"가 손끝으로 느껴짐 */
  .highlight-float-btn:hover{
    background: #2E2E2E;
    transform: translate(-50%, -100%) scale(1.12);
  }
  .highlight-float-btn:active{
    transform: translate(-50%, -100%) scale(0.86);
    transition: transform 0.06s ease; /* 눌리는 반응은 순간적이어야 손맛이 남 */
  }
  /* 선택 영역이 화면 맨 위쪽이라 위로 띄울 자리가 부족하면, 대신 아래로 뒤집음 */
  .highlight-float-btn.flip-down{
    transform: translate(-50%, 12px);
  }
  .highlight-float-btn.flip-down:hover{
    transform: translate(-50%, 12px) scale(1.12);
  }
  .highlight-float-btn.flip-down:active{
    transform: translate(-50%, 12px) scale(0.86);
  }
  .highlight-float-btn.flip-down::after{
    top: auto;
    bottom: 100%;
    border-top-color: transparent;
    border-bottom-color: #181818;
  }

  /* ── 하단 좌: 카테고리 세그먼트 탭 ──────────── */
  /* 판(.float-layer)이 JS로 정확히 "지금 보이는 화면"에 맞춰지므로, 그 안에서는
     absolute로 판의 바닥에 붙이기만 하면 됨 */
  /* [핵심] bottom이 아니라 top 기준으로 잡음 - 아래에서부터 재면 사파리 주소창이
     움직일 때마다 그 계산이 흔들리는데, 위에서부터 재면 전혀 영향을 안 받음.
     기준값 100svh는 "주소창이 다 펼쳐진, 가장 작은 화면 높이" - 이 높이를 기준으로
     삼으면 주소창이 나타나 화면이 줄어들어도 탭이 잘리지 않고, 주소창이 사라져
     화면이 커지면 탭이 그만큼 바닥에서 살짝 떠 보일 뿐 절대 요동치지 않음. */
  .category-tabs{
    position: absolute;
    left: 20px;
    top: calc(100vh - 66px - max(0px, env(safe-area-inset-bottom)));   /* svh를 모르는 옛 브라우저용 */
    top: calc(100svh - 66px - max(0px, env(safe-area-inset-bottom)));
    display: flex;
    gap: 2px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px;
    box-shadow: 0 4px 14px rgba(24,24,24,0.1);
    z-index: 70;
    max-width: calc(100vw - 90px);
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .category-tabs::-webkit-scrollbar{ display: none; }
  .category-tab-add{
    flex-shrink: 0;
    position: relative;
    z-index: 1;
    border: none;
    background: none;
    border-radius: 999px;
    width: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-tertiary);
    cursor: pointer;
  }
  .category-tab-add:hover{ color: var(--text-secondary); }
  /* 폰에는 카테고리 관리 진입로 자체가 없음(컴포즈바가 없어서) - 그러니 +도 안 둠.
     눌러도 아무 데도 못 가는 버튼을 보여줄 이유가 없고, 늘어선 탭 자리도 하나 아낌 */
  @media (pointer: coarse){ .category-tab-add{ display: none !important; } }

  /* ── 카테고리 관리 시트 ─────────────────────── */
  .category-picker-list{
    display: flex;
    flex-direction: column;
    gap: 2px;
    max-height: 50vh;
    overflow-y: auto;
    margin-bottom: 14px;
  }
  .category-picker-row{
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 6px;
    border-radius: 10px;
  }
  .category-picker-row:hover{ background: var(--hover); }
  .category-picker-dot{
    flex-shrink: 0;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: none;
    padding: 0;
    cursor: pointer;
  }
  .category-picker-dot:hover{ transform: scale(1.15); }
  /* 색 점을 누르면 그 아래로 펼쳐지는 12색 팔레트 */
  .category-picker-swatches{
    display: none;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
    padding: 10px 4px 4px 28px;
  }
  .category-picker-swatches.open{ display: grid; }
  .category-picker-swatch{
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 2px solid transparent;
    padding: 0;
    cursor: pointer;
  }
  .category-picker-swatch.selected{ border-color: var(--text); }
  .category-picker-name{
    flex: 1;
    min-width: 0;
    text-align: left;
    background: none;
    border: none;
    font-family: 'Pretendard', sans-serif;
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    padding: 0;
    cursor: pointer;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .category-picker-row.current .category-picker-name{ color: var(--category-color); }
  .category-picker-name-input{
    flex: 1;
    min-width: 0;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 8px;
    font-family: 'Pretendard', sans-serif;
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
  }
  .category-picker-icon-btn{
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border: none;
    border-radius: 50%;
    background: none;
    color: var(--text-tertiary);
    cursor: pointer;
  }
  .category-picker-icon-btn:hover{ background: var(--border); color: var(--text-secondary); }
  .category-picker-icon-btn.danger:hover{ color: var(--danger); }
  /* 폰에선 이 목록이 "고르기 전용"임 - 이름 바꾸기·삭제·색 바꾸기·새로 만들기는 전부
     컴퓨터에서만. 그래서 그 버튼들을 아예 안 보여줘서, 눌러도 안 되는 게 아니라
     처음부터 "여긴 그런 게 없다"고 명확하게 함. */
  @media (pointer: coarse){
    .category-picker-icon-btn,
    .category-picker-add-row{ display: none !important; }
    .category-picker-dot{ cursor: default; }
    .category-picker-dot:hover{ transform: none; }
  }
  .category-picker-add-row{
    display: flex;
    gap: 8px;
  }
  .category-picker-input{
    flex: 1;
    min-width: 0;
    height: 44px;
    box-sizing: border-box;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0 14px;
    font-family: 'Pretendard', sans-serif;
    font-size: 15px;
    color: var(--text);
    outline: none;
    background: var(--bg);
  }
  .category-picker-input:focus{ border-color: var(--category-color); }
  .category-picker-add-btn{
    flex-shrink: 0;
    height: 44px;
    padding: 0 18px;
    border: none;
    border-radius: 10px;
    background: var(--category-color);
    color: var(--text);
    font-family: 'Pretendard', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
  /* 탭 뒤에서 좌우로 슬라이드하는 필 - 애플 세그먼트 컨트롤 느낌 */
  .category-tab-indicator{
    position: absolute;
    top: 4px;
    bottom: 4px;
    left: 0;
    border-radius: 999px;
    background: var(--category-color);
    transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1), width 0.32s cubic-bezier(0.32, 0.72, 0, 1), background 0.25s ease;
    z-index: 0;
  }
  /* 마우스로 눌렀을 때 검은 테두리가 남지 않게 함 (키보드로 이동할 땐 그대로 보임) */
  .category-tab:focus:not(:focus-visible){ outline: none; }
  .category-tab{
    position: relative;
    z-index: 1;
    border: none;
    background: none;
    border-radius: 999px;
    padding: 9px 14px;
    font-family: 'Pretendard', sans-serif;
    font-size: 13.5px;
    font-weight: 700;
    color: var(--text-secondary);
    cursor: pointer;
    transition: color 0.2s ease;
  }
  .category-tab.active{
    color: var(--text);
  }
  /* 폰: 탭을 다 늘어놓지 않고 지금 카테고리 하나만 알약으로 보여줌 - 카테고리가
     몇 개든 화면 폭이 절대 안 늘어남. 나머지(관계·삶·사랑 등)는 옆으로 스와이프하거나,
     이 알약을 눌러서 뜨는 목록에서 바로 고르면 됨. */
  @media (pointer: coarse){
    .category-tabs{
      max-width: none;
      overflow-x: visible;
    }
    .category-tab:not(.active){ display: none; }
    .category-tab.active{
      padding-right: 28px; /* 아래 화살표 힌트가 글자와 안 붙게 */
    }
    /* "눌러서 펼치기"라는 걸 은은하게 알려주는 작은 화살표 */
    .category-tab.active::after{
      content: '';
      position: absolute;
      right: 12px;
      top: 50%;
      width: 6px;
      height: 6px;
      border-right: 1.6px solid var(--text-tertiary);
      border-bottom: 1.6px solid var(--text-tertiary);
      transform: translateY(-65%) rotate(45deg);
    }
  }

  /* ── 하단 우: + 버튼 ─────────────────────── */
  .add-quote-trigger-btn{
    position: absolute;
    right: 20px;
    top: calc(100vh - 68px - max(0px, env(safe-area-inset-bottom)));   /* svh를 모르는 옛 브라우저용 */
    top: calc(100svh - 68px - max(0px, env(safe-area-inset-bottom)));
    width: 48px; height: 48px;
    border-radius: 50%;
    border: none;
    background: var(--text);
    color: #FFFFFF;
    font-size: 22px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(24,24,24,0.22);
    z-index: 70;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .add-quote-trigger-btn:active{ transform: scale(0.94); }

  /* 형광펜 하이라이트 - 카테고리 색과 무관하게 항상 통일된 노랑 */
  .quote-highlight{
    background: var(--highlight-bg);
    padding: 1px 0;
    border-radius: 2px;
    cursor: pointer;
  }

  /* ── 확인 다이얼로그 ──────────────────────── */
  .modal-overlay{
    position: fixed;
    left: 0; right: 0;
    /* 화면 높이만큼 위아래로 더 덮어서 가장자리가 절대 드러나지 않게 함.
       vh는 아이폰 사파리에서 주소창 상태에 따라 실제 보이는 영역과 어긋날 수 있어서
       (그 값 그대로 위아래 상쇄시키는 트릭이라 어긋난 만큼 그대로 틈이 생김),
       실시간으로 반영되는 dvh로 확실하게 잡음. */
    top: -100vh;
    bottom: -100vh;
    top: -100dvh;
    bottom: -100dvh;
    background: rgba(31,35,40,0.32);
    display: none;
    align-items: center;
    justify-content: center;
    padding: calc(100vh + 20px) 20px;
    padding: calc(100dvh + 20px) 20px;
    z-index: 330;
  }
  .modal-overlay.open{ display: flex; }
  .modal-box{
    background: var(--surface);
    border-radius: 14px;
    width: 100%;
    max-width: 440px;
    box-shadow: 0 12px 32px rgba(31,35,40,0.16);
    animation: fadeIn 0.18s ease;
  }
  .confirm-box{
    max-width: 300px;
    padding: 26px 22px 20px;
  }
  .confirm-message{
    margin: 0 0 20px;
    font-size: 14px;
    line-height: 1.75;
    color: var(--text);
    text-align: center;
  }
  .spell-error-text{
    text-align: left;
    font-size: 12.5px;
    line-height: 1.6;
    color: var(--text-secondary);
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 50vh;
    overflow-y: auto;
  }
  .confirm-actions{ display:flex; gap: 8px; }
  .confirm-btn{
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 0;
    font-family: 'Pretendard', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    background: var(--surface);
  }
  .confirm-cancel{ color: var(--text-secondary); }
  .confirm-cancel:hover{ background: var(--hover); }
  .confirm-ok{ color: var(--danger); border-color: var(--danger-soft); background: var(--danger-soft); }
  .confirm-ok:hover{ background: #EBDAD6; }

  @keyframes fadeIn{
    from{ opacity: 0; transform: translateY(2px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  /* ── 중앙 Dialog 공통 ──────────────────────── */
  .sheet-overlay{
    position: fixed;
    left: 0; right: 0;
    /* 어두운 배경은 화면보다 위아래로 넉넉히 넘치게 깔아서 어떤 경우에도 틈이 안 생기게 함.
       (보이는 영역에 딱 맞추려 하면 iOS의 화면 밀림·주소창 접힘 때문에 조금씩 어긋나
        중간에 흰 띠가 생겼음). vh는 주소창 상태에 따라 실제 화면과 어긋날 수 있어
        (위아래를 vh로 상쇄하는 트릭이라 그 어긋난 만큼 그대로 틈이 됨), 실시간으로
        반영되는 dvh로 확실하게 잡음. */
    top: -100vh;
    bottom: -100vh;
    top: -100dvh;
    bottom: -100dvh;
    /* 창은 여백을 줘서 "실제로 보이는 영역" 안에 놓이도록 함 */
    padding: calc(100vh + var(--vv-pad-top, 0px)) 16px calc(100vh + var(--vv-pad-bottom, 0px));
    padding: calc(100dvh + var(--vv-pad-top, 0px)) 16px calc(100dvh + var(--vv-pad-bottom, 0px));
    background: rgba(24,24,24,0.28);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 310;
    /* 키보드가 오르내릴 때 창이 부드럽게 따라가도록 */
    transition: padding 0.25s cubic-bezier(0.32, 0.72, 0, 1);
  }
  .sheet-overlay.open{ display: flex; }
  /* 편집 모드 들어가는 첫 화면(비밀번호 입력)은 뒤에 흐릿하게 비치는 내용이 딱히
     의미가 없어서, 다른 창(검색·수정·코멘트)과 달리 어둡게 흐리지 않고 그냥
     깨끗한 배경 하나로 둠. */
  #passcodeOverlay{
    background: var(--bg);
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
  }
  .bottom-sheet{
    width: 100%;
    max-width: 480px;
    height: auto;
    /* 부모(오버레이)의 남은 공간을 넘지 않도록. 키보드가 올라오면 그만큼 자동으로 줄어듦 */
    max-height: min(100%, 82vh, 720px);   /* dvh를 모르는 옛 브라우저용 */
    max-height: min(100%, 82dvh, 720px);
    background: var(--surface);
    border-radius: 20px;
    box-shadow: 0 20px 50px rgba(24,24,24,0.18);
    opacity: 0;
    transform: scale(0.97) translateY(4px);
    transition: opacity 0.2s ease, transform 0.2s ease;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }
  .sheet-overlay.open .bottom-sheet{
    opacity: 1;
    transform: scale(1) translateY(0);
  }
  /* 문장 추가 · 검색 팝업은 다른 시트(수정/코멘트)보다 살짝 더 또렷하게 등장함.
     처음엔 통통 튀는 스프링으로 했다가 정신없다는 피드백을 받아서, 오버슈트 없이
     한 방향으로만 자리 잡는 차분한 방식으로 바꿈. */
  /* 키보드를 내리면 쓸 수 있는 높이가 갑자기 늘어나는데, 그대로 두면 창이 "뚝" 하고 커짐.
     높이 변화를 부드럽게 이어줌. */
  #searchSheetOverlay .bottom-sheet{
    transition: max-height 0.28s cubic-bezier(0.32, 0.72, 0, 1);
  }
  @keyframes sheetPopIn{
    0%{ opacity: 0; transform: scale(0.92) translateY(10px); }
    100%{ opacity: 1; transform: scale(1) translateY(0); }
  }
  #searchSheetOverlay.open .bottom-sheet{
    animation: sheetPopIn 0.26s cubic-bezier(.2,.7,.3,1);
  }
  .sheet-title{
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    margin: 0 0 14px;
  }
  .sheet-body{
    position: relative;
    padding: 22px;
    overflow-y: auto;
    overscroll-behavior: contain;
  }

  /* [1] 출처: 입력칸을 포커스하면 최근 사용한 출처가 바로 아래 드롭다운으로 나타남 */
  .source-suggest{
    display: none;
    position: absolute;
    top: calc(100% - 8px);
    left: 0; right: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 10px 24px rgba(24,24,24,0.14);
    z-index: 5;
    overflow: hidden;
  }
  .source-suggest.open{ display: block; }
  .source-suggest-item{
    display: block;
    width: 100%;
    text-align: left;
    padding: 12px 14px;
    background: none;
    border: none;
    border-bottom: 1px solid var(--border);
    font-family: 'Pretendard', sans-serif;
    font-size: 14px;
    color: var(--text);
    cursor: pointer;
  }
  .source-suggest-item:last-child{ border-bottom: none; }
  .source-suggest-item:active{ background: var(--hover); }
  .source-suggest-item.highlighted{ background: var(--hover); }

  .quote-textarea{
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    font-family: 'Pretendard', sans-serif;
    font-size: 16px;
    line-height: 1.65;
    color: var(--text);
    outline: none;
    margin-bottom: 12px;
    background: var(--bg);
    resize: none;
  }
  .quote-textarea:focus{ border-color: var(--category-color); }
  .quote-textarea::placeholder{ color: var(--text-tertiary); }

  .cta-btn{
    pointer-events: auto;
    border: none;
    border-radius: 999px;
    font-family: 'Pretendard', sans-serif;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  }
  .cta-primary{
    background: var(--category-color);
    color: var(--text);
    font-size: 14px;
    font-weight: 700;
    padding: 14px 26px;
    box-shadow: 0 3px 10px rgba(24,24,24,0.16);
  }
  .cta-primary:hover{ box-shadow: 0 4px 13px rgba(24,24,24,0.2); }
  .cta-btn:active{ transform: scale(0.96); }
  .add-book-submit{
    width: 100%;
    margin-top: 6px;
    padding: 13px 0;
  }
  .add-book-submit:disabled{ opacity: 0.5; cursor: default; }

  .status-msg{
    font-size: 12px;
    color: var(--text-secondary);
    min-height: 0;
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    transition: opacity 0.3s ease, max-height 0.3s ease, margin 0.3s ease;
  }
  .status-msg.show{
    opacity: 1;
    max-height: 30px;
    margin-top: 8px;
    margin-bottom: 8px;
  }
  .status-msg.error{ color: var(--danger); }

  /* ── 저장 완료 토스트 ─────────────────────── */
  /* 예전엔 .float-layer(높이가 dvh로 계속 재계산되는 판) 안에 absolute로 들어있었음.
     그 판 자체의 높이가 스크롤 중 흔들릴 때 사파리가 그 안의 요소까지 다시 그리면서
     같이 흔들려 보였던 것 같음 - 그래서 아예 그 판에 안 얹히게, 독립된 자기만의
     고정 위치를 가지게 함. top 값이 화면 크기 계산과 전혀 무관한 상수라 이제 절대
     안 움직임(사용자 요청대로 "그냥 딱 그 위치에 고정"). */
  .toast{
    position: fixed;
    top: max(20px, env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%) translateY(-6px);
    background: var(--category-color);
    color: var(--text);
    font-size: 12.5px;
    font-weight: 600;
    padding: 9px 18px;
    border-radius: 999px;
    box-shadow: 0 6px 18px rgba(24,24,24,0.2);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 400;
    white-space: nowrap;
  }
  .toast.show{
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ── 문장 ··· 액션 (아이폰 기본 선택 버튼/액션시트 스타일) ──── */
  .ios-sheet-backdrop{
    display: none;
    position: fixed;
    left: 0; right: 0;
    top: -100vh;
    bottom: -100vh;
    top: -100dvh;
    bottom: -100dvh;
    background: rgba(24,24,24,0.32);
    z-index: 96;
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  .ios-sheet-backdrop.open{ display: block; opacity: 1; }
  .ios-action-sheet{
    position: fixed;
    left: 12px; right: 12px;
    bottom: max(12px, env(safe-area-inset-bottom));
    z-index: 97;
    display: flex;
    flex-direction: column;
    gap: 8px;
    /* 아래에서 올라오는 애니메이션과, 주소창에 맞춘 위치 보정을 함께 적용 */
    transform: translateY(100%);
    opacity: 0;
    transition: transform 0.22s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.2s ease;
    pointer-events: none;
  }
  .ios-action-sheet.open{
    transform: translateY(0);
    opacity: 1;
    pointer-events: auto;
  }
  .ios-action-group{
    background: var(--surface);
    border-radius: 14px;
    overflow: hidden;
  }
  .ios-action-item{
    display: block;
    width: 100%;
    padding: 16px;
    background: none;
    border: none;
    border-bottom: 1px solid var(--border);
    font-family: 'Pretendard', sans-serif;
    font-size: 16px;
    color: var(--text);
    text-align: center;
    cursor: pointer;
  }
  .ios-action-item:last-child{ border-bottom: none; }
  .ios-action-item:active{ background: var(--hover); }
  .ios-action-item.danger{ color: var(--danger); }
  .ios-action-item.cancel{ font-weight: 700; }




  /* iOS Safari는 input/textarea의 font-size가 16px 미만이면 포커스 시 화면을 자동으로 확대함.
     margin-bottom을 12px로 잡은 입력 필드들 폰트는 14~15.5px라 확대가 걸릴 수 있어
     16px 미만 필드는 아래에서 별도로 보정함(선택 사항, 현재는 유지). */
  /* ── 폰에서는 가운데 뜨는 팝업 대신 화면 전체를 덮는 새 창으로 ──────────
     팝업 방식은 화면 가장자리에 여백이 생기는 문제가 계속 있었는데,
     화면을 통째로 덮으면 그럴 일이 아예 없음. 아래에서 위로 올라옴. */
  @media (pointer: coarse){
    .sheet-overlay{
      background: var(--bg);
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      align-items: stretch;
      justify-content: stretch;
      padding: 100vh 0;      /* dvh를 모르는 옛 브라우저용 */
      padding: 100dvh 0;    /* 위아래로 넉넉히 덮은 만큼 되돌려서 창을 화면에 맞춤 -
                               위(top/bottom)와 반드시 같은 단위(dvh)로 맞춰야 정확히 상쇄됨 */
      overscroll-behavior: contain; /* 창 안에서 끝까지 스크롤해도 뒤 화면이 따라 움직이지 않게 함 */
    }
    .sheet-overlay .bottom-sheet{
      /* 창 배경(#FCFCFC)과 바깥 배경(#FFFFFF)이 미세하게 달라서 경계가 회색 띠로 보였음.
         전체화면일 땐 같은 색으로 맞춰서 경계가 아예 안 보이게 함. */
      background: var(--bg);
      width: 100%;
      max-width: none;
      /* 평소에는 화면을 꽉 채우고(100%), 키보드가 실제로 올라왔을 때만 그 위 공간으로 줄어듦.
         예전엔 항상 "보이는 높이"를 썼는데, 아이폰은 주소창이 펴져 있으면 그 값이
         화면보다 90px쯤 작게 나와서 창이 팝업처럼 작아져 보였음. */
      height: var(--kb-fit-h, 100%);
      max-height: none;
      border-radius: 0;
      box-shadow: none;
      animation: none;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1),
                  height 0.25s cubic-bezier(0.32, 0.72, 0, 1);
      opacity: 1;
      overflow-y: auto;
      overscroll-behavior: contain;
    }
    .sheet-overlay.open .bottom-sheet{
      animation: none;
      transform: translateY(0);
      opacity: 1;
    }
    /* 저장 버튼을 화면에 계속 붙여두려 했더니, 오히려 빈 공간이 남는 문제가 생겼음.
       그냥 창 전체가 한 덩어리로 스크롤되고, 버튼은 마지막 칸 다음(기본 화면 맨 아래)에
       자연스럽게 놓이도록 단순화함. 입력 중엔 다른 필드처럼 스크롤해서 찾으면 됨. */
    .sheet-overlay .sheet-body{ padding: 26px 22px 20px; }
    /* 비밀번호 창은 내용이 짧아서(자물쇠·제목·점 몇 개뿐), 다른 창처럼 위에서부터 채우면
       내용은 위쪽에 몰려있고 그 아래로 빈 공간만 잔뜩 남아 "너무 위에 붙어있다"는 느낌을 줌.
       이 창만 세로로 가운데 오게 함. */
    #passcodeOverlay .sheet-body{
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .sheet-close-btn{ top: 22px; right: 18px; width: 34px; height: 34px; }
    .sheet-title{ font-size: 17px; margin-bottom: 20px; }
  }


</style>
</head>
<body>

<div class="splash-overlay" id="splashOverlay">
  <div class="splash-wordmark">
    <span class="splash-wordmark-dot"></span>
    <span>soooo.zip</span>
  </div>
</div>

<!-- 컴퓨터 편집 모드 전용: 실제 스크롤은 이 판(화면 전체 폭)이 담당함.
     .wrap은 안에서 700px로 좁게 배치만 될 뿐이라, 그 옆 여백에 마우스가 있어도
     휠을 굴리면 이 판이 반응해서 목록이 움직임. -->
<div class="scroll-region" id="scrollRegion">
<div class="wrap">
  <div class="archive-header">
    <!-- 로고 이미지 대신 텍스트 워드마크로 - "이게 뭐하는 앱인지" 바로 읽히고,
         브랜드 색은 작은 점 하나로만 흔적을 남김(과하지 않게). 파비콘·스플래시는
         여전히 원래 이미지 로고를 씀(브라우저 탭·첫 로딩 화면은 아이콘이 나음). -->
    <button type="button" class="wordmark" id="wordmark" title="편집 모드로">
      <span class="wordmark-dot"></span>
      <span class="wordmark-text">soooo.zip</span>
      <!-- 평소엔 완전히 안 보이다가, 서버 재시도를 기다리는 동안에만 아주 작게 나타남 -->
      <span class="sync-pending-dot" id="syncDot" title="아직 서버에 반영 안 됨 - 곧 다시 시도해요"></span>
    </button>
    <!-- 톱니바퀴는 편집 모드에서만 뜸(가끔 쓰는 기능들 - 보기 모드로/맞춤법/내보내기/가져오기) -->
    <button type="button" class="settings-gear-btn" id="settingsGearBtn" title="설정">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>
  <div class="archive-list" id="archiveList"></div>
  <!-- 이제 목록 맨 아래가 아니라 로고 메뉴에서 실행됨 - 이 버튼은 화면엔 안 보이지만,
       runSpellCheck()가 진행 상황(몇 번째 묶음 점검 중 등)을 여기 textContent로
       계속 기록해두는 용도로 그대로 남겨둠(로직을 안 바꾸려고). -->
  <button type="button" class="spell-check-trigger" id="spellCheckBtn" style="display:none">맞춤법 확인하기</button>
</div>
</div>

<!-- 떠 있는 요소들을 한 판 위에 모아둠. 판의 높이가 "실제로 보이는 화면 높이"라
     주소창이 접히고 펴지는 걸 브라우저가 알아서 반영해줌 (JavaScript 계산 없음). -->
<div class="float-layer">
  <div class="category-tabs" id="categoryTabs">
    <div class="category-tab-indicator" id="categoryTabIndicator"></div>
    <!-- 탭들은 renderCategoryTabs()가 categories 배열을 기준으로 매번 다시 그림 -->
  </div>
  <button type="button" class="add-quote-trigger-btn" id="addQuoteTriggerBtn" title="문장 남기기">+</button>
  <div class="toast" id="toastMsg"></div>
  <!-- 문장을 드래그로 선택하면(PC 편집 모드) 그 선택 영역 바로 위에 뜨는 작은 툴바 -
       예전엔 우하단 + 버튼이 이 역할까지 겸했는데, 화면 가장자리에 고정이라 "방금
       선택한 것과 이 버튼이 무슨 상관이지" 싶게 동떨어져 보였음. 노션·미디엄처럼
       선택한 바로 그 자리 위에 뜨게 바꿔서, 선택과 액션이 시각적으로 바로 이어지게 함. -->
  <button type="button" class="highlight-float-btn" id="highlightFloatBtn" title="하이라이트">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 11-6 6v3h9l3-3"/><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/></svg>

<script>
// 스플래시가 뜨는 바로 이 순간, 실제로 보이는 화면 높이를 즉시 재서 강제로 못박음 -
// CSS의 100dvh는 이론상 "지금 실제 보이는 영역"을 실시간 반영해야 하는데, 사파리는
// 페이지가 막 열려서 주소창이 아직 다 펼쳐진 바로 그 첫 순간엔 이 계산이 덜 끝나서
// 실제보다 크게(주소창 자리까지 포함해서) 잡을 때가 있음(알려진 사파리 특성) - 그러면
// 스플래시 배경이 화면 아래쪽(주소창 바로 위)에서 살짝 못 미쳐서 그 틈으로 뒤 콘텐츠가
// 비쳐 보임("주소창 부분이 잘린다"는 게 이거). visualViewport.height는 이 이른 시점에도
// 더 안정적으로 "지금 진짜 보이는 영역"을 주므로, 다른 무거운 초기화보다도 먼저 여기서
// 곧바로 적용함(최대한 이른 시점이어야 잘리는 순간 자체가 안 생김).
(function pinSplashHeight(){
  const splash = document.getElementById('splashOverlay');
  if(!splash || !window.visualViewport) return;
  const vv = window.visualViewport;
  // 높이만이 아니라 "화면 위쪽 기준점"까지 같이 맞춰야 함 - 사파리에서 주소창이 걸쳐
  // 있는 동안엔 fixed의 top:0이 실제 보이는 화면의 맨 위와 어긋나서, 스플래시가 위아래
  // 양쪽으로 조금씩 못 미치고 그 틈으로 뒤 콘텐츠가 비쳐 보였음(첫 화면 캡처로 확인).
  const apply = () => {
    // 사라지는 애니메이션(.hide)이 시작되면 손을 뗌 - 그 애니메이션도 transform을 쓰기
    // 때문에, 여기서 계속 덮어쓰면 서로 밀치면서 튀어 보임
    if(splash.classList.contains('hide')) return;
    splash.style.transform = 'translateY(' + Math.round(vv.offsetTop) + 'px)';
    splash.style.height = Math.round(vv.height) + 'px';
  };
  apply();
  vv.addEventListener('resize', apply);
  vv.addEventListener('scroll', apply);
})();

const UNCATEGORIZED = '미분류';
// 새 카테고리를 만들 때 순서대로 배정되는 옅은 톤 팔레트 - 색 고르기 고민을 안 만들려고.
// 이미 쓰는 색은 건너뛰고, 다 겹치면 처음으로 돌아가 순환함.
const CATEGORY_PALETTE = ['#7FD8F0', '#FFAB91', '#C6F24E', '#FF9EC4', '#B8A6E0', '#FFD180', '#8FE0C4', '#F0A6A6', '#A0C4FF', '#FFE066', '#D9A6D9', '#9FD8D3'];
function categoryNames(){ return categories.map(c => c.name); }
function getCategoryColor(name){
  if(name === UNCATEGORIZED) return '#B0B0B0';
  const cat = categories.find(c => c.name === name);
  return cat ? cat.color : CATEGORY_PALETTE[0];
}
function nextPaletteColor(){
  const used = categories.map(c => c.color);
  const free = CATEGORY_PALETTE.find(c => !used.includes(c));
  return free || CATEGORY_PALETTE[categories.length % CATEGORY_PALETTE.length];
}

// 스포트라이트 배경은 계산식(color-mix)으로 뽑으면 "일"처럼 파란 계열이 회색빛으로 읽힘.
// 흰 배경 위에서 파랑은 눈에 색으로 안 잡히고, 주황·분홍·연두는 같은 농도여도 색이 느껴짐.
// 그래서 기본 4개는 눈으로 확인한 값을 직접 넣어두고, 새로 만든 카테고리만 계산식을 씀
// (직접 고르지 않은 색이라 완벽히 안 맞을 순 있지만, 매번 손으로 튜닝할 순 없으니 절충함).
const SPOTLIGHT_TINTS = {
  '일': '#EEFAFD',   // 파랑을 꽉 채우면 남보라로 읽혀서, 초록을 올려 하늘색 쪽으로 잡음
  '관계': '#FFF9F7',
  '삶': '#FBFEF3',
  '사랑': '#FFF8FB'
};
function applyCategoryColorFor(cat){
  const color = getCategoryColor(cat);
  document.documentElement.style.setProperty('--category-color', color);
  const tint = SPOTLIGHT_TINTS[cat] || `color-mix(in srgb, ${color} 8%, white)`;
  document.documentElement.style.setProperty('--spotlight-tint', tint);
}

// 겹치거나 인접한 구간을 하나로 합쳐서, 항상 정렬되고 겹치지 않는 배열로 유지함.
// 이렇게 저장해두면 화면에 그려지는 <mark> 개수와 실제 저장된 구간 개수가 항상 1:1로 맞아서,
// "이 마크를 탭하면 지운다"를 인덱스로 안전하게 매칭할 수 있음.
function mergeHighlights(list){
  const sorted = [...list].sort((a, b) => a.start - b.start);
  const merged = [];
  sorted.forEach(h => {
    const last = merged[merged.length - 1];
    if(last && h.start <= last.end){
      last.end = Math.max(last.end, h.end);
    } else {
      merged.push({ start: h.start, end: h.end });
    }
  });
  return merged;
}

// 하이라이트 버튼을 다시 누르면 취소되도록 하는 토글 로직.
// 선택한 구간이 기존 하이라이트와 조금이라도 겹치면, 그 겹치는 부분만 정확히 빼냄
// (겹치는 하이라이트가 딱 그 구간이면 통째로 사라지고, 일부만 겹치면 안 겹치는 조각만 남음).
// 전혀 안 겹치면 새 하이라이트로 추가함.
// 문장을 고쳐 쓴 뒤에도 하이라이트를 최대한 지켜줌.
// 예전엔 글자가 한 자라도 바뀌면 하이라이트를 전부 지워버렸는데(위치가 어긋나니까),
// 실제로는 오타 하나 고치거나 앞뒤를 조금 다듬는 경우가 대부분이라 칠해둔 부분은
// 그대로 남아있는 때가 많음 - 그걸 통째로 날려버리니 "하이라이트가 사라진다"는 문제가 됐음.
// 그래서 칠해져 있던 글자들을 새 문장에서 다시 찾아, 찾아지면 그 위치로 옮겨줌.
// 못 찾으면(그 부분이 실제로 지워졌거나 많이 바뀐 경우) 그 하이라이트만 조용히 버림.
function remapHighlights(oldText, newText, highlights){
  if(!Array.isArray(highlights) || !highlights.length) return [];
  const used = []; // 이미 가져다 쓴 구간 - 같은 단어가 여러 번 나올 때 겹쳐 잡지 않게
  const remapped = [];

  highlights.forEach(h => {
    const piece = oldText.slice(h.start, h.end);
    if(!piece) return;

    // 앞에서부터 찾되, 이미 다른 하이라이트가 차지한 자리는 건너뜀
    let from = 0;
    while(true){
      const idx = newText.indexOf(piece, from);
      if(idx === -1) return; // 새 문장에 그 부분이 아예 없음 → 이 하이라이트는 버림
      const end = idx + piece.length;
      const overlaps = used.some(u => idx < u.end && end > u.start);
      if(!overlaps){
        remapped.push({ start: idx, end });
        used.push({ start: idx, end });
        return;
      }
      from = idx + 1;
    }
  });

  return remapped.sort((a, b) => a.start - b.start);
}

function toggleHighlightRange(existing, range){
  const overlapping = existing.some(h => range.start < h.end && range.end > h.start);
  if(!overlapping){
    return mergeHighlights([...existing, range]);
  }
  const result = [];
  existing.forEach(h => {
    if(range.end <= h.start || range.start >= h.end){
      result.push(h); // 안 겹치는 기존 구간은 그대로 유지
      return;
    }
    if(h.start < range.start) result.push({ start: h.start, end: range.start });
    if(h.end > range.end) result.push({ start: range.end, end: h.end });
  });
  return mergeHighlights(result);
}

// 문장 텍스트를 하이라이트 구간에 따라 <mark>로 감싸서 HTML로 만듦.
// 하이라이트가 아닌 부분은 그대로 escapeHtml 처리함.
function renderHighlightedText(text, highlights){
  if(!highlights || highlights.length === 0) return escapeHtml(text);
  let result = '';
  let cursor = 0;
  highlights.forEach((h, i) => {
    const start = Math.max(0, Math.min(h.start, text.length));
    const end = Math.max(0, Math.min(h.end, text.length));
    if(start > cursor) result += escapeHtml(text.slice(cursor, start));
    if(end > start) result += `<mark class="quote-highlight" data-hidx="${i}">${escapeHtml(text.slice(start, end))}</mark>`;
    cursor = Math.max(cursor, end);
  });
  if(cursor < text.length) result += escapeHtml(text.slice(cursor));
  return result;
}

// 드래그로 선택한 영역(range)의 시작/끝이, 문장 컨테이너 기준으로 순수 텍스트에서
// 몇 번째 글자에 해당하는지 계산함. 이미 <mark>가 섞여 있어도 정확히 셀 수 있도록
// 컨테이너의 자식 노드를 순서대로 훑으면서 글자 수를 누적함.
function getTextOffset(container, targetNode, targetOffset){
  let charCount = 0;
  let found = false;
  function walk(el){
    for(const child of el.childNodes){
      if(found) return;
      if(child === targetNode){
        charCount += targetOffset;
        found = true;
        return;
      }
      if(child.nodeType === Node.TEXT_NODE){
        charCount += child.textContent.length;
      } else if(child.nodeType === Node.ELEMENT_NODE){
        walk(child);
      }
    }
  }
  walk(container);
  return charCount;
}

// 추가된 지 12시간 안쪽인지 확인 (수정 시에는 ts를 안 건드리므로, 순수하게 "새로 추가됨"만 반영함)
function isRecentlyAdded(ts){
  return !!ts && (Date.now() - ts) < (12 * 60 * 60 * 1000);
}
// 고쳐 쓴 지 24시간 안쪽인지 확인 - 새로 추가된 것(NEW)과는 다른 표시를 붙이기 위함.
// 방금 추가한 문장을 바로 고친 경우엔 NEW가 우선이라 EDIT은 안 붙임(둘 다 붙으면 지저분함).
function isRecentlyEdited(s){
  if(!s || !s.editedAt) return false;
  if(isRecentlyAdded(s.ts)) return false;
  return (Date.now() - s.editedAt) < (24 * 60 * 60 * 1000);
}
