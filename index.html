// ── 보관함(카테고리별 문장 목록) 렌더링 ──────────
// 문장을 추가/삭제할 때 목록이 갑자기 훅 바뀌지 않고 한 박자 부드럽게 이어지도록 하는
// 짧은 연출 두 가지. renderArchive()가 innerHTML을 통째로 다시 그리는 방식이라, "생겨난 것"과
// "사라질 것"을 미리 표시해두는 식으로 씀 - 렌더링 로직 자체는 건드리지 않고 그 앞뒤에서만 처리함.
// 방금 담은 문장이 자리를 만들며 펼쳐지듯 나타남 - 지울 때 "접히는" 것과 정확히
// 짝이 되는 움직임이라, 담고 지우는 동작이 한 쌍으로 느껴짐.
// 높이를 CSS만으로는 0에서 제 높이로 부드럽게 늘릴 수 없어서(auto로는 전환이 안 걸림),
// 실제 높이를 재서 그 값으로 옮겨준 뒤 다 끝나면 원래대로 돌려놓음.
function flashNewlyAdded(id){
  requestAnimationFrame(() => {
    const el = archiveList.querySelector(`.quote-block[data-id="${id}"]`);
    if(!el) return;

    const targetHeight = el.offsetHeight;
    const cs = getComputedStyle(el);
    const padTop = cs.paddingTop;
    const padBottom = cs.paddingBottom;

    // 시작 상태: 높이 0, 여백 0, 투명 - 아직 자리를 차지하지 않은 모습
    el.style.overflow = 'hidden';
    el.style.height = '0px';
    el.style.paddingTop = '0px';
    el.style.paddingBottom = '0px';
    el.style.opacity = '0';
    el.style.transform = 'translateY(4px)';

    // 다음 프레임에 제 크기로 펼침 (같은 프레임에 바꾸면 전환이 안 걸림)
    requestAnimationFrame(() => {
      el.style.transition = 'height 0.3s cubic-bezier(.22,1,.36,1), padding 0.3s cubic-bezier(.22,1,.36,1), opacity 0.26s ease 0.04s, transform 0.3s cubic-bezier(.22,1,.36,1)';
      el.style.height = targetHeight + 'px';
      el.style.paddingTop = padTop;
      el.style.paddingBottom = padBottom;
      el.style.opacity = '1';
      el.style.transform = 'translateY(0)';

      const cleanup = () => {
        // 인라인으로 박아둔 값들을 모두 지워서, 이후엔 원래 CSS대로 자연스럽게 동작하게 함
        el.style.transition = '';
        el.style.height = '';
        el.style.paddingTop = '';
        el.style.paddingBottom = '';
        el.style.opacity = '';
        el.style.transform = '';
        el.style.overflow = '';
      };
      el.addEventListener('transitionend', cleanup, { once: true });
      setTimeout(cleanup, 500); // 혹시 transitionend가 안 와도 확실히 정리되도록
    });
  });
}
// 지우기로 결정된 문장이 그 자리에서 옅어지며 접히는 걸 먼저 보여준 뒤에 실제로 지움
function playRemoveAnimation(el){
  return new Promise(resolve => {
    if(!el){ resolve(); return; }
    const h = el.getBoundingClientRect().height;
    el.style.height = h + 'px'; // 트랜지션이 걸리려면 시작값이 숫자로 고정돼 있어야 함
    void el.offsetHeight; // 강제로 한 번 그리게 해서, 바로 다음 줄의 변화가 트랜지션으로 이어지게 함
    el.classList.add('quote-removing');
    requestAnimationFrame(() => { el.style.height = '0px'; });
    setTimeout(resolve, 240);
  });
}

function renderArchive(){
  applyCategoryColor();
  renderCategoryTabs();

  const fullList = sentences.filter(s => s.category === currentCategory);

  if(fullList.length === 0){
    archiveList.innerHTML = `
      <div class="empty">
        <div class="empty-title">아직 남긴 문장이 없습니다.</div>
      </div>`;
    setupSeenTracking();
    return;
  }

  const spotlight = pickSpotlight(fullList);
  const withoutSpotlight = fullList.filter(s => !spotlight || s.id !== spotlight.id);

  // NEW 표시가 붙어있는(12시간 이내 추가된) 문장은 스포트라이트 바로 아래에 최신순으로 모아두고,
  // 나머지만 랜덤 셔플함. NEW 표시가 사라지면(12시간 지나면) 자연스럽게 셔플 그룹으로 옮겨감.
  const newOnes = withoutSpotlight
    .filter(s => isRecentlyAdded(s.ts))
    .sort((a, b) => (b.ts || 0) - (a.ts || 0));
  // 방금 고친 문장(EDIT)은 반대로 맨 아래에 모아둠 - 이미 한 번 본 문장이라
  // 위쪽의 "오늘 처음 만나는 문장" 자리를 차지하지 않게 하되, 어디 있는지는 찾기 쉽게.
  const editedOnes = withoutSpotlight
    .filter(s => !isRecentlyAdded(s.ts) && isRecentlyEdited(s))
    .sort((a, b) => (b.editedAt || 0) - (a.editedAt || 0));
  const others = withoutSpotlight.filter(s => !isRecentlyAdded(s.ts) && !isRecentlyEdited(s));

  const rest = getShuffledRest(others);
  const finalList = spotlight
    ? [spotlight, ...newOnes, ...rest, ...editedOnes]
    : [...newOnes, ...rest, ...editedOnes];

  archiveList.innerHTML = finalList.map(s => {
    const metaParts = [];
    if(s.source) metaParts.push(escapeHtml(s.source));
    if(s.ref) metaParts.push(escapeHtml(s.ref));
    const metaLine = metaParts.join(' · ');
    const bookmarkHtml = s.important ? `<span class="quote-bookmark" title="즐겨찾기">${BOOKMARK_SVG}</span>` : '';
    const newBadgeHtml = isRecentlyAdded(s.ts) ? `<span class="quote-new-badge">NEW</span>` : '';
    const editBadgeHtml = isRecentlyEdited(s) ? `<span class="quote-edit-badge">EDIT</span>` : '';
    const showMetaRow = metaLine || s.important || newBadgeHtml || editBadgeHtml;
    const isSpotlight = spotlight && s.id === spotlight.id;
    const spotlightLabelHtml = isSpotlight ? `<div class="spotlight-label">${escapeHtml(currentSpotlightMessage)}</div>` : '';
    return `
      <div class="quote-block${isSpotlight ? ' spotlight-card' : ''}" data-id="${s.id}">
        ${spotlightLabelHtml}
        <p class="quote-text">${renderHighlightedText(s.text, s.highlights)}</p>
        ${s.comment ? `<div class="quote-comment"><span class="quote-comment-mark"></span><span class="quote-comment-text">${escapeHtml(s.comment)}</span></div>` : ''}
        ${showMetaRow ? `<div class="quote-meta-line">${bookmarkHtml}${newBadgeHtml}${editBadgeHtml}${metaLine ? `<span>${metaLine}</span>` : ''}</div>` : ''}
      </div>
    `;
  }).join('');

  setupSeenTracking();
}

// ── "봤다" 추적: 화면에 5초 이상 실제로 보였을 때만 기록 ────────
// (그냥 리스트에 뜨기만 해도 "봤다"고 치면, 스크롤 안 하고 지나친 것까지 다 봤다고 착각하게 됨)
let seenObserver = null;
let seenTimers = new Map(); // element -> timeout id
let seenSaveDebounceTimer = null;

function scheduleSeenSave(){
  clearTimeout(seenSaveDebounceTimer);
  seenSaveDebounceTimer = setTimeout(() => { saveAll(); }, 2000);
}

function setupSeenTracking(){
  if(seenObserver) seenObserver.disconnect();
  seenTimers.forEach(t => clearTimeout(t));
  seenTimers.clear();

  seenObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if(entry.isIntersecting){
        if(!seenTimers.has(entry.target)){
          const id = entry.target.dataset.id;
          const timer = setTimeout(() => {
            const s = findSentence(id);
            if(s){
              s.lastSeenAt = Date.now();
              scheduleSeenSave();
            }
            seenTimers.delete(entry.target);
          }, 5000);
          seenTimers.set(entry.target, timer);
        }
      } else if(seenTimers.has(entry.target)){
        clearTimeout(seenTimers.get(entry.target));
        seenTimers.delete(entry.target);
      }
    });
  }, { threshold: 0.6 });

  archiveList.querySelectorAll('.quote-block').forEach(el => seenObserver.observe(el));
}

// 이벤트 위임: archiveList 자체는 재렌더링해도 그대로 유지되는 요소라, 리스너를 한 번만 붙여두고
// 클릭된 대상이 어느 quote-block인지는 매번 closest로 찾음.
// (이전엔 renderArchive가 실행될 때마다 문장 개수만큼 리스너를 새로 붙이고 있었음)
archiveList.addEventListener('click', async (e) => {
  const block = e.target.closest('.quote-block');
  if(!block) return;

  // 드래그로 문장을 선택한 상태면(하이라이트 하려는 것) 액션시트를 열지 않음
  const sel = window.getSelection();
  if(sel && !sel.isCollapsed && sel.toString().trim()) return;

  // 보기 모드에서는 고치는 메뉴를 아예 안 열고, 짧은 반응만 보여줌
  if(viewMode === 'view'){
    const tapped = findSentence(block.dataset.id);
    if(tapped) showToast(pickTapReaction(tapped), 1400);
    return;
  }

  // 이미 칠해진 하이라이트를 탭하면, 메뉴 대신 그 하이라이트를 바로 지움
  const markEl = e.target.closest('.quote-highlight');
  if(markEl){
    const idx = parseInt(markEl.dataset.hidx, 10);
    const s = findSentence(block.dataset.id);
    if(s && Array.isArray(s.highlights) && !isNaN(idx)){
      s.highlights.splice(idx, 1);
      await saveAll();
      renderArchive();
    }
    return;
  }

  openEntryAction(block.dataset.id);
});

// ── 카테고리 세그먼트 탭 (좌하단) ───────────────
// 카테고리를 전환할 때, 배열 순서상 다음/이전인지에 따라 아주 살짝 좌우로 미끄러지듯 바뀜.
// 화면을 통째로 넘기는 게 아니라 "약간의" 느낌만 주는 정도로, 이동 거리와 시간을 짧게 잡음.
// dir을 명시적으로 주면(화살표 키·알약 클릭처럼 "다음/이전"이 확실한 경우) 그대로 씀.
// 안 주면(탭을 직접 클릭한 경우처럼 어디서 어디로 튈지 모를 때) 인덱스를 비교해서 추측함 -
// 이 추측 방식은 순환(사랑→일처럼 배열 끝에서 다시 앞으로 넘어가는 경우) 방향을 반대로
// 잘못 판단해서, 오른쪽으로 넘겼는데 왼쪽에서 들어오는 것처럼 보이는 문제가 있었음.
function switchCategoryAnimated(newCat, explicitDir){
  if(newCat === currentCategory) return;
  const oldIdx = categoryNames().indexOf(currentCategory);
  const newIdx = categoryNames().indexOf(newCat);
  const forward = explicitDir != null ? (explicitDir > 0) : (newIdx > oldIdx); // 배열상 오른쪽으로 이동하면 다음 화면이 오른쪽에서 들어옴

  // 탭 알약은 누르자마자 곧바로 움직이게 함.
  // 문장 목록을 다시 그리는 건 무거운 작업이라, 그게 끝난 뒤에 알약이 출발하면
  // 첫 프레임들이 잡아먹혀서 툭툭 끊겨 보임 (특히 문장이 많은 폰에서).
  currentCategory = newCat;
  saveLastCategory(currentCategory);
  applyCategoryColor();
  categoryTabs.querySelectorAll('.category-tab').forEach(tab => {
    tab.classList.toggle('active', tab.dataset.cat === currentCategory);
  });
  updateCategoryIndicator();
  // 입력줄이 떠 있는 상태(컴퓨터 편집 모드)면, 화살표 키로 카테고리를 옮겨도 알약이 같이 따라오게 함
  if(typeof updateComposeCatPill === 'function') updateComposeCatPill();

  archiveList.classList.remove('cat-anim-in-l', 'cat-anim-in-r');
  archiveList.classList.add(forward ? 'cat-anim-out-l' : 'cat-anim-out-r');

  setTimeout(() => {
    renderArchive();
    resetQuoteFocus();
    scrollHostTo(0, 'instant');

    archiveList.classList.remove('cat-anim-out-l', 'cat-anim-out-r');
    archiveList.classList.add(forward ? 'cat-anim-in-r' : 'cat-anim-in-l');
    setTimeout(() => archiveList.classList.remove('cat-anim-in-l', 'cat-anim-in-r'), 240);
  }, 130);
}

// ── 위아래 화살표로 화면 부드럽게 스크롤 ──────────────────
// 브라우저 기본 동작은 몇십 픽셀씩 찔끔찔끔 끊겨 움직임.
// 대신 한 번에 적당한 양을 부드럽게 흘려보내서 읽는 흐름이 끊기지 않게 함.
// 키를 꾹 누르고 있으면 명령이 겹쳐 밀리므로, 진행 중일 땐 목표 위치만 더해나감.
let smoothScrollTarget = null;
let smoothScrollRaf = null;

// 컴퓨터 편집 모드에서는 목록이 통째로 화면(window)이 아니라 .scroll-region 안에서만 스크롤됨
// (입력줄에 절대 가리지 않도록 - 자세한 이유는 관련 CSS 주석 참고).
// 그래서 지금 스크롤 대상이 window인지 .scroll-region인지를 이 함수들이 알아서 골라 씀.
function scrollHost(){
  return document.body.classList.contains('compose-active') ? scrollRegionEl : null;
}
function currentScrollTop(){
  const host = scrollHost();
  return host ? host.scrollTop : (window.scrollY || window.pageYOffset || 0);
}
function currentScrollMaxY(){
  const host = scrollHost();
  if(host) return Math.max(0, host.scrollHeight - host.clientHeight);
  return Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
}
function currentViewportHeight(){
  const host = scrollHost();
  return host ? host.clientHeight : window.innerHeight;
}
function scrollHostTo(y, behavior){
  const host = scrollHost();
  if(host){ host.scrollTo({ top: y, behavior: behavior || 'auto' }); return; }
  window.scrollTo({ top: y, behavior: behavior || 'instant' });
}

// 위아래 키는 문장 하나씩 움직임. 멈추는 자리는 항상 "그 문장의 끝이 화면 아래에서
// SCROLL_EDGE_GAP만큼 떨어진 곳" - 그래서 문장이 중간에 잘리지 않고 매번 같은 자리에서 끝남.
// 문장 끝과 화면 아래 사이 여백.
// 예전엔 100px 고정이었는데, 그 공간에 다음 문장 글자가 3줄쯤 비집고 들어와 잘려 보였음.
// 카테고리 탭·검색 버튼이 문장과 가로로 겹치지 않는 넓은 화면(PC)에서는 여백을 확 줄여서
// 다음 문장이 아예 안 보이게 하고, 좁은 화면에서만 탭을 피할 만큼 띄움.
// 위아래 키로 문장 하나씩 이동. 멈추는 자리는 항상 "그 문장이 화면 한가운데"에 오도록 함.
// 문장 길이와 상관없이 늘 같은 자리에서 멈추게 하려는 것.
// (예전엔 문장 끝을 화면 아래에 맞췄는데, 그러면 다음 문장이 아래로 비집고 들어와 잘려 보였음)
function sentenceStopPoints(){
  const maxY = currentScrollMaxY();
  const vh = currentViewportHeight();
  const baseY = currentScrollTop();
  const pts = [];
  archiveList.querySelectorAll('.quote-block').forEach(el => {
    const r = el.getBoundingClientRect();
    const centerInPage = r.top + r.height / 2 + baseY;
    // 그 문장의 한가운데가 화면 한가운데에 오도록 하는 스크롤 위치
    pts.push(Math.round(centerInPage - vh / 2));
  });
  return { pts: pts.sort((a, b) => a - b), maxY, vh };
}

function scrollToNextSentenceEdge(dir){
  const base = smoothScrollTarget === null ? currentScrollTop() : smoothScrollTarget;
  const { pts, maxY, vh } = sentenceStopPoints();
  // 문장 하나가 화면보다 길 수도 있음. 그럴 땐 한 번에 화면 하나 넘게 건너뛰지 않도록 제한해서
  // 못 보고 지나치는 부분이 없게 함.
  const maxStep = Math.max(120, Math.round(vh * 0.8));

  let next;
  if(dir > 0){
    next = pts.find(y => y > base + 8);
    if(next === undefined) next = maxY;              // 마지막 문장까지 갔으면 맨 아래로
    next = Math.min(next, base + maxStep);
  } else {
    next = [...pts].reverse().find(y => y < base - 8);
    if(next === undefined) next = 0;                 // 첫 문장보다 위면 맨 위로
    next = Math.max(next, base - maxStep);
  }
  smoothScrollTo(Math.min(maxY, Math.max(0, next)));
}

function smoothScrollTo(targetY){
  const maxY = currentScrollMaxY();
  smoothScrollTarget = Math.min(maxY, Math.max(0, targetY));

  if(smoothScrollRaf) return; // 이미 흐르는 중이면 목표만 갱신하고 끝
  const step = () => {
    const cur = currentScrollTop();
    const diff = smoothScrollTarget - cur;
    // 남은 거리가 1.5px 안쪽이면 바로 목표에 붙임.
    // 예전엔 0.5px 기준이라, 2px쯤 남았을 때 한 프레임 이동량(0.36px)이 화면에 반영되지 않아
    // 제자리걸음에 빠지면서 늘 목표보다 2px 못 미친 자리에 멈췄음.
    if(Math.abs(diff) < 1.5){
      scrollHostTo(smoothScrollTarget);
      smoothScrollTarget = null;
      smoothScrollRaf = null;
      return;
    }
    let delta = diff * 0.18; // 남은 거리의 일부씩 좁혀가며 자연스럽게 감속
    // 이동량이 1px보다 작으면 화면에 반영되지 않으므로 최소 1px은 움직이게 함
    if(Math.abs(delta) < 1) delta = diff > 0 ? 1 : -1;
    scrollHostTo(cur + delta);
    smoothScrollRaf = requestAnimationFrame(step);
  };
  smoothScrollRaf = requestAnimationFrame(step);
}

document.addEventListener('keydown', (e) => {
  if(e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;

  const active = document.activeElement;
  const tag = active ? active.tagName : '';
  // 입력줄에 커서가 있을 땐("텍스트 집중 모드") 위/아래가 원래 텍스트칸 동작(줄 이동)에 쓰이고,
  // Tab으로 초점을 뺀 상태("문장 집중 모드")일 때만 목록을 넘기는 데 쓰임 - 그 외 입력칸도 마찬가지로 건드리지 않음.
  if(['INPUT', 'TEXTAREA'].includes(tag)) return;
  const anyOverlayOpen = document.querySelector(
    '.sheet-overlay.open, .modal-overlay.open, .ios-action-sheet.open, .ios-sheet-backdrop.open, .settings-dropdown.open'
  );
  if(anyOverlayOpen) return;

  e.preventDefault();
  scrollToNextSentenceEdge(e.key === 'ArrowDown' ? 1 : -1);
});

// 카테고리를 바꾸면 흐르던 스크롤을 멈춤 (새 목록에서 엉뚱한 위치로 흐르지 않도록)
function resetQuoteFocus(){
  if(smoothScrollRaf) cancelAnimationFrame(smoothScrollRaf);
  smoothScrollRaf = null;
  smoothScrollTarget = null;
}

// ── Tab으로 "입력 중" ↔ "목록 탐색 중" 전환 ──────────────────────
// 채팅형 입력줄에 초점이 있으면 화살표가 늘 목록/카테고리 전환에 쓰이는데, 그러면
// 여러 줄짜리 문장을 쓸 때 커서를 움직이려고 화살표를 눌러도 안 먹힘. Tab으로 초점을
// 완전히 빼면(목록 탐색 중) 화살표가 원래 하던 대로 목록/카테고리를 넘기고, 다시 Tab을
// 누르면 입력줄로 돌아와 화살표가 다시 글자 커서 이동으로 쓰임 - 딱 두 상태만 오가는 스위치.
document.addEventListener('keydown', (e) => {
  if(e.key !== 'Tab') return;
  if(!document.body.classList.contains('compose-active')) return; // PC 편집 모드에서만
  const anyOverlayOpen = document.querySelector(
    '.sheet-overlay.open, .modal-overlay.open, .ios-action-sheet.open, .ios-sheet-backdrop.open, .settings-dropdown.open'
  );
  if(anyOverlayOpen) return; // 팝업이 열려 있으면 원래 Tab 동작(그 안 필드 이동)을 건드리지 않음
  if(isWithinComposeMetaEdit(document.activeElement)) return; // 출처/쪽수 고치는 중엔 원래 Tab 동작(칸 이동)을 그대로 둠

  // 메모를 처리하던 중이어도 Tab은 그 상태를 건드리지 않음 - 예전엔 Tab도 M·Esc처럼
  // "그만 쓰기"로 취급했는데, 실제로 써보니 메모를 쓰다가 Tab으로 잠깐 목록을 보거나
  // 카테고리를 옮긴 뒤 돌아와서 계속 쓰는 흐름이 훨씬 흔했음 - 그때마다 메모 처리가
  // 조용히 끊겨서 "쓰던 게 사라진" 것처럼 느껴졌음. 그만두는 건 M(토글)이나 Esc로
  // 명시적으로 할 수 있으니, Tab은 초점만 오가게 두는 게 맞음.

  if(document.activeElement === composeTextInput){
    e.preventDefault();
    composeTextInput.blur(); // 초점을 비움 → 화살표가 목록 탐색으로 넘어감
    showComposeMemoHint(); // 손이 비는 이 순간, 쌓인 메모가 있으면 말풍선으로 살짝 알려줌
  } else {
    e.preventDefault();
    composeTextInput.focus(); // 어디에 있었든 입력줄로 돌아와 다시 타이핑 재개
    hideComposeMemoHint();
  }
});

// ── 메인 화면에서 좌우 화살표로 카테고리 전환 (일 · 관계 · 삶 · 사랑) ──────
// 입력칸/버튼 등 다른 걸 조작 중일 땐 건드리지 않고, 딱히 포커스된 게 없거나
// 카테고리 탭 자체에 포커스가 있을 때만 동작함.
document.addEventListener('keydown', (e) => {
  if(e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;

  const active = document.activeElement;
  const isCategoryTab = active && active.classList.contains('category-tab');
  const isGenericFocus = !active || active === document.body;
  // 입력줄에 커서가 있을 땐("텍스트 집중 모드") 좌우가 원래 텍스트칸 동작(글자 이동)에 쓰이고,
  // Tab으로 초점을 뺀 상태("문장 집중 모드")일 때만 카테고리를 넘기는 데 쓰임.
  if(!isCategoryTab && !isGenericFocus) return;

  const anyOverlayOpen = document.querySelector(
    '.sheet-overlay.open, .modal-overlay.open, .ios-action-sheet.open, .ios-sheet-backdrop.open, .settings-dropdown.open'
  );
  if(anyOverlayOpen) return;

  e.preventDefault();
  const currentIdx = categoryNames().indexOf(currentCategory);
  const dir = e.key === 'ArrowRight' ? 1 : -1;
  const nextIdx = (currentIdx + dir + categoryNames().length) % categoryNames().length;

  switchCategoryAnimated(categoryNames()[nextIdx], dir);

  // 예전엔 이동한 탭에 포커스를 넘겼는데, 그러면 검은 테두리가 생기고
  // 그 상태에서 엔터를 누르면 전역 단축키 대신 그 탭 버튼이 눌려버림.
  // 화살표 이동은 어차피 전역에서 처리하므로 포커스는 넘기지 않음.
  if(isCategoryTab && document.activeElement && document.activeElement.blur){
    document.activeElement.blur();
  }
});

// ── 문장 추가 시트 (우하단 +) ───────────────────
// [1] 출처 입력칸을 포커스하면 최근 사용한 출처가 바로 아래 드롭다운으로 나타남.
// mousedown에서 처리해야 input의 blur보다 먼저 실행되어 클릭이 씹히지 않음.
function wireSourceSuggest(inputEl, suggestEl){
  let highlightedIndex = -1;

  function renderHighlight(){
    suggestEl.querySelectorAll('.source-suggest-item').forEach((btn, i) => {
      btn.classList.toggle('highlighted', i === highlightedIndex);
    });
  }

  inputEl.addEventListener('focus', () => {
    if(recentSources.length === 0) return;
    highlightedIndex = -1;
    suggestEl.innerHTML = recentSources.map(src => `
      <button type="button" class="source-suggest-item">${escapeHtml(src)}</button>
    `).join('');
    suggestEl.querySelectorAll('.source-suggest-item').forEach((btn, i) => {
      btn.addEventListener('mousedown', (e) => {
        e.preventDefault();
        inputEl.value = recentSources[i];
        suggestEl.classList.remove('open');
      });
    });
    suggestEl.classList.add('open');
  });
  // 드롭다운이 열려있을 때 위/아래로 항목을 옮기고, Tab으로 확정하면서 다음 칸(문장 입력)으로 넘어감
  inputEl.addEventListener('keydown', (e) => {
    if(!suggestEl.classList.contains('open')) return;
    const items = suggestEl.querySelectorAll('.source-suggest-item');
    if(items.length === 0) return;

    if(e.key === 'ArrowDown'){
      e.preventDefault();
      highlightedIndex = (highlightedIndex + 1) % items.length;
      renderHighlight();
    } else if(e.key === 'ArrowUp'){
      e.preventDefault();
      highlightedIndex = (highlightedIndex - 1 + items.length) % items.length;
      renderHighlight();
    } else if(e.key === 'Tab'){
      if(highlightedIndex >= 0) inputEl.value = recentSources[highlightedIndex];
      suggestEl.classList.remove('open');
      // Tab 기본 동작(다음 요소로 포커스 이동)은 그대로 두고 막지 않음
    }
  });
  inputEl.addEventListener('blur', () => {
    setTimeout(() => suggestEl.classList.remove('open'), 150);
  });
}
wireSourceSuggest(composeSourceInput, composeSourceSuggest);

// ── 컴퓨터 편집 모드: 채팅형 입력줄 ──────────────────────────────
// 평소엔 카테고리·출처를 안 건드려도 되게, 마지막으로 쓴 값을 그대로 이어감.
// 페이지는 문장마다 다른 경우가 많아 저장할 때마다 비움(잘못된 페이지가 조용히 남는 걸 막기 위해).
let composeSource = '';

function updateComposeCatPill(){
  composeCatDot.style.background = getCategoryColor(currentCategory);
  composeCatLabel.textContent = currentCategory;
}
// 카테고리 탭과 입력줄의 카테고리 알약이 같은 currentCategory를 보고 있으므로,
// 어느 쪽에서 바뀌든 항상 같이 업데이트되게 렌더링 지점에서 호출함.
// 예전엔 눌러서 순환하는 방식이었는데, 이제 카테고리가 여러 개일 수 있어서
// 탭의 +버튼과 똑같이 이 피커를 열어 고르게 함(추가·이름변경·삭제도 여기서 바로 가능).
composeCatPill.addEventListener('click', () => {
  openCategoryPicker();
});

// 출처·쪽수를 하나로 묶어 보여줌 - 문장 목록에 보이는 "출처 · 47p" 표기와 같은 형식.
// (쪽수는 저장할 때마다 비워지므로, 평소엔 출처만 보이는 경우가 많음)
function updateComposeMetaPill(){
  const parts = [];
  if(composeSource) parts.push(composeSource);
  const pageVal = composePageInput.value.trim();
  if(pageVal) parts.push(pageVal + 'p');
  composeMetaLabel.textContent = parts.length ? parts.join(' · ') : '출처 없음';
}
function openComposeMetaEdit(){
  composeMetaEdit.classList.add('show');
  composeMetaPill.style.display = 'none';
  composeSourceInput.value = composeSource;
  composeSourceInput.focus();
  composeSourceInput.select();
  syncComposeBarSpace(); // 좁은 화면에서 상태 줄이 두 줄로 접히는 경우까지 대비
}
function closeComposeMetaEdit(){
  composeSource = composeSourceInput.value.trim();
  updateComposeMetaPill();
  composeMetaEdit.classList.remove('show');
  composeMetaPill.style.display = '';
  syncComposeBarSpace();
}
function isWithinComposeMetaEdit(el){
  return !!el && composeMetaEdit.contains(el);
}
function handleComposeMetaFieldBlur(){
  // 출처칸↔쪽수칸 사이를 옮겨다니거나 자동완성 목록을 누르는 momento에도 blur가 먼저
  // 발생하므로, 살짝 늦춰서 "정말 이 영역 밖으로 나갔는지"를 확인한 뒤에만 닫음
  setTimeout(() => {
    if(!isWithinComposeMetaEdit(document.activeElement)) closeComposeMetaEdit();
  }, 160);
}
composeMetaPill.addEventListener('click', openComposeMetaEdit);
composeSourceInput.addEventListener('keydown', (e) => {
  if(e.key === 'Enter'){ e.preventDefault(); composePageInput.focus(); composePageInput.select(); }
  else if(e.key === 'Escape'){ e.preventDefault(); composeSourceInput.value = composeSource; closeComposeMetaEdit(); composeTextInput.focus(); }
});
composeSourceInput.addEventListener('blur', handleComposeMetaFieldBlur);
composePageInput.addEventListener('keydown', (e) => {
  if(e.key === 'Enter'){ e.preventDefault(); closeComposeMetaEdit(); composeTextInput.focus(); }
  else if(e.key === 'Escape'){ e.preventDefault(); closeComposeMetaEdit(); composeTextInput.focus(); }
});
composePageInput.addEventListener('blur', handleComposeMetaFieldBlur);
composePageInput.addEventListener('input', updateComposeMetaPill);

// 문장 길이에 맞춰 입력칸이 늘어나다가, 일정 높이를 넘으면 그 안에서만 스크롤됨
function autoGrowComposeTextarea(){
  composeTextInput.style.height = 'auto';
  composeTextInput.style.height = composeTextInput.scrollHeight + 'px';
  syncComposeBarSpace();
}
// 입력줄이 자라나는 만큼, 목록이 스크롤되는 영역(.wrap) 자체의 높이를 줄여서
// 입력줄 자리를 항상 정확히 비워둠 - 목록이 그 밑으로는 아예 스크롤되어 들어가지 않음.
//
// [메모 X버튼은 이 계산에 안 넣음] 한때는 메모 처리 중 뜨는 X버튼 높이도 여기 더해서
// 여백을 키웠었는데, 그러면 M을 누르는 순간 화면이 그만큼 위로 훅 밀리는 게 오히려
// 더 거슬린다는 피드백이 있었음. X버튼은 배경 없는 작은 아이콘 하나뿐이라(말풍선
// 힌트와 같은 성격 - 그것도 이 계산에 안 들어감), 지금 있는 화면 상태 위에 그냥
// 살짝 얹히는 오버레이로 두는 게 나음 - 화면은 절대 안 움직이고, 정말 드물게 아주
// 마지막 줄과 살짝 겹칠 수는 있지만(배경이 없어 티도 잘 안 남), 그게 화면이 훅
// 밀리는 것보다 훨씬 자연스러움.
function syncComposeBarSpace(){
  if(!document.body.classList.contains('compose-active')) return;
  const h = Math.ceil(composeBar.getBoundingClientRect().height);
  // 입력줄 높이 + 화면 아래 여백(20px) + 목록과의 간격(24px)
  document.documentElement.style.setProperty('--compose-reserve', (h + 20 + 24) + 'px');
}
window.addEventListener('resize', syncComposeBarSpace);
composeTextInput.addEventListener('input', autoGrowComposeTextarea);
composeTextInput.addEventListener('input', updateSendBtnState);
// Tab이 아니라 그냥 마우스로 클릭해서 다시 입력칸에 들어와도 말풍선은 조용히 치워줌
composeTextInput.addEventListener('focus', hideComposeMemoHint);
composeTextInput.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    // 입력줄이 기본으로 초점을 갖고 있어서, 문장을 드래그해 선택해둔 채로 엔터를 치면
    // 이 핸들러가 먼저 걸림. 그럴 땐 입력줄 저장보다 하이라이트 적용이 우선함.
    if(pendingHighlight){ applyPendingHighlight(); return; }
    handleComposeSubmit();
  }
});

// ── 문장 수정도 채팅형 입력줄로 ─────────────────────────
// 예전엔 별도 팝업이 떴는데, 메모 처리와 같은 방식으로 통일함 - 입력줄에 그 문장의
// 내용이 미리 채워진 채로 열리고, 고쳐서 엔터 누르면 새로 추가되는 게 아니라
// "그 문장 자체가" 업데이트됨.
let activeSentenceEdit = null; // 지금 수정 중인 문장의 id (아니면 null)
let activeCommentEdit = null; // 지금 코멘트를 쓰는 중인 문장의 id (아니면 null)
let activeSentenceEditOriginalRefMode = 'page';
let activeSentenceEditOriginalDate = '';
function openSentenceEditFlow(id){
  const s = findSentence(id);
  if(!s) return;
  // 메모를 처리하던 중이었다면 그건 잠시 접어둠(동시에 둘 다는 헷갈리므로) -
  // 메모 자체는 안 지워지니 나중에 트래커에서 다시 이어서 처리하면 됨
  if(activeMemoConversion) closeMemoConversionFlow();
  activeSentenceEdit = id;
  currentCategory = s.category;
  updateComposeCatPill();
  composeSource = s.source || '';
  const parsed = parseRefString(s.ref);
  activeSentenceEditOriginalRefMode = parsed.mode;
  activeSentenceEditOriginalDate = parsed.date;
  composePageInput.value = parsed.mode === 'page' ? parsed.page : '';
  updateComposeMetaPill();
  composeTextInput.value = s.text || '';
  autoGrowComposeTextarea();
  composeEditRow.classList.add('show');
  updateSendBtnState(); // 수정 중엔 전송 버튼이 평소 화살표(저장용)여야 함
  syncComposeBarSpace();
  focusSoon(() => composeTextInput);
}
// 저장하지 않고 그만둠 - 입력줄을 평소(빈 채로 새로 쓰는) 상태로 되돌림
function closeSentenceEditFlow(){
  activeSentenceEdit = null;
  composeEditRow.classList.remove('show');
  composeTextInput.value = '';
  autoGrowComposeTextarea();
  composeSource = recentSources[0] || '';
  composePageInput.value = '';
  updateComposeMetaPill();
  updateSendBtnState(); // 메모가 남아있으면 다시 연필 얼굴로
  syncComposeBarSpace();
}
composeEditCancelBtn.addEventListener('click', () => {
  if(activeCommentEdit) closeCommentEditFlow();
  else closeSentenceEditFlow();
});

// ── 코멘트도 입력줄에서 쓰기 (PC) ──────────────────────
// 예전엔 코멘트를 남길 때만 별도 팝업이 떴는데, 문장 수정은 이미 입력줄에서 하고 있어서
// 같은 성격의 일인데 방식만 다른 게 어색했음 - 늘 쓰던 그 칸에서 그대로 쓰게 함.
// 폰은 이 입력줄 자체가 없으므로(메모 화면만 씀) 기존 팝업을 그대로 씀.
function openCommentEditFlow(id){
  const s = findSentence(id);
  if(!s) return;
  if(activeMemoConversion) closeMemoConversionFlow();
  if(activeSentenceEdit) closeSentenceEditFlow();
  activeCommentEdit = id;
  composeTextInput.value = s.comment || '';
  composeTextInput.placeholder = '이 문장에 남길 생각';
  autoGrowComposeTextarea();
  composeEditRow.classList.add('show');
  composeEditRow.querySelector('span').textContent = '코멘트 쓰는 중';
  updateSendBtnState();
  syncComposeBarSpace();
  focusSoon(() => composeTextInput);
}
function closeCommentEditFlow(){
  activeCommentEdit = null;
  composeEditRow.classList.remove('show');
  composeEditRow.querySelector('span').textContent = '문장 수정 중'; // 원래 문구로 되돌림
  composeTextInput.value = '';
  composeTextInput.placeholder = '문장을 입력하세요';
  autoGrowComposeTextarea();
  updateSendBtnState();
  syncComposeBarSpace();
}

async function handleComposeSubmit(){
  const text = composeTextInput.value.trim();
  if(!text) return; // 빈 채로 엔터 치는 건 흔한 실수라, 에러 없이 그냥 아무 일도 안 일어나게 함

  // 코멘트를 쓰는 중이었다면 그 문장의 코멘트만 갱신하고 끝냄
  if(activeCommentEdit){
    const s = findSentence(activeCommentEdit);
    if(s){
      s.comment = text;
      writeLocalBackup();
      saveAll();
      renderArchive();
    }
    closeCommentEditFlow();
    showToast('✓ 코멘트를 남겼어요', 1600);
    composeTextInput.focus();
    return;
  }

  // 문장을 수정하는 중이었다면, 새로 추가하는 게 아니라 그 문장 자체를 갱신하고 끝냄 -
  // 나머지(메모 이어가기 등) 로직과는 완전히 갈라진 별개의 흐름이라 여기서 먼저 처리함
  if(activeSentenceEdit){
    const s = findSentence(activeSentenceEdit);
    if(!s){ closeSentenceEditFlow(); return; }
    const source = composeSource;
    // 원래 날짜 기반이었는데 페이지 칸을 안 건드렸으면 원래 날짜를 그대로 유지함
    // (컴포즈바엔 예전 팝업에 있던 날짜 선택 UI가 없어서, 날짜였던 것까지 억지로
    //  페이지로 바꾸지 않으려는 안전장치 - 페이지를 입력하면 그건 페이지로 바뀜)
    const ref = (activeSentenceEditOriginalRefMode === 'date' && !composePageInput.value.trim())
      ? activeSentenceEditOriginalDate.replace(/-/g, '.')
      : buildRefString('page', composePageInput.value, '');
    const categoryChanged = s.category !== currentCategory;

    composeSendBtn.disabled = true;
    if(s.text !== text){
      // 칠해둔 부분이 새 문장에도 그대로 있으면 그 자리로 옮겨줌(전부 날리지 않음)
      s.highlights = remapHighlights(s.text, text, s.highlights);
      s.spellChecked = false; // 내용이 바뀌었으니 맞춤법 재점검 대상으로 되돌림
      s.tags = [];            // 주제가 달라졌을 수 있으니 의미 태그도 다시 뽑도록 비움
    }
    const contentChanged = s.text !== text || s.source !== source || s.ref !== ref;
    s.text = text;
    s.source = source;
    s.category = currentCategory;
    s.ref = ref;
    if(contentChanged) s.editedAt = Date.now(); // EDIT 표시를 24시간 띄우기 위한 시각
    if(source) addRecentSource(source);

    writeLocalBackup();
    await saveAll();
    composeSendBtn.disabled = false;

    closeSentenceEditFlow();
    if(categoryChanged) saveLastCategory(currentCategory);
    renderArchive();
    showToast('✓ 수정했어요');
    composeTextInput.focus();
    return;
  }

  const source = composeSource;
  const ref = buildRefString('page', composePageInput.value, '');
  const newId = genId();

  sentences.push({
    id: newId,
    category: currentCategory,
    source,
    text,
    ref,
    important: false,
    highlights: [],
    spellChecked: false,
    tags: [],
    comment: '',
    ts: Date.now(),
    lastSeenAt: Date.now()
  });
  if(source) addRecentSource(source);

  // 메모를 문장으로 옮기는 중이었다면, 그 메모는 이제 다 쓴 것이므로 같이 지움
  const convertedMemo = activeMemoConversion;
  if(convertedMemo){
    rememberDeleted(deletedMemoIds, convertedMemo.id); // 다른 기기가 되살리지 못하게 기록
    memos = memos.filter(m => m.id !== convertedMemo.id);
  }

  // 서버로 보내는 비동기 과정을 기다리지 않고 곧바로 이 기기에 남겨둠
  writeLocalBackup();

  composeTextInput.value = '';
  autoGrowComposeTextarea();
  renderArchive();
  flashNewlyAdded(newId); // 방금 담긴 문장이 살짝 떠오르며 자리 잡는 느낌

  // [중요] 서버 저장(saveAll)이 끝나길 기다리지 않고, 화면 전환(다음 메모로 넘어가기 등)을
  // 먼저 함 - 예전엔 이 아래 있던 걸 저장이 끝난 뒤로 미뤄뒀는데, 네트워크가 느리면(특히
  // Worker 콜드스타트 등) 그 사이엔 엔터를 쳐도 아무 반응이 없는 것처럼 느껴져서 "다음
  // 메모로 바로 안 넘어간다"는 문제가 있었음. 로컬엔 이미 안전하게 남겨뒀으니(writeLocalBackup),
  // 서버 저장은 뒤에서 조용히 계속 진행되어도 됨 - 실패해도 재시도 로직이 알아서 처리함.
  saveAll();

  // 메모 처리 중이었다면 입력줄을 안 비운 채(카테고리·출처는 이어감) 곧장 다음 메모로 넘어감 -
  // "널널하게 이어지는" 흐름. 알림도 하나만 뜨게 함(두 개가 겹치면 서로 덮어써서 하나만 보임).
  if(convertedMemo){
    updateComposeMemoState();
    const next = nextUnconvertedMemo();
    if(next){
      showToast('✓ ' + pickSaveMessage(source));
      openMemoConversionFlow(next);
      return;
    }
    closeMemoConversionFlow();
    showToast('✓ 마지막 메모까지 다 옮겼어요', 1800);
    composeTextInput.focus();
    return;
  }

  composePageInput.value = '';
  updateComposeMetaPill(); // 쪽수가 비워졌으니 알약 표시도 새로 맞춤
  updateSendBtnState(); // 칸을 코드로 비웠으니(=input 이벤트가 안 남) 여기서 직접 다시 확인해줌
  showToast('✓ ' + pickSaveMessage(source));
  composeTextInput.focus();
}

// 모드+입력값 → 저장용 문자열 ("51p" 또는 "2026.04.25")
function buildRefString(mode, pageVal, dateVal){
  if(mode === 'page'){
    const v = (pageVal || '').trim();
    return v ? `${v}p` : '';
  }
  return dateVal ? dateVal.replace(/-/g, '.') : '';
}
// 저장된 문자열 → 수정 시트를 열 때 모드+입력값 복원 (옛 형식/자유 입력도 최대한 추측해서 복원)
function parseRefString(ref){
  if(!ref) return { mode: 'page', page: '', date: '' };
  const pageMatch = ref.match(/^(\d+)\s*p$/i);
  if(pageMatch) return { mode: 'page', page: pageMatch[1], date: '' };
  const dateMatch = ref.match(/^(\d{4})[.\-](\d{2})[.\-](\d{2})$/);
  if(dateMatch) return { mode: 'date', page: '', date: `${dateMatch[1]}-${dateMatch[2]}-${dateMatch[3]}` };
  const digits = ref.match(/\d+/);
  return { mode: 'page', page: digits ? digits[0] : '', date: '' };
}

// 시트를 연 뒤 입력칸에 초점을 주기까지의 대기 시간.
// 모바일은 키보드가 올라오는 동안 기다려야 하지만, PC는 기다릴 이유가 없어서 즉시 초점을 줌
// (그냥 250ms를 다 기다리면 눌렀는데 잠깐 멈칫하는 느낌이 남).
function focusSoon(getEl){
  const isDesktop = window.matchMedia('(min-width: 900px) and (hover: hover)').matches;
  if(isDesktop) requestAnimationFrame(() => { const el = getEl(); if(el) el.focus(); });
  else setTimeout(() => { const el = getEl(); if(el) el.focus(); }, 250);
}

// 그 문장에 해당하는 성격들을 모아서, 그중 하나를 무작위로 고름.
// (여러 성격이 겹치면 매번 다른 결의 반응이 나와서 덜 뻔해짐)
function pickTapReaction(s){
  const pools = [];
  if(Array.isArray(s.highlights) && s.highlights.length) pools.push(VIEW_TAP_REACTIONS.highlighted);
  if(s.important) pools.push(VIEW_TAP_REACTIONS.favorite);
  if(s.comment && s.comment.trim()) pools.push(VIEW_TAP_REACTIONS.commented);

  const age = Date.now() - (s.ts || 0);
  const day = 24 * 60 * 60 * 1000;
  if(age < 3 * day) pools.push(VIEW_TAP_REACTIONS.fresh);
  else if(age > 60 * day) pools.push(VIEW_TAP_REACTIONS.old);

  const len = (s.text || '').replace(/\s/g, '').length;
  if(len >= 70) pools.push(VIEW_TAP_REACTIONS.long);
  else if(len <= 20) pools.push(VIEW_TAP_REACTIONS.short);

  pools.push(VIEW_TAP_REACTIONS.plain); // 항상 후보에 포함해서 너무 정형화되지 않게 함
  return pickFrom(pools[Math.floor(Math.random() * pools.length)]);
}

// 저장할 때마다 뜨는 확인 문구를 상황에 맞게 여러 개 두고 돌아가며 보여줌.
// 마스코트나 캐릭터 없이, 그 순간 사이트가 조용히 알아봐 주는 정도의 말투만 담음.
const SAVE_MESSAGES = {
  newBook: [
    '새 책이네요 반가워요',
    '이 책은 처음이네요',
    '새로운 책이에요 잘 부탁해요',
  ],
  continue: [
    (n) => `이 책에서 ${n}번째예요`,
    (n) => `이 책과 ${n}번 만났어요`,
    (n) => `${n}번째로 옮겨 적었어요`,
  ],
  milestone: [
    (n) => `어느새 ${n}개를 모았어요`,
    (n) => `${n}개 여기까지 왔네요`,
    (n) => `벌써 ${n}번째 문장이에요`,
  ],
  plain: [
    '잘 담아뒀어요',
    '여기 남겨뒀어요',
    '조용히 저장했어요',
  ],
};
function pickFrom(pool, ...args){
  const item = pool[Math.floor(Math.random() * pool.length)];
  return typeof item === 'function' ? item(...args) : item;
}
// 방금 문장이 sentences에 추가된 뒤에 호출된다고 가정함 (전체 개수·같은 출처 개수에 그걸 포함해서 셈)
function pickSaveMessage(source){
  const total = sentences.length;
  if(total > 0 && total % 50 === 0) return pickFrom(SAVE_MESSAGES.milestone, total);

  if(source){
    const sameSourceCount = sentences.filter(s => s.source === source).length;
    if(sameSourceCount === 1) return pickFrom(SAVE_MESSAGES.newBook);
    return pickFrom(SAVE_MESSAGES.continue, sameSourceCount);
  }
  return pickFrom(SAVE_MESSAGES.plain);
}

// ── 엔터로 문장 추가 시트 바로 열기 (PC, 키보드만으로 진행하기) ──────
// 입력칸/버튼 등 이미 엔터를 자체적으로 처리하는 요소에 포커스가 있을 땐 건드리지 않음 -

document.addEventListener('keydown', (e) => {
  if(e.key !== 'Enter' || e.defaultPrevented) return;
  if(pendingHighlight) return; // 문장을 드래그해둔 상태면 그 쪽 엔터(칠하기)가 우선함
  const tag = document.activeElement ? document.activeElement.tagName : '';
  if(['INPUT', 'TEXTAREA', 'BUTTON', 'A'].includes(tag)) return;
  const anyOverlayOpen = document.querySelector(
    '.sheet-overlay.open, .modal-overlay.open, .ios-action-sheet.open, .ios-sheet-backdrop.open, .settings-dropdown.open'
  );
  if(anyOverlayOpen) return;
  // 모드에 따라 엔터가 하는 일이 달라짐: 보기 모드는 검색, 편집 모드(컴퓨터)는 늘 떠 있는
  // 입력줄에 커서를 놓아줌 (예전엔 여기서 팝업을 열었지만, 이제 그 팝업 자체가 없어짐)
  if(viewMode === 'view') openSearchSheet();
  else if(!HAS_ONSCREEN_KEYBOARD) composeTextInput.focus();
});

// ── 중앙 Dialog가 visual viewport(키보드 열림 등) 안에 오도록 위치 보정 ──
// 키보드가 올라왔을 때의 처리.
// 예전엔 창 전체를 키보드 위 공간에 맞춰 줄였는데, iOS에서 그 크기 계산이 정확히 안 맞아
// 어두운 배경이 화면 중간에서 끊기고 아래로 원래 내용이 비쳐 보였음.
// 그래서 배경은 항상 화면 전체를 덮게 두고(틈이 안 생김), 실제로 쓸 수 있는 높이만
// CSS 변수로 알려줘서 시트가 그 안에 들어가도록 함.
// "실제로 보이는 영역"의 위치와 크기를 알려줌.
// 창(팝업)은 이 값을 그대로 써서 늘 보이는 영역에 딱 맞게 놓임.
function syncDialogViewport(){
  const vv = window.visualViewport;
  if(!vv) return;
  // 화면 위/아래에서 각각 얼마나 가려져 있는지(주소창·키보드 등).
  // 이 값만큼 창 바깥에 여백을 줘서, 창이 실제로 보이는 영역 안에 놓이게 함.
  const padTop = Math.max(0, Math.round(vv.offsetTop));
  const padBottom = Math.max(0, Math.round(window.innerHeight - (vv.offsetTop + vv.height)));
  document.documentElement.style.setProperty('--vv-pad-top', padTop + 'px');
  document.documentElement.style.setProperty('--vv-pad-bottom', padBottom + 'px');
  // 키보드가 실제로 올라왔을 때만 창 높이를 그 위 공간으로 줄임.
  // 주소창 정도의 작은 차이까지 반영하면 창이 화면을 못 채워 팝업처럼 보임.
  const keyboardUp = window.innerHeight - (vv.height + vv.offsetTop) > 120;
  if(keyboardUp){
    document.documentElement.style.setProperty('--kb-fit-h', Math.round(vv.height) + 'px');
  } else {
    document.documentElement.style.removeProperty('--kb-fit-h');
  }
}
// 창을 닫을 때 여백을 원래대로 되돌림
function resetDialogViewport(){
  document.documentElement.style.removeProperty('--kb-fit-h');
  document.documentElement.style.setProperty('--vv-pad-top', '0px');
  document.documentElement.style.setProperty('--vv-pad-bottom', '0px');
}

// 창이 열려 있을 때만 반응함. 평소 스크롤 중에는 아무것도 계산하지 않아서
// 사파리가 주소창을 움직이는 걸 방해하지 않음.
function anySheetOpen(){ return !!document.querySelector('.sheet-overlay.open'); }
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', () => { if(anySheetOpen()) syncDialogViewport(); });
  window.visualViewport.addEventListener('scroll', () => { if(anySheetOpen()) syncDialogViewport(); });
}
syncDialogViewport();

// 떠 있는 탭·+버튼의 위치는 이제 순수 CSS만으로 처리함(.float-layer 주석 참고) -
// JS로 visualViewport를 쫓아가던 예전 방식은 사파리의 주소창 애니메이션보다 늘 한 박자
// 늦어서 오히려 더 심하게 요동쳤기 때문에 완전히 걷어냈음.

// ── 배경 스크롤 잠금 (Dialog 열림 중) ────────────
let scrollLockCount = 0;
let savedScrollY = 0;
// 화면 키보드가 올라오는 기기인지 (PC는 물리 키보드)
const HAS_ONSCREEN_KEYBOARD = window.matchMedia('(pointer: coarse)').matches;

// ── 폰: 옆으로 스와이프해서 카테고리 전환 ──────────────────
// 컴퓨터의 화살표 키 전환을 손가락 제스처로 옮긴 것 - 알약 하나만 보이게 바꾼 뒤로,
// 옆 카테고리로 넘어가는 손맛을 이걸로 대신 채움. 세로로 읽다가 실수로 옆 카테고리로
// 넘어가면 안 되므로, 제스처가 "가로로 확실히 움직인다" 싶을 때만 반응하고, 그 전까진
// 평소 세로 스크롤을 절대 방해하지 않음(방향이 정해지기 전엔 preventDefault 자체를 안 함).
if(HAS_ONSCREEN_KEYBOARD){
  const SWIPE_DIR_LOCK_PX = 18;  // 방향을 정하기 전 최소 이 정도는 움직여야 함 - 너무 이르게
                                  // 판단하면 자연스러운 손 떨림 정도로도 잘못 판정하기 쉬움
  const SWIPE_H_RATIO = 1.6;     // 가로로 확정하려면 세로 이동량보다 이만큼은 확실히 더 커야 함.
                                  // 애매하면 세로(스크롤)로 봄 - 세로가 기본 동작이고 가로는
                                  // "확실할 때만" 가로채야, 실수로 스크롤이 막히는 일이 없음.
                                  // (예전엔 어느 한쪽이 12px만 넘으면 그 순간 "더 큰 쪽"으로
                                  // 바로 정해버려서, 세로로 읽던 중 아주 살짝만 옆으로 틀어져도
                                  // 가로로 오판 → preventDefault로 그 제스처 내내 스크롤 자체가
                                  // 안 먹히는 문제가 있었음. 실제 녹화로 확인된 원인.)
  const SWIPE_TRIGGER_PX = 70;   // 가로로 이만큼 밀어야 실제 전환이 일어남
  let swipeStartX = 0, swipeStartY = 0, swipeDir = null; // null | 'h' | 'v'

  document.addEventListener('touchstart', (e) => {
    if(viewMode !== 'view' || e.touches.length !== 1) return;
    // 팝업이 열려 있으면(검색·액션시트 등) 거기 안 스와이프까지 카테고리 전환으로 새지 않게 함
    if(document.querySelector('.sheet-overlay.open, .ios-action-sheet.open, .ios-sheet-backdrop.open, .settings-dropdown.open')) return;
    swipeStartX = e.touches[0].clientX;
    swipeStartY = e.touches[0].clientY;
    swipeDir = null;
  }, { passive: true });

  document.addEventListener('touchmove', (e) => {
    if(!swipeStartX && !swipeStartY) return;
    const dx = e.touches[0].clientX - swipeStartX;
    const dy = e.touches[0].clientY - swipeStartY;
    const adx = Math.abs(dx), ady = Math.abs(dy);
    if(swipeDir === null && (adx > SWIPE_DIR_LOCK_PX || ady > SWIPE_DIR_LOCK_PX)){
      swipeDir = (adx > ady * SWIPE_H_RATIO) ? 'h' : 'v';
    }
    // 가로로 확정된 뒤에만 페이지가 같이 안 밀리게 막음 - 세로 스크롤 의도면 절대 안 건드림
    if(swipeDir === 'h') e.preventDefault();
  }, { passive: false });

  document.addEventListener('touchend', (e) => {
    if(swipeDir === 'h'){
      const dx = e.changedTouches[0].clientX - swipeStartX;
      if(Math.abs(dx) > SWIPE_TRIGGER_PX){
        const names = categoryNames();
        const idx = names.indexOf(currentCategory);
        const dir = dx < 0 ? 1 : -1; // 왼쪽으로 밀면 다음 카테고리(오른쪽에서 들어옴)
        const nextIdx = (idx + dir + names.length) % names.length;
        switchCategoryAnimated(names[nextIdx], dir);
      }
    }
    swipeStartX = 0; swipeStartY = 0; swipeDir = null;
  });
}


// 폰에서는 body를 통째로 고정시키지 않음.
// 그렇게 하면 창을 닫을 때 window.scrollTo로 강제 스크롤을 해야 하는데,
// 아이폰 사파리는 강제로 스크롤당하면 주소창 상태와 화면 높이 계산이 어긋난 채로 남아서
// 그 뒤로 떠 있는 요소들이 계속 어긋나고 덜덜거렸음.
// 폰에서는 창이 화면 전체를 덮으므로 뒤가 안 보여서 굳이 고정할 필요도 없음.
// 창(팝업)이나 메모 화면이 떠 있는 동안 뒤 화면이 같이 스크롤되지 않게 막음.
// 아이폰 사파리에선 overflow:hidden 이 안 통해서, 읽기 화면 판을 그 자리에 고정시키는 방식을 씀
// (자세한 이유는 .bg-frozen 관련 CSS 주석 참고).
// 평소 읽는 동안 스크롤 위치를 계속 기록해둠.
// 창을 열려고 로고나 버튼을 누르는 그 순간, 브라우저가 먼저 스크롤을 0으로 밀어버리는 경우가
// 있어서(아이폰 사파리) 창을 여는 시점에 위치를 재면 이미 늦음 - 그래서 미리 챙겨두는 방식.
let lastReadScrollY = 0;
document.addEventListener('scroll', () => {
  if(!document.body.classList.contains('bg-frozen')){
    lastReadScrollY = window.scrollY || window.pageYOffset || 0;
  }
}, { passive: true });

function freezeBackground(){
  // 이미 고정 중이면 위치를 다시 재지 않음.
  // (비밀번호 창이 닫히면서 메모 화면이 곧바로 이어서 여는 경우처럼, 잠금이 잠깐 풀렸다가
  //  다시 걸릴 때가 있음. 그 찰나엔 스크롤이 이미 0으로 되돌아가 있어서, 그대로 다시 재면
  //  읽던 위치가 0으로 덮여버림 - 나갈 때 맨 위로 튀는 원인이었음)
  if(!document.body.classList.contains('bg-frozen')){
    const now = window.scrollY || window.pageYOffset || 0;
    // 지금 값이 0이면 방금 브라우저가 밀어버린 것일 수 있으니, 미리 기록해둔 값을 씀
    savedScrollY = now || lastReadScrollY;
    // 고정시키면 판이 맨 위로 올라가버리므로, 읽던 만큼 위로 끌어올려 보이는 자리를 유지함
    if(scrollRegionEl) scrollRegionEl.style.top = `-${savedScrollY}px`;
  }
  document.body.classList.add('bg-frozen');
  document.body.classList.add('modal-open');
  document.documentElement.classList.add('modal-open-html');
}
function unfreezeBackground(){
  document.body.classList.remove('bg-frozen');
  document.body.classList.remove('modal-open');
  document.documentElement.classList.remove('modal-open-html');
  if(scrollRegionEl) scrollRegionEl.style.top = '';
  // 고정을 풀면 스크롤이 0으로 돌아가 있으므로, 읽던 자리로 되돌려줌
  window.scrollTo(0, savedScrollY);
}
function lockBodyScroll(){
  if(scrollLockCount === 0) freezeBackground();
  scrollLockCount++;
}
function unlockBodyScroll(){
  scrollLockCount = Math.max(0, scrollLockCount - 1);
  if(scrollLockCount === 0) unfreezeBackground();
}

// ── 드래그로 문장 선택 → 선택 영역 바로 위에 플로팅 하이라이트 버튼이 뜸 ────────
// 예전엔 우하단 + 버튼이 이 역할까지 겸했는데(화면 가장자리 고정이라 선택 위치와 무관하게
// 항상 같은 자리였음), 이제 완전히 별도의 작은 툴바(highlightFloatBtn)가 선택 영역
// 바로 위(공간 부족하면 아래)에 붙어서 뜸. + 버튼은 이제 원래 두 역할(보기모드=검색,
// 편집모드=입력줄로 이동)만 함.
const SEARCH_ICON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>';
let pendingHighlight = null;

// 보기 모드면 돋보기(검색), 편집 모드면 + 로 - 우하단 버튼 하나가 모드에 따라 역할을 바꿈
function resetAddButtonToNormal(){
  if(viewMode === 'view'){
    addQuoteTriggerBtn.innerHTML = SEARCH_ICON;
    addQuoteTriggerBtn.title = '검색';
  } else {
    addQuoteTriggerBtn.textContent = '+';
    addQuoteTriggerBtn.title = '입력줄로 이동';
  }
}
function updateFabForMode(){
  resetAddButtonToNormal();
  hideHighlightFloatBtn(); // 모드가 바뀌면 진행 중이던 선택/하이라이트 의도는 의미가 없어짐
}

// 플로팅 하이라이트 버튼을 선택 영역의 화면 좌표(rect) 기준으로 정확히 위치시킴.
// 화면 위쪽 여유가 부족하면(선택한 곳이 화면 맨 위 근처면) 위 대신 아래로 뒤집어서 띄움 -
// 안 그러면 버튼이 화면 밖으로 잘려 나가거나 브라우저 주소창 쪽에 가려질 수 있음.
function positionHighlightFloatBtn(rect, cancelMode){
  const btn = highlightFloatBtn;
  btn.title = cancelMode ? '하이라이트 취소' : '하이라이트';
  btn.classList.toggle('cancel-mode', cancelMode);
  const GAP = 10;
  const MIN_TOP_SPACE = 46; // 버튼 높이+꼬리+여유
  const flipDown = rect.top < MIN_TOP_SPACE;
  btn.classList.toggle('flip-down', flipDown);
  btn.style.left = (rect.left + rect.width / 2) + 'px';
  btn.style.top = (flipDown ? rect.bottom + GAP : rect.top - GAP) + 'px';
  btn.classList.add('show');
}
// 드래그를 "놓은" 바로 그 지점(끝 글자)의 화면 좌표를 정확히 구함 - 예전엔 선택 영역
// 전체의 경계 상자(getBoundingClientRect)를 썼는데, 여러 줄에 걸쳐 선택하면 그 "전체
// 영역의 중앙"이 계산되어서 실제로 손을 뗀 지점과 동떨어진, 다소 제멋대로인 자리에 뜨는
// 문제가 있었음. Selection의 focus(드래그가 끝난 쪽 - 방향에 따라 시작일 수도 끝일 수도
// 있음, 항상 "마지막으로 커서가 있던 지점")를 기준으로, 그 위치의 글자 하나(0폭 지점은
// 사각형이 안 잡힐 때가 있어 안정적으로 바로 앞 글자를 씀)의 사각형을 정확히 재서 씀.
function getSelectionFocusRect(sel){
  try{
    const node = sel.focusNode;
    let offset = sel.focusOffset;
    if(!node) return null;
    const range = document.createRange();
    if(node.nodeType === Node.TEXT_NODE && offset > 0){
      range.setStart(node, offset - 1);
      range.setEnd(node, offset);
    } else {
      range.setStart(node, offset);
      range.setEnd(node, offset);
    }
    const rects = range.getClientRects();
    if(rects.length) return rects[rects.length - 1];
  }catch(e){ /* 아래에서 폴백 처리 */ }
  return null;
}
function hideHighlightFloatBtn(){
  clearTimeout(highlightBtnShowTimer);
  highlightFloatBtn.classList.remove('show', 'cancel-mode', 'flip-down');
  pendingHighlight = null;
}
// 선택을 유지한 채로 스크롤하면(문장이 길어서 위아래로 움직이며 고르는 경우 등),
// 텍스트는 화면에서 움직이는데 버튼은 fixed라 제자리에 남아 어긋나 보일 수 있음 -
// 그래서 스크롤할 때마다 지금 선택된 범위를 다시 재서 위치를 새로 맞춤.
scrollRegionEl.addEventListener('scroll', () => {
  if(!pendingHighlight || !highlightFloatBtn.classList.contains('show')) return;
  const sel = window.getSelection();
  if(!sel || sel.isCollapsed || sel.rangeCount === 0) return;
  const rect = getSelectionFocusRect(sel) || sel.getRangeAt(0).getBoundingClientRect();
  positionHighlightFloatBtn(rect, highlightFloatBtn.classList.contains('cancel-mode'));
});

// 선택이 계속 바뀌는 동안(드래그 중)에는 매번 곧바로 버튼을 옮기지 않고, 잠시 멈춘 뒤에야
// 뜨게 함 - 예전엔 드래그 중에도 매 순간 실시간으로 버튼이 텍스트 위로 따라다녔는데,
// 그러면서 버튼 자체가 마우스가 지나가는 자리를 계속 가로막아 드래그 자체가 버벅이고
// (실제로 겪은 "드드득거리며 다른 문장까지 왕창 선택됨" 현상) 정확한 선택이 어려웜.
// Enter 지름길은 즉각 반응해야 하니 pendingHighlight 자체는 매번 바로 갱신하고,
// "버튼을 화면에 띄우는 것"만 따로 늦춤.
let highlightBtnShowTimer = null;
document.addEventListener('selectionchange', () => {
  if(viewMode === 'view') return; // 보기 모드에선 칠하기 자체를 안 함
  const sel = window.getSelection();
  if(!sel || sel.isCollapsed || !sel.toString().trim()){
    clearTimeout(highlightBtnShowTimer);
    hideHighlightFloatBtn();
    return;
  }
  const range = sel.getRangeAt(0);
  const anchorEl = range.commonAncestorContainer.nodeType === 1
    ? range.commonAncestorContainer
    : range.commonAncestorContainer.parentElement;
  const textEl = anchorEl ? anchorEl.closest('.quote-text') : null;
  if(!textEl){
    clearTimeout(highlightBtnShowTimer);
    hideHighlightFloatBtn();
    return;
  }

  const start = getTextOffset(textEl, range.startContainer, range.startOffset);
  const end = getTextOffset(textEl, range.endContainer, range.endOffset);
  if(start === end){
    clearTimeout(highlightBtnShowTimer);
    hideHighlightFloatBtn();
    return;
  }

  const block = textEl.closest('.quote-block');
  const rangeStart = Math.min(start, end);
  const rangeEnd = Math.max(start, end);
  pendingHighlight = { sentenceId: block.dataset.id, start: rangeStart, end: rangeEnd };

  // 드래그 중엔 이 지점까지만 하고, 실제 버튼 표시는 아래 타이머가 늦춰서 처리함 -
  // 그동안엔 화면에 뜬 버튼이 없어서 드래그하는 손을 전혀 방해하지 않음.
  clearTimeout(highlightBtnShowTimer);
  highlightBtnShowTimer = setTimeout(() => {
    // 타이머가 실행되는 시점엔 선택이 이미 바뀌었거나 풀렸을 수 있어 다시 한번 확인함
    const curSel = window.getSelection();
    if(!curSel || curSel.isCollapsed || !curSel.toString().trim() || !pendingHighlight) return;
    const s = findSentence(pendingHighlight.sentenceId);
    const existing = (s && Array.isArray(s.highlights)) ? s.highlights : [];
    const overlapping = existing.some(h => pendingHighlight.start < h.end && pendingHighlight.end > h.start);
    // 드래그를 놓은 지점(focus) 기준으로 위치를 잡되, 혹시 못 구했으면(엣지케이스) 예전처럼
    // 선택 영역 전체 경계로 폴백함 - 항상 어딘가엔 뜨도록 안전장치
    const focusRect = getSelectionFocusRect(curSel) || curSel.getRangeAt(0).getBoundingClientRect();
    positionHighlightFloatBtn(focusRect, overlapping);
  }, 300); // 드래그가 멈춘 뒤 이 정도는 지나야 "선택을 끝냈다"고 보고 버튼을 보여줌
});

// 버튼을 누르는 순간 mousedown에서 선택이 풀려버리는 것을 막음
highlightFloatBtn.addEventListener('mousedown', (e) => e.preventDefault());
// 실제로 칠하는 동작 - 버튼 클릭과 "드래그한 채로 엔터" 둘 다 이 함수를 씀
async function applyPendingHighlight(){
  if(!pendingHighlight) return;
  const s = findSentence(pendingHighlight.sentenceId);
  if(s){
    const existing = Array.isArray(s.highlights) ? s.highlights : [];
    s.highlights = toggleHighlightRange(existing, { start: pendingHighlight.start, end: pendingHighlight.end });
    await saveAll();
    renderArchive();
  }
  window.getSelection().removeAllRanges();
  hideHighlightFloatBtn();
}
highlightFloatBtn.addEventListener('click', applyPendingHighlight);
addQuoteTriggerBtn.addEventListener('click', async () => {
  if(HAS_ONSCREEN_KEYBOARD && viewMode === 'edit') return; // 이 상태(메모 화면)에서는 이 버튼이 화면에 없음 - 이중 안전장치
  if(viewMode === 'view'){
    openSearchSheet();
    return;
  }
  // PC 편집 모드에서 평소 문장 추가는 이제 채팅형 입력줄이 대신함 - 버튼은 그 칸으로 초점만 옮겨줌
  composeTextInput.focus();
});
// 드래그로 문장을 선택한 채로 엔터를 치면, 마우스로 플로팅 버튼까지 옮겨가지 않아도
// 바로 칠해짐 - 드래그가 끝난 손이 이미 키보드 위에 있는 경우가 많아서 지름길이 됨.
// (버튼을 없애는 게 아니라 같은 결과로 가는 방법을 하나 더 두는 것뿐이라 안전함)
document.addEventListener('keydown', (e) => {
  if(e.key !== 'Enter' || e.defaultPrevented) return;
  if(!pendingHighlight) return;
  const tag = document.activeElement ? document.activeElement.tagName : '';
  if(['INPUT', 'TEXTAREA', 'BUTTON', 'A'].includes(tag)) return; // 다른 칸에 입력 중이면 그쪽 엔터가 우선
  e.preventDefault();
  applyPendingHighlight();
});

// ── 맞춤법 확인 (전체 카테고리, 아직 점검 안 한 문장만 AI로 일괄 점검) ──────
// Worker에 이미 있던 /classify(Anthropic 프록시)를 그대로 재사용함 - Worker 재배포 불필요.
let pendingCorrections = []; // [{ key, entryId, sentenceIdx(전체 비교면 null), category, original, corrected }]

// 마침표/물음표/느낌표(+ 뒤따르는 닫는 인용부호) 기준으로 한 문단을 문장 단위로 쪼갬
function splitSentences(text){
  const matches = text.match(/[^.!?]*[.!?]+["'”’」』]*|[^.!?]+$/g) || [];
  return matches.map(s => s.trim()).filter(Boolean);
}

// 문자 단위 diff (LCS 기반) - 원문/수정본에서 실제로 달라진 글자만 표시하기 위함.
// 문장 전체를 다 그어버리면 뭐가 바뀐 건지 찾기 힘드니, 진짜 다른 부분만 표시함.
function computeCharDiff(a, b){
  const m = a.length, n = b.length;
  const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for(let i = 1; i <= m; i++){
    for(let j = 1; j <= n; j++){
      dp[i][j] = a[i-1] === b[j-1] ? dp[i-1][j-1] + 1 : Math.max(dp[i-1][j], dp[i][j-1]);
    }
  }
  const ops = [];
  let i = m, j = n;
  while(i > 0 && j > 0){
    if(a[i-1] === b[j-1]){ ops.push({ type: 'equal', ch: a[i-1] }); i--; j--; }
    else if(dp[i-1][j] >= dp[i][j-1]){ ops.push({ type: 'delete', ch: a[i-1] }); i--; }
    else { ops.push({ type: 'insert', ch: b[j-1] }); j--; }
  }
  while(i > 0){ ops.push({ type: 'delete', ch: a[--i] }); }
  while(j > 0){ ops.push({ type: 'insert', ch: b[--j] }); }
  ops.reverse();
  return ops;
}

// diff 결과를 원문 줄/수정본 줄 각각의 HTML로 만듦 - 달라진 글자만 색칠/취소선 처리
function renderCharDiffHtml(original, corrected){
  const ops = computeCharDiff(original, corrected);
  let origHtml = '';
  let correctedHtml = '';
  ops.forEach(op => {
    const escaped = escapeHtml(op.ch);
    if(op.type === 'equal'){
      origHtml += escaped;
      correctedHtml += escaped;
    } else if(op.type === 'delete'){
      origHtml += `<span class="diff-del">${escaped}</span>`;
    } else if(op.ch === ' '){
      // 공백 삽입(띄어쓰기 추가)은 하이라이트만으로는 잘 안 보이므로 V 표시로 눈에 띄게 함
      correctedHtml += `<span class="diff-space-mark" title="띄어쓰기 추가">V</span> `;
    } else {
      correctedHtml += `<span class="diff-ins">${escaped}</span>`;
    }
  });
  return { origHtml, correctedHtml };
}

const SPELLCHECK_CHUNK_SIZE = 10; // 한 번에 너무 많이 보내면 응답이 중간에 잘려 조용히 실패할 수 있어 작은 묶음으로 나눔

function chunkArray(arr, size){
  const chunks = [];
  for(let i = 0; i < arr.length; i += size) chunks.push(arr.slice(i, i + size));
  return chunks;
}

async function requestSpellCheckChunk(chunkList){
  // 문장 안에 줄바꿈이 있으면 아래 "한 줄에 하나씩" 파싱이 깨지므로 미리 공백으로 정리함
  const payload = chunkList.map(s => ({ id: s.id, text: s.text.replace(/\r?\n/g, ' ') }));
  const prompt = `다음은 책에서 옮겨 적은 문장들입니다. 각 문장에서 명백한 오타, 맞춤법 오류, 띄어쓰기 오류만 고쳐주세요.
문장 끝에 마침표(. ? !)가 빠져 있으면 자연스럽게 붙여주세요.
따옴표(' " ' " 등)는 원문에 있는 그대로 두고 절대 바꾸지 마세요 - 스타일이 다르거나 짝이 안 맞아 보여도 오류가 아닙니다.
원문의 표현, 어투, 의미는 절대 바꾸지 마세요 - 실제로 틀린 부분만 고쳐야 합니다.

문장 목록(JSON):
${JSON.stringify(payload)}

수정 결과를 한 줄에 하나씩, 아래 형식으로만 출력하세요. 각 줄은 "id" 다음에 "|||" 다음에 "수정된 문장" 순서입니다.
설명, 번호, 마크다운 없이 이 형식의 줄들만 출력하세요 (문장 안에 큰따옴표나 특수문자가 있어도 그대로 쓰면 됩니다):
id|||수정된 문장`;

  const res = await fetch(WORKER_URL + '/classify', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-6',
      max_tokens: 4000,
      messages: [{ role: 'user', content: prompt }]
    })
  });

  if(!res.ok) throw new Error('요청 실패: ' + res.status);
  const data = await res.json();
  const rawText = (data.content || []).map(b => b.text || '').join('');

  const corrections = rawText
    .split('\n')
    .map(line => line.trim())
    .filter(Boolean)
    .map(line => {
      const sepIdx = line.indexOf('|||');
      if(sepIdx === -1) return null;
      return {
        id: line.slice(0, sepIdx).trim(),
        text: line.slice(sepIdx + 3).trim()
      };
    })
    .filter(Boolean);

  if(corrections.length === 0) throw new Error('응답에서 유효한 줄을 찾지 못함');
  return corrections;
}

function showSpellError(message){
  spellErrorMessage.textContent = message;
  spellErrorOverlay.classList.add('open');
}
spellErrorCloseBtn.addEventListener('click', () => {
  spellErrorOverlay.classList.remove('open');
});
spellErrorOverlay.addEventListener('click', (e) => {
  if(e.target === spellErrorOverlay) spellErrorOverlay.classList.remove('open');
});

async function runSpellCheck(){
  // [1] 이미 점검했던 문장은 다시 보내지 않음. [3] 카테고리 구분 없이 전체 대상.
  const list = sentences.filter(s => !s.spellChecked);
  if(list.length === 0){
    showToast('새로 점검할 문장이 없어요');
    return;
  }

  spellCheckBtn.disabled = true;

  const chunks = chunkArray(list, SPELLCHECK_CHUNK_SIZE);
  const diffItems = [];
  const errorMessages = [];
  let successCount = 0;

  for(let i = 0; i < chunks.length; i++){
    const chunk = chunks[i];
    spellCheckBtn.textContent = chunks.length > 1 ? `점검 중... (${i + 1}/${chunks.length})` : '점검 중...';

    try{
      const corrections = await requestSpellCheckChunk(chunk);

      // 이 묶음은 성공했으니 점검 완료로 표시하고 바로 저장.
      // 실패한 묶음은 건드리지 않아서, 다음에 버튼을 누르면 그 문장들만 다시 시도됨.
      chunk.forEach(s => { s.spellChecked = true; });
      await saveAll();
      successCount++;

      // [4] 문단 전체가 아니라 문장 단위로 쪼개서 비교 - 실제로 달라진 문장만 모음
      corrections.forEach(c => {
        const orig = chunk.find(s => s.id === c.id);
        if(!orig || typeof c.text !== 'string') return;
        const correctedFull = c.text.trim();
        if(!correctedFull || correctedFull === orig.text.trim()) return;

        const origSentences = splitSentences(orig.text);
        const correctedSentences = splitSentences(correctedFull);

        if(origSentences.length > 0 && origSentences.length === correctedSentences.length){
          origSentences.forEach((os, idx) => {
            const cs = correctedSentences[idx];
            if(os.trim() !== cs.trim()){
              diffItems.push({
                key: `${c.id}:${idx}`,
                entryId: c.id,
                sentenceIdx: idx,
                category: orig.category,
                original: os,
                corrected: cs
              });
            }
          });
        } else {
          // 문장 개수가 서로 안 맞으면 안전하게 전체를 통째로 비교
          diffItems.push({
            key: `${c.id}:whole`,
            entryId: c.id,
            sentenceIdx: null,
            category: orig.category,
            original: orig.text,
            corrected: correctedFull
          });
        }
      });
    }catch(e){
      const msg = (e && e.message) ? e.message : String(e);
      console.error(`맞춤법 확인 실패 (묶음 ${i + 1}/${chunks.length}):`, e);
      errorMessages.push(`묶음 ${i + 1}/${chunks.length}: ${msg}`);
    }
  }

  spellCheckBtn.disabled = false;
  spellCheckBtn.textContent = '맞춤법 확인하기';

  if(successCount === 0 && errorMessages.length > 0){
    showSpellError('맞춤법 확인에 실패했어요. 아래 내용을 캡처해서 알려주시면 원인을 더 정확히 찾을 수 있어요.\n\n' + errorMessages.join('\n'));
    return;
  }
  if(diffItems.length === 0){
    showToast('고칠 부분을 찾지 못했어요', 2200);
    return;
  }

  openSpellCheckReview(diffItems);
  if(errorMessages.length > 0){
    showToast(`일부는 확인하지 못했어요 (${errorMessages.length}개 묶음 실패, 다음에 다시 시도돼요)`, 3200);
  }
}
spellCheckBtn.addEventListener('click', runSpellCheck);

function openSpellCheckReview(diffItems){
  pendingCorrections = diffItems;
  spellCheckList.innerHTML = diffItems.map(item => {
    const { origHtml, correctedHtml } = renderCharDiffHtml(item.original, item.corrected);
    return `
      <div class="spell-check-item">
        <label class="spell-check-item-header">
          <input type="checkbox" class="spell-check-checkbox" data-key="${item.key}" checked>
          <div class="spell-check-texts">
            <span class="spell-check-category" style="color:${getCategoryColor(item.category)}">${item.category}</span>
            <div class="spell-check-original">${origHtml}</div>
            <div class="spell-check-corrected">${correctedHtml}</div>
          </div>
        </label>
      </div>
    `;
  }).join('');
  spellCheckOverlay.classList.add('open');
  lockBodyScroll();
}
function closeSpellCheckReview(){
  spellCheckOverlay.classList.remove('open');
  unlockBodyScroll();
  pendingCorrections = [];
}
spellCheckOverlay.addEventListener('click', (e) => {
  if(e.target === spellCheckOverlay) closeSpellCheckReview();
});

spellCheckApplyBtn.addEventListener('click', async () => {
  const checkedKeys = new Set(
    Array.from(spellCheckList.querySelectorAll('.spell-check-checkbox:checked')).map(el => el.dataset.key)
  );

  if(checkedKeys.size === 0){
    closeSpellCheckReview();
    return;
  }

  // entryId별로 모아서, 문장 단위 항목이면 원본 문장 배열 중 체크된 것만 교체해 재조립함
  const byEntry = {};
  pendingCorrections.forEach(item => {
    if(!byEntry[item.entryId]) byEntry[item.entryId] = [];
    byEntry[item.entryId].push(item);
  });

  let appliedCount = 0;
  Object.keys(byEntry).forEach(entryId => {
    const items = byEntry[entryId];
    const s = findSentence(entryId);
    if(!s) return;

    const isWholeEntry = items.length === 1 && items[0].sentenceIdx === null;
    if(isWholeEntry){
      if(checkedKeys.has(items[0].key)){
        // 맞춤법 교정은 보통 글자 몇 개만 바뀌므로, 칠해둔 부분은 최대한 살려서 옮김
        s.highlights = remapHighlights(s.text, items[0].corrected, s.highlights);
        s.text = items[0].corrected;
        appliedCount++;
      }
      return;
    }

    const origSentences = splitSentences(s.text);
    let changedAny = false;
    items.forEach(item => {
      if(checkedKeys.has(item.key) && origSentences[item.sentenceIdx] !== undefined){
        origSentences[item.sentenceIdx] = item.corrected;
        changedAny = true;
        appliedCount++;
      }
    });
    if(changedAny){
      const newText = origSentences.join(' ');
      s.highlights = remapHighlights(s.text, newText, s.highlights);
      s.text = newText;
    }
  });

  await saveAll();
  closeSpellCheckReview();
  renderArchive();
  showToast(appliedCount > 0 ? `✓ ${appliedCount}개 문장을 수정했어요` : '적용된 변경사항이 없어요');
});

const splashOverlay = document.getElementById('splashOverlay');
const SPLASH_MIN_MS = 700; // 데이터가 순식간에 로드돼도 로고가 최소 이 정도는 보이도록 함
const splashStart = Date.now();

loadAll().then(() => {
  const wait = Math.max(0, SPLASH_MIN_MS - (Date.now() - splashStart));
  setTimeout(() => {
    splashOverlay.classList.add('hide');
  }, wait);
});
</script>
