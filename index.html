<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>soooo.zip</title>
<link rel="icon" type="image/png" id="faviconLink">
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root{
    --bg: #FFFFFF;
    --surface: #FCFCFC;
    --text: #181818;
    --text-secondary: #666666;
    --text-tertiary: #A0A0A0;
    --border: #ECECEC;
    --category-color: #C6F24E;
    --compose-color: #C6F24E;
    --hover: #F5F5F5;
    --danger: #B23A2E;
    --danger-soft: #F5E6E4;
    --highlight-bg: #FFF176;
    --highlight-text: #2E7D32;
    --cancel-bg: #FFEBEE;
    --cancel-text: #C62828;
  }
  *{ box-sizing: border-box; }
  html{
    /* 스크롤바가 있고 없고에 따라 화면 폭이 미세하게 바뀌면서 콘텐츠가 좌우로
       움찔거리는 걸 막기 위해, 스크롤바 자리를 항상 비워둠. 모달을 열어 스크롤이
       잠기거나(body가 fixed가 되며 스크롤바가 사라짐), 문장이 늘어 스크롤이
       생기거나 하는 두 경우 다 이걸로 해결됨. */
    overflow-y: scroll;
    scrollbar-gutter: stable;
  }
  html,body{
    margin:0; padding:0;
    width: 100%;
    max-width: 100%;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", sans-serif;
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
  }
  body.modal-open{
    overflow: hidden;
    touch-action: none;
  }
  html.modal-open-html{
    overflow: hidden !important;
    touch-action: none;
  }
  /* ⚠️ 아이폰 사파리는 overflow:hidden 만으로는 뒤 화면 스크롤이 막히지 않음(사파리의 알려진 한계).
     그래서 창이 떠 있는 동안엔 "읽던 화면 판"을 그 자리에 통째로 고정시켜버림 - 이게 실제로
     듣는 유일한 방법.
     예전에 이 방식으로 주소창이 꼬이는 문제가 있었는데, 그건 화면 전체(body)를 고정했기 때문이었음.
     여기서는 읽기 화면 판(.scroll-region)만 고정하고 팝업·메모화면은 그대로 두므로 그 문제가 없음.
     고정하는 순간 판이 맨 위로 튀어 올라가지 않게, 읽던 위치만큼 위로 끌어올려서(top: -Npx)
     눈에 보이는 자리는 그대로 유지함. */
  body.bg-frozen .scroll-region{
    position: fixed;
    left: 0;
    right: 0;
    width: 100%;
    overflow: hidden;
  }

  .wrap{
    width: 100%;
    max-width: 700px;
    margin: 0 auto;
    /* 아래 여백을 넉넉하게 둠 - 사파리는 주소창이 다시 나타날 때 "지금 보이는 영역"만
       줄어들 뿐 문서 스크롤 위치 자체는 그대로라서, 아래 뜬 탭이 위로 좁혀 들어오는 만큼
       목록 마지막 줄과 겹칠 수 있음(방향키 값 추적만으로는 못 막음 - 근본적으로 스크롤과
       화면에 실제 보이는 영역이 서로 다른 기준이라 생기는 어긋남). 탭 높이보다 충분히
       크게 잡아서, 그 어긋남이 생겨도 항상 여유 있게 안 닿도록 함. */
    padding: max(28px, env(safe-area-inset-top)) 22px 260px;
  }
  /* 평소엔 그냥 투명한 감싸개일 뿐이고(폭도 안 건드림), 컴퓨터 편집 모드일 때만
     화면 전체 폭짜리 스크롤 판이 됨(위 CSS 참고) */
  .scroll-region{ width: 100%; }

  /* ── 시작 스플래시 화면 ─────────────────────── */
  .splash-overlay{
    position: fixed;
    inset: 0;
    z-index: 500;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.4s ease;
  }
  .splash-overlay.hide{
    opacity: 0;
    pointer-events: none;
  }
  .splash-logo{
    width: 108px;
    height: 108px;
    animation: splashPop 0.35s ease-out;
  }
  @keyframes splashPop{
    from{ opacity: 0; transform: scale(0.9); }
    to{ opacity: 1; transform: scale(1); }
  }

  /* ── 보관함 (카테고리별 문장 목록) - 메인 화면 ──── */
  .archive-header{
    display: flex;
    justify-content: center;
    margin-bottom: 24px;
    position: relative;
  }
  .archive-header img{
    width: 40px;
    height: 40px;
    display: block;
    cursor: pointer;
  }
  /* 평소엔 완전히 안 보이다가, 서버 재시도를 기다리는 동안에만 로고 우상단에 아주
     작게 나타남 - 정상일 때 뭔가 보이면 그게 오히려 노이즈라는 원칙으로 최대한 조용하게 */
  .sync-pending-dot{
    display: none;
    position: absolute;
    top: 1px;
    left: 50%;
    margin-left: 11px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #FFD874;
    box-shadow: 0 0 0 2px var(--bg);
  }
  .sync-pending-dot.show{ display: block; }
  /* 로고를 누르면 보기/편집 모드가 전환됨 - 화면 전체가 아주 잠깐 흐려졌다 돌아옴 */
  @keyframes modeSwitchFade{
    0%{ opacity: 1; }
    45%{ opacity: 0.62; }
    100%{ opacity: 1; }
  }
  .wrap.mode-switch-fade{ animation: modeSwitchFade 0.36s ease; }
  /* 모드가 바뀌면서 우하단 아이콘(+/돋보기)이 통통 튀듯 나타남 */
  @keyframes fabIconPop{
    0%{ transform: scale(1); }
    45%{ transform: scale(0.82); opacity: 0.5; }
    100%{ transform: scale(1); opacity: 1; }
  }
  .fab-icon-pop{ animation: fabIconPop 0.32s cubic-bezier(.2,.8,.3,1); }
  .archive-list{ max-width: 620px; margin: 0 auto; }
  /* 카테고리를 바꿀 때 아주 살짝 좌우로 미끄러지는 느낌 (토스 스타일의 미세한 전환) */
  @keyframes catOutToLeft{ to{ transform: translateX(-10px); opacity: 0; } }
  @keyframes catOutToRight{ to{ transform: translateX(10px); opacity: 0; } }
  @keyframes catInFromRight{ from{ transform: translateX(10px); opacity: 0; } to{ transform: translateX(0); opacity: 1; } }
  @keyframes catInFromLeft{ from{ transform: translateX(-10px); opacity: 0; } to{ transform: translateX(0); opacity: 1; } }
  .archive-list.cat-anim-out-l{ animation: catOutToLeft 0.13s ease forwards; }
  .archive-list.cat-anim-out-r{ animation: catOutToRight 0.13s ease forwards; }
  .archive-list.cat-anim-in-r{ animation: catInFromRight 0.24s cubic-bezier(.22,.7,.3,1); }
  .archive-list.cat-anim-in-l{ animation: catInFromLeft 0.24s cubic-bezier(.22,.7,.3,1); }

  /* 문장 목록 맨 아래 - 맞춤법 확인 트리거 */
  .spell-check-trigger{
    display: block;
    width: 100%;
    max-width: 560px;
    margin: 24px auto 0;
    padding: 8px 0;
    border: none;
    background: none;
    color: var(--text-tertiary);
    font-family: 'Pretendard', sans-serif;
    font-size: 11.5px;
    font-weight: 500;
    cursor: pointer;
  }
  .spell-check-trigger:disabled{ opacity: 0.5; cursor: default; }
  /* 보기 모드에서는 고치는 기능 버튼을 감춤 */
  body.mode-view .spell-check-trigger{ display: none; }

  /* ── 편집 모드 비밀번호 ─────────────────────── */
  .bottom-sheet.passcode-sheet{
    max-width: 460px;
    position: relative; /* 별자리보다 위에 뜨도록(z-index 기준을 여기서 잡음) */
    z-index: 1;
    /* 박스 자체는 또렷한 카드로 남아야 하니 배경을 확실히 깔아서 뒤 별자리가 안 비치게 함 */
    background: var(--bg);
  }
  .passcode-sheet .sheet-body{
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 56px 40px 46px;
    min-height: 320px;
    justify-content: center;
  }
  /* 오로라처럼 천천히 흐르는 그라데이션 - 로고에 쓰인 색(카테고리 4색과 동일 팔레트)을
     그대로 가져와서, 로고가 배경으로 은은하게 번진 듯한 느낌. 2026년 기준 AI 제품들이
     많이 쓰는 "메시 그라데이션 / 오로라" 스타일 참고함(Stripe, Apple Music 등).
     팝업 박스 "안"이 아니라 화면 전체(오버레이)를 덮어서, 박스는 그 위에 뜬 또렷한
     카드로 보이고 그 주변 화면에서 색이 흐르는 구조. */
  .passcode-aurora{
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: 0;
    pointer-events: none;
  }
  .passcode-aurora-blob{
    position: absolute;
    width: 42vmax;
    height: 42vmax;
    border-radius: 50%;
    filter: blur(70px);
    opacity: 0.4;
    will-change: transform;
  }
  .passcode-aurora-blob.b1{
    top: -12%; left: -14%;
    background: radial-gradient(circle, #7FD8F0, transparent 70%);
    animation: auroraDrift1 15s ease-in-out infinite;
  }
  .passcode-aurora-blob.b2{
    bottom: -18%; right: -12%;
    background: radial-gradient(circle, #FF9EC4, transparent 70%);
    animation: auroraDrift2 19s ease-in-out infinite;
  }
  .passcode-aurora-blob.b3{
    top: 22%; right: 8%;
    width: 34vmax; height: 34vmax;
    background: radial-gradient(circle, #C6F24E, transparent 70%);
    animation: auroraDrift3 13s ease-in-out infinite;
  }
  .passcode-aurora-blob.b4{
    bottom: 8%; left: 10%;
    width: 30vmax; height: 30vmax;
    background: radial-gradient(circle, #FFAB91, transparent 70%);
    animation: auroraDrift1 17s ease-in-out infinite reverse;
  }
  @keyframes auroraDrift1{
    0%, 100%{ transform: translate(0,0) scale(1); }
    33%{ transform: translate(6vmax, 4vmax) scale(1.12); }
    66%{ transform: translate(-3vmax, 7vmax) scale(0.94); }
  }
  @keyframes auroraDrift2{
    0%, 100%{ transform: translate(0,0) scale(1); }
    50%{ transform: translate(-7vmax, -5vmax) scale(1.15); }
  }
  @keyframes auroraDrift3{
    0%, 100%{ transform: translate(0,0) scale(1); }
    40%{ transform: translate(5vmax, -6vmax) scale(1.08); }
    70%{ transform: translate(-4vmax, -2vmax) scale(0.92); }
  }
  @media (prefers-reduced-motion: reduce){
    .passcode-aurora-blob{ animation: none !important; }
  }
  .passcode-lock{
    color: var(--text-tertiary);
    margin-bottom: 16px;
    position: relative;
    transition: color 0.25s ease, transform 0.3s ease;
  }
  .passcode-lock svg{ width: 30px; height: 30px; }

  /* 시네마틱하게: 밝기가 한 번 세졌다가 사라지는 구간이 있으면(오로라가 부풀며 진해지는
     부분) 그게 "번쩍"하는 느낌으로 읽힘 - 그래서 이번엔 밝기가 오르는 구간을 완전히 없애고,
     대신 "초점이 빠지며 멀어지는" 느낌(블러 + 살짝 커짐)으로 깊이감을 냄. 카메라가 팬
     포커스를 옮기는 것과 같은 원리 - 카드는 흐려지며 멀어지고, 뒤 내용은 흐린 상태에서
     또렷하게 초점이 맞아 들어옴. 시간도 살짝 늘리고(0.55s) 더 부드러운 감속 곡선을 씀. */
  @keyframes passcodeCardDissolve{
    0%{ transform: scale(1); opacity: 1; filter: blur(0px); }
    100%{ transform: scale(1.05); opacity: 0; filter: blur(14px); }
  }
  @keyframes passcodeAuroraSweep{
    0%{ opacity: 0.38; }
    100%{ opacity: 0; }
  }
  @keyframes contentRevealIn{
    0%{ transform: scale(0.98); opacity: 0; filter: blur(10px); }
    100%{ transform: scale(1); opacity: 1; filter: blur(0px); }
  }
  .passcode-sheet.transitioning-out{
    animation: passcodeCardDissolve 0.55s cubic-bezier(.22,1,.36,1) forwards;
  }
  .passcode-aurora.transitioning-out .passcode-aurora-blob{
    animation: passcodeAuroraSweep 0.55s cubic-bezier(.22,1,.36,1) forwards;
  }
  .content-reveal-in{
    animation: contentRevealIn 0.5s cubic-bezier(.22,1,.36,1) 0.1s backwards;
  }
  @media (prefers-reduced-motion: reduce){
    .passcode-sheet.transitioning-out,
    .passcode-aurora.transitioning-out .passcode-aurora-blob,
    .content-reveal-in{ animation: none !important; }
  }
  .passcode-title{
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
  }
  .passcode-desc{
    margin-top: 7px;
    font-size: 15px;
    color: var(--text-tertiary);
  }
  .passcode-dots{
    display: flex;
    gap: 17px;
    margin-top: 30px;
    height: 16px;
  }
  .passcode-dot{
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: transparent;
    transition: background 0.16s ease, border-color 0.16s ease;
  }
  /* 방금 입력한 점 "하나만" 톡 튀어오름 - 예전엔 이 애니메이션이 .filled 전체에 걸려있어서,
     매번 다시 그릴 때마다 이미 채워둔 점들까지 같이 다시 튀어 정신없었음(막 입력한 것만
     반응해야 하는데 전부 반응). 그래서 "방금 채워진 바로 그 점"에만 별도 클래스로 붙임.
     바운스도 과했다는 얘기가 있어서 튀어오르는 폭을 확 줄임(1.35→1.2). */
  @keyframes passcodeDotFill{
    0%{ transform: scale(0.6); }
    55%{ transform: scale(1.2); }
    100%{ transform: scale(1.12); }
  }
  .passcode-dot.filled{
    background: var(--category-color);
    border-color: var(--category-color);
    transform: scale(1.12);
  }
  .passcode-dot.just-filled{
    animation: passcodeDotFill 0.24s cubic-bezier(.34,1.56,.64,1);
  }
  /* 실제 입력은 보이지 않는 칸이 받고, 화면에는 점만 보여줌 */
  .passcode-hidden-input{
    position: absolute;
    opacity: 0;
    pointer-events: none;
    width: 1px; height: 1px;
    font-size: 16px; /* iOS에서 포커스 시 화면이 확대되는 것 방지 */
  }
  .passcode-error{
    margin-top: 14px;
    font-size: 12px;
    color: var(--danger);
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  .passcode-error.show{ opacity: 1; }
  @keyframes passcodeShake{
    0%,100%{ transform: translateX(0); }
    20%{ transform: translateX(-7px); }
    40%{ transform: translateX(7px); }
    60%{ transform: translateX(-4px); }
    80%{ transform: translateX(4px); }
  }
  .passcode-dots.shake{ animation: passcodeShake 0.4s ease; }

  /* 비밀번호가 맞았을 때: 자물쇠가 열리고 점들이 잠깐 밝아졌다가 시트가 닫힘 */
  .sheet-overlay.unlocked .passcode-lock{
    color: var(--category-color);
    transform: translateY(-3px) scale(1.08);
    transition: color 0.25s ease, transform 0.3s cubic-bezier(.2,.8,.3,1);
  }
  .sheet-overlay.unlocked .passcode-dot{
    background: var(--category-color);
    border-color: var(--category-color);
    transform: scale(1.2);
  }
  .sheet-overlay.unlocked .bottom-sheet{
    opacity: 0;
    transform: scale(1.02) translateY(-4px);
    /* 자물쇠가 열리는 걸 충분히 본 뒤에 창이 사라지도록 늦춤 */
    transition: opacity 0.36s ease 0.5s, transform 0.36s ease 0.5s;
  }
  /* 잠긴 자물쇠와 열린 자물쇠를 같은 자리에 겹쳐두고, 비밀번호가 맞으면 바꿔 보여줌 */
  .passcode-lock .lock-open{
    position: absolute;
    top: 0; left: 0;
    opacity: 0;
    transform: scale(0.7);
  }
  .sheet-overlay.unlocked .passcode-lock .lock-closed{
    opacity: 0;
    transform: scale(0.7);
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  .sheet-overlay.unlocked .passcode-lock .lock-open{
    opacity: 1;
    /* 살짝 튀어오르며 "짠" 하고 열리는 느낌. 너무 빨리 지나가지 않게 여유를 둠 */
    transform: scale(1);
    transition: opacity 0.36s ease 0.14s, transform 0.5s cubic-bezier(.34,1.56,.64,1) 0.14s;
  }
  .passcode-lock .lock-closed{ transition: opacity 0.3s ease, transform 0.3s ease; }

  /* 시트 우측 상단 닫기 버튼 - 키보드가 올라오면 바깥을 누르기 어려워서 필요함 */
  .sheet-close-btn{
    position: absolute;
    top: 16px;
    right: 16px;
    width: 30px;
    height: 30px;
    border: none;
    background: none;
    color: var(--text-tertiary);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border-radius: 50%;
    cursor: pointer;
  }
  .sheet-close-btn:active{ background: var(--hover); color: var(--text); }

  /* 입력칸 위 안내 글 */
  .field-label{
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-tertiary);
    margin: 16px 0 7px;
  }
  .field-label:first-of-type{ margin-top: 4px; }

  /* ── 보기 모드 전용 검색 ─────────────────────── */
  /* 높이를 vh(화면 전체)로 잡으면 키보드가 올라왔을 때 실제 남은 공간보다 커져서
     시트가 위로 밀려 올라감. 부모(.bottom-sheet)가 이미 남은 공간에 맞춰 크기를
     제한하고 있으므로, 여기서는 그 안을 100%로 채우기만 함. */
  .search-sheet .sheet-body{
    position: relative;
    /* 아래쪽이 비어 보이지 않도록 위아래 여백을 같게 맞춤 */
    padding-bottom: 22px;
    display: flex;
    flex-direction: column;
    /* 부모(.bottom-sheet)가 flex 컨테이너라, max-height(%)로는 제대로 안 줄어듦.
       flex:1 + min-height:0 으로 남은 공간에 정확히 맞춰 줄어들게 함. */
    flex: 1 1 auto;
    min-height: 0;
  }
  .search-input-field{
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    font-family: 'Pretendard', sans-serif;
    font-size: 16px;
    color: var(--text);
    background: var(--surface);
    margin-bottom: 4px;
    flex-shrink: 0;
  }
  .search-input-field:focus{ outline: none; border-color: var(--text-tertiary); }
  .search-results-list{ overflow-y: auto; flex: 1; min-height: 0; margin-top: 8px; }
  .search-result-item{
    padding: 12px 2px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    text-align: left;
  }
  .search-result-item:last-child{ border-bottom: none; }
  .search-result-item:active{ background: var(--hover); }
  /* 키보드 위/아래로 고른 항목 - 회색 배경과 색 막대를 같이 쓰니 지저분해서,
     카테고리 색이 아주 옅게 깔리는 정도로만 표시함 */
  /* 키보드로 고른 항목 - 카테고리와 상관없이 늘 같은 색으로.
     글자색을 아주 옅게 깐 느낌이라 어떤 카테고리에서도 튀지 않음. */
  .search-result-item.active{
    background: rgba(24,24,24,0.06);
    border-radius: 8px;
  }
  .search-result-tag{
    display: inline-block;
    font-size: 10.5px;
    font-weight: 700;
    margin-bottom: 5px;
  }
  .search-result-text{
    font-size: 14px;
    line-height: 1.55;
    color: var(--text);
    word-break: keep-all;
  }
  .search-result-meta{
    margin-top: 5px;
    font-size: 11.5px;
    color: var(--text-tertiary);
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .search-result-bookmark{
    display: inline-flex;
    color: var(--category-color);
    flex-shrink: 0;
  }
  /* 검색 결과 안에서는 하이라이트를 눌러 지울 일이 없으므로 커서만 기본으로 되돌림 */
  .search-result-text .quote-highlight{ cursor: default; }
  .search-empty-hint{
    padding: 24px 2px;
    text-align: center;
    font-size: 13px;
    color: var(--text-tertiary);
  }
  /* 검색 결과를 눌러 이동했을 때, 그 문장이 잠깐 옅게 빛났다가 가라앉으며 눈에 띄게 함 */
  @keyframes searchJumpFlash{
    0%{ background: color-mix(in srgb, var(--category-color) 30%, white); }
    100%{ background: transparent; }
  }
  .quote-block.search-jump-flash{ animation: searchJumpFlash 1.6s ease; }

  /* 맞춤법 확인 결과 검토 목록 */
  .spell-check-item{
    border-bottom: 1px solid var(--border);
    padding: 14px 0;
  }
  .spell-check-item:last-child{ border-bottom: none; }
  .spell-check-item-header{
    display: flex;
    align-items: flex-start;
    gap: 10px;
    cursor: pointer;
  }
  .spell-check-checkbox{
    margin-top: 4px;
    flex-shrink: 0;
    width: 17px; height: 17px;
    accent-color: var(--category-color);
  }
  .spell-check-texts{ flex: 1; min-width: 0; }
  .spell-check-category{
    display: block;
    font-size: 10.5px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .spell-check-original{
    font-size: 13px;
    color: var(--text-tertiary);
    margin-bottom: 5px;
    line-height: 1.55;
    word-break: keep-all;
  }
  .spell-check-corrected{
    font-size: 14.5px;
    color: var(--text);
    line-height: 1.55;
    word-break: keep-all;
  }
  .diff-del{
    background: var(--cancel-bg);
    color: var(--cancel-text);
    text-decoration: line-through;
    border-radius: 2px;
  }
  .diff-ins{
    background: #E8F5E9;
    color: var(--highlight-text);
    font-weight: 700;
    border-radius: 2px;
  }
  .diff-space-mark{
    display: inline-block;
    color: var(--highlight-text);
    font-weight: 700;
    font-size: 10px;
    vertical-align: super;
    line-height: 1;
    margin: 0 1px;
  }

  .quote-block{
    position: relative;
    padding: 20px 0;
    cursor: pointer;  }
  .quote-block:active{ background: var(--hover); }
  .quote-block + .quote-block{
    border-top: 1px solid var(--border);
  }
  /* 문장을 추가/삭제할 때 목록이 갑자기 훅 바뀌지 않고 한 박자 부드럽게 이어지도록 함.
     거의 안 느껴질 정도로만 - 화려한 연출은 이 앱 톤이랑 안 맞아서 피함. */
  @keyframes quoteRiseIn{
    from{ opacity: 0; transform: translateY(6px); }
    to{ opacity: 1; transform: translateY(0); }
  }
  .quote-block.quote-just-added{
    animation: quoteRiseIn 0.25s ease;
  }
  .quote-block.quote-removing{
    overflow: hidden;
    opacity: 0;
    padding-top: 0;
    padding-bottom: 0;
    border-top-color: transparent;
    transition: height 0.22s ease, opacity 0.16s ease,
                padding 0.22s ease, border-color 0.22s ease;
  }
  /* 오래 안 만난 문장(스포트라이트)은 옅은 배경 칠로만 강조함(화면 끝까지 배경이 번짐).
     위/아래 여백을 정확히 맞추기 위해: 로고→스포트라이트 간격(archive-header의 margin-bottom)과
     스포트라이트→다음 문장 간격(margin-bottom)을 같은 값으로 맞추고, 다음 항목의 자체
     top padding은 0으로 상쇄시켜서 두 간격이 픽셀 단위로 동일해지도록 함. */
  .quote-block.spotlight-card{
    background: var(--spotlight-tint, #FBFEF3);
    margin: 0 -22px 24px;
    padding: 20px 22px;
  }
  .quote-block.spotlight-card + .quote-block{
    border-top: none;
    padding-top: 0;
  }
  .spotlight-label{
    font-size: 11.5px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 8px;
    padding-left: 18px;
  }
  .quote-text{
    border-left: 4px solid var(--category-color);
    padding-left: 14px;
    font-size: 16px;
    font-weight: 400;
    line-height: 1.6;
    color: var(--text);
    margin: 0;
    text-align: left;
    word-break: keep-all;
    overflow-wrap: break-word;
  }
  .quote-comment{
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin-top: 10px;
    padding-left: 18px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    line-height: 1.5;
  }
  .quote-comment-mark{
    display: inline-block;
    width: 10px;
    height: 2px;
    border-radius: 1px;
    background: var(--category-color);
    flex-shrink: 0;
    margin-top: 8px;
  }
  .quote-comment-text{
    word-break: keep-all;
  }
  .quote-meta-line{
    position: relative;
    margin-top: 10px;
    padding-left: 18px;
    font-size: 12px;
    color: var(--text-tertiary);
    min-height: 13px;
    display: flex;
    align-items: center;
  }
  /* 책갈피는 항상 세로 선과 같은 x위치(왼쪽 끝)에 고정되도록 절대 위치로 둠.
     출처/페이지 텍스트의 들여쓰기(padding-left:18px)와는 서로 영향을 주지 않아서,
     책갈피가 있든 없든 텍스트 위치는 항상 같고, 책갈피는 항상 선 바로 아래에 옴. */
  .quote-bookmark{
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    color: var(--category-color);
  }
  /* 추가된 지 24시간 안쪽인 문장에만 표시됨. 카테고리 색을 그대로 쓰면 파스텔톤이라
     작은 글자에서는 잘 안 보일 수 있어, 살짝 어둡게 섞어서 가독성을 확보함. */
  .quote-new-badge{
    color: color-mix(in srgb, var(--category-color) 60%, black);
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.02em;
    margin-right: 6px;
  }

  .empty{
    text-align:center;
    padding: 64px 20px;
    color: var(--text-tertiary);
    font-size: 13.5px;
    line-height: 1.9;
  }
  .empty-title{
    font-size: 14px;
    font-weight: 600;
    color: var(--text-secondary);
  }

  /* 아래 키로 문장 끝에 맞춰 멈춰도, 그 아래 여백에 다음 문장 글자가 두어 줄 비집고 들어와
     "중간에서 잘린" 것처럼 보였음. 딱 자르는 대신 서서히 흐려지게 해서 자연스럽게 마무리함.
     (카테고리 탭·버튼보다는 아래층에 있어서 그것들은 그대로 또렷하게 보임) */
  /* 떠 있는 요소들을 담는 판.
     높이를 100dvh(= 지금 실제로 보이는 화면 높이)로 두면, 주소창이 접히고 펴질 때
     브라우저가 알아서 갱신해줌. JavaScript로 뒤늦게 쫓아가지 않으니 버벅임이 없음. */
  .float-layer{
    position: fixed;
    left: 0; right: 0;
    top: 0;
    height: 100vh;    /* dvh를 모르는 옛 브라우저용 */
    height: 100dvh;
    /* 스크롤이 멈춘 뒤 JS가 한 번 더 정확히 잰 값이 있으면 그걸 우선 씀(관련 이유는
       syncFloatLayerHeightWhenSettled 주석 참고). 스크롤 중엔 이 값이 갱신되지 않으니
       dvh가 알아서 부드럽게 처리함. */
    height: var(--float-vh, 100dvh);
    pointer-events: none;
    z-index: 70;
  }
  .float-layer > *{ pointer-events: auto; }

  /* ── 컴퓨터 전용: Tab으로 목록 훑어보기에 들어갈 때 잠깐 뜨는 말풍선 ──────────
     예전엔 우상단에 숫자 배지가 늘 떠 있었는데, "평소에도 계속 보여서 시각적으로
     많다"는 얘기가 있어서 없앰. 손이 비는 순간(Tab으로 타이핑을 잠깐 멈출 때)에만
     "아 맞다 메모"하고 떠올릴 정도로만 짧게 알려주는 게 훨씬 조용함. */
  .compose-memo-hint{
    display: none;
    position: absolute;
    left: 50%;
    bottom: calc(100% + 14px);
    transform: translateX(-50%);
    background: #FFD874;
    color: var(--text);
    font-size: 13px;
    font-weight: 700;
    padding: 10px 16px;
    border-radius: 14px;
    white-space: nowrap;
    box-shadow: 0 6px 16px rgba(24,24,24,0.16);
    z-index: 3;
  }
  .compose-memo-hint::after{
    content: '';
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    border: 7px solid transparent;
    border-top-color: #FFD874;
  }
  @keyframes composeMemoHintPop{
    0%{ transform: translateX(-50%) scale(0.7); opacity: 0; }
    100%{ transform: translateX(-50%) scale(1); opacity: 1; }
  }
  .compose-memo-hint.show{
    display: block;
    animation: composeMemoHintPop 0.28s cubic-bezier(.34,1.56,.64,1);
  }
  /* 폰(터치 기기)에는 아예 안 둠 - Tab 자체가 컴퓨터 전용 동작이라 */
  @media (pointer: coarse){ .compose-memo-hint{ display: none !important; } }

  /* 편집 모드가 메모 화면으로 바뀐 폰에서는 탭·+버튼을 다 감춤 (메모 화면이 전부를 대체함) */
  body.mode-memo .category-tabs,
  body.mode-memo .add-quote-trigger-btn{ display: none !important; }
  /* 메모 화면이 뜬 동안 뒤(읽기 화면)가 같이 스크롤되지 않게 잠금.
     예전에 이걸 position:fixed + 스크롤 위치 강제 이동으로 처리했다가 아이폰 사파리에서
     주소창 상태가 꼬이는 심각한 버그가 났었음(편집 화면 갔다 오면 위치가 이상해지던 문제).
     그래서 그 방식은 다시 안 쓰고, overflow만 잠그는 훨씬 단순한 방식을 씀 - 이러면
     scrollTop이 그대로 보존돼 있어서 나중에 풀어도 자동으로 원래 있던 자리 그대로임
     (강제로 옮길 필요 자체가 없음). 컴퓨터 채팅줄에서 이미 검증된 것과 같은 방식. */
  /* 뒤 화면 잠금은 팝업과 똑같이 .bg-frozen 방식을 씀 (freezeBackground 참고) */

  /* ── 폰 전용 메모 화면 ─────────────────────────
     읽기 화면은 이미 여러 번 다듬어져서 그대로 두고, 이 화면만 완전히 새로 그림.
     목록도 탭도 없이 입력칸 두 개뿐이라 구조가 단순해서, 지금까지 골치였던
     "떠 있는 요소 위치" 문제 자체가 생기지 않음 (뭔가 떠 있을 이유가 없음). */
  .memo-screen{
    position: fixed;
    inset: 0;
    height: 100vh;    /* dvh를 모르는 옛 브라우저용 */
    height: 100dvh;
    background: var(--bg);
    z-index: 60;      /* float-layer(70)보다 낮게 둬서, 저장 알림(토스트)은 이 화면 위로도 계속 보임 */
    display: none;
    flex-direction: column;
  }
  body.mode-memo .memo-screen{ display: flex; }
  .memo-screen-top{
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
    padding: max(20px, env(safe-area-inset-top)) 18px 14px;
    border-bottom: 1px solid var(--border);
  }
  .memo-exit-btn{
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    border: none; background: none; color: var(--text);
    border-radius: 50%;
    padding: 0;
    cursor: pointer;
  }
  .memo-exit-btn:active{ background: var(--hover); }
  .memo-screen-title{ font-size: 15.5px; font-weight: 700; flex: 1; }
  .memo-screen-count{ font-size: 12px; color: var(--text-tertiary); }
  .memo-screen-body{
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 30px 22px calc(30px + env(safe-area-inset-bottom));
  }
  .memo-field-label{
    font-size: 13px;
    font-weight: 600;
    color: var(--text-tertiary);
    margin: 22px 0 8px;
  }
  .memo-field-label:first-child{ margin-top: 4px; }
  .memo-big-input{
    width: 100%;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 15px 16px;
    font-size: 16px;   /* iOS 자동 확대 방지 */
    font-family: 'Pretendard', sans-serif;
    color: var(--text);
    background: var(--surface);
  }
  .memo-big-input:focus{ outline: none; border-color: var(--category-color); }
  .memo-big-input.shake{ animation: passcodeShake 0.4s ease; }
  .memo-save-btn{
    width: 100%;
    margin-top: 30px;
    padding: 16px 0;
    border: none;
    border-radius: 14px;
    background: var(--category-color);
    color: var(--text);
    font-family: 'Pretendard', sans-serif;
    font-size: 15.5px;
    font-weight: 700;
    cursor: pointer;
  }
  .memo-save-btn:active{ transform: scale(0.98); }

  /* ── 컴퓨터 편집 모드 전용: 채팅형 입력줄 ─────────────────────
     클로드 입력창과 같은 구조: 입력칸이 위에서 위로 자라나고, 상태 줄(카테고리·페이지·출처)과
     전송 버튼은 항상 맨 아래에 고정됨 - 문장을 아무리 많이 쳐도 버튼 위치가 안 움직임. */
  .compose-bar{
    display: none;
    position: fixed;
    left: 50%;
    bottom: max(20px, env(safe-area-inset-bottom));
    transform: translateX(-50%) scale(1);
    width: min(700px, calc(100% - 40px));
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(24,24,24,0.12);
    padding: 12px 12px 10px;
    z-index: 65;
    opacity: 1;
    /* 입력줄에서 초점이 빠지면("문장 집중 모드") 살짝 흐려지고 작아져서,
       지금 화살표가 문장 훑어보기에 쓰이는 중이라는 걸 은은하게 알려줌 */
    transition: opacity 0.22s ease, transform 0.22s ease;
  }
  body.compose-active .compose-bar{ display: block; }
  .compose-bar:not(.compose-bar-focused){
    opacity: 0.68;
    transform: translateX(-50%) scale(0.975);
  }
  /* 채팅줄이 떠 있는 동안엔 카테고리 탭이 중복이라 감춤 - 채팅줄 안 카테고리 알약이 그 역할을 대신함 */
  body.compose-active .category-tabs{ display: none; }
  /* 목록이 페이지 전체(window)가 아니라 이 안에서만 스크롤되게 함.
     그래야 스크롤을 아무리 내려도 문장이 입력줄 밑으로 들어가 가려지는 일이 없고,
     항상 입력줄 바로 위에서 깔끔하게 멈춤 - 클로드 채팅창에서 메시지 목록이 입력창
     위 칸에 얌전히 갇혀 있는 것과 같은 구조. */
  body.compose-active{ overflow: hidden; }
  /* 목록이 이제 .scroll-region 안에서만 스크롤되므로(아래 참고), 이 상태에선 바깥(html)
     스크롤바가 할 일이 없는데도 계속 떠 있었음 - 그 빈 스크롤바를 꺼둠.
     :has()는 오래된 브라우저에서 안 먹힐 수 있어 JS로 html에 직접 클래스를 붙여 확실하게 처리하고,
     혹시 다른 규칙과 부딪혀도 확실히 이기도록 !important를 둠. */
  html.compose-active-html{ overflow-y: hidden !important; scrollbar-gutter: auto !important; }
  /* 실제 스크롤은 이 판(화면 전체 폭)이 담당함 - 안쪽 .wrap은 700px로 좁게 배치만 될 뿐이라,
     예전엔 그 좁은 폭 밖(양옆 여백)에 마우스가 있으면 휠을 굴려도 반응이 없었음.
     이 판을 화면 전체 폭으로 넓혀서, 어디에 마우스가 있든 휠이 먹히게 함. */
  body.compose-active .scroll-region{
    height: calc(100vh - var(--compose-reserve, 160px));
    overflow-y: auto;
    overscroll-behavior: contain;
    /* 스크롤은 마우스 휠·화살표 키로 그대로 되지만, 막대는 안 보이게 함 - 클로드 채팅창처럼
       "스크롤 되는데 막대가 안 보이는" 조용한 느낌. (윈도우 크롬/엣지는 막대가 항상 두껍게
       보여서 특히 도움이 됨) */
    scrollbar-width: none;           /* Firefox */
    -ms-overflow-style: none;        /* 옛 엣지 */
  }
  body.compose-active .scroll-region::-webkit-scrollbar{ display: none; } /* 크롬·사파리·새 엣지 */

  /* 위로 스크롤할 때 문장이 화면 위 끝에서 뚝 잘리지 않고 옅게 흐려지며 사라지게 함
     (클로드 채팅창의 위쪽 페이드와 같은 느낌). 흐림 자체도 아래로 갈수록 옅어지게
     mask를 같이 써서 "흐릿함이 서서히 걷히는" 자연스러운 그라데이션을 만듦. */
  .compose-top-fade{
    display: none;
    position: fixed;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: min(700px, calc(100% - 40px));
    height: 56px;
    pointer-events: none;
    z-index: 64;
    background: var(--bg);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    mask-image: linear-gradient(to bottom, black 0%, transparent 100%);
    -webkit-mask-image: linear-gradient(to bottom, black 0%, transparent 100%);
  }
  body.compose-active .compose-top-fade{ display: block; }
  @media (pointer: coarse){ .compose-top-fade{ display: none !important; } }

  /* 위쪽과 대칭 - 방향만 뒤집음(위→아래로 옅어지던 걸 아래→위로 옅어지게).
     bottom을 --compose-reserve에 맞춰서, 메모줄이 뜨고 지고 여백 크기가 바뀌어도
     항상 정확히 "목록이 끝나는 그 지점"에 걸리게 함. */
  .compose-bottom-fade{
    display: none;
    position: fixed;
    bottom: var(--compose-reserve, 160px);
    left: 50%;
    transform: translateX(-50%);
    width: min(700px, calc(100% - 40px));
    height: 56px;
    pointer-events: none;
    z-index: 64;
    background: var(--bg);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    mask-image: linear-gradient(to top, black 0%, transparent 100%);
    -webkit-mask-image: linear-gradient(to top, black 0%, transparent 100%);
  }
  body.compose-active .compose-bottom-fade{ display: block; }
  @media (pointer: coarse){ .compose-bottom-fade{ display: none !important; } }

  .compose-input-row{ display: flex; }

  /* 메모를 문장으로 옮기는 중에만 나타나는 줄. 입력줄 박스 "안"에 한 줄로 끼어들어서
     박스 크기 자체가 늘어나는 게 아니라, 박스 바깥(바로 위)에 따로 떠 있는 라벨임 -
     그래서 입력줄 박스는 메모를 켜고 끄고와 무관하게 항상 정확히 똑같은 모양을 유지함. */
  .compose-memo-row{
    display: none;
    position: absolute;
    left: 0;
    right: 0;
    bottom: 100%;
    margin-bottom: 10px;
    align-items: center;

    gap: 6px;
    flex-wrap: wrap;
    padding: 0 12px;
    font-size: 11.5px;
    text-align: center;
  }
  .compose-memo-row.show{ display: flex; }
  .compose-memo-page{
    flex-shrink: 0;

    font-weight: 700;
  }
  .compose-memo-keyword{
    color: var(--text-tertiary);
    overflow: hidden;

  }
  .compose-memo-discard{
    flex-shrink: 0;

    border-radius: 50%;

    color: var(--text-tertiary);
    padding: 0;
    cursor: pointer;
  }
  .compose-memo-discard:hover{ background: var(--hover); color: var(--text-secondary); }
  /* 메모줄과 같은 자리·같은 방식으로 뜸(동시에 켜질 일은 없음 - 메모 처리 중엔 수정 못 열고,
     수정 중엔 메모 처리를 못 엶) */
  .compose-edit-row{
    display: none;
    position: absolute;
    left: 0;
    right: 0;
    bottom: 100%;
    margin-bottom: 10px;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 11.5px;
    color: var(--text-tertiary);
  }
  .compose-edit-row.show{ display: flex; }
  .compose-textarea{
    flex: 1;
    resize: none;
    border: none;
    background: none;
    font-family: 'Pretendard', sans-serif;
    font-size: 14.5px;

    color: var(--text);
    padding: 6px 4px 10px;
    /* 문장이 이 정도로 길어질 일은 거의 없어서, 안에서 따로 스크롤되지 않고 그냥 계속
       위로 자라나게 둠(클로드 입력창과 같은 방식) - 스크롤바가 뜨면서 폭이 줄어드는
       느낌도 없어짐 */
    overflow-y: hidden;
  }
  .compose-textarea:focus{ outline: none; }

  .compose-status-row{
    display: flex;
    align-items: center;
    gap: 8px;
    padding-top: 9px;
    border-top: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .compose-cat-pill{
    display: flex;
    align-items: center;
    gap: 6px;
    border: none;
    background: var(--hover);
    border-radius: 999px;
    padding: 5px 11px 5px 9px;
    font-family: 'Pretendard', sans-serif;
    font-size: 12px;
    font-weight: 700;
    color: var(--text);
    cursor: pointer;
    flex-shrink: 0;
  }
  .compose-cat-pill:active{ transform: scale(0.96); }
  .compose-cat-dot{
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--category-color);
    flex-shrink: 0;
  }
  .compose-page-field{
    display: flex;
    align-items: center;
    gap: 2px;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 5px 11px;
    flex-shrink: 0;
  }
  .compose-page-hash{ font-size: 12px; color: var(--text-tertiary); }
  .compose-page-input{
    width: 42px;
    border: none;
    background: none;
    font-family: 'Pretendard', sans-serif;
    font-size: 12px;
    color: var(--text);
    padding: 0;
  }
  .compose-page-input:focus{ outline: none; }
  /* 출처·쪽수를 한 덩어리로 - 문장 목록에 보이는 "출처 · 47p" 표기와 똑같은 형식이라
     쪽수만 따로 두드러지지 않고, 출처와 같은 무게로 조용히 자리함 */
  .compose-meta-pill{
    border: none;
    background: none;
    color: var(--text-tertiary);
    font-family: 'Pretendard', sans-serif;
    font-size: 12px;
    padding: 5px 4px;
    cursor: pointer;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 260px;
  }
  .compose-meta-pill:hover{ color: var(--text); }
  .compose-meta-edit{
    display: none;
    position: relative;
    align-items: center;
    gap: 6px;
    flex: 1 1 160px;
    min-width: 140px;
  }
  .compose-meta-edit.show{ display: flex; }
  .compose-source-input{
    flex: 1;
    min-width: 0;
    border: 1px solid var(--category-color);
    border-radius: 999px;
    padding: 5px 12px;
    font-family: 'Pretendard', sans-serif;
    font-size: 12px;
    color: var(--text);
    background: var(--bg);
  }
  .compose-source-input:focus{ outline: none; }
  .compose-meta-edit .source-suggest{ bottom: calc(100% + 6px); top: auto; left: 0; }
  .compose-meta-edit .compose-page-field{ background: var(--bg); }

  .compose-send-btn{
    flex-shrink: 0;
    margin-left: auto;
    width: 30px; height: 30px;
    border: none;
    border-radius: 50%;
    background: var(--category-color);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .compose-send-btn:active{ transform: scale(0.94); }
  .compose-send-btn:disabled{ opacity: 0.5; cursor: default; }
  /* 평소엔 화살표만, 메모가 있고 입력칸이 비어있을 때만 연필로 바뀜(둘 다 항상 그려두고
     보일 것만 보이게 함 - 아이콘 자체를 매번 새로 그리지 않아 깜빡임이 없음) */
  .send-icon-pencil{ display: none; }
  body.compose-active.send-btn-pencil .send-icon-arrow{ display: none; }
  body.compose-active.send-btn-pencil .send-icon-pencil{ display: block; }
  body.compose-active.send-btn-pencil .compose-send-btn{ background: #FFD874; }
  /* 폰에는 이 채팅줄 자체가 없음 - 폰의 편집 모드는 완전히 다른(메모) 화면이라 */
  @media (pointer: coarse){ .compose-bar{ display: none !important; } }

  /* 채팅줄이 뜬 상태에선 평소 문장 추가 용도가 없어져서, 우측 가장자리(세로 중앙) + 버튼은
     텍스트를 선택했을 때(하이라이트용)만 나타나고 평소엔 감춰둠.
     자리를 화면 맨 아래(우하단)가 아니라 "지금 보이는 화면의 세로 중앙"으로 옮김 - 긴 목록
     위쪽을 드래그할 때마다 화면 끝까지 손이 갈 필요 없게. 스크롤해도 이 판(float-layer)
     자체가 화면에 고정돼 있어서 늘 지금 보이는 영역의 중앙에 있음.
     사라질 땐 바로 사라지게 함(transition 없음) - 선택을 풀면 아이콘 내용이 먼저
     형광펜에서 "+"로 바뀌고 나서 서서히 없어지면, 그 사이에 "+"가 잠깐 보였다 사라져서
     깜빡이는 것처럼 느껴졌음. 나타날 때만 부드럽게 함. */
  body.compose-active .add-quote-trigger-btn{
    bottom: auto;
    top: 50%;
    opacity: 0;
    pointer-events: none;
    transform: translateY(-50%) scale(0.85);
  }
  body.compose-active .add-quote-trigger-btn.highlight-mode,
  body.compose-active .add-quote-trigger-btn.cancel-mode{
    opacity: 1;
    pointer-events: auto;
    transform: translateY(-50%) scale(1);
    transition: opacity 0.15s ease, transform 0.15s ease;
  }

  /* ── 하단 좌: 카테고리 세그먼트 탭 ──────────── */
  .category-tabs{
    position: absolute;
    left: 20px;
    bottom: max(20px, env(safe-area-inset-bottom));
    display: flex;
    gap: 2px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px;
    box-shadow: 0 4px 14px rgba(24,24,24,0.1);
    z-index: 70;
    max-width: calc(100vw - 90px);
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .category-tabs::-webkit-scrollbar{ display: none; }
  .category-tab-add{
    flex-shrink: 0;
    position: relative;
    z-index: 1;
    border: none;
    background: none;
    border-radius: 999px;
    width: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-tertiary);
    cursor: pointer;
  }
  .category-tab-add:hover{ color: var(--text-secondary); }

  /* ── 카테고리 관리 시트 ─────────────────────── */
  .category-picker-list{
    display: flex;
    flex-direction: column;
    gap: 2px;
    max-height: 50vh;
    overflow-y: auto;
    margin-bottom: 14px;
  }
  .category-picker-row{
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 6px;
    border-radius: 10px;
  }
  .category-picker-row:hover{ background: var(--hover); }
  .category-picker-dot{
    flex-shrink: 0;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: none;
    padding: 0;
    cursor: pointer;
  }
  .category-picker-dot:hover{ transform: scale(1.15); }
  /* 색 점을 누르면 그 아래로 펼쳐지는 12색 팔레트 */
  .category-picker-swatches{
    display: none;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
    padding: 10px 4px 4px 28px;
  }
  .category-picker-swatches.open{ display: grid; }
  .category-picker-swatch{
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 2px solid transparent;
    padding: 0;
    cursor: pointer;
  }
  .category-picker-swatch.selected{ border-color: var(--text); }
  .category-picker-name{
    flex: 1;
    min-width: 0;
    text-align: left;
    background: none;
    border: none;
    font-family: 'Pretendard', sans-serif;
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    padding: 0;
    cursor: pointer;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .category-picker-row.current .category-picker-name{ color: var(--category-color); }
  .category-picker-name-input{
    flex: 1;
    min-width: 0;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 8px;
    font-family: 'Pretendard', sans-serif;
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
  }
  .category-picker-icon-btn{
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border: none;
    border-radius: 50%;
    background: none;
    color: var(--text-tertiary);
    cursor: pointer;
  }
  .category-picker-icon-btn:hover{ background: var(--border); color: var(--text-secondary); }
  .category-picker-icon-btn.danger:hover{ color: var(--danger); }
  .category-picker-add-row{
    display: flex;
    gap: 8px;
  }
  .category-picker-input{
    flex: 1;
    min-width: 0;
    height: 44px;
    box-sizing: border-box;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0 14px;
    font-family: 'Pretendard', sans-serif;
    font-size: 15px;
    color: var(--text);
    outline: none;
    background: var(--bg);
  }
  .category-picker-input:focus{ border-color: var(--category-color); }
  .category-picker-add-btn{
    flex-shrink: 0;
    height: 44px;
    padding: 0 18px;
    border: none;
    border-radius: 10px;
    background: var(--category-color);
    color: var(--text);
    font-family: 'Pretendard', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
  /* 탭 뒤에서 좌우로 슬라이드하는 필 - 애플 세그먼트 컨트롤 느낌 */
  .category-tab-indicator{
    position: absolute;
    top: 4px;
    bottom: 4px;
    left: 0;
    border-radius: 999px;
    background: var(--category-color);
    transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1), width 0.32s cubic-bezier(0.32, 0.72, 0, 1), background 0.25s ease;
    z-index: 0;
  }
  /* 마우스로 눌렀을 때 검은 테두리가 남지 않게 함 (키보드로 이동할 땐 그대로 보임) */
  .category-tab:focus:not(:focus-visible){ outline: none; }
  .category-tab{
    position: relative;
    z-index: 1;
    border: none;
    background: none;
    border-radius: 999px;
    padding: 9px 14px;
    font-family: 'Pretendard', sans-serif;
    font-size: 13.5px;
    font-weight: 700;
    color: var(--text-secondary);
    cursor: pointer;
    transition: color 0.2s ease;
  }
  .category-tab.active{
    color: var(--text);
  }

  /* ── 하단 우: + 버튼 ─────────────────────── */
  .add-quote-trigger-btn{
    position: absolute;
    right: 20px;
    bottom: max(20px, env(safe-area-inset-bottom));
    width: 48px; height: 48px;
    border-radius: 50%;
    border: none;
    background: var(--text);
    color: #FFFFFF;
    font-size: 22px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(24,24,24,0.22);
    z-index: 70;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .add-quote-trigger-btn:active{ transform: scale(0.94); }
  /* 문장을 드래그로 선택하면, 새 버튼을 따로 띄우는 대신 이미 익숙한 이 자리(우하단)를
     그대로 재사용해서 "하이라이트" 버튼으로 잠깐 바뀜. 선택이 풀리면 다시 +로 돌아옴. */
  .add-quote-trigger-btn.highlight-mode{
    background: var(--highlight-bg);
    color: #3D3200;
  }
  .add-quote-trigger-btn.highlight-mode.cancel-mode{
    background: var(--cancel-bg);
    color: var(--cancel-text);
  }

  /* 형광펜 하이라이트 - 카테고리 색과 무관하게 항상 통일된 노랑 */
  .quote-highlight{
    background: var(--highlight-bg);
    padding: 1px 0;
    border-radius: 2px;
    cursor: pointer;
  }

  /* ── 확인 다이얼로그 ──────────────────────── */
  .modal-overlay{
    position: fixed;
    left: 0; right: 0;
    /* 화면 높이만큼 위아래로 더 덮어서 가장자리가 절대 드러나지 않게 함.
       vh는 아이폰 사파리에서 주소창 상태에 따라 실제 보이는 영역과 어긋날 수 있어서
       (그 값 그대로 위아래 상쇄시키는 트릭이라 어긋난 만큼 그대로 틈이 생김),
       실시간으로 반영되는 dvh로 확실하게 잡음. */
    top: -100vh;
    bottom: -100vh;
    top: -100dvh;
    bottom: -100dvh;
    background: rgba(31,35,40,0.32);
    display: none;
    align-items: center;
    justify-content: center;
    padding: calc(100vh + 20px) 20px;
    padding: calc(100dvh + 20px) 20px;
    z-index: 330;
  }
  .modal-overlay.open{ display: flex; }
  .modal-box{
    background: var(--surface);
    border-radius: 14px;
    width: 100%;
    max-width: 440px;
    box-shadow: 0 12px 32px rgba(31,35,40,0.16);
    animation: fadeIn 0.18s ease;
  }
  .confirm-box{
    max-width: 300px;
    padding: 26px 22px 20px;
  }
  .confirm-message{
    margin: 0 0 20px;
    font-size: 14px;
    line-height: 1.75;
    color: var(--text);
    text-align: center;
  }
  .spell-error-text{
    text-align: left;
    font-size: 12.5px;
    line-height: 1.6;
    color: var(--text-secondary);
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 50vh;
    overflow-y: auto;
  }
  .confirm-actions{ display:flex; gap: 8px; }
  .confirm-btn{
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 0;
    font-family: 'Pretendard', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    background: var(--surface);
  }
  .confirm-cancel{ color: var(--text-secondary); }
  .confirm-cancel:hover{ background: var(--hover); }
  .confirm-ok{ color: var(--danger); border-color: var(--danger-soft); background: var(--danger-soft); }
  .confirm-ok:hover{ background: #EBDAD6; }

  @keyframes fadeIn{
    from{ opacity: 0; transform: translateY(2px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  /* ── 중앙 Dialog 공통 ──────────────────────── */
  .sheet-overlay{
    position: fixed;
    left: 0; right: 0;
    /* 어두운 배경은 화면보다 위아래로 넉넉히 넘치게 깔아서 어떤 경우에도 틈이 안 생기게 함.
       (보이는 영역에 딱 맞추려 하면 iOS의 화면 밀림·주소창 접힘 때문에 조금씩 어긋나
        중간에 흰 띠가 생겼음). vh는 주소창 상태에 따라 실제 화면과 어긋날 수 있어
        (위아래를 vh로 상쇄하는 트릭이라 그 어긋난 만큼 그대로 틈이 됨), 실시간으로
        반영되는 dvh로 확실하게 잡음. */
    top: -100vh;
    bottom: -100vh;
    top: -100dvh;
    bottom: -100dvh;
    /* 창은 여백을 줘서 "실제로 보이는 영역" 안에 놓이도록 함 */
    padding: calc(100vh + var(--vv-pad-top, 0px)) 16px calc(100vh + var(--vv-pad-bottom, 0px));
    padding: calc(100dvh + var(--vv-pad-top, 0px)) 16px calc(100dvh + var(--vv-pad-bottom, 0px));
    background: rgba(24,24,24,0.28);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 310;
    /* 키보드가 오르내릴 때 창이 부드럽게 따라가도록 */
    transition: padding 0.25s cubic-bezier(0.32, 0.72, 0, 1);
  }
  .sheet-overlay.open{ display: flex; }
  /* 편집 모드 들어가는 첫 화면(비밀번호 입력)은 뒤에 흐릿하게 비치는 내용이 딱히
     의미가 없어서, 다른 창(검색·수정·코멘트)과 달리 어둡게 흐리지 않고 그냥
     깨끗한 배경 하나로 둠. */
  #passcodeOverlay{
    background: var(--bg);
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
  }
  .bottom-sheet{
    width: 100%;
    max-width: 480px;
    height: auto;
    /* 부모(오버레이)의 남은 공간을 넘지 않도록. 키보드가 올라오면 그만큼 자동으로 줄어듦 */
    max-height: min(100%, 82vh, 720px);   /* dvh를 모르는 옛 브라우저용 */
    max-height: min(100%, 82dvh, 720px);
    background: var(--surface);
    border-radius: 20px;
    box-shadow: 0 20px 50px rgba(24,24,24,0.18);
    opacity: 0;
    transform: scale(0.97) translateY(4px);
    transition: opacity 0.2s ease, transform 0.2s ease;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }
  .sheet-overlay.open .bottom-sheet{
    opacity: 1;
    transform: scale(1) translateY(0);
  }
  /* 문장 추가 · 검색 팝업은 다른 시트(수정/코멘트)보다 살짝 더 또렷하게 등장함.
     처음엔 통통 튀는 스프링으로 했다가 정신없다는 피드백을 받아서, 오버슈트 없이
     한 방향으로만 자리 잡는 차분한 방식으로 바꿈. */
  /* 키보드를 내리면 쓸 수 있는 높이가 갑자기 늘어나는데, 그대로 두면 창이 "뚝" 하고 커짐.
     높이 변화를 부드럽게 이어줌. */
  #searchSheetOverlay .bottom-sheet{
    transition: max-height 0.28s cubic-bezier(0.32, 0.72, 0, 1);
  }
  @keyframes sheetPopIn{
    0%{ opacity: 0; transform: scale(0.92) translateY(10px); }
    100%{ opacity: 1; transform: scale(1) translateY(0); }
  }
  #searchSheetOverlay.open .bottom-sheet{
    animation: sheetPopIn 0.26s cubic-bezier(.2,.7,.3,1);
  }
  .sheet-title{
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    margin: 0 0 14px;
  }
  .sheet-body{
    position: relative;
    padding: 22px;
    overflow-y: auto;
    overscroll-behavior: contain;
  }

  /* [1] 출처: 입력칸을 포커스하면 최근 사용한 출처가 바로 아래 드롭다운으로 나타남 */
  .source-suggest{
    display: none;
    position: absolute;
    top: calc(100% - 8px);
    left: 0; right: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 10px 24px rgba(24,24,24,0.14);
    z-index: 5;
    overflow: hidden;
  }
  .source-suggest.open{ display: block; }
  .source-suggest-item{
    display: block;
    width: 100%;
    text-align: left;
    padding: 12px 14px;
    background: none;
    border: none;
    border-bottom: 1px solid var(--border);
    font-family: 'Pretendard', sans-serif;
    font-size: 14px;
    color: var(--text);
    cursor: pointer;
  }
  .source-suggest-item:last-child{ border-bottom: none; }
  .source-suggest-item:active{ background: var(--hover); }
  .source-suggest-item.highlighted{ background: var(--hover); }

  .quote-textarea{
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    font-family: 'Pretendard', sans-serif;
    font-size: 16px;
    line-height: 1.65;
    color: var(--text);
    outline: none;
    margin-bottom: 12px;
    background: var(--bg);
    resize: none;
  }
  .quote-textarea:focus{ border-color: var(--category-color); }
  .quote-textarea::placeholder{ color: var(--text-tertiary); }

  .cta-btn{
    pointer-events: auto;
    border: none;
    border-radius: 999px;
    font-family: 'Pretendard', sans-serif;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  }
  .cta-primary{
    background: var(--category-color);
    color: var(--text);
    font-size: 14px;
    font-weight: 700;
    padding: 14px 26px;
    box-shadow: 0 3px 10px rgba(24,24,24,0.16);
  }
  .cta-primary:hover{ box-shadow: 0 4px 13px rgba(24,24,24,0.2); }
  .cta-btn:active{ transform: scale(0.96); }
  .add-book-submit{
    width: 100%;
    margin-top: 6px;
    padding: 13px 0;
  }
  .add-book-submit:disabled{ opacity: 0.5; cursor: default; }

  .status-msg{
    font-size: 12px;
    color: var(--text-secondary);
    min-height: 0;
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    transition: opacity 0.3s ease, max-height 0.3s ease, margin 0.3s ease;
  }
  .status-msg.show{
    opacity: 1;
    max-height: 30px;
    margin-top: 8px;
    margin-bottom: 8px;
  }
  .status-msg.error{ color: var(--danger); }

  /* ── 저장 완료 토스트 ─────────────────────── */
  /* 예전엔 .float-layer(높이가 dvh로 계속 재계산되는 판) 안에 absolute로 들어있었음.
     그 판 자체의 높이가 스크롤 중 흔들릴 때 사파리가 그 안의 요소까지 다시 그리면서
     같이 흔들려 보였던 것 같음 - 그래서 아예 그 판에 안 얹히게, 독립된 자기만의
     고정 위치를 가지게 함. top 값이 화면 크기 계산과 전혀 무관한 상수라 이제 절대
     안 움직임(사용자 요청대로 "그냥 딱 그 위치에 고정"). */
  .toast{
    position: fixed;
    top: max(20px, env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%) translateY(-6px);
    background: var(--category-color);
    color: var(--text);
    font-size: 12.5px;
    font-weight: 600;
    padding: 9px 18px;
    border-radius: 999px;
    box-shadow: 0 6px 18px rgba(24,24,24,0.2);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 400;
    white-space: nowrap;
  }
  .toast.show{
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ── 문장 ··· 액션 (아이폰 기본 선택 버튼/액션시트 스타일) ──── */
  .ios-sheet-backdrop{
    display: none;
    position: fixed;
    left: 0; right: 0;
    top: -100vh;
    bottom: -100vh;
    top: -100dvh;
    bottom: -100dvh;
    background: rgba(24,24,24,0.32);
    z-index: 96;
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  .ios-sheet-backdrop.open{ display: block; opacity: 1; }
  .ios-action-sheet{
    position: fixed;
    left: 12px; right: 12px;
    bottom: max(12px, env(safe-area-inset-bottom));
    z-index: 97;
    display: flex;
    flex-direction: column;
    gap: 8px;
    /* 아래에서 올라오는 애니메이션과, 주소창에 맞춘 위치 보정을 함께 적용 */
    transform: translateY(100%);
    opacity: 0;
    transition: transform 0.22s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.2s ease;
    pointer-events: none;
  }
  .ios-action-sheet.open{
    transform: translateY(0);
    opacity: 1;
    pointer-events: auto;
  }
  .ios-action-group{
    background: var(--surface);
    border-radius: 14px;
    overflow: hidden;
  }
  .ios-action-item{
    display: block;
    width: 100%;
    padding: 16px;
    background: none;
    border: none;
    border-bottom: 1px solid var(--border);
    font-family: 'Pretendard', sans-serif;
    font-size: 16px;
    color: var(--text);
    text-align: center;
    cursor: pointer;
  }
  .ios-action-item:last-child{ border-bottom: none; }
  .ios-action-item:active{ background: var(--hover); }
  .ios-action-item.danger{ color: var(--danger); }
  .ios-action-item.cancel{ font-weight: 700; }




  /* iOS Safari는 input/textarea의 font-size가 16px 미만이면 포커스 시 화면을 자동으로 확대함.
     margin-bottom을 12px로 잡은 입력 필드들 폰트는 14~15.5px라 확대가 걸릴 수 있어
     16px 미만 필드는 아래에서 별도로 보정함(선택 사항, 현재는 유지). */
  /* ── 폰에서는 가운데 뜨는 팝업 대신 화면 전체를 덮는 새 창으로 ──────────
     팝업 방식은 화면 가장자리에 여백이 생기는 문제가 계속 있었는데,
     화면을 통째로 덮으면 그럴 일이 아예 없음. 아래에서 위로 올라옴. */
  @media (pointer: coarse){
    .sheet-overlay{
      background: var(--bg);
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      align-items: stretch;
      justify-content: stretch;
      padding: 100vh 0;      /* dvh를 모르는 옛 브라우저용 */
      padding: 100dvh 0;    /* 위아래로 넉넉히 덮은 만큼 되돌려서 창을 화면에 맞춤 -
                               위(top/bottom)와 반드시 같은 단위(dvh)로 맞춰야 정확히 상쇄됨 */
      overscroll-behavior: contain; /* 창 안에서 끝까지 스크롤해도 뒤 화면이 따라 움직이지 않게 함 */
    }
    .sheet-overlay .bottom-sheet{
      /* 창 배경(#FCFCFC)과 바깥 배경(#FFFFFF)이 미세하게 달라서 경계가 회색 띠로 보였음.
         전체화면일 땐 같은 색으로 맞춰서 경계가 아예 안 보이게 함. */
      background: var(--bg);
      width: 100%;
      max-width: none;
      /* 평소에는 화면을 꽉 채우고(100%), 키보드가 실제로 올라왔을 때만 그 위 공간으로 줄어듦.
         예전엔 항상 "보이는 높이"를 썼는데, 아이폰은 주소창이 펴져 있으면 그 값이
         화면보다 90px쯤 작게 나와서 창이 팝업처럼 작아져 보였음. */
      height: var(--kb-fit-h, 100%);
      max-height: none;
      border-radius: 0;
      box-shadow: none;
      animation: none;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1),
                  height 0.25s cubic-bezier(0.32, 0.72, 0, 1);
      opacity: 1;
      overflow-y: auto;
      overscroll-behavior: contain;
    }
    .sheet-overlay.open .bottom-sheet{
      animation: none;
      transform: translateY(0);
      opacity: 1;
    }
    /* 저장 버튼을 화면에 계속 붙여두려 했더니, 오히려 빈 공간이 남는 문제가 생겼음.
       그냥 창 전체가 한 덩어리로 스크롤되고, 버튼은 마지막 칸 다음(기본 화면 맨 아래)에
       자연스럽게 놓이도록 단순화함. 입력 중엔 다른 필드처럼 스크롤해서 찾으면 됨. */
    .sheet-overlay .sheet-body{ padding: 26px 22px 20px; }
    /* 비밀번호 창은 내용이 짧아서(자물쇠·제목·점 몇 개뿐), 다른 창처럼 위에서부터 채우면
       내용은 위쪽에 몰려있고 그 아래로 빈 공간만 잔뜩 남아 "너무 위에 붙어있다"는 느낌을 줌.
       이 창만 세로로 가운데 오게 함. */
    #passcodeOverlay .sheet-body{
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .sheet-close-btn{ top: 22px; right: 18px; width: 34px; height: 34px; }
    .sheet-title{ font-size: 17px; margin-bottom: 20px; }
  }


</style>
</head>
<body>

<div class="splash-overlay" id="splashOverlay">
  <img alt="수집가들" class="splash-logo" id="splashLogo">
</div>

<!-- 컴퓨터 편집 모드 전용: 실제 스크롤은 이 판(화면 전체 폭)이 담당함.
     .wrap은 안에서 700px로 좁게 배치만 될 뿐이라, 그 옆 여백에 마우스가 있어도
     휠을 굴리면 이 판이 반응해서 목록이 움직임. -->
<div class="scroll-region" id="scrollRegion">
<div class="wrap">
  <div class="archive-header">
    <img id="headerLogo" alt="수집가들">
    <!-- 평소엔 완전히 안 보이다가, 서버 재시도를 기다리는 동안에만 아주 작게 나타남 -->
    <span class="sync-pending-dot" id="syncDot" title="아직 서버에 반영 안 됨 - 곧 다시 시도해요"></span>
  </div>
  <div class="archive-list" id="archiveList"></div>
  <!-- 이제 목록 맨 아래가 아니라 로고 메뉴에서 실행됨 - 이 버튼은 화면엔 안 보이지만,
       runSpellCheck()가 진행 상황(몇 번째 묶음 점검 중 등)을 여기 textContent로
       계속 기록해두는 용도로 그대로 남겨둠(로직을 안 바꾸려고). -->
  <button type="button" class="spell-check-trigger" id="spellCheckBtn" style="display:none">맞춤법 확인하기</button>
</div>
</div>

<!-- 떠 있는 요소들을 한 판 위에 모아둠. 판의 높이가 "실제로 보이는 화면 높이"라
     주소창이 접히고 펴지는 걸 브라우저가 알아서 반영해줌 (JavaScript 계산 없음). -->
<div class="float-layer">
  <div class="category-tabs" id="categoryTabs">
    <div class="category-tab-indicator" id="categoryTabIndicator"></div>
    <!-- 탭들은 renderCategoryTabs()가 categories 배열을 기준으로 매번 다시 그림 -->
  </div>
  <button type="button" class="add-quote-trigger-btn" id="addQuoteTriggerBtn" title="문장 남기기">+</button>
  <div class="toast" id="toastMsg"></div>
</div>

<!-- 폰 전용: 편집 모드로 들어오면 이 화면 하나만 씀. 목록도, 탭도 없이 페이지+키워드만 -->
<div class="memo-screen" id="memoScreen">
  <div class="memo-screen-top">
    <button type="button" class="memo-exit-btn" id="memoExitBtn" title="나가기">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="memo-screen-title">메모</div>
    <div class="memo-screen-count" id="memoScreenCount"></div>
  </div>
  <div class="memo-screen-body">
    <div class="memo-field-label">페이지</div>
    <input type="text" id="memoPageInput" class="memo-big-input" inputmode="numeric" placeholder="예: 47" autocomplete="off">
    <div class="memo-field-label">키워드</div>
    <input type="text" id="memoKeywordInput" class="memo-big-input" placeholder="예: 남자는" autocomplete="off">
    <button type="button" class="memo-save-btn" id="memoSaveBtn">저장하고 계속 쓰기</button>
  </div>
</div>

<!-- 컴퓨터 편집 모드 전용: 화면 아래 항상 떠 있는 채팅형 입력줄.
     평소엔 카테고리·페이지·출처를 건드릴 일이 없고, 문장만 치고 엔터 누르면 저장됨. -->
<!-- 컴퓨터 편집 모드 전용: 위로 스크롤할 때 문장이 화면 위 끝에서 뚝 잘리지 않고
     클로드처럼 옅게 흐려지며 사라지게 하는 층 -->
<div class="compose-top-fade"></div>
<!-- 아래쪽도 위쪽과 똑같은 방식으로 - 목록이 빈 여백과 만나는 지점에서 뚝 끊기지 않고
     옅게 흐려지며 사라지게 함. 여백 크기(--compose-reserve)가 메모줄 유무에 따라
     바뀌므로, 그 값을 그대로 따라가게 해서 항상 정확히 그 경계에 걸치게 함. -->
<div class="compose-bottom-fade"></div>

<div class="compose-bar" id="composeBar">
  <!-- 예전엔 우상단에 숫자 배지가 늘 떠 있었는데, "너무 눈에 많이 보인다"는 얘기가 있어서
       없앰. 대신 Tab으로 목록 훑어보기 모드로 나갈 때만(메모가 있으면) 잠깐 말풍선으로
       알려줌 - 평소엔 완전히 조용하고, 손이 비는 그 순간에만 자연스럽게 눈에 들어옴. -->
  <div class="compose-memo-hint" id="composeMemoHint"></div>
  <!-- 메모를 문장으로 옮기는 중에만 나타남 - 항상 맨 위에만 추가되고, 입력줄·상태줄
       두 줄의 순서·모양은 무슨 일이 있어도 그대로 유지됨(중간에 끼어들지 않음).
       "몇 개 남았는지"는 배지 숫자가 이미 하고 있는 일이라 여기서 또 안 보여줌 -
       그래서 페이지·키워드, 그리고 지우는 작은 × 하나로만 심플하게. -->
  <div class="compose-memo-row" id="composeMemoRow">
    <span class="compose-memo-page" id="composeMemoPage"></span>
    <span class="compose-memo-keyword" id="composeMemoKeyword"></span>
    <button type="button" class="compose-memo-discard" id="composeMemoDiscardBtn" title="이 메모 지우기">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <!-- 문장을 고쳐 쓰는 중에만 나타남 - 메모줄과 똑같이 박스 밖에 뜨는 라벨이라 입력줄
       모양엔 영향 안 줌. 새로 쓰는 것과 헷갈리지 않게 "지금 이건 수정 중"이라고 알려줌. -->
  <div class="compose-edit-row" id="composeEditRow">
    <span>문장 수정 중</span>
    <button type="button" class="compose-memo-discard" id="composeEditCancelBtn" title="수정 그만두기">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="compose-input-row">
    <textarea id="composeTextInput" class="compose-textarea" placeholder="문장을 입력하세요" rows="1"></textarea>
  </div>
  <div class="compose-status-row">
    <button type="button" class="compose-cat-pill" id="composeCatPill" title="다른 카테고리에 담기 (클릭)">
      <span class="compose-cat-dot" id="composeCatDot"></span>
      <span id="composeCatLabel"></span>
    </button>
    <!-- 출처·쪽수를 하나로 - 실제 문장 목록에 보이는 "출처 · 47p" 표기와 똑같은 형식 -->
    <button type="button" class="compose-meta-pill" id="composeMetaPill" title="출처·쪽수 바꾸기">
      <span id="composeMetaLabel">출처 없음</span>
    </button>
    <div class="compose-meta-edit" id="composeMetaEdit">
      <input type="text" id="composeSourceInput" class="compose-source-input" placeholder="책 제목이나 출처" autocomplete="off">
      <div class="source-suggest" id="composeSourceSuggest"></div>
      <div class="compose-page-field">
        <span class="compose-page-hash">#</span>
        <input type="text" id="composePageInput" class="compose-page-input" inputmode="numeric" placeholder="쪽수" autocomplete="off">
      </div>
    </div>
    <button type="button" class="compose-send-btn" id="composeSendBtn" title="저장 (Enter)">
      <svg class="send-icon-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
      <svg class="send-icon-pencil" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
    </button>
  </div>
</div>

    if(IS_CLAUDE_ARTIFACT){
      return await window.storage.set(key, value, false);
    }
    try{
      const res = await fetch(WORKER_URL + "/data", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Site-Secret": SITE_SECRET },
        body: value
      });
      // fetch()는 서버가 에러(403·500 등)로 응답해도 "실패"로 안 잡음(연결 자체가
      // 끊겼을 때만 실패로 침). 그래서 응답 내용을 직접 확인해야 함 - 이걸 안 하고 있어서
      // 서버가 거부해도 저장에 성공한 것처럼 처리되고 있었음(진짜 원인이었음).
      if(!res.ok) return null;
    }catch(e){
      return null;
    }
    return { key, value };
  }
};

// 이미 쓰는 색은 건너뛰고, 다 겹치면 처음으로 돌아가 순환함.
const CATEGORY_PALETTE = ['#7FD8F0', '#FFAB91', '#C6F24E', '#FF9EC4', '#B8A6E0', '#FFD180', '#8FE0C4', '#F0A6A6', '#A0C4FF', '#FFE066', '#D9A6D9', '#9FD8D3'];
function categoryNames(){ return categories.map(c => c.name); }
function getCategoryColor(name){
  if(name === UNCATEGORIZED) return '#B0B0B0';
  const cat = categories.find(c => c.name === name);
  return cat ? cat.color : CATEGORY_PALETTE[0];
}
function nextPaletteColor(){
  const used = categories.map(c => c.color);
  const free = CATEGORY_PALETTE.find(c => !used.includes(c));
  return free || CATEGORY_PALETTE[categories.length % CATEGORY_PALETTE.length];
}

// 흰 배경 위에서 파랑은 눈에 색으로 안 잡히고, 주황·분홍·연두는 같은 농도여도 색이 느껴짐.

const SPOTLIGHT_TINTS = {
  '일': '#EEFAFD',   // 파랑을 꽉 채우면 남보라로 읽혀서, 초록을 올려 하늘색 쪽으로 잡음

// 겹치거나 인접한 구간을 하나로 합쳐서, 항상 정렬되고 겹치지 않는 배열로 유지함.
// 이렇게 저장해두면 화면에 그려지는 <mark> 개수와 실제 저장된 구간 개수가 항상 1:1로 맞아서,
// "이 마크를 탭하면 지운다"를 인덱스로 안전하게 매칭할 수 있음.
function mergeHighlights(list){
  const sorted = [...list].sort((a, b) => a.start - b.start);
  const merged = [];
  sorted.forEach(h => {
    const last = merged[merged.length - 1];
    if(last && h.start <= last.end){
      last.end = Math.max(last.end, h.end);
    } else {
      merged.push({ start: h.start, end: h.end });
    }
  });
  return merged;
}

// 하이라이트 버튼을 다시 누르면 취소되도록 하는 토글 로직.
// 선택한 구간이 기존 하이라이트와 조금이라도 겹치면, 그 겹치는 부분만 정확히 빼냄
// (겹치는 하이라이트가 딱 그 구간이면 통째로 사라지고, 일부만 겹치면 안 겹치는 조각만 남음).
// 전혀 안 겹치면 새 하이라이트로 추가함.
function toggleHighlightRange(existing, range){
  const overlapping = existing.some(h => range.start < h.end && range.end > h.start);
  if(!overlapping){
    return mergeHighlights([...existing, range]);
  }
  const result = [];
  existing.forEach(h => {
    if(range.end <= h.start || range.start >= h.end){
      result.push(h); // 안 겹치는 기존 구간은 그대로 유지
      return;
    }
    if(h.start < range.start) result.push({ start: h.start, end: range.start });
    if(h.end > range.end) result.push({ start: range.end, end: h.end });
  });
  return mergeHighlights(result);
}

// 문장 텍스트를 하이라이트 구간에 따라 <mark>로 감싸서 HTML로 만듦.
// 하이라이트가 아닌 부분은 그대로 escapeHtml 처리함.
function renderHighlightedText(text, highlights){
  if(!highlights || highlights.length === 0) return escapeHtml(text);
  let result = '';
  let cursor = 0;
  highlights.forEach((h, i) => {
    const start = Math.max(0, Math.min(h.start, text.length));
    const end = Math.max(0, Math.min(h.end, text.length));
    if(start > cursor) result += escapeHtml(text.slice(cursor, start));
    if(end > start) result += `<mark class="quote-highlight" data-hidx="${i}">${escapeHtml(text.slice(start, end))}</mark>`;
    cursor = Math.max(cursor, end);
  });
  if(cursor < text.length) result += escapeHtml(text.slice(cursor));
  return result;
}

// 드래그로 선택한 영역(range)의 시작/끝이, 문장 컨테이너 기준으로 순수 텍스트에서
// 몇 번째 글자에 해당하는지 계산함. 이미 <mark>가 섞여 있어도 정확히 셀 수 있도록
// 컨테이너의 자식 노드를 순서대로 훑으면서 글자 수를 누적함.
function getTextOffset(container, targetNode, targetOffset){
  let charCount = 0;
  let found = false;
  function walk(el){
    for(const child of el.childNodes){
      if(found) return;
      if(child === targetNode){
        charCount += targetOffset;
        found = true;
        return;
      }
      if(child.nodeType === Node.TEXT_NODE){
        charCount += child.textContent.length;
      } else if(child.nodeType === Node.ELEMENT_NODE){
        walk(child);
      }
    }
  }
  walk(container);
  return charCount;
}
