// blockId를 시드로 쓰는 결정적 난수 생성기 - 같은 시간대 안에서는 항상 같은 결과를 냄
function seededRandom(seed){
  let t = seed + 0x6D2B79F5;
  return function(){
    t += 0x6D2B79F5;
    let r = Math.imul(t ^ (t >>> 15), 1 | t);
    r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffleWithSeed(arr, seed){
  const rand = seededRandom(seed);
  const result = arr.slice();
  for(let i = result.length - 1; i > 0; i--){
    const j = Math.floor(rand() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}

function pickSpotlightMessage(){
  const now = new Date();
  const hour = now.getHours();
  let period;
  if(hour < 6) period = 'dawn';
  else if(hour < 12) period = 'morning';
  else if(hour < 18) period = 'afternoon';
  else period = 'evening';

  // 6시간 단위 블록 ID - UTC가 아니라 이 기기의 로컬 자정을 기준으로 계산해야
  // 시간대(새벽/아침/오후/저녁) 경계랑 정확히 같은 시점에 멘트가 바뀜
  const localMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const hoursSinceLocalMidnight = (now - localMidnight) / (60 * 60 * 1000);
  const blockWithinDay = Math.floor(hoursSinceLocalMidnight / 6); // 0~3
  const daysSinceEpoch = Math.floor(localMidnight.getTime() / (24 * 60 * 60 * 1000));
  const blockId = daysSinceEpoch * 4 + blockWithinDay;

  const pool = SPOTLIGHT_MESSAGES_BY_TIME[period];
  // 같은 블록 안에서는 4개 카테고리가 셔플된 풀에서 서로 다른 자리를 배정받아서,
  // 여러 카테고리 화면에 동시에 같은 멘트가 겹쳐 뜨는 일이 없어짐
  const shuffled = shuffleWithSeed(pool, blockId);
  const catIndex = categoryNames().indexOf(currentCategory);
  return shuffled[(catIndex >= 0 ? catIndex : 0) % shuffled.length];
}

function shuffleArray(arr){
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// 카테고리를 볼 때마다 매번 다시 섞으면 별점/코멘트 등 사소한 변경에도 화면이 들썩여서,
// "같은 카테고리를 계속 보는 동안"에는 순서를 그대로 유지하고, 새로 추가/삭제된 것만 반영함.
// 카테고리를 실제로 전환할 때만 완전히 새로 섞임.
let shuffleState = { category: null, order: [] };

function getShuffledRest(restList){
  const restIds = new Set(restList.map(s => s.id));

  if(shuffleState.category !== currentCategory){
    const ids = restList.map(s => s.id);
    shuffleArray(ids);
    shuffleState = { category: currentCategory, order: ids };
  } else {
    let order = shuffleState.order.filter(id => restIds.has(id));
    const existingSet = new Set(order);
    const newIds = restList.map(s => s.id).filter(id => !existingSet.has(id));
    newIds.forEach(id => {
      const pos = Math.floor(Math.random() * (order.length + 1));
      order.splice(pos, 0, id);
    });
    shuffleState = { category: currentCategory, order };
  }

  const map = new Map(restList.map(s => [s.id, s]));
  return shuffleState.order.map(id => map.get(id)).filter(Boolean);
}

// 카테고리를 새로 들어올 때만 "가장 오래 안 만난 문장"을 새로 뽑고, 그 안에서 머무는 동안은 유지함.
// 멘트는 (시간대 + 카테고리)로 결정되는 값이라 매번 다시 계산해도 안전함 - 시간대가 안 바뀌면 그대로임.
let currentSpotlightId = null;
let currentSpotlightMessage = '';
let spotlightCategory = null;

function pickSpotlight(fullList){
  if(spotlightCategory !== currentCategory){
    const spotlight = fullList.reduce((oldest, s) => {
      const sSeen = s.lastSeenAt || s.ts || 0;
      const oldestSeen = oldest ? (oldest.lastSeenAt || oldest.ts || 0) : Infinity;
      return sSeen < oldestSeen ? s : oldest;
    }, null);
    currentSpotlightId = spotlight ? spotlight.id : null;
    spotlightCategory = currentCategory;
  }
  currentSpotlightMessage = pickSpotlightMessage();
  return fullList.find(s => s.id === currentSpotlightId) || null;
}

function showConfirm(message, okLabel){
  confirmMessage.textContent = message;
  confirmOk.textContent = okLabel || '삭제';
  confirmOverlay.classList.add('open');
  return new Promise((resolve) => {
    confirmResolver = resolve;
  });
}
function resolveConfirm(result){
  confirmOverlay.classList.remove('open');
  if(confirmResolver){
    confirmResolver(result);
    confirmResolver = null;
  }
}
confirmOk.addEventListener('click', () => resolveConfirm(true));
confirmCancel.addEventListener('click', () => resolveConfirm(false));
confirmOverlay.addEventListener('click', (e) => {
  if(e.target === confirmOverlay) resolveConfirm(false);
});

const toastEl = document.getElementById('toastMsg');
let toastTimer = null;
function showToast(text, ms){
  clearTimeout(toastTimer);
  toastEl.textContent = text;
  void toastEl.offsetWidth;
  toastEl.classList.add('show');
  toastTimer = setTimeout(() => {
    toastEl.classList.remove('show');
  }, ms || 2000);
}

// ── 데이터 로드/저장 ───────────────────────────
// [대개편] 예전엔 책(groups/books) 기준 구조였는데, 이제 카테고리(sentences 배열) 기준으로 바뀜.
// 예전 구조가 KV에 남아있으면 이 브라우저의 localStorage에 안전하게 백업해두고, 새 구조로 새로 시작함.
async function loadAll(){
  try{
    const res = await storageAdapter.get(STORAGE_KEY);
    let parsed = res && res.value ? JSON.parse(res.value) : null;

    if(parsed && Array.isArray(parsed.sentences)){
      // 서버 응답이 정상이어도, 그 안에 방금 이 기기에서 쓴 내용이 아직 없을 수 있음
      // (서버 전송이 계속 실패 중이었다면). 예전엔 여기서 서버 값으로 무조건 덮어써서,
      // 로컬에만 있던(아직 서버로 못 간) 메모가 다음에 화면을 열 때 통째로 사라지는
      // 문제가 있었음 - 폰에서 메모 써도 서버 응답이 "정상인데 그 메모가 없는" 상태면
      // 그대로 지워지던 게 이거였음. 그래서 서버 응답도 무조건 믿지 않고, 이 기기의
      // 로컬 백업이 있으면 항상 같이 병합함(서버에 없는 것만 로컬에서 살려둠).
      const local = readLocalBackup();
      const serverSentences = parsed.sentences;
      const serverMemos = Array.isArray(parsed.memos) ? parsed.memos : [];
      const serverSources = Array.isArray(parsed.recentSources) ? parsed.recentSources : [];
      // 카테고리도 같은 취급을 함 - 서버에 아직 카테고리 필드가 없던 옛 저장분이면 기본 4개로
      const serverCategories = (Array.isArray(parsed.categories) && parsed.categories.length)
        ? parsed.categories : DEFAULT_CATEGORIES.map(c => ({ ...c }));

      if(local){
        const mergedSentences = mergeWithServer(serverSentences, local.sentences);
        const mergedMemos = mergeMemosWithServer(serverMemos, local.memos);
        const mergedCategories = mergeCategoriesWithServer(serverCategories, local.categories);
        const stillUnsynced =
          mergedSentences.length !== serverSentences.length ||
          mergedMemos.length !== serverMemos.length ||
          mergedCategories.length !== serverCategories.length;

        sentences = mergedSentences;
        memos = mergedMemos;
        categories = mergedCategories;
        recentSources = serverSources.length ? serverSources : local.recentSources;

        if(stillUnsynced){
          console.log('로컬에만 있던 내용을 서버 응답과 병합함 - 다시 동기화 시도함');
          markUnsyncedAndRetry();
        }
      } else {
        sentences = serverSentences;
        memos = serverMemos;
        categories = serverCategories;
        recentSources = serverSources;
      }
    } else if(parsed && (Array.isArray(parsed.groups) || Array.isArray(parsed.books))){
      // 예전(책 기반) 데이터 발견 → 로컬 백업 후 새 구조로 초기화
      try{
        const backupKey = 'truth-collector-backup-books-' + Date.now();
        localStorage.setItem(backupKey, JSON.stringify(parsed));
        console.log('예전 데이터를 로컬에 백업했습니다:', backupKey);
      }catch(e){}
      sentences = [];
      recentSources = [];
      memos = [];
      categories = DEFAULT_CATEGORIES.map(c => ({ ...c }));
      await saveAll();
      setTimeout(() => showToast('예전 책 데이터는 이 브라우저에 백업해뒀어요'), 500);
    } else {
      // 서버에 아무것도 없거나 형식이 안 맞음 - 곧바로 빈 상태로 밀어버리면, 서버가 잠깐
      // 응답을 못 준 것뿐이었을 때 이 브라우저에 남아있던 것까지 통째로 사라져 보임.
      // 그래서 바로 비우지 않고, 이 기기에 남겨둔 로컬 백업이 있으면 그걸 먼저 씀.
      const local = readLocalBackup();
      if(local){
        sentences = local.sentences;
        recentSources = local.recentSources;
        memos = local.memos;
        categories = local.categories;
        console.log('서버 응답이 비어있어 로컬 백업을 대신 씀');
        markUnsyncedAndRetry(); // 이 내용이 서버에 실제로 가 있는지 확실치 않으니 다시 시도해봄
      } else {
        sentences = [];
        recentSources = [];
        memos = [];
        categories = DEFAULT_CATEGORIES.map(c => ({ ...c }));
      }
    }
  }catch(e){
    console.error('데이터 로드 실패:', e);
    // 네트워크 자체가 안 되는 상황(오프라인 등)에서도 마찬가지로 로컬 백업을 먼저 확인함
    const local = readLocalBackup();
    if(local){
      sentences = local.sentences;
      recentSources = local.recentSources;
      memos = local.memos;
      categories = local.categories;
      console.log('로드 실패로 로컬 백업을 대신 씀');
      markUnsyncedAndRetry();
    } else {
      sentences = [];
      recentSources = [];
      memos = [];
      categories = DEFAULT_CATEGORIES.map(c => ({ ...c }));
    }
  }

  loadedSnapshotIds = new Set(sentences.map(s => s.id));
  memoLoadedSnapshotIds = new Set(memos.map(m => m.id));
  categoryLoadedSnapshotNames = new Set(categories.map(c => c.name));
  currentCategory = loadLastCategory();
  // PC는 편집(글쓰기), 폰은 읽기가 주 용도로 자리 잡아서, 지난 방문 때 어느 모드였는지와
  // 상관없이 기기에 따라 시작 모드를 정함. 폰은 늘 보기 모드로, PC는 켜자마자 비밀번호
  // 창을 자동으로 띄워서 곧장 편집 모드로 넘어가게 함(취소하면 보기 모드에 남음 - 검색 등은
  // 거기서도 계속 쓸 수 있음).
  viewMode = 'view';
  applyViewMode();
  renderArchive();
  if(!HAS_ONSCREEN_KEYBOARD) openPasscodeSheet();
}

// 서버의 최신 문장 목록과 지금 이 브라우저의 문장 목록을 병합함.
// - 로컬에 있는 건 그대로 씀(방금 내가 만든 수정이 우선)
// - 서버에만 있고, 내가 마지막으로 불러온 시점에도 없었던 것 → 그 사이 다른 사람이
//   추가한 것이므로 살려서 합침
// - 서버에는 있는데 내가 불러온 시점엔 있었지만 지금 로컬엔 없는 것 → 내가 의도적으로
//   삭제한 것이므로 되살리지 않음
function mergeWithServer(serverSentences, localSentences){
  const merged = [];
  const seen = new Set();
  localSentences.forEach(s => {
    merged.push(s);
    seen.add(s.id);
  });
  serverSentences.forEach(s => {
    if(seen.has(s.id)) return;
    if(loadedSnapshotIds.has(s.id)) return; // 내가 지운 것 → 복원하지 않음
    merged.push(s); // 그 사이 다른 사람이 추가한 것 → 살림
  });
  return merged;
}
// 메모도 같은 방식으로 병합함 (폰에서 쓰고, 컴퓨터에서 지워나가는 흐름이라 겹칠 일은 적지만 안전하게)
let memoLoadedSnapshotIds = new Set();
function mergeMemosWithServer(serverMemos, localMemos){
  const merged = [];
  const seen = new Set();
  localMemos.forEach(m => { merged.push(m); seen.add(m.id); });
  serverMemos.forEach(m => {
    if(seen.has(m.id)) return;
    if(memoLoadedSnapshotIds.has(m.id)) return;
    merged.push(m);
  });
  return merged;
}
// 카테고리도 같은 방식으로 병합함 - id가 따로 없는 목록이라 이름을 기준으로 삼음.
// (이름 자체가 바뀌는 "수정"은 새 이름을 가진 것 하나가 로컬에 생기고 옛 이름은 로컬에서
// 사라지는 것과 같은 모양이라, 이 병합 로직이 그대로 "이름 바꾸기"에도 자연히 맞음)
let categoryLoadedSnapshotNames = new Set();
function mergeCategoriesWithServer(serverCategories, localCategories){
  const merged = [];
  const seen = new Set();
  localCategories.forEach(c => { merged.push(c); seen.add(c.name); });
  serverCategories.forEach(c => {
    if(seen.has(c.name)) return;
    if(categoryLoadedSnapshotNames.has(c.name)) return; // 내가 지우거나 이름을 바꿔 없앤 것 → 복원 안 함
    merged.push(c);
  });
  return merged;
}

// 서버(Cloudflare) 하나에만 의존하면, 서버 쪽에 무슨 문제가 생기는 순간 이 기기에서도
// 통째로 사라져 보임 - "폰에서 저장했다고 떴는데 나중에 열어보니 없어져 있었다"는 게 이래서 생김.
// 그래서 저장할 때마다 이 브라우저 자체(localStorage)에도 항상 최신 상태를 남겨두고,
// 서버가 응답을 못 줄 때는 그걸 대신 씀 - 최소한 이 기기 안에서는 절대 안 사라지게 하는 안전망.
const LOCAL_BACKUP_KEY = 'truth-collector-local-backup';
function writeLocalBackup(){
  try{
    localStorage.setItem(LOCAL_BACKUP_KEY, JSON.stringify({ sentences, recentSources, memos, categories, ts: Date.now() }));
  }catch(e){
    console.error('로컬 백업 저장 실패:', e);
  }
}
function readLocalBackup(){
  try{
    const raw = localStorage.getItem(LOCAL_BACKUP_KEY);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    if(!Array.isArray(parsed.sentences)) return null;
    return {
      sentences: parsed.sentences,
      recentSources: Array.isArray(parsed.recentSources) ? parsed.recentSources : [],
      memos: Array.isArray(parsed.memos) ? parsed.memos : [],
      // 이 백업이 카테고리 기능 이전에 저장된 것일 수도 있으니(옛 버전), 없으면 기본값으로
      categories: Array.isArray(parsed.categories) && parsed.categories.length ? parsed.categories : DEFAULT_CATEGORIES.map(c => ({ ...c }))
    };
  }catch(e){
    return null;
  }
}

// saveAll()이 겹쳐서 여러 번 불려도(메모를 빠르게 연달아 쓸 때처럼), 실제 서버 통신은
// 반드시 한 번에 하나씩만, 순서대로 나가게 함. 안 그러면 "메모 1개만 있던 시점"에
// 만들어진 요청이 네트워크에서 늦게 도착해서, 그새 다른 요청이 이미 반영해둔
// "메모 4개 있는" 최신 상태를 덮어써버릴 수 있음 - 문장은 저장 버튼을 잠가서 한 번에
// 하나씩만 나가게 해뒀는데, 메모는 "쭈르륵 쓰기"를 위해 일부러 그 잠금을 안 둬서
// 여러 저장이 겹칠 수 있었음. 화면 반응은 그대로 즉시 되게 두고, 서버로 나가는
// 실제 통신 줄만 여기서 하나로 세움.
let saveQueue = Promise.resolve();
function saveAll(){
  const result = saveQueue.then(() => saveAllInner());
  saveQueue = result.catch(() => {}); // 이번 게 실패해도 다음 저장은 이어지게 함
  return result;
}
async function saveAllInner(){
  try{
    // 저장 직전에 서버 최신본을 한 번 더 확인해서 병합함 - 안 그러면 내가 저장하는 순간
    // 그 사이 다른 사람이 추가한 내용이 통째로 사라질 수 있음
    let serverBackup = null;
    try{
      const res = await storageAdapter.get(STORAGE_KEY);
      const parsed = res && res.value ? JSON.parse(res.value) : null;
      if(parsed && parsed.backup) serverBackup = parsed.backup;
      if(parsed && Array.isArray(parsed.sentences)){
        sentences = mergeWithServer(parsed.sentences, sentences);
        memos = mergeMemosWithServer(Array.isArray(parsed.memos) ? parsed.memos : [], memos);
        categories = mergeCategoriesWithServer(
          (Array.isArray(parsed.categories) && parsed.categories.length) ? parsed.categories : DEFAULT_CATEGORIES.map(c => ({ ...c })),
          categories
        );
        (parsed.recentSources || []).forEach(src => {
          if(!recentSources.includes(src)) recentSources.push(src);
        });
        recentSources = recentSources.slice(0, 3);
      }
    }catch(e){
      console.error('저장 전 병합 확인 실패 (그대로 저장 진행):', e);
    }

    // 서버로 보내기 전에 먼저 이 기기에 남겨둠 - 이 아래(서버 전송)에서 무슨 일이 생기든
    // 방금 쓴 내용은 최소한 이 브라우저 안에는 이미 안전하게 있는 상태가 됨
    writeLocalBackup();

    const payload = { sentences, recentSources, memos, categories };
    if(serverBackup) payload.backup = serverBackup;

    const result = await storageAdapter.set(STORAGE_KEY, JSON.stringify(payload));
    // set()이 null을 돌려주면 서버가 실제로는 거부한 것 - 여태 이 값을 확인 안 해서
    // 서버가 에러를 응답해도 무조건 성공으로 처리되고 있었음(폰에서 "저장했어요"가 떴는데
    // 실제로는 서버에 하나도 안 남아있던 문제의 진짜 원인)
    if(!result) throw new Error('서버가 저장을 거부함');
    lastLocalSaveAt = Date.now();
    loadedSnapshotIds = new Set(sentences.map(s => s.id));
    memoLoadedSnapshotIds = new Set(memos.map(m => m.id));
    categoryLoadedSnapshotNames = new Set(categories.map(c => c.name));
    // 이전에 실패해서 재시도를 기다리고 있던 상태였다면, 이번엔 성공했으니 그 상태를 풀어줌
    if(hasUnsyncedChanges){
      setUnsyncedState(false);
      showToast('이제 서버에도 반영됐어요', 1600);
    }
    return true;
  }catch(e){
    console.error('저장 실패:', e);
    showToast('서버엔 저장 못 했지만 이 기기엔 남아있어요. 다시 시도해주세요.');
    // 여기서 포기하지 않고, 뒤에서 계속 다시 시도함 - 다른 기기(컴퓨터 등)로 넘어가려면
    // 결국 서버까지 가야 하므로, 이 기기 안에 남겨두는 것만으론 부족함
    markUnsyncedAndRetry();
    return false;
  }
}
// 서버 저장이 실패했을 때, 포기하지 않고 일정 간격으로 다시 시도함.
// (로컬 백업은 "이 기기에서 안 사라지게"만 해줄 뿐, 다른 기기로 넘어가려면 결국
//  서버까지 가야 하므로 이 재시도가 꼭 필요함)
let hasUnsyncedChanges = false;
let retryTimer = null;
// 평소엔 완전히 안 보이다가, 재시도를 기다리는 동안에만 로고 옆에 아주 작은 점으로 표시함.
// "정상일 때 뭔가 보이면 그게 노이즈"라는 원칙이라 - 값이 바뀌는 이 함수를 거칠 때만 갱신함.
function setUnsyncedState(value){
  hasUnsyncedChanges = value;
  if(syncDot) syncDot.classList.toggle('show', value);
}
function markUnsyncedAndRetry(){
  setUnsyncedState(true);
  if(retryTimer) return; // 이미 재시도가 예약되어 있으면 중복으로 걸지 않음
  retryTimer = setTimeout(async () => {
    retryTimer = null;
    if(!hasUnsyncedChanges) return;
    const ok = await saveAll();
    if(!ok) markUnsyncedAndRetry(); // 이번에도 실패했으면 또 예약
  }, 8000);
}

// ── 다른 사람이 고친 내용 백그라운드로 확인하기 ─────────────
// Cloudflare KV는 최종 일관성 저장소라, 다른 곳에서 저장한 내용이 최대 1분 이상 늦게 반영될 수
// 있음. 그래서 주기적으로 조용히 다시 불러와서, 바뀐 게 있으면 화면만 갱신해줌.
let lastLocalSaveAt = 0;
let loadedSnapshotIds = new Set();
let pollTimer = null;

// "봤다" 기록처럼 사람이 알아챌 수 없는 필드는 변경 비교에서 제외함 -
// 안 그러면 그냥 스크롤하며 읽기만 해도 "변경사항 반영" 알림이 떠서 오해를 살 수 있음
function stripSilentFields(list){
  return list.map(({ lastSeenAt, ...rest }) => rest);
}

async function pollForUpdates(){
  // 뭔가 입력 중이거나 시트가 열려있으면 방해하지 않도록 건너뜀
  const anyOverlayOpen = document.querySelector(
    '.sheet-overlay.open, .modal-overlay.open, .ios-action-sheet.open, .ios-sheet-backdrop.open'
  );
  if(anyOverlayOpen) return;

  // 방금 로컬에서 저장했다면, 서버가 아직 그 이전 값을 캐시하고 있을 수 있어
  // 잠시 폴링을 건너뜀 (안 그러면 내가 방금 한 수정이 순간적으로 되돌아가 보일 수 있음)
  if(Date.now() - lastLocalSaveAt < 90000) return;

  try{
    const res = await storageAdapter.get(STORAGE_KEY);
    const parsed = res && res.value ? JSON.parse(res.value) : null;
    if(!parsed || !Array.isArray(parsed.sentences)) return;

    // 아직 서버로 못 보낸 내용이 있는 동안엔(재시도 대기 중), 서버 값으로 그냥 덮어쓰면
    // 안 됨 - 이 서버 응답 자체가 "그 내용이 반영되기 전"의 값이라, 덮어쓰는 순간
    // 로컬에만 있던 내용이 사라짐. 그 사이엔 조용히 건너뜀(재시도가 곧 알아서 반영함).
    if(hasUnsyncedChanges) return;

    // 메모는 조용히 최신값으로만 맞춰둠 (폰에서 쓴 메모가 컴퓨터 배지에 반영되도록) -
    // 문장처럼 "변경사항 반영" 알림을 띄우진 않음, 화면에 안 보이는 내용이라 알려도 혼란만 줌
    const newMemos = Array.isArray(parsed.memos) ? parsed.memos : [];
    if(JSON.stringify(newMemos) !== JSON.stringify(memos)){
      memos = newMemos;
      memoLoadedSnapshotIds = new Set(memos.map(m => m.id));
      updateComposeMemoState();
    }

    // 카테고리도 메모와 같이 조용히만 맞춤 - 다른 기기에서 새로 만들거나 이름을 바꿨을 수 있음.
    // 지금 보고 있던 카테고리가 그 사이 이름이 바뀌거나 지워졌으면, 첫 번째 카테고리로 옮겨감.
    const newCategories = (Array.isArray(parsed.categories) && parsed.categories.length)
      ? parsed.categories : DEFAULT_CATEGORIES.map(c => ({ ...c }));
    if(JSON.stringify(newCategories) !== JSON.stringify(categories)){
      categories = newCategories;
      categoryLoadedSnapshotNames = new Set(categories.map(c => c.name));
      if(!categoryNames().includes(currentCategory) && currentCategory !== UNCATEGORIZED){
        currentCategory = categoryNames()[0] || UNCATEGORIZED;
        saveLastCategory(currentCategory);
      }
      renderCategoryTabs();
    }

    const anyDiff = JSON.stringify(parsed.sentences) !== JSON.stringify(sentences);
    if(!anyDiff) return;

    const meaningfulDiff = JSON.stringify(stripSilentFields(parsed.sentences)) !== JSON.stringify(stripSilentFields(sentences));

    sentences = parsed.sentences;
    recentSources = Array.isArray(parsed.recentSources) ? parsed.recentSources : [];
    loadedSnapshotIds = new Set(sentences.map(s => s.id));

    if(meaningfulDiff){
      renderArchive();
      showToast('새로운 변경사항을 반영했어요', 1800);
    }
    // 의미있는 변경이 아니면(예: 시청 기록만 달라짐) 화면을 다시 그리거나 알리지 않고
    // 최신 데이터로만 조용히 맞춰둠

  }catch(e){
    console.error('자동 새로고침 확인 실패:', e);
  }
}
function startPolling(){
  if(pollTimer) return;
  pollTimer = setInterval(pollForUpdates, 20000);
}
function stopPolling(){
  if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }
}
// 탭이 백그라운드로 가면 멈추고, 다시 돌아오면 바로 한 번 확인 후 재시작
document.addEventListener('visibilitychange', () => {
  if(document.hidden){
    stopPolling();
  } else {
    pollForUpdates();
    startPolling();
  }
});
startPolling();

// ── 백업 저장 ──────────────────────────────────────────
// Worker 변경 없이, 같은 저장 값 안에 "backup" 필드 하나를 추가하는 방식으로 구현함.
// 로고를 누르는 동작 자체는 이제 보기/편집 모드 전환에 쓰이므로, 백업은 모드를 바꿀 때마다
// 화면에 아무 티도 안 내고 조용히 같이 저장되도록 붙여둠.
// "복원용 백업 스냅샷"을 서버에 남겨두는 용도. 예전엔 이 함수가 saveAll()의 줄 세우기를
// 건너뛰고 서버에 직접 쓰고 있었고(그래서 메모 저장 요청과 순서 없이 겹칠 수 있었음),
// 심지어 보내는 내용에 memos 필드 자체가 빠져 있었음 - 편집 모드 들어갈 때마다
// (컴퓨터는 켜질 때마다, 폰은 메모 화면 들어갈 때마다) 조용히 자동으로 이게 실행되니,
// 서버가 보낸 것을 그대로 통째로 반영하는 방식이라면 이게 실행될 때마다 메모가
// 통째로 사라질 수 있었음 - 메모가 자꾸 사라지던 것의 진짜 원인일 가능성이 큼.
// 이제는 saveAll()과 완전히 같은 줄(큐)을 타게 하고, 지금 메모리에 있는 sentences·
// memos·recentSources를 빠짐없이 그대로 실어서 보냄(saveAll과 동일한 내용 + 백업 스냅샷만 추가).
function handleBackupSave(silent){
  const result = saveQueue.then(() => handleBackupSaveInner(silent));
  saveQueue = result.catch(() => {});
  return result;
}
async function handleBackupSaveInner(silent){
  try{
    const res = await storageAdapter.get(STORAGE_KEY);
    const parsed = res && res.value ? JSON.parse(res.value) : null;
    const baseSentences = (parsed && Array.isArray(parsed.sentences)) ? parsed.sentences : sentences;
    const baseSources = (parsed && Array.isArray(parsed.recentSources)) ? parsed.recentSources : recentSources;
    // 서버가 방금 어떤 값을 갖고 있었든, 지금 이 기기가 알고 있는 sentences/memos/categories를
    // 절대 누락하지 않고 그대로 실음 (예전엔 memos 필드 자체가 빠져있었음)
    const mergedSentences = mergeWithServer(baseSentences, sentences);
    const mergedMemos = mergeMemosWithServer(Array.isArray(parsed?.memos) ? parsed.memos : [], memos);
    const mergedCategories = mergeCategoriesWithServer(
      (Array.isArray(parsed?.categories) && parsed.categories.length) ? parsed.categories : DEFAULT_CATEGORIES.map(c => ({ ...c })),
      categories
    );

    const result = await storageAdapter.set(STORAGE_KEY, JSON.stringify({
      sentences: mergedSentences,
      recentSources: baseSources,
      memos: mergedMemos,
      categories: mergedCategories,
      backup: { sentences: mergedSentences, recentSources: baseSources, savedAt: Date.now() }
    }));
    if(!result) throw new Error('서버가 백업 저장을 거부함');
    if(!silent) showToast('저장됐어요', 1200);
  }catch(e){
    console.error('백업 저장 실패:', e);
    markUnsyncedAndRetry();
  }
}

// ── 보기 모드 / 편집 모드 ───────────────────────────────
// 보기 모드: 우하단 버튼이 돋보기(검색)가 되고, 문장을 눌러도 메뉴 대신 짧은 반응만 뜸.
// 편집 모드: 지금까지의 화면 그대로. 로고를 누르면 두 모드가 전환됨 - 그 외엔 로고를 눌러도 아무 반응 없음.
let viewMode = 'edit';

function applyViewMode(){
  document.body.classList.toggle('mode-view', viewMode === 'view');
  // 폰에서 "편집 모드"는 이제 즐겨찾기/코멘트/수정 같은 걸 하는 게 아니라,
  // 화면 전체가 메모 쓰는 화면으로 바뀜. 컴퓨터는 채팅형 입력줄이 뜨는 편집 화면.
  const memoScreenActive = HAS_ONSCREEN_KEYBOARD && viewMode === 'edit';
  const composeActive = !HAS_ONSCREEN_KEYBOARD && viewMode === 'edit';
  const wasMemoScreen = document.body.classList.contains('mode-memo');
  document.body.classList.toggle('mode-memo', memoScreenActive);
  // 메모 화면도 팝업과 똑같이 뒤 읽기 화면을 고정시킴. 팝업들과 같은 잠금 카운트를 쓰므로,
  // 비밀번호 창이 닫히는 것과 메모 화면이 열리는 게 겹쳐도 잠금이 중간에 풀리지 않음
  // (예전엔 overflow만 잠갔는데 아이폰 사파리에선 그게 안 통했음)
  if(memoScreenActive && !wasMemoScreen) lockBodyScroll();
  else if(!memoScreenActive && wasMemoScreen) unlockBodyScroll();
  document.body.classList.toggle('compose-active', composeActive);
  document.documentElement.classList.toggle('compose-active-html', composeActive);
  updateFabForMode();
  updateComposeMemoState();
  if(memoScreenActive) openMemoCaptureScreen();
  if(composeActive) activateComposeBar();
}
// 화면 전체가 아주 잠깐 흐려졌다 돌아오고, 우하단 아이콘이 통통 튀듯 바뀜 - "다른 모드로 넘어갔다"는
// 느낌만 은은하게 주는 정도. 페이지가 뒤집히거나 하는 과한 연출은 톤이랑 안 맞아서 피함.
// skipPageAnim: 비밀번호 창이 닫히면서 넘어올 땐 화면 깜빡임을 생략함.
// 창이 사라지는 것만으로도 이미 전환된 느낌이 나는데, 거기에 화면까지 깜빡이면 두 번 흔들려 어색함.
function playModeSwitchAnim(skipPageAnim){
  if(!skipPageAnim){
    const wrapEl = document.querySelector('.wrap');
    if(wrapEl){
      wrapEl.classList.remove('mode-switch-fade');
      void wrapEl.offsetWidth;
      wrapEl.classList.add('mode-switch-fade');
      setTimeout(() => wrapEl.classList.remove('mode-switch-fade'), 420);
    }
  }
  // 컴퓨터 편집 모드에서는 이 버튼이 평소엔 숨겨져 있다가(하이라이트할 때만 나타남) -
  // 이 튀는 연출이 opacity를 강제로 건드려서, 숨겨져 있어야 할 버튼이 전환하는 순간
  // 잠깐 화면에 나타났다 사라지는 것처럼 보였음(우측 세로 중앙에 원이 반짝하고 사라지는 현상).
  // 그 자리에서는 튈 필요가 없으니 건너뜀.
  const enteringComposeActive = !HAS_ONSCREEN_KEYBOARD && viewMode === 'edit';
  if(!enteringComposeActive){
    addQuoteTriggerBtn.classList.remove('fab-icon-pop');
    void addQuoteTriggerBtn.offsetWidth;
    addQuoteTriggerBtn.classList.add('fab-icon-pop');
    setTimeout(() => addQuoteTriggerBtn.classList.remove('fab-icon-pop'), 360);
  }
}
// (예전엔 여기서 읽던 위치를 따로 저장해뒀다가 나갈 때 되돌리는 코드가 있었음.
//  이제는 뒤 화면을 고정하는 방식(freezeBackground)이 위치를 그대로 보존해서 알아서 돌아오므로,
//  두 코드가 서로 다른 값을 써서 오히려 어긋나던 문제를 없애려고 제거함)
function switchToMode(next, skipPageAnim){
  viewMode = next;
  playModeSwitchAnim(skipPageAnim);
  applyViewMode();
  handleBackupSave(true); // 모드 전환 김에 백업도 조용히 남겨둠
}
function toggleViewMode(){
  // 편집 모드로 들어갈 때만 비밀번호를 확인함. 나올 때는 그냥 나감.
  if(viewMode === 'view'){
    openPasscodeSheet();
  } else {
    switchToMode('view');
  }
}

// ── 편집 모드 비밀번호 ──────────────────────────────────
const EDIT_PASSCODE = '134679';
let passcodeValue = '';

function renderPasscodeDots(){
  passcodeDots.innerHTML = Array.from({ length: EDIT_PASSCODE.length }, (_, i) => {
    const filled = i < passcodeValue.length;
    const justFilled = i === passcodeValue.length - 1; // 방금 막 채워진 그 점 하나만 표시
    return `<div class="passcode-dot${filled ? ' filled' : ''}${justFilled ? ' just-filled' : ''}"></div>`;
  }).join('');
}
// 잠금 화면 뒤 배경(오로라 그라데이션)은 이제 순수 CSS 애니메이션이라 JS가 따로
// 켜고 끌 필요가 없음 - 창이 display:none일 땐 애니메이션도 같이 멈춰서 배터리 걱정도 없음.

function openPasscodeSheet(){
  passcodeValue = '';
  passcodeInput.value = '';
  passcodeError.classList.remove('show');
  passcodeOverlay.classList.remove('unlocked');
  // 폰에서 열리는 편집 모드는 이제 "메모 쓰기 화면"이라, 문구도 그에 맞게 바꿔줌
  passcodeTitle.textContent = HAS_ONSCREEN_KEYBOARD ? '메모 쓰기' : '편집 모드';
  renderPasscodeDots();
  passcodeOverlay.classList.add('open');
  lockBodyScroll();
  syncDialogViewport();
  // 폰에서는 "누른 그 순간"에 초점을 줘야 자판이 올라옴.
  // 잠시 뒤에 주면 사용자가 누른 동작과 끊겨서 자판이 안 뜸.
  // preventScroll: 진짜 탭(사용자 제스처)으로 열릴 때만 브라우저가 이 입력칸을 "보이게"
  // 스스로 스크롤시키려 드는 게 있어서, 그 스크롤이 읽던 위치를 0으로 밀어버렸음.
  // 이 칸은 이미 화면 전체를 덮은 창 안에 있어 보이게 할 필요 자체가 없어 꺼둠.
  passcodeInput.focus({ preventScroll: true });
}
function closePasscodeSheet(){
  // 지금 초점이 이 창 "안"에 있을 때만 블러 처리함(비번 입력칸의 폰 자판을 내리려는 목적).
  // 예전엔 무조건 블러했는데, 전환 애니메이션을 넣은 뒤로 이 함수가 실행되는 시점엔 이미
  // switchToMode가 컴포즈바 입력칸에 초점을 옮겨둔 뒤라(순서가 그렇게 바뀜), 그걸 도로
  // 지워버리는 버그가 있었음 - 편집 모드에 들어가자마자 Tab을 눌러도 타이핑 중이던 걸로
  // 인식이 안 되고 목록 탐색 모드로 잘못 들어가던 원인이 이거였음.
  if(document.activeElement && passcodeOverlay.contains(document.activeElement) && document.activeElement.blur){
    document.activeElement.blur();
  }
  passcodeOverlay.classList.remove('open');
  resetDialogViewport(passcodeOverlay);
  unlockBodyScroll();
}
passcodeOverlay.addEventListener('click', (e) => {
  if(e.target === passcodeOverlay) closePasscodeSheet();
  else passcodeInput.focus(); // 시트 안 아무 데나 눌러도 계속 입력할 수 있게
});

passcodeInput.addEventListener('input', () => {
  passcodeValue = passcodeInput.value.replace(/\D/g, '').slice(0, EDIT_PASSCODE.length);
  passcodeInput.value = passcodeValue;
  passcodeError.classList.remove('show');
  renderPasscodeDots();

  if(passcodeValue.length < EDIT_PASSCODE.length) return;
  if(passcodeValue === EDIT_PASSCODE){
    // 바로 닫지 않고, 자물쇠가 열리고 점이 차오르는 걸 잠깐 보여준 뒤 넘어감
    passcodeOverlay.classList.add('unlocked');
    setTimeout(() => {
      // 순서가 중요함: 편집 모드로 먼저 넘어가야(폰이면 메모 화면이 잠금을 하나 더 걸어둠)
      // 그 다음 비밀번호 창을 닫아도 잠금이 0으로 떨어지지 않음.
      // 반대 순서면 그 찰나에 잠금이 완전히 풀려서 읽던 위치가 맨 위로 튐.
      // 절충안 전환: 카드+오로라가 옅어지는 동안, 내용은 먼저 바꿔치기 해두고
      // (그래야 옅어지는 카드 뒤로 살짝 비치는 게 이미 올바른 내용임) PC에서는
      // 그 내용이 살짝 작았다가 커지며 나타나는 걸 같이 보여줌.
      switchToMode('edit', true);
      const passcodeSheetEl = document.querySelector('.passcode-sheet');
      passcodeSheetEl.classList.add('transitioning-out');
      passcodeAurora.classList.add('transitioning-out');
      if(!HAS_ONSCREEN_KEYBOARD){
        const wrapEl = document.querySelector('.wrap');
        wrapEl.classList.remove('content-reveal-in');
        void wrapEl.offsetWidth;
        wrapEl.classList.add('content-reveal-in');
      }
      setTimeout(() => {
        closePasscodeSheet();
        passcodeSheetEl.classList.remove('transitioning-out');
        passcodeAurora.classList.remove('transitioning-out');
      }, 550);
    }, 900);
  } else {
    // 틀리면 흔들리고 비워짐
    passcodeError.classList.add('show');
    passcodeDots.classList.remove('shake');
    void passcodeDots.offsetWidth;
    passcodeDots.classList.add('shake');
    setTimeout(() => {
      passcodeValue = '';
      passcodeInput.value = '';
      renderPasscodeDots();
    }, 420);
  }
});

// ── 폰 전용 메모 화면 ────────────────────────────────────
// 책 읽으면서 폰으로 정식 문장을 옮겨 적는 건 느리고 오타가 나서, 실제로는
// "171 남성은"처럼 짧은 단서만 쭈르륵 남기고 나중에 컴퓨터에서 정리하시더라는 것에서 시작함.
// 그래서 폰의 "편집 모드"는 이제 즐겨찾기·수정 같은 걸 하는 자리가 아니라, 이 단서(페이지+키워드)를
// 빠르게 이어 쓰는 전용 화면임. 저장하면 칸이 비워지고 바로 다음 메모를 쓸 수 있음.
function updateMemoScreenCount(){
  if(!memoScreenCount) return;
  memoScreenCount.textContent = memos.length ? `${memos.length}개 남김` : '';
}
function openMemoCaptureScreen(){
  updateMemoScreenCount();
  memoPageInput.value = '';
  memoKeywordInput.value = '';
  focusSoon(() => memoPageInput);
}
async function saveMemoEntry(){
  const page = memoPageInput.value.trim();
  const keyword = memoKeywordInput.value.trim();
  if(!page){
    // 페이지는 나중에 그 자리를 다시 찾는 유일한 단서라 꼭 필요함 - 비어있으면 살짝 흔들어 알려줌
    memoPageInput.classList.remove('shake');
    void memoPageInput.offsetWidth;
    memoPageInput.classList.add('shake');
    memoPageInput.focus();
    return;
  }
  memos.push({ id: genId(), page, keyword, ts: Date.now() });
  // 화면에 반영하기도 전에, 가장 먼저 이 기기에 그대로 박아둠(동기적으로, 기다림 없이).
  // 예전엔 이걸 saveAll() 안(서버와 통신하는 비동기 코드 사이)에서 했는데, 그 사이에
  // 화면이 꺼지거나 폰이 멈추거나 하면 - 방금 메모리에 들어간 메모가 로컬에도 못
  // 남고 그대로 사라질 수 있었음(폰에서조차 사라지던 문제의 진짜 원인). 지금은
  // push하자마자 바로 적어둬서 그 틈 자체가 없음.
  writeLocalBackup();
  // 화면은 바로 비워서 다음 메모를 곧장 이어 쓸 수 있게 함("쭈르륵 쓰기" 흐름은 그대로 유지).
  // 실제 서버 저장은 뒤에서 진행되고, 성공/실패를 확인해서 알려줌 - 예전엔 결과를
  // 기다리지도 확인하지도 않고 무조건 "저장했어요"라고 알렸어서, 와이파이가 불안정한
  // 순간엔 조용히 실패해도 사용자는 저장된 줄 알고 넘어갈 수 있었음.
  memoPageInput.value = '';
  memoKeywordInput.value = '';
  updateMemoScreenCount();
  memoPageInput.focus();
  const savedCount = memos.length;
  const ok = await saveAll();
  if(ok){
    showToast(`메모 남겨뒀어요 (${savedCount}개)`, 1100);
  } else {
    // 성공 알림(1.1초)보다 훨씬 오래 띄워서, 이어서 다음 메모를 써도 묻혀 사라지지 않게 함
    showToast('컴퓨터엔 아직 안 갔지만 이 폰엔 남아있어요. Wi-Fi를 확인해주세요.', 3200);
  }
}
memoSaveBtn.addEventListener('click', saveMemoEntry);
memoPageInput.addEventListener('keydown', (e) => {
  if(e.key === 'Enter'){ e.preventDefault(); memoKeywordInput.focus(); }
});
memoKeywordInput.addEventListener('keydown', (e) => {
  if(e.key === 'Enter'){ e.preventDefault(); saveMemoEntry(); }
});
// 나갈 땐 비밀번호 없이 그냥 보기 모드로 (편집→보기는 원래 비번이 필요 없던 것과 동일)
memoExitBtn.addEventListener('click', () => switchToMode('view'));

// ── 컴퓨터 전용: 메모 말풍선 힌트 + 메모를 문장으로 옮기는 흐름 ───────
// 폰에서 남긴 메모가 있다는 건 이제 두 가지로만 조용히 알려줌 - ① 전송 버튼이 연필 얼굴이
// 되는 것(항상, 칸이 비어있을 때), ② Tab으로 타이핑을 잠깐 멈추는 순간 말풍선이 뜨는 것.
// 예전처럼 항상 떠 있는 숫자 배지는 없앰 - "평소에도 계속 보인다"는 게 문제였음.
function updateComposeMemoState(){
  if(HAS_ONSCREEN_KEYBOARD) return; // 폰에는 이 흐름 자체가 없음
  updateSendBtnIcon();
}
// 평소 화살표(저장) 대신, 메모가 있고 입력칸이 비어있을 때만 연필(메모 시작)로 바뀜 -
// 새 요소를 안 늘리고 이미 있는 버튼이 지금 상황에 맞는 얼굴을 하는 것뿐.
// 타이핑을 시작하면(칸이 안 비게 되면) 바로 원래 화살표로 돌아감.
function updateSendBtnIcon(){
  if(HAS_ONSCREEN_KEYBOARD) return;
  const showPencil = memos.length > 0 && !activeMemoConversion && !activeSentenceEdit
    && composeTextInput.value.trim() === '';
  document.body.classList.toggle('send-btn-pencil', showPencil);
}
// Tab으로 입력줄에서 초점이 빠질 때(목록 훑어보기 모드로 들어갈 때)만 잠깐 떠서 알려주고,
// 다시 타이핑을 시작하거나 몇 초 지나면 조용히 사라짐.
let memoHintTimer = null;
function showComposeMemoHint(){
  if(HAS_ONSCREEN_KEYBOARD || activeMemoConversion || activeSentenceEdit || !memos.length) return;
  composeMemoHint.textContent = `메모 ${memos.length}개가 쌓여있어요!`;
  composeMemoHint.classList.remove('show');
  void composeMemoHint.offsetWidth;
  composeMemoHint.classList.add('show');
  clearTimeout(memoHintTimer);
  memoHintTimer = setTimeout(hideComposeMemoHint, 3200);
}
function hideComposeMemoHint(){
  clearTimeout(memoHintTimer);
  composeMemoHint.classList.remove('show');
}
// 페이지 번호가 작은 것부터 - 책을 읽어나가는 순서와 자연히 맞음(나중 페이지는 나중에 처리)
function nextUnconvertedMemo(){
  if(!memos.length) return null;
  return memos.reduce((min, m) => (parseInt(m.page, 10) < parseInt(min.page, 10) ? m : min), memos[0]);
}
// 입력줄 위에 뜨는 메모 표시를 채움 - 어떤 메모를 옮기는 중인지 (몇 개 남았는지는
// 우측 상단 배지 숫자가 이미 보여주고 있어서 여기선 중복으로 안 보여줌)
function updateComposeMemoRow(memo){
  composeMemoRow.classList.add('show');
  composeMemoPage.textContent = memo.page + 'p';
  composeMemoKeyword.textContent = memo.keyword || '(키워드 없음)';
  syncComposeBarSpace(); // 이 줄이 생긴 만큼 입력줄 키가 커지므로, 목록 아래 여백도 다시 맞춤
}
// 채팅형 입력줄을 "메모 처리 모드"로 바꿈 - 팝업을 새로 여는 대신, 이미 떠 있는
// 입력줄 위에 그 메모 정보가 얹히고 페이지가 미리 채워짐. 문장 치고 엔터만 누르면 됨.
function openMemoConversionFlow(memo){
  if(activeSentenceEdit) return; // 문장을 수정하는 중엔 메모 처리가 그 내용을 덮어쓰면 안 됨
  const target = memo || nextUnconvertedMemo();
  if(!target) return;
  activeMemoConversion = target;
  document.body.classList.add('memo-converting'); // 이 동안엔 배지를 감춤(줄이 이미 개수를 보여주니 중복)
  composePageInput.value = target.page;
  updateComposeMetaPill();
  updateComposeMemoRow(target);
  composeTextInput.value = '';
  autoGrowComposeTextarea();
  updateSendBtnIcon(); // 메모 처리 중엔 전송 버튼이 다시 평소 화살표(저장용)로 돌아가야 함
  focusSoon(() => composeTextInput);
}
function closeMemoConversionFlow(){
  activeMemoConversion = null;
  document.body.classList.remove('memo-converting');
  composeMemoRow.classList.remove('show');
  composePageInput.value = '';
  updateComposeMetaPill();
  updateSendBtnIcon(); // 아직 남은 메모가 있으면 다시 연필 얼굴로
  syncComposeBarSpace();
}
// 메모 처리 중이거나 문장을 수정하는 중에, 입력줄 바깥(문장 목록 등)을 클릭해도
// 그만 씀 - 드롭다운처럼 "바깥을 누르면 닫힌다"는 흔한 동작을 그대로 따름.
document.addEventListener('mousedown', (e) => {
  if(!activeMemoConversion && !activeSentenceEdit) return;
  if(composeBar.contains(e.target)) return; // 입력줄 자체(출처 수정칸 등 포함)를 누른 거면 그냥 둠
  if(activeMemoConversion) closeMemoConversionFlow();
  if(activeSentenceEdit) closeSentenceEditFlow();
});
// 문장으로 옮기지 않고 그 메모만 지움(오타 등으로 필요 없어진 경우)
composeMemoDiscardBtn.addEventListener('click', async () => {
  if(!activeMemoConversion) return;
  memos = memos.filter(m => m.id !== activeMemoConversion.id);
  writeLocalBackup();
  await saveAll();
  updateComposeMemoState();
  const next = nextUnconvertedMemo();
  if(next){
    openMemoConversionFlow(next);
  } else {
    closeMemoConversionFlow();
    showToast('메모를 다 정리했어요', 1600);
  }
});
// 메모 처리 중이거나 문장을 수정하는 중에 Esc를 누르면 그만두고 평소 입력줄로 돌아감 -
// 메모는 지우지 않고 트래커에 남고, 수정은 저장 없이 취소됨. Tab과 똑같이 초점도 같이
// 비워서(문장 집중 모드로) 같은 전환 애니메이션이 여기서도 재생되게 함.
document.addEventListener('keydown', (e) => {
  if(e.key !== 'Escape' || (!activeMemoConversion && !activeSentenceEdit)) return;
  const anyOverlayOpen = document.querySelector(
    '.sheet-overlay.open, .modal-overlay.open, .ios-action-sheet.open, .ios-sheet-backdrop.open'
  );
  if(anyOverlayOpen) return; // 다른 창이 열려 있으면 그쪽 Esc가 우선함
  if(activeMemoConversion) closeMemoConversionFlow();
  if(activeSentenceEdit) closeSentenceEditFlow();
  if(document.activeElement === composeTextInput) composeTextInput.blur();
});
// 마우스로 트래커 카드를 누르지 않아도, 'M' 키로 바로 메모 처리를 시작할 수 있음.
// 한 번 더 누르면 다시 평소 입력줄로 돌아감(토글) - 메모는 지우는 게 아니라 트래커에
// 그대로 남아있어서 나중에 다시 M을 눌러 이어서 처리하면 됨.
// 문자 키라서 입력 중엔(한글 조합 등과 겹치지 않게) 절대 안 먹히게 막아둠 -
// 입력줄에서 완전히 벗어나 있을 때만(Tab으로 "문장 집중" 모드를 나온 상태) 동작함.
document.addEventListener('keydown', (e) => {
  if(e.key !== 'm' && e.key !== 'M') return;
  if(HAS_ONSCREEN_KEYBOARD || !document.body.classList.contains('compose-active')) return;
  if(activeSentenceEdit) return; // 문장을 수정하는 중엔 M이 끼어들어 그 내용을 덮어쓰면 안 됨
  const tag = document.activeElement ? document.activeElement.tagName : '';
  // 메모 모드로 들어가면 초점이 곧장 문장칸으로 이동하는데(타이핑 바로 시작하려고),
  // 그 상태에서 다시 M을 눌러 끄려고 하면 "입력 중이니 무시"에 걸려버림.
  // 그래서 메모 처리 중 + 아직 아무것도 안 쓴 빈 칸일 때만 예외로 허용함
  // (뭔가 이미 썼다면 그건 진짜 문장에 들어가는 m이니 그대로 타이핑되게 둠).
  const isEmptyComposeTextarea = tag === 'TEXTAREA'
    && document.activeElement === composeTextInput
    && composeTextInput.value === '';
  if(['INPUT', 'TEXTAREA'].includes(tag) && !(activeMemoConversion && isEmptyComposeTextarea)) return;
  const anyOverlayOpen = document.querySelector(
    '.sheet-overlay.open, .modal-overlay.open, .ios-action-sheet.open, .ios-sheet-backdrop.open'
  );
  if(anyOverlayOpen) return;
  e.preventDefault();
  if(activeMemoConversion){
    closeMemoConversionFlow();
    return;
  }
  if(!memos.length) return; // 처리할 메모가 없으면 아무 일도 안 일어남
  openMemoConversionFlow();
});

// 로고를 짧게 탭하면: 보기 모드에서는 그대로 편집 모드로(빠른 길 그대로 유지),
// 편집 모드에서는 이제 메뉴가 뜸(보기 모드로 / 맞춤법 확인 / 내보내기) - 가끔 쓰는
// 기능들을 한데 모아둔 자리. 길게 누르기(내보내기 전용 제스처)는 여기로 흡수되어 없어짐.
function exportAllData(){
  try{
    const payload = {
      exportedAt: new Date().toISOString(),
      sentenceCount: sentences.length,
      sentences,
      recentSources,
      memos,
      categories
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const dateStr = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = `soooozip-backup-${dateStr}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    showToast(`파일로 내보냈어요 (${sentences.length}개)`, 2000);
  }catch(e){
    console.error('내보내기 실패:', e);
    showToast('내보내지 못했어요', 1800);
  }
}
// 내보내기만 있고 되돌리는 방법이 없으면 반쪽짜리라, 가져오기(복구)를 짝으로 만듦.
// 안전하게: 무작정 덮어쓰지 않고, 지금 갖고 있는 것과 "병합"함 - 이미 저장/동기화에
// 쓰던 것과 똑같은 병합 함수를 그대로 재사용해서(파일 쪽을 "서버"인 것처럼 취급),
// 겹치는 건 건드리지 않고 파일에만 있던 것만 추가됨. 실수로 지금 걸 잃을 일이 없음.
function importAllData(){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'application/json';
  input.addEventListener('change', async () => {
    const file = input.files && input.files[0];
    if(!file) return;
    try{
      const text = await file.text();
      const parsed = JSON.parse(text);
      if(!Array.isArray(parsed.sentences)) throw new Error('문장 목록이 없는 파일이에요');

      const fileSentences = parsed.sentences;
      const fileMemos = Array.isArray(parsed.memos) ? parsed.memos : [];
      const fileCategories = (Array.isArray(parsed.categories) && parsed.categories.length)
        ? parsed.categories : DEFAULT_CATEGORIES.map(c => ({ ...c }));

      // 지금 갖고 있는 걸 "로컬"로 두고, 파일 내용을 "서버"인 것처럼 병합함 -
      // 겹치는 id/이름은 지금 것을 그대로 두고, 파일에만 있던 것만 새로 더해짐
      const mergedSentences = mergeWithServer(fileSentences, sentences);
      const mergedMemos = mergeMemosWithServer(fileMemos, memos);
      const mergedCategories = mergeCategoriesWithServer(fileCategories, categories);

      const addedSentences = mergedSentences.length - sentences.length;
      const addedMemos = mergedMemos.length - memos.length;
      const addedCategories = mergedCategories.length - categories.length;

      if(addedSentences === 0 && addedMemos === 0 && addedCategories === 0){
        showToast('이 파일 내용은 이미 다 갖고 있어요', 2000);
        return;
      }
      if(!confirm(`문장 ${addedSentences}개, 메모 ${addedMemos}개, 카테고리 ${addedCategories}개를 더 가져올까요?\n(겹치는 내용은 안 건드리고, 파일에만 있던 것만 추가돼요)`)) return;

      sentences = mergedSentences;
      memos = mergedMemos;
      categories = mergedCategories;
      loadedSnapshotIds = new Set(sentences.map(s => s.id));
      memoLoadedSnapshotIds = new Set(memos.map(m => m.id));
      categoryLoadedSnapshotNames = new Set(categories.map(c => c.name));

      await saveAll();
      renderArchive();
      showToast(`가져왔어요 (문장 ${addedSentences}개 추가)`, 2200);
    }catch(e){
      console.error('가져오기 실패:', e);
      showToast('이 파일을 읽을 수 없어요. soooo.zip에서 내보낸 파일이 맞는지 확인해주세요.', 2600);
    }
  });
  input.click();
}

// ── 카테고리 관리(추가·이름변경·삭제) ────────────────────
// 탭 끝 +버튼, 컴포즈바 카테고리 알약, 로고 메뉴 "카테고리 관리"가 전부 이 하나를 공유해서 씀.
function openCategoryPicker(){
  renderCategoryPickerList();
  categoryPickerNewInput.value = '';
  categoryPickerOverlay.classList.add('open');
  lockBodyScroll();
  syncDialogViewport();
}
function closeCategoryPicker(){
  if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
  categoryPickerOverlay.classList.remove('open');
  resetDialogViewport(categoryPickerOverlay);
  unlockBodyScroll();
}
categoryPickerOverlay.addEventListener('click', (e) => {
  if(e.target === categoryPickerOverlay) closeCategoryPicker();
});

// 목록을 다시 그림 - 미분류는 실제로 그 안에 문장이 있을 때만 골라볼 수 있게 보여줌

function renderCategoryPickerList(){

  const rows = categories.map(c => `
    <div class="category-picker-row${c.name === currentCategory ? ' current' : ''}" data-cat="${escapeHtml(c.name)}">

      </button>
    </div>
    <div class="category-picker-swatches" data-swatches-for="${escapeHtml(c.name)}">${renderColorSwatches(c.color)}</div>`).join('');
  const uncategorizedRow = hasUncategorized ? `
    <div class="category-picker-row${currentCategory === UNCATEGORIZED ? ' current' : ''}" data-cat="${UNCATEGORIZED}">
      <span class="category-picker-dot" style="background:${getCategoryColor(UNCATEGORIZED)}"></span>
      <button type="button" class="category-picker-name" data-action="select">${UNCATEGORIZED}</button>
    </div>` : '';
  categoryPickerList.innerHTML = rows + uncategorizedRow;
}
async function setCategoryColor(name, color){
  const cat = categories.find(c => c.name === name);
  if(!cat || cat.color === color) return;
  cat.color = color;
  if(currentCategory === name) applyCategoryColor();
  await saveAll();
  renderCategoryPickerList();
  renderCategoryTabs();
  updateComposeCatPill();
}

// 이름 칸을 실제 입력칸으로 바꿔서 그 자리에서 바로 고치게 함
function startCategoryRename(row, name){
  const nameBtn = row.querySelector('.category-picker-name');
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'category-picker-name-input';
  input.value = name;
  input.maxLength = 12;
  nameBtn.replaceWith(input);
  input.focus();
  input.select();

  const commit = () => {
    const newName = input.value.trim();
    if(!newName || newName === name){ renderCategoryPickerList(); return; }
    if(newName === UNCATEGORIZED || categoryNames().includes(newName)){
      showToast('이미 있는 이름이에요', 1600);
      renderCategoryPickerList();
      return;
    }
    renameCategory(name, newName);
  };
  input.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){ e.preventDefault(); commit(); }
    else if(e.key === 'Escape'){ e.preventDefault(); renderCategoryPickerList(); }
  });
  input.addEventListener('blur', commit);
}

async function renameCategory(oldName, newName){
  const cat = categories.find(c => c.name === oldName);
  if(!cat) return;
  cat.name = newName;
  // 그 이름을 참고하던 문장들도 같이 옮겨줌 (이름이 바뀌었을 뿐 다른 카테고리로 옮긴 게 아니므로)
  sentences.forEach(s => { if(s.category === oldName) s.category = newName; });
  if(currentCategory === oldName){
    currentCategory = newName;
    saveLastCategory(currentCategory);
  }
  await saveAll();
  renderCategoryPickerList();
  renderArchive();
}

async function deleteCategory(name){
  const count = sentences.filter(s => s.category === name).length;
  const msg = count > 0
    ? `"${name}"을 지우면 그 안의 문장 ${count}개는 "미분류"로 옮겨져요. 계속할까요?`
    : `"${name}"을 지울까요?`;
  if(!confirm(msg)) return;
  categories = categories.filter(c => c.name !== name);
  sentences.forEach(s => { if(s.category === name) s.category = UNCATEGORIZED; });
  if(currentCategory === name){
    currentCategory = categoryNames()[0] || UNCATEGORIZED;
    saveLastCategory(currentCategory);
  }
  await saveAll();
  renderCategoryPickerList();
  renderArchive();
}

categoryPickerList.addEventListener('click', (e) => {
  // 팔레트 안 색 하나를 고른 경우 - 행이 아니라 스와치 격자 안에서 일어나는 클릭이라 먼저 확인함
  const swatch = e.target.closest('.category-picker-swatch');
  if(swatch){
    const forName = swatch.closest('.category-picker-swatches').dataset.swatchesFor;
    setCategoryColor(forName, swatch.dataset.color);
    return;
  }

  const row = e.target.closest('.category-picker-row');
  if(!row) return;
  const cat = row.dataset.cat;
  const action = e.target.closest('[data-action]')?.dataset.action;

  if(action === 'select'){
    closeCategoryPicker();
    if(cat !== currentCategory) switchCategoryAnimated(cat);
    return;
  }
  if(action === 'rename'){
    startCategoryRename(row, cat);
    return;

  }

    categoryPickerList.querySelectorAll('.category-picker-swatches.open').forEach(el => el.classList.remove('open'));
    if(willOpen) swatches.classList.add('open');
    return;
  }
});

// ── 한글 검색: 타이핑 중인 모든 중간 상태를 인식 ──────────────
// "취향의 경제"를 치는 과정에서 나오는 상태들:
//   ㅊ → 추 → 취 → 츃 → 취햐 → 취향 → 취향ㅇ → 취향으 → 취향의
// 완성된 글자든 미완성이든, 글자를 전부 자모(첫소리·가운뎃소리·끝소리)로 풀어서
// 늘어놓고 비교하면 위 상태가 전부 "취향의"의 앞부분과 맞아떨어짐.
const HANGUL_BASE = 0xAC00, HANGUL_LAST = 0xD7A3;
const CHOSEONG = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const JUNGSEONG = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
const JONGSEONG = ['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];

// 겹받침·겹모음은 타이핑할 때 두 번에 나눠 눌리므로, 비교할 땐 낱개로 풀어둠
// (예: "취향" 입력 중 "ㅇ"만 눌린 상태 → 받침 ㅇ 과 맞아야 함)
const JONG_SPLIT = {
  'ㄳ':'ㄱㅅ','ㄵ':'ㄴㅈ','ㄶ':'ㄴㅎ','ㄺ':'ㄹㄱ','ㄻ':'ㄹㅁ','ㄼ':'ㄹㅂ',
  'ㄽ':'ㄹㅅ','ㄾ':'ㄹㅌ','ㄿ':'ㄹㅍ','ㅀ':'ㄹㅎ','ㅄ':'ㅂㅅ'
};
const JUNG_SPLIT = {
  'ㅘ':'ㅗㅏ','ㅙ':'ㅗㅐ','ㅚ':'ㅗㅣ','ㅝ':'ㅜㅓ','ㅞ':'ㅜㅔ','ㅟ':'ㅜㅣ','ㅢ':'ㅡㅣ'
};

function isCompleteHangul(ch){
  const code = ch.charCodeAt(0);
  return code >= HANGUL_BASE && code <= HANGUL_LAST;
}

// 문자열을 자모 단위로 풀어놓음. 한글이 아닌 글자는 그대로 둠.
function toJamo(str){
  let out = '';
  for(const ch of str){
    if(isCompleteHangul(ch)){
      const idx = ch.charCodeAt(0) - HANGUL_BASE;
      const cho = CHOSEONG[Math.floor(idx / 588)];
      const jung = JUNGSEONG[Math.floor((idx % 588) / 28)];
      const jong = JONGSEONG[idx % 28];
      out += cho + (JUNG_SPLIT[jung] || jung) + (JONG_SPLIT[jong] || jong);
    } else {
      out += (JUNG_SPLIT[ch] || JONG_SPLIT[ch] || ch);
    }
  }
  return out;
}

// 검색어가 대상 문자열 어딘가에 "타이핑 중인 상태로도" 맞는지 확인.
// 자모로 풀어서 비교하므로, 글자가 완성되기 전 어느 단계에서도 찾아짐.
function matchesTyping(text, query){
  if(!text || !query) return false;
  const t = text.toLowerCase();
  const q = query.toLowerCase();
  if(t.includes(q)) return true;          // 보통의 경우는 여기서 바로 끝남
  return toJamo(t).includes(toJamo(q));
}

function renderSearchResults(query){
  const q = query.trim().toLowerCase();
  if(!q){
    searchResultsList.innerHTML = `<div class="search-empty-hint">문장이나 책 제목을 입력해보세요</div>`;
    return;
  }
  const matches = sentences.filter(s =>
    matchesTyping(s.text, q) || matchesTyping(s.source, q)
  );
  if(matches.length === 0){
    searchResultsList.innerHTML = `<div class="search-empty-hint">찾는 문장이 없어요</div>`;
    return;
  }
  searchResultsList.innerHTML = matches.map(s => {
    const color = getCategoryColor(s.category);
    const meta = [s.source, s.ref].filter(Boolean).map(escapeHtml).join(' · ');
    // 목록에서 보던 그대로 - 칠해둔 형광펜과 저장(책갈피) 표시를 검색 결과에도 그대로 보여줌
    const bookmark = s.important ? `<span class="search-result-bookmark">${BOOKMARK_SVG}</span>` : '';
    return `<div class="search-result-item" data-id="${s.id}">
      <span class="search-result-tag" style="color:${color}">${escapeHtml(s.category)}</span>
      <div class="search-result-text">${renderHighlightedText(s.text, s.highlights)}</div>
      ${(meta || bookmark) ? `<div class="search-result-meta">${bookmark}${meta}</div>` : ''}
    </div>`;
  }).join('');
}
searchInput.addEventListener('input', () => {

});

// 검색 결과에서 그 문장이 있는 자리로 이동해 잠깐 빛나게 함
function jumpToSentence(id){
  const s = findSentence(id);
  if(!s) return;
  closeSearchSheet();
  if(s.category !== currentCategory){
    currentCategory = s.category;
    saveLastCategory(currentCategory);
    renderArchive();
  }
  setTimeout(() => {
    const el = archiveList.querySelector(`.quote-block[data-id="${s.id}"]`);
    if(!el) return;
    // 폰에서는 부드러운 강제 스크롤이 사파리의 화면 높이 계산을 흔들어서
    // 그 뒤로 떠 있는 요소들이 어긋남. 즉시 이동으로 바꿔 흔들림을 줄임.
    el.scrollIntoView({ block: 'center', behavior: HAS_ONSCREEN_KEYBOARD ? 'instant' : 'smooth' });
    el.classList.remove('search-jump-flash');
    void el.offsetWidth;
    el.classList.add('search-jump-flash');
  }, 260);
}

searchResultsList.addEventListener('click', (e) => {
  const item = e.target.closest('.search-result-item');
  if(!item) return;
  jumpToSentence(item.dataset.id);
});

// ── 검색 결과를 키보드로 고르기 (위/아래로 이동, 엔터로 이동) ──────
let searchActiveIdx = -1;
function updateSearchActive(){
  const items = searchResultsList.querySelectorAll('.search-result-item');
  items.forEach((el, i) => el.classList.toggle('active', i === searchActiveIdx));
  const cur = items[searchActiveIdx];
  if(cur) cur.scrollIntoView({ block: 'nearest' });
}
searchInput.addEventListener('keydown', (e) => {
  const items = searchResultsList.querySelectorAll('.search-result-item');
  if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    if(items.length === 0) return;
    e.preventDefault();
    e.stopPropagation();
    const dir = e.key === 'ArrowDown' ? 1 : -1;
    // 아직 아무것도 안 골랐으면 위/아래에 따라 처음 또는 마지막부터 시작
    if(searchActiveIdx === -1) searchActiveIdx = dir === 1 ? 0 : items.length - 1;
    else searchActiveIdx = (searchActiveIdx + dir + items.length) % items.length;
    updateSearchActive();
  } else if(e.key === 'Enter'){
    // 창을 닫으면 초점이 풀려서, 이 엔터가 전역 단축키까지 흘러가 검색창이 다시 열림.
    // 여기서 처리한 엔터는 위로 전달되지 않도록 막아둠.
    if(searchActiveIdx >= 0 && items[searchActiveIdx]){
      e.preventDefault();
      e.stopPropagation();
      jumpToSentence(items[searchActiveIdx].dataset.id);
    } else if(items.length === 1){
      // 결과가 하나뿐이면 굳이 고르지 않아도 바로 이동
      e.preventDefault();
      e.stopPropagation();
      jumpToSentence(items[0].dataset.id);
    }
  }
});

// ── 보관함(카테고리별 문장 목록) 렌더링 ──────────
// 문장을 추가/삭제할 때 목록이 갑자기 훅 바뀌지 않고 한 박자 부드럽게 이어지도록 하는
// 짧은 연출 두 가지. renderArchive()가 innerHTML을 통째로 다시 그리는 방식이라, "생겨난 것"과
// "사라질 것"을 미리 표시해두는 식으로 씀 - 렌더링 로직 자체는 건드리지 않고 그 앞뒤에서만 처리함.
function flashNewlyAdded(id){
  requestAnimationFrame(() => {
    const el = archiveList.querySelector(`.quote-block[data-id="${id}"]`);
    if(!el) return;
    el.classList.add('quote-just-added');
    el.addEventListener('animationend', () => el.classList.remove('quote-just-added'), { once: true });
  });
}
// 지우기로 결정된 문장이 그 자리에서 옅어지며 접히는 걸 먼저 보여준 뒤에 실제로 지움
function playRemoveAnimation(el){
  return new Promise(resolve => {
    if(!el){ resolve(); return; }
    const h = el.getBoundingClientRect().height;
    el.style.height = h + 'px'; // 트랜지션이 걸리려면 시작값이 숫자로 고정돼 있어야 함
    void el.offsetHeight; // 강제로 한 번 그리게 해서, 바로 다음 줄의 변화가 트랜지션으로 이어지게 함
    el.classList.add('quote-removing');
    requestAnimationFrame(() => { el.style.height = '0px'; });
    setTimeout(resolve, 240);
  });
}

function renderArchive(){
  applyCategoryColor();
  renderCategoryTabs();

  const fullList = sentences.filter(s => s.category === currentCategory);

  if(fullList.length === 0){
    archiveList.innerHTML = `
      <div class="empty">
        <div class="empty-title">아직 남긴 문장이 없습니다.</div>
      </div>`;
    setupSeenTracking();
    return;
  }

  const spotlight = pickSpotlight(fullList);
  const withoutSpotlight = fullList.filter(s => !spotlight || s.id !== spotlight.id);

  // NEW 표시가 붙어있는(12시간 이내 추가된) 문장은 스포트라이트 바로 아래에 최신순으로 모아두고,
  // 나머지만 랜덤 셔플함. NEW 표시가 사라지면(12시간 지나면) 자연스럽게 셔플 그룹으로 옮겨감.
  const newOnes = withoutSpotlight
    .filter(s => isRecentlyAdded(s.ts))
    .sort((a, b) => (b.ts || 0) - (a.ts || 0));
  const others = withoutSpotlight.filter(s => !isRecentlyAdded(s.ts));

  const rest = getShuffledRest(others);
  const finalList = spotlight ? [spotlight, ...newOnes, ...rest] : [...newOnes, ...rest];

  archiveList.innerHTML = finalList.map(s => {
    const metaParts = [];
    if(s.source) metaParts.push(escapeHtml(s.source));
    if(s.ref) metaParts.push(escapeHtml(s.ref));
    const metaLine = metaParts.join(' · ');
    const bookmarkHtml = s.important ? `<span class="quote-bookmark" title="즐겨찾기">${BOOKMARK_SVG}</span>` : '';
    const newBadgeHtml = isRecentlyAdded(s.ts) ? `<span class="quote-new-badge">NEW</span>` : '';
    const showMetaRow = metaLine || s.important || newBadgeHtml;
    const isSpotlight = spotlight && s.id === spotlight.id;
    const spotlightLabelHtml = isSpotlight ? `<div class="spotlight-label">${escapeHtml(currentSpotlightMessage)}</div>` : '';
    return `
      <div class="quote-block${isSpotlight ? ' spotlight-card' : ''}" data-id="${s.id}">
        ${spotlightLabelHtml}
        <p class="quote-text">${renderHighlightedText(s.text, s.highlights)}</p>
        ${s.comment ? `<div class="quote-comment"><span class="quote-comment-mark"></span><span class="quote-comment-text">${escapeHtml(s.comment)}</span></div>` : ''}
        ${showMetaRow ? `<div class="quote-meta-line">${bookmarkHtml}${newBadgeHtml}${metaLine ? `<span>${metaLine}</span>` : ''}</div>` : ''}
      </div>
    `;
  }).join('');

  setupSeenTracking();
}

// ── "봤다" 추적: 화면에 5초 이상 실제로 보였을 때만 기록 ────────
// (그냥 리스트에 뜨기만 해도 "봤다"고 치면, 스크롤 안 하고 지나친 것까지 다 봤다고 착각하게 됨)
let seenObserver = null;
let seenTimers = new Map(); // element -> timeout id
let seenSaveDebounceTimer = null;

function scheduleSeenSave(){
  clearTimeout(seenSaveDebounceTimer);
  seenSaveDebounceTimer = setTimeout(() => { saveAll(); }, 2000);
}

function setupSeenTracking(){
  if(seenObserver) seenObserver.disconnect();
  seenTimers.forEach(t => clearTimeout(t));
  seenTimers.clear();

  seenObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if(entry.isIntersecting){
        if(!seenTimers.has(entry.target)){
          const id = entry.target.dataset.id;
          const timer = setTimeout(() => {
            const s = findSentence(id);
            if(s){
              s.lastSeenAt = Date.now();
              scheduleSeenSave();
            }
            seenTimers.delete(entry.target);
          }, 5000);
          seenTimers.set(entry.target, timer);
        }
      } else if(seenTimers.has(entry.target)){
        clearTimeout(seenTimers.get(entry.target));
        seenTimers.delete(entry.target);
      }
    });
  }, { threshold: 0.6 });

  archiveList.querySelectorAll('.quote-block').forEach(el => seenObserver.observe(el));
}

// 이벤트 위임: archiveList 자체는 재렌더링해도 그대로 유지되는 요소라, 리스너를 한 번만 붙여두고
// 클릭된 대상이 어느 quote-block인지는 매번 closest로 찾음.
// (이전엔 renderArchive가 실행될 때마다 문장 개수만큼 리스너를 새로 붙이고 있었음)
archiveList.addEventListener('click', async (e) => {
  const block = e.target.closest('.quote-block');
  if(!block) return;

  // 드래그로 문장을 선택한 상태면(하이라이트 하려는 것) 액션시트를 열지 않음
  const sel = window.getSelection();
  if(sel && !sel.isCollapsed && sel.toString().trim()) return;

  // 보기 모드에서는 고치는 메뉴를 아예 안 열고, 짧은 반응만 보여줌
  if(viewMode === 'view'){
    const tapped = findSentence(block.dataset.id);
    if(tapped) showToast(pickTapReaction(tapped), 1400);
    return;
  }

  // 이미 칠해진 하이라이트를 탭하면, 메뉴 대신 그 하이라이트를 바로 지움
  const markEl = e.target.closest('.quote-highlight');
  if(markEl){
    const idx = parseInt(markEl.dataset.hidx, 10);
    const s = findSentence(block.dataset.id);
    if(s && Array.isArray(s.highlights) && !isNaN(idx)){
      s.highlights.splice(idx, 1);
      await saveAll();
      renderArchive();
    }
    return;
  }

  openEntryAction(block.dataset.id);
});

// ── 카테고리 세그먼트 탭 (좌하단) ───────────────
// 카테고리를 전환할 때, 배열 순서상 다음/이전인지에 따라 아주 살짝 좌우로 미끄러지듯 바뀜.
// 화면을 통째로 넘기는 게 아니라 "약간의" 느낌만 주는 정도로, 이동 거리와 시간을 짧게 잡음.
// dir을 명시적으로 주면(화살표 키·알약 클릭처럼 "다음/이전"이 확실한 경우) 그대로 씀.
// 안 주면(탭을 직접 클릭한 경우처럼 어디서 어디로 튈지 모를 때) 인덱스를 비교해서 추측함 -
// 이 추측 방식은 순환(사랑→일처럼 배열 끝에서 다시 앞으로 넘어가는 경우) 방향을 반대로
// 잘못 판단해서, 오른쪽으로 넘겼는데 왼쪽에서 들어오는 것처럼 보이는 문제가 있었음.
function switchCategoryAnimated(newCat, explicitDir){
  if(newCat === currentCategory) return;
  const oldIdx = categoryNames().indexOf(currentCategory);
  const newIdx = categoryNames().indexOf(newCat);
  const forward = explicitDir != null ? (explicitDir > 0) : (newIdx > oldIdx); // 배열상 오른쪽으로 이동하면 다음 화면이 오른쪽에서 들어옴

  // 탭 알약은 누르자마자 곧바로 움직이게 함.
  // 문장 목록을 다시 그리는 건 무거운 작업이라, 그게 끝난 뒤에 알약이 출발하면
  // 첫 프레임들이 잡아먹혀서 툭툭 끊겨 보임 (특히 문장이 많은 폰에서).
  currentCategory = newCat;
  saveLastCategory(currentCategory);
  applyCategoryColor();
  categoryTabs.querySelectorAll('.category-tab').forEach(tab => {
    tab.classList.toggle('active', tab.dataset.cat === currentCategory);
  });
  updateCategoryIndicator();
  // 입력줄이 떠 있는 상태(컴퓨터 편집 모드)면, 화살표 키로 카테고리를 옮겨도 알약이 같이 따라오게 함
  if(typeof updateComposeCatPill === 'function') updateComposeCatPill();

  archiveList.classList.remove('cat-anim-in-l', 'cat-anim-in-r');
  archiveList.classList.add(forward ? 'cat-anim-out-l' : 'cat-anim-out-r');

  setTimeout(() => {
    renderArchive();
    resetQuoteFocus();
    scrollHostTo(0, 'instant');

    archiveList.classList.remove('cat-anim-out-l', 'cat-anim-out-r');
    archiveList.classList.add(forward ? 'cat-anim-in-r' : 'cat-anim-in-l');
    setTimeout(() => archiveList.classList.remove('cat-anim-in-l', 'cat-anim-in-r'), 240);
  }, 130);
}

// ── 위아래 화살표로 화면 부드럽게 스크롤 ──────────────────
// 브라우저 기본 동작은 몇십 픽셀씩 찔끔찔끔 끊겨 움직임.
// 대신 한 번에 적당한 양을 부드럽게 흘려보내서 읽는 흐름이 끊기지 않게 함.
// 키를 꾹 누르고 있으면 명령이 겹쳐 밀리므로, 진행 중일 땐 목표 위치만 더해나감.
let smoothScrollTarget = null;
let smoothScrollRaf = null;

// 컴퓨터 편집 모드에서는 목록이 통째로 화면(window)이 아니라 .scroll-region 안에서만 스크롤됨
// (입력줄에 절대 가리지 않도록 - 자세한 이유는 관련 CSS 주석 참고).
// 그래서 지금 스크롤 대상이 window인지 .scroll-region인지를 이 함수들이 알아서 골라 씀.
function scrollHost(){
  return document.body.classList.contains('compose-active') ? scrollRegionEl : null;
}
function currentScrollTop(){
  const host = scrollHost();
  return host ? host.scrollTop : (window.scrollY || window.pageYOffset || 0);
}
function currentScrollMaxY(){
  const host = scrollHost();
  if(host) return Math.max(0, host.scrollHeight - host.clientHeight);
  return Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
}
function currentViewportHeight(){
  const host = scrollHost();
  return host ? host.clientHeight : window.innerHeight;
}
function scrollHostTo(y, behavior){
  const host = scrollHost();
  if(host){ host.scrollTo({ top: y, behavior: behavior || 'auto' }); return; }
  window.scrollTo({ top: y, behavior: behavior || 'instant' });
}

// 위아래 키는 문장 하나씩 움직임. 멈추는 자리는 항상 "그 문장의 끝이 화면 아래에서
// SCROLL_EDGE_GAP만큼 떨어진 곳" - 그래서 문장이 중간에 잘리지 않고 매번 같은 자리에서 끝남.
// 문장 끝과 화면 아래 사이 여백.
// 예전엔 100px 고정이었는데, 그 공간에 다음 문장 글자가 3줄쯤 비집고 들어와 잘려 보였음.
// 카테고리 탭·검색 버튼이 문장과 가로로 겹치지 않는 넓은 화면(PC)에서는 여백을 확 줄여서
// 다음 문장이 아예 안 보이게 하고, 좁은 화면에서만 탭을 피할 만큼 띄움.
// 위아래 키로 문장 하나씩 이동. 멈추는 자리는 항상 "그 문장이 화면 한가운데"에 오도록 함.
// 문장 길이와 상관없이 늘 같은 자리에서 멈추게 하려는 것.
// (예전엔 문장 끝을 화면 아래에 맞췄는데, 그러면 다음 문장이 아래로 비집고 들어와 잘려 보였음)
function sentenceStopPoints(){
  const maxY = currentScrollMaxY();
  const vh = currentViewportHeight();
  const baseY = currentScrollTop();
  const pts = [];
  archiveList.querySelectorAll('.quote-block').forEach(el => {
    const r = el.getBoundingClientRect();
    const centerInPage = r.top + r.height / 2 + baseY;
    // 그 문장의 한가운데가 화면 한가운데에 오도록 하는 스크롤 위치
    pts.push(Math.round(centerInPage - vh / 2));
  });
  return { pts: pts.sort((a, b) => a - b), maxY, vh };
}

function scrollToNextSentenceEdge(dir){
  const base = smoothScrollTarget === null ? currentScrollTop() : smoothScrollTarget;
  const { pts, maxY, vh } = sentenceStopPoints();
  // 문장 하나가 화면보다 길 수도 있음. 그럴 땐 한 번에 화면 하나 넘게 건너뛰지 않도록 제한해서
  // 못 보고 지나치는 부분이 없게 함.
  const maxStep = Math.max(120, Math.round(vh * 0.8));

  let next;
  if(dir > 0){
    next = pts.find(y => y > base + 8);
    if(next === undefined) next = maxY;              // 마지막 문장까지 갔으면 맨 아래로
    next = Math.min(next, base + maxStep);
  } else {
    next = [...pts].reverse().find(y => y < base - 8);
    if(next === undefined) next = 0;                 // 첫 문장보다 위면 맨 위로
    next = Math.max(next, base - maxStep);
  }
  smoothScrollTo(Math.min(maxY, Math.max(0, next)));
}

function smoothScrollTo(targetY){
  const maxY = currentScrollMaxY();
  smoothScrollTarget = Math.min(maxY, Math.max(0, targetY));

  if(smoothScrollRaf) return; // 이미 흐르는 중이면 목표만 갱신하고 끝
  const step = () => {
    const cur = currentScrollTop();
    const diff = smoothScrollTarget - cur;
    // 남은 거리가 1.5px 안쪽이면 바로 목표에 붙임.
    // 예전엔 0.5px 기준이라, 2px쯤 남았을 때 한 프레임 이동량(0.36px)이 화면에 반영되지 않아
    // 제자리걸음에 빠지면서 늘 목표보다 2px 못 미친 자리에 멈췄음.
    if(Math.abs(diff) < 1.5){
      scrollHostTo(smoothScrollTarget);
      smoothScrollTarget = null;
      smoothScrollRaf = null;
      return;
    }
    let delta = diff * 0.18; // 남은 거리의 일부씩 좁혀가며 자연스럽게 감속
    // 이동량이 1px보다 작으면 화면에 반영되지 않으므로 최소 1px은 움직이게 함
    if(Math.abs(delta) < 1) delta = diff > 0 ? 1 : -1;
    scrollHostTo(cur + delta);
    smoothScrollRaf = requestAnimationFrame(step);
  };
  smoothScrollRaf = requestAnimationFrame(step);
}

document.addEventListener('keydown', (e) => {
  if(e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;

  const active = document.activeElement;
  const tag = active ? active.tagName : '';
  // 입력줄에 커서가 있을 땐("텍스트 집중 모드") 위/아래가 원래 텍스트칸 동작(줄 이동)에 쓰이고,
  // Tab으로 초점을 뺀 상태("문장 집중 모드")일 때만 목록을 넘기는 데 쓰임 - 그 외 입력칸도 마찬가지로 건드리지 않음.
  if(['INPUT', 'TEXTAREA'].includes(tag)) return;
  const anyOverlayOpen = document.querySelector(
    '.sheet-overlay.open, .modal-overlay.open, .ios-action-sheet.open, .ios-sheet-backdrop.open'
  );
  if(anyOverlayOpen) return;

  e.preventDefault();
  scrollToNextSentenceEdge(e.key === 'ArrowDown' ? 1 : -1);
});

// 카테고리를 바꾸면 흐르던 스크롤을 멈춤 (새 목록에서 엉뚱한 위치로 흐르지 않도록)
function resetQuoteFocus(){
  if(smoothScrollRaf) cancelAnimationFrame(smoothScrollRaf);
  smoothScrollRaf = null;
  smoothScrollTarget = null;
}

// ── Tab으로 "입력 중" ↔ "목록 탐색 중" 전환 ──────────────────────
// 채팅형 입력줄에 초점이 있으면 화살표가 늘 목록/카테고리 전환에 쓰이는데, 그러면
// 여러 줄짜리 문장을 쓸 때 커서를 움직이려고 화살표를 눌러도 안 먹힘. Tab으로 초점을
// 완전히 빼면(목록 탐색 중) 화살표가 원래 하던 대로 목록/카테고리를 넘기고, 다시 Tab을
// 누르면 입력줄로 돌아와 화살표가 다시 글자 커서 이동으로 쓰임 - 딱 두 상태만 오가는 스위치.
document.addEventListener('keydown', (e) => {
  if(e.key !== 'Tab') return;
  if(!document.body.classList.contains('compose-active')) return; // PC 편집 모드에서만
  const anyOverlayOpen = document.querySelector(
    '.sheet-overlay.open, .modal-overlay.open, .ios-action-sheet.open, .ios-sheet-backdrop.open'
  );
  if(anyOverlayOpen) return; // 팝업이 열려 있으면 원래 Tab 동작(그 안 필드 이동)을 건드리지 않음
  if(isWithinComposeMetaEdit(document.activeElement)) return; // 출처/쪽수 고치는 중엔 원래 Tab 동작(칸 이동)을 그대로 둠

  // 메모 처리 중이었다면 Tab도 M·Esc랑 똑같이 "그만 쓰기"부터 함 - 그 다음엔 그대로
  // 아래 평소 Tab 로직(초점 비우기)으로 이어지게 둬서, 그때 걸리는 기존 전환 애니메이션이
  // 여기서도 똑같이 재생되게 함(따로 만들지 않고 이미 있는 걸 그대로 씀)
  if(activeMemoConversion){
    closeMemoConversionFlow();
  }

  if(document.activeElement === composeTextInput){
    e.preventDefault();
    composeTextInput.blur(); // 초점을 비움 → 화살표가 목록 탐색으로 넘어감
    showComposeMemoHint(); // 손이 비는 이 순간, 쌓인 메모가 있으면 말풍선으로 살짝 알려줌
  } else {
    e.preventDefault();
    composeTextInput.focus(); // 어디에 있었든 입력줄로 돌아와 다시 타이핑 재개
    hideComposeMemoHint();
  }
});

// ── 메인 화면에서 좌우 화살표로 카테고리 전환 (일 · 관계 · 삶 · 사랑) ──────
// 입력칸/버튼 등 다른 걸 조작 중일 땐 건드리지 않고, 딱히 포커스된 게 없거나
// 카테고리 탭 자체에 포커스가 있을 때만 동작함.
document.addEventListener('keydown', (e) => {
  if(e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;

  const active = document.activeElement;
  const isCategoryTab = active && active.classList.contains('category-tab');
  const isGenericFocus = !active || active === document.body;
  // 입력줄에 커서가 있을 땐("텍스트 집중 모드") 좌우가 원래 텍스트칸 동작(글자 이동)에 쓰이고,
  // Tab으로 초점을 뺀 상태("문장 집중 모드")일 때만 카테고리를 넘기는 데 쓰임.
  if(!isCategoryTab && !isGenericFocus) return;

  const anyOverlayOpen = document.querySelector(
    '.sheet-overlay.open, .modal-overlay.open, .ios-action-sheet.open, .ios-sheet-backdrop.open'
  );
  if(anyOverlayOpen) return;

  e.preventDefault();
  const currentIdx = categoryNames().indexOf(currentCategory);
  const dir = e.key === 'ArrowRight' ? 1 : -1;
  const nextIdx = (currentIdx + dir + categoryNames().length) % categoryNames().length;

  switchCategoryAnimated(categoryNames()[nextIdx], dir);

  // 예전엔 이동한 탭에 포커스를 넘겼는데, 그러면 검은 테두리가 생기고
  // 그 상태에서 엔터를 누르면 전역 단축키 대신 그 탭 버튼이 눌려버림.
  // 화살표 이동은 어차피 전역에서 처리하므로 포커스는 넘기지 않음.
  if(isCategoryTab && document.activeElement && document.activeElement.blur){
    document.activeElement.blur();
  }
});

// ── 문장 추가 시트 (우하단 +) ───────────────────
// [1] 출처 입력칸을 포커스하면 최근 사용한 출처가 바로 아래 드롭다운으로 나타남.
// mousedown에서 처리해야 input의 blur보다 먼저 실행되어 클릭이 씹히지 않음.
function wireSourceSuggest(inputEl, suggestEl){
  let highlightedIndex = -1;

  function renderHighlight(){
    suggestEl.querySelectorAll('.source-suggest-item').forEach((btn, i) => {
      btn.classList.toggle('highlighted', i === highlightedIndex);
    });
  }

  inputEl.addEventListener('focus', () => {
    if(recentSources.length === 0) return;
    highlightedIndex = -1;
    suggestEl.innerHTML = recentSources.map(src => `
      <button type="button" class="source-suggest-item">${escapeHtml(src)}</button>
    `).join('');
    suggestEl.querySelectorAll('.source-suggest-item').forEach((btn, i) => {
      btn.addEventListener('mousedown', (e) => {
        e.preventDefault();
        inputEl.value = recentSources[i];
        suggestEl.classList.remove('open');
      });
    });
    suggestEl.classList.add('open');
  });
  // 드롭다운이 열려있을 때 위/아래로 항목을 옮기고, Tab으로 확정하면서 다음 칸(문장 입력)으로 넘어감
  inputEl.addEventListener('keydown', (e) => {
    if(!suggestEl.classList.contains('open')) return;
    const items = suggestEl.querySelectorAll('.source-suggest-item');
    if(items.length === 0) return;

    if(e.key === 'ArrowDown'){
      e.preventDefault();
      highlightedIndex = (highlightedIndex + 1) % items.length;
      renderHighlight();
    } else if(e.key === 'ArrowUp'){
      e.preventDefault();
      highlightedIndex = (highlightedIndex - 1 + items.length) % items.length;
      renderHighlight();
    } else if(e.key === 'Tab'){
      if(highlightedIndex >= 0) inputEl.value = recentSources[highlightedIndex];
      suggestEl.classList.remove('open');
      // Tab 기본 동작(다음 요소로 포커스 이동)은 그대로 두고 막지 않음
    }
  });
  inputEl.addEventListener('blur', () => {
    setTimeout(() => suggestEl.classList.remove('open'), 150);
  });
}

function syncComposeBarSpace(){

async function handleComposeSubmit(){
  const text = composeTextInput.value.trim();
  if(!text) return; // 빈 채로 엔터 치는 건 흔한 실수라, 에러 없이 그냥 아무 일도 안 일어나게 함

  // 문장을 수정하는 중이었다면, 새로 추가하는 게 아니라 그 문장 자체를 갱신하고 끝냄 -
  // 나머지(메모 이어가기 등) 로직과는 완전히 갈라진 별개의 흐름이라 여기서 먼저 처리함
  if(activeSentenceEdit){
    const s = findSentence(activeSentenceEdit);
    if(!s){ closeSentenceEditFlow(); return; }
    const source = composeSource;
    // 원래 날짜 기반이었는데 페이지 칸을 안 건드렸으면 원래 날짜를 그대로 유지함
    // (컴포즈바엔 예전 팝업에 있던 날짜 선택 UI가 없어서, 날짜였던 것까지 억지로
    //  페이지로 바꾸지 않으려는 안전장치 - 페이지를 입력하면 그건 페이지로 바뀜)
    const ref = (activeSentenceEditOriginalRefMode === 'date' && !composePageInput.value.trim())
      ? activeSentenceEditOriginalDate.replace(/-/g, '.')
      : buildRefString('page', composePageInput.value, '');
    const categoryChanged = s.category !== currentCategory;

    composeSendBtn.disabled = true;
    if(s.text !== text){
      s.highlights = []; // 텍스트가 바뀌면 글자 위치가 어긋나므로 하이라이트 초기화
      s.spellChecked = false; // 내용이 바뀌었으니 맞춤법 재점검 대상으로 되돌림
      s.tags = [];            // 주제가 달라졌을 수 있으니 의미 태그도 다시 뽑도록 비움
    }
    s.text = text;
    s.source = source;
    s.category = currentCategory;
    s.ref = ref;
    if(source) addRecentSource(source);

    writeLocalBackup();
    await saveAll();
    composeSendBtn.disabled = false;

    closeSentenceEditFlow();
    if(categoryChanged) saveLastCategory(currentCategory);
    renderArchive();
    showToast('✓ 수정했어요');
    composeTextInput.focus();
    return;
  }

  const source = composeSource;
  const ref = buildRefString('page', composePageInput.value, '');
  const newId = genId();

  composeSendBtn.disabled = true;
  sentences.push({
    id: newId,
    category: currentCategory,
    source,
    text,
    ref,
    important: false,
    highlights: [],
    spellChecked: false,
    tags: [],
    comment: '',
    ts: Date.now(),
    lastSeenAt: Date.now()
  });
  if(source) addRecentSource(source);

  // 메모를 문장으로 옮기는 중이었다면, 그 메모는 이제 다 쓴 것이므로 같이 지움
  const convertedMemo = activeMemoConversion;
  if(convertedMemo) memos = memos.filter(m => m.id !== convertedMemo.id);

  // 서버로 보내는 비동기 과정을 기다리지 않고 곧바로 이 기기에 남겨둠
  writeLocalBackup();

  await saveAll();
  composeSendBtn.disabled = false;

  composeTextInput.value = '';
  autoGrowComposeTextarea();
  renderArchive();
  flashNewlyAdded(newId); // 방금 담긴 문장이 살짝 떠오르며 자리 잡는 느낌

  // 메모 처리 중이었다면 입력줄을 안 비운 채(카테고리·출처는 이어감) 곧장 다음 메모로 넘어감 -
  // "널널하게 이어지는" 흐름. 알림도 하나만 뜨게 함(두 개가 겹치면 서로 덮어써서 하나만 보임).
  if(convertedMemo){
    updateComposeMemoState();
    const next = nextUnconvertedMemo();
    if(next){
      showToast('✓ ' + pickSaveMessage(source));
      openMemoConversionFlow(next);
      return;
    }
    closeMemoConversionFlow();
    showToast('✓ 마지막 메모까지 다 옮겼어요', 1800);
    composeTextInput.focus();
    return;
  }

  composePageInput.value = '';
  updateComposeMetaPill(); // 쪽수가 비워졌으니 알약 표시도 새로 맞춤
  updateSendBtnIcon(); // 칸을 코드로 비웠으니(=input 이벤트가 안 남) 여기서 직접 다시 확인해줌
  showToast('✓ ' + pickSaveMessage(source));
  composeTextInput.focus();
}

// 모드+입력값 → 저장용 문자열 ("51p" 또는 "2026.04.25")
function buildRefString(mode, pageVal, dateVal){
  if(mode === 'page'){
    const v = (pageVal || '').trim();
    return v ? `${v}p` : '';
  }
  return dateVal ? dateVal.replace(/-/g, '.') : '';
}
// 저장된 문자열 → 수정 시트를 열 때 모드+입력값 복원 (옛 형식/자유 입력도 최대한 추측해서 복원)
function parseRefString(ref){
  if(!ref) return { mode: 'page', page: '', date: '' };
  const pageMatch = ref.match(/^(\d+)\s*p$/i);
  if(pageMatch) return { mode: 'page', page: pageMatch[1], date: '' };
  const dateMatch = ref.match(/^(\d{4})[.\-](\d{2})[.\-](\d{2})$/);
  if(dateMatch) return { mode: 'date', page: '', date: `${dateMatch[1]}-${dateMatch[2]}-${dateMatch[3]}` };
  const digits = ref.match(/\d+/);
  return { mode: 'page', page: digits ? digits[0] : '', date: '' };
}

// 시트를 연 뒤 입력칸에 초점을 주기까지의 대기 시간.
// 모바일은 키보드가 올라오는 동안 기다려야 하지만, PC는 기다릴 이유가 없어서 즉시 초점을 줌
// (그냥 250ms를 다 기다리면 눌렀는데 잠깐 멈칫하는 느낌이 남).
function focusSoon(getEl){
  const isDesktop = window.matchMedia('(min-width: 900px) and (hover: hover)').matches;
  if(isDesktop) requestAnimationFrame(() => { const el = getEl(); if(el) el.focus(); });
  else setTimeout(() => { const el = getEl(); if(el) el.focus(); }, 250);
}

// 그 문장에 해당하는 성격들을 모아서, 그중 하나를 무작위로 고름.
// (여러 성격이 겹치면 매번 다른 결의 반응이 나와서 덜 뻔해짐)
function pickTapReaction(s){
  const pools = [];
  if(Array.isArray(s.highlights) && s.highlights.length) pools.push(VIEW_TAP_REACTIONS.highlighted);
  if(s.important) pools.push(VIEW_TAP_REACTIONS.favorite);
  if(s.comment && s.comment.trim()) pools.push(VIEW_TAP_REACTIONS.commented);

  const age = Date.now() - (s.ts || 0);
  const day = 24 * 60 * 60 * 1000;
  if(age < 3 * day) pools.push(VIEW_TAP_REACTIONS.fresh);
  else if(age > 60 * day) pools.push(VIEW_TAP_REACTIONS.old);

  const len = (s.text || '').replace(/\s/g, '').length;
  if(len >= 70) pools.push(VIEW_TAP_REACTIONS.long);
  else if(len <= 20) pools.push(VIEW_TAP_REACTIONS.short);

  pools.push(VIEW_TAP_REACTIONS.plain); // 항상 후보에 포함해서 너무 정형화되지 않게 함
  return pickFrom(pools[Math.floor(Math.random() * pools.length)]);
}

// 저장할 때마다 뜨는 확인 문구를 상황에 맞게 여러 개 두고 돌아가며 보여줌.
// 마스코트나 캐릭터 없이, 그 순간 사이트가 조용히 알아봐 주는 정도의 말투만 담음.
const SAVE_MESSAGES = {
  newBook: [
    '새 책이네요 반가워요',
    '이 책은 처음이네요',
    '새로운 책이에요 잘 부탁해요',
  ],
  continue: [
    (n) => `이 책에서 ${n}번째예요`,
    (n) => `이 책과 ${n}번 만났어요`,
    (n) => `${n}번째로 옮겨 적었어요`,
  ],
  milestone: [
    (n) => `어느새 ${n}개를 모았어요`,
    (n) => `${n}개 여기까지 왔네요`,
    (n) => `벌써 ${n}번째 문장이에요`,
  ],
  plain: [
    '잘 담아뒀어요',
    '여기 남겨뒀어요',
    '조용히 저장했어요',
  ],
};
function pickFrom(pool, ...args){
  const item = pool[Math.floor(Math.random() * pool.length)];
  return typeof item === 'function' ? item(...args) : item;
}
// 방금 문장이 sentences에 추가된 뒤에 호출된다고 가정함 (전체 개수·같은 출처 개수에 그걸 포함해서 셈)
function pickSaveMessage(source){
  const total = sentences.length;
  if(total > 0 && total % 50 === 0) return pickFrom(SAVE_MESSAGES.milestone, total);

  if(source){
    const sameSourceCount = sentences.filter(s => s.source === source).length;
    if(sameSourceCount === 1) return pickFrom(SAVE_MESSAGES.newBook);
    return pickFrom(SAVE_MESSAGES.continue, sameSourceCount);
  }
  return pickFrom(SAVE_MESSAGES.plain);
}
